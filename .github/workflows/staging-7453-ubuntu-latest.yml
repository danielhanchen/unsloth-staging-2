name: "staging-7453 ubuntu-latest"
on:
  push:
    branches: ["pr-7453-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/llama_cpp.py'
      - 'studio/backend/core/inference/llama_keepwarm.py'
      - 'studio/backend/models/inference.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/tests/test_inference_status_loaded_gguf.py'
      - 'studio/backend/tests/test_openai_auto_switch.py'
      - 'studio/frontend/src/features/chat/api/chat-adapter.ts'
      - 'studio/frontend/src/features/chat/api/chat-api.ts'
      - 'studio/frontend/src/features/chat/hooks/use-chat-model-runtime.ts'
      - 'studio/frontend/src/features/chat/runtime-provider.tsx'
      - 'studio/frontend/src/features/chat/utils/refresh-context-usage.ts'
      - '.github/workflows/staging-7453-ubuntu-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_inference_status_loaded_gguf.py studio/backend/tests/test_openai_auto_switch.py tests/studio/test_new_chat_context_recount.py tests/studio/test_token_count_prompt_parity.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
