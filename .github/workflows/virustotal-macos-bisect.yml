name: VirusTotal per-engine verdicts

# "0 malicious" alongside 13 engine timeouts is not a clean verdict, and the
# question here is specifically what MICROSOFT says, since it is the only engine
# that ever flagged these disk images. Read the current per-engine table for every
# macOS build in the experiment, in one job, so the five verdicts are comparable.

on:
  push:
    branches: ["vt-bisect"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verdicts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ask VirusTotal about each build
        env:
          VT_API_KEY: ${{ secrets.VIRUS_TOTAL_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request

          key = os.environ["VT_API_KEY"]
          builds = [
              ("PR build 1",              "68bd2cb29736fb5ab4cc649c72ee3e858ab7e6cb9906750ad67b8b30afd6316f"),
              ("PR build 2",              "6debabad727ba0f79db2ec7c85883fd269a4151cc1c6104b3e567be5936a26c0"),
              ("main build 1",            "da997311fbdcb64620cf3a8a225a16df4b4907b91d4738da6cf7415b997bfe4c"),
              ("main build 2",            "cdfc531d627529621a05b2fdb7739fe82cf83910cbc8d7d7ac69715161190ab7"),
              ("PR + main's install.ps1", "ce70935318106f672d4b4e77e3f7b939873c39b4b17e32b33d4941b44c673d02"),
          ]

          def get(url):
              request = urllib.request.Request(url)
              request.add_header("x-apikey", key)
              with urllib.request.urlopen(request, timeout = 120) as response:
                  return json.loads(response.read())

          for label, digest in builds:
              data = get(f"https://www.virustotal.com/api/v3/files/{digest}")["data"]
              results = data["attributes"].get("last_analysis_results", {})
              microsoft = results.get("Microsoft", {})
              flagged = {
                  engine: verdict.get("result")
                  for engine, verdict in results.items()
                  if verdict.get("category") in ("malicious", "suspicious")
              }
              print(
                  f"{label:26} Microsoft={microsoft.get('category')}"
                  f"/{microsoft.get('result')}  flagged={flagged}",
                  flush = True,
              )
              time.sleep(20)
          PY
