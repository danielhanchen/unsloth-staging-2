name: VirusTotal macOS bisect, step three

# Swapping install.ps1 back to main's version cleared the detection, so the trigger
# is this PR's installer script inside the bundle. Two hypotheses remain:
#
#   H1 CONTENT: something the PR adds to install.ps1 looks like a dropper to
#      Microsoft's ML -- most likely writing a .cmd that starts an interpreter with
#      an inline -c payload, or the hidden-window process probe.
#   H2 REPUTATION: Wacatac.B!ml is a low-prevalence heuristic. main's install.ps1
#      hash has shipped in every release and is known-good; ANY new hash inside an
#      unsigned installer scores as unknown.
#
# H2 is testable without touching a line of logic: take main, add a comment to
# install.ps1, and build. New hash, zero new behaviour. If that is flagged too, the
# verdict is about novelty rather than about what this PR does.

on:
  push:
    branches: ["vt-bisect"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Positive control: main, plus ONE line -- the trampoline string itself.
          # If this flags, the string is the trigger and nothing else is needed.
          - label: main-plus-the-trampoline-string
            mode: add-string
          # Negative control: the PR, with that string replaced by a harmless one
          # everywhere it appears. If this is clean, same conclusion from the other
          # side.
          - label: pr-with-a-harmless-string
            mode: neuter-string
    steps:
      - uses: actions/checkout@v4
        with:
          repository: unslothai/unsloth
          ref: ${{ matrix.mode == 'add-string' && 'main' || 'windows-application-control-8490' }}
          persist-credentials: false

      - name: Perturb install.ps1
        run: |
          set -euo pipefail
          python3 - "${{ matrix.mode }}" <<'PY'
          import pathlib, sys

          mode = sys.argv[1]
          path = pathlib.Path("install.ps1")
          text = path.read_text(encoding = "utf-8")

          trampoline = (
              "import sys, os; sys.path[:1] = [x for x in sys.path[:1] "
              "if getattr(sys.flags, 'safe_path', False) or x not in ('', os.getcwd())]; "
              "sys.argv[0] = 'unsloth'; from unsloth_cli import app; sys.exit(app())"
          )

          if mode == "add-string":
              # main, plus exactly one new line: the string under suspicion.
              marker = "\n    # ── Tauri structured output ──"
              assert marker in text
              text = text.replace(
                  marker,
                  f'\n    $script:UnslothCliTrampoline = "{trampoline}"\n' + marker,
                  1,
              )
          else:
              # the PR, with the same string reduced to something no classifier
              # could object to. Every other line of the installer is untouched.
              assert trampoline in text
              text = text.replace(trampoline, "import unsloth_cli")
          path.write_text(text, encoding = "utf-8")
          print(f"install.ps1 is now {len(text)} chars")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --save-dev --prefix studio @tauri-apps/cli@2.10.1 --no-fund --no-audit
      - name: Install frontend dependencies
        working-directory: studio/frontend
        run: npm install --no-fund --no-audit
      - uses: dtolnay/rust-toolchain@stable

      - name: Build the dmg
        working-directory: studio
        run: |
          npx --prefix . tauri build -v --bundles dmg \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p out
          find studio/src-tauri/target -path '*bundle*' -name '*.dmg' \
            -exec cp {} "out/${{ matrix.label }}.dmg" \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: step2-${{ matrix.label }}
          path: out/
          if-no-files-found: error
          retention-days: 3

  scan:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vt-8592
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: step2-*
          path: ${{ runner.temp }}/step2
          merge-multiple: true
      - name: Scan and report Microsoft per file
        env:
          VT_API_KEY: ${{ secrets.VIRUS_TOTAL_API_TOKEN }}
        run: |
          set -euo pipefail
          ls -la "$RUNNER_TEMP/step2"
          python3 scripts/virustotal_scan.py "$RUNNER_TEMP/step2" \
            --output-markdown "$RUNNER_TEMP/step2.md" || true
          cat "$RUNNER_TEMP/step2.md" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, time, urllib.request

          key = os.environ["VT_API_KEY"]

          def get(url):
              request = urllib.request.Request(url)
              request.add_header("x-apikey", key)
              with urllib.request.urlopen(request, timeout = 120) as response:
                  return json.loads(response.read())

          for path in sorted(pathlib.Path(os.environ["RUNNER_TEMP"], "step2").iterdir()):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              results = get(f"https://www.virustotal.com/api/v3/files/{digest}")["data"][
                  "attributes"
              ].get("last_analysis_results", {})
              microsoft = results.get("Microsoft", {})
              flagged = {
                  engine: verdict.get("result")
                  for engine, verdict in results.items()
                  if verdict.get("category") in ("malicious", "suspicious")
              }
              print(f"{path.name}: sha256={digest}", flush = True)
              print(
                  f"  Microsoft={microsoft.get('category')}/{microsoft.get('result')}"
                  f"  flagged={flagged}",
                  flush = True,
              )
              time.sleep(20)
          PY
