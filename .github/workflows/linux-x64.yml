name: "PR-9996 studio.db contention ubuntu-latest"
on:
  push:
    branches: [pr9996-cross-os]
    paths:
      - 'studio/backend/**'
      - '.github/workflows/linux-x64.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  contention:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # The behaviour under test is SQLite pragmas, one poll query and log levels, so the
      # heavy ML stack is deliberately not installed: it would only add failure modes that
      # have nothing to do with the change.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install structlog fastapi pytest
      - name: Report the SQLite build actually in use
        run: python -c "import sqlite3, sys, platform; print(platform.platform()); print('python', sys.version); print('sqlite', sqlite3.sqlite_version)"
      - name: studio.db write-lock contention suite
        working-directory: studio/backend
        env:
          PYTHONPATH: .
        run: python -m pytest tests/test_studio_db_write_lock_contention.py -v --no-header
