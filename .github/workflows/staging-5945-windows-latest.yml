name: "staging-5945 windows-latest"
on:
  push:
    branches: ["pr-5945-xplat-ci"]
    paths:
      - 'studio/backend/core/training/worker.py'
      - 'studio/backend/tests/test_llama_cpp_update.py'
      - 'studio/backend/tests/test_spark_oom_guard.py'
      - 'studio/install_llama_prebuilt.py'
      - 'studio/scripts/provision_llama_cuda.sh'
      - 'studio/setup.sh'
      - '.github/workflows/staging-5945-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests -q || true
