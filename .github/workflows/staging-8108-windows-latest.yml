name: "staging-8108 windows-latest"
on:
  push:
    branches: ["pr-8108-xplat-ci"]
    paths:
      - 'studio/backend/core/data_recipe/jobs/worker.py'
      - 'studio/backend/core/export/worker.py'
      - 'studio/backend/core/inference/stt_download_worker.py'
      - 'studio/backend/core/inference/worker.py'
      - 'studio/backend/core/training/diffusion_training_service.py'
      - 'studio/backend/core/training/worker.py'
      - 'studio/backend/hub/workers/hf_download.py'
      - 'studio/backend/main.py'
      - 'studio/backend/requirements/studio.txt'
      - 'studio/backend/tests/test_diffusion_training.py'
      - 'studio/backend/tests/test_native_tls.py'
      - 'studio/backend/tests/test_native_tls_entrypoints.py'
      - 'studio/backend/utils/mlx_repair.py'
      - 'studio/backend/utils/models/model_config.py'
      - 'studio/backend/utils/native_tls.py'
      - 'studio/backend/utils/transformers_version.py'
      - 'studio/prebuilt_core.py'
      - '.github/workflows/staging-8108-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_diffusion_training.py studio/backend/tests/test_native_tls.py studio/backend/tests/test_native_tls_entrypoints.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
