name: "staging-6763 diffusion probe (linux/mac/windows)"
on:
  push:
    branches: ["pr-6763-xplat-ci"]
    paths:
      - 'studio/**'
      - '.github/scripts/diffusion_probe.py'
      - '.github/workflows/staging-6763-diffusion-probe.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Studio without torch (this probe never loads a model)
        run: |
          python -m pip install --upgrade pip
          # CPU torch: the launcher imports unsloth, which refuses to start without it. This
          # is also the environment worth probing -- a GPU-less host must still render the
          # pages and tell the user up front that the DiT families cannot train here.
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r studio/backend/requirements/studio.txt
          python -m pip install unsloth_zoo
          python -m pip install -e . || true
          python -m pip install playwright httpx
          python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Launch Studio
        run: |
          mkdir -p artifacts
          export UNSLOTH_STUDIO_HOME="$PWD/studio_home"
          export PYTHONPATH="$PWD/studio/backend"
          # The backend directly, not the `unsloth studio` CLI: that path imports unsloth_zoo,
          # which raises "cannot find any torch accelerator" on a GPU-less runner. Studio
          # itself runs fine without one, which is the whole point of this probe.
          (cd studio/backend && python run.py --host 127.0.0.1 --port 8888 \
             --password "Probe-6763-pass" > ../../artifacts/studio.log 2>&1 &)
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8888/healthz > /dev/null; then echo "up after $((i * 5))s"; break; fi
            sleep 5
          done
          curl -sf http://127.0.0.1:8888/healthz || (tail -80 artifacts/studio.log; exit 1)
      - name: Run the diffusion probe
        run: |
          python .github/scripts/diffusion_probe.py --base http://127.0.0.1:8888 \
            --password "Probe-6763-pass" --out artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diffusion-probe-${{ matrix.os }}
          path: |
            artifacts/**
