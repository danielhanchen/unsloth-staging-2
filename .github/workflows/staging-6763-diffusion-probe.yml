name: "staging-6763 diffusion probe (linux/mac/windows)"
on:
  push:
    branches: ["pr-6763-xplat-ci"]
    paths:
      - 'studio/**'
      - '.github/scripts/diffusion_probe.py'
      - '.github/workflows/staging-6763-diffusion-probe.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Studio (no torch: this probe never loads a model)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r studio/backend/requirements/studio.txt
          python -m pip install -e . || true
          python -m pip install playwright httpx
          python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Launch Studio
        run: |
          mkdir -p artifacts
          export UNSLOTH_STUDIO_HOME="$PWD/studio_home"
          (python -m unsloth.studio_cli studio -H 127.0.0.1 -p 8888 > artifacts/studio.log 2>&1 &) || \
          (unsloth studio -H 127.0.0.1 -p 8888 > artifacts/studio.log 2>&1 &)
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8888/healthz > /dev/null; then echo "up after ${i}0s"; break; fi
            sleep 5
          done
          curl -sf http://127.0.0.1:8888/healthz || (tail -50 artifacts/studio.log; exit 1)
      - name: Run the diffusion probe
        run: |
          PASSWORD=$(python - <<'PY'
          import re, pathlib
          log = pathlib.Path("artifacts/studio.log").read_text(encoding="utf-8", errors="replace")
          m = re.search(r"(?i)(?:bootstrap|initial|generated)\s*password\b[^\S\r\n]*[:=]?[^\S\r\n]*(\S+)", log)
          print(m.group(1) if m else "")
          PY
          )
          test -n "$PASSWORD" || (echo "no bootstrap password in the log"; tail -40 artifacts/studio.log; exit 1)
          python .github/scripts/diffusion_probe.py --base http://127.0.0.1:8888 --password "$PASSWORD" --out artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diffusion-probe-${{ matrix.os }}
          path: |
            artifacts/**
