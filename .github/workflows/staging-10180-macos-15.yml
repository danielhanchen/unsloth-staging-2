name: "staging-10180 macos-15"
on:
  push:
    branches: ["pr-10180-macjob-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: python -m pip install torch llguidance==1.8.0 mlx==0.32.2 mlx-metal==0.32.2 mlx-lm==0.31.3 mlx-vlm==0.7.1
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_control_markup_neutralize_7066.py studio/backend/tests/test_mlx_inference_backend.py studio/backend/tests/test_mlx_stack_blockers.py studio/backend/tests/test_openai_tool_passthrough.py studio/backend/tests/test_passthrough_healing.py studio/backend/tests/test_presence_penalty.py studio/backend/tests/test_research_json_fallback.py studio/backend/tests/test_sf_client_tools_passthrough.py studio/backend/tests/test_think_prefill_reemit.py tests/studio/install/test_dependency_pass_skips.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out.txt 2>&1 || rc=$?; cat pytest_out.txt; tot=$(grep -cE "^(FAILED|ERROR) " pytest_out.txt) || tot=0; dep=$(grep -cE "^(FAILED|ERROR) .* (ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers).$" pytest_out.txt) || dep=0; bare=$(awk '/^_+ ERROR collecting [^ ]+ _+$/ {cur=$4; next} /^(=|_)+ / {cur=""} cur != "" && /(ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers)./ {ok[cur]=1} /^ERROR [^ ]+$/ && ($2 in ok) {n++} END {print n+0}' pytest_out.txt) || bare=0; dep=$((dep + bare)); if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers)." pytest_out.txt && { [ "$tot" = "0" ] || [ "$tot" = "$dep" ]; }; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" = "1" ] && [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; exit "$rc"
      - name: "jobs: install MLX (Apple Silicon)"
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch
          for attempt in 1 2 3; do python -m pip install "unsloth_zoo @ git+https://github.com/unslothai/unsloth-zoo" && break; [ "$attempt" = 3 ] && exit 1; sleep $((5 * attempt)); done
          python -m pip install -e . --no-deps
          python -m pip install -U llguidance==1.8.0 mlx==0.32.2 mlx-metal==0.32.2 mlx-lm==0.31.3 mlx-vlm==0.7.1
          python -m pip list 2>/dev/null | grep -iE '^(transformers|mlx|mlx-lm|mlx-vlm|trl|peft|torch) '
      - name: "job: mlx_guided (MLX (Apple Silicon))"
        if: ${{ !cancelled() }}
        run: |
          env -u UNSLOTH_IS_PRESENT -u UNSLOTH_COMPILE_DISABLE python .github/scripts/jobs/mlx_guided.py --out job_0_mlx_guided_macos-15.json
      - name: "job: mlx_guided --tiny (MLX (Apple Silicon))"
        if: ${{ !cancelled() }}
        run: |
          env -u UNSLOTH_IS_PRESENT -u UNSLOTH_COMPILE_DISABLE python .github/scripts/jobs/mlx_guided.py --tiny --out job_1_mlx_guided_macos-15.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: job-results-macos-15
          path: job_*.json
          if-no-files-found: warn
