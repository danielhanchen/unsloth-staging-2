name: "staging-7219 macos-14"
on:
  push:
    branches: ["pr-7219-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/tools.py'
      - 'studio/backend/core/inference/web_access_policy.py'
      - 'studio/backend/core/rag/web_rank.py'
      - 'studio/backend/core/research_runs.py'
      - 'studio/backend/main.py'
      - 'studio/backend/routes/__init__.py'
      - 'studio/backend/routes/chat_history.py'
      - 'studio/backend/routes/research_runs.py'
      - 'studio/backend/storage/research_runs_db.py'
      - 'studio/backend/storage/studio_db.py'
      - 'studio/backend/tests/test_chat_history_routes.py'
      - 'studio/backend/tests/test_chat_history_storage.py'
      - 'studio/backend/tests/test_desktop_auth.py'
      - 'studio/backend/tests/test_middleware.py'
      - 'studio/backend/tests/test_rag_retrieval.py'
      - 'studio/backend/tests/test_research_runs_hardening.py'
      - 'studio/backend/tests/test_research_runs_storage.py'
      - 'studio/backend/tests/test_web_access_policy.py'
      - 'studio/backend/tests/test_web_fetch_extraction.py'
      - 'studio/backend/tests/test_web_rank.py'
      - '.github/workflows/staging-7219-macos-14.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests -q || true
