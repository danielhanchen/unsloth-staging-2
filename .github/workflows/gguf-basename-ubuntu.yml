name: "PR-7897 basename + discovery (ubuntu-latest)"
on:
  push:
    branches: [pr7897-cross-os]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    env:
      UNSLOTH_ALLOW_CPU: "1"
      UNSLOTH_IS_PRESENT: "1"
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}', cache: 'pip' }
      - run: python -m pip install pytest
      - name: "Basename table (3.10 leg is the glob include_hidden canary)"
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_gguf_model_basename.py -q -p no:cacheprovider
      - name: No include_hidden (Python 3.11+ only, would break the 3.10 leg)
        run: |
          ! grep -rn "include_hidden" studio/backend/core/export/export.py unsloth/save.py
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest-asyncio httpx python-multipart "numpy<3"
      - working-directory: studio/backend
        run: python -m pytest tests/test_export_gguf_discovery.py tests/test_export_absolute_paths.py tests/test_training_finalizing_phase.py -q -p no:cacheprovider
