name: "staging-10903 windows-latest"
on:
  push:
    branches: ["pr-10903-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
      UNSLOTH_ZOO_DISABLE_GPU_INIT: '1'
      # Documented test-only CPU fallback; these runners have no GPU.
      UNSLOTH_ALLOW_CPU: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=5.10" peft accelerate pytest
          # unsloth's own declared runtime deps; without these `import unsloth` fails.
          python -m pip install typer rich pydantic pyyaml nest-asyncio structlog click
          # Released unsloth_zoo predates UNSLOTH_ALLOW_CPU and raises on a GPU-less host.
          python -m pip install --no-deps git+https://github.com/unslothai/unsloth-zoo
          # --no-deps on purpose: unsloth_zoo pins transformers<=5.5.0, which is
          # older than the versions this guard needs. Install its pure-python
          # deps by hand instead, skipping triton / torchao / mlx.
          python -m pip install datasets sentencepiece tqdm psutil numpy protobuf \
            huggingface_hub hf_transfer pillow regex msgspec typing_extensions \
            filelock packaging tyro trl
      - name: Guard logic, no unsloth import (AST-loaded from the real source)
        run: python tests/version_matrix_check.py --skip-peft --unsloth-path .
      - name: Cache selection and norm upcast tests
        run: PYTHONPATH=. python -m pytest tests/ -q --tb=short
      - name: Guard gates only the bidirectional families
        run: |
          PYTHONPATH=. python - <<'PY'
          import importlib, sys
          from unsloth.models.vision import (
              _BIDIRECTIONAL_MASK_BUILDERS, _needs_bidirectional_multimodal_mask)
          bad = []
          for name in ("gemma3", "gemma4", "gemma4_unified", "qwen2_vl", "llava", "paligemma"):
              try:
                  mod = importlib.import_module(f"transformers.models.{name}.modeling_{name}")
              except Exception:
                  continue
              gated = any(hasattr(mod, b) for b in _BIDIRECTIONAL_MASK_BUILDERS)
              print(f"{name}: gated={gated}")
              if name in ("qwen2_vl", "llava", "paligemma") and gated:
                  bad.append(name)
          if bad:
              sys.exit(f"causal VLMs must never be gated: {bad}")
          print("OK: causal VLMs keep the static cache path")
          PY
