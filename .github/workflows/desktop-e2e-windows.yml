# STAGING. Silent-installs the SHIPPED NSIS installer on a machine stripped of developer
# tooling, audits EVERY installed PE's Authenticode signature, then launches the app and
# drives it through its own backend.
#
# The signature audit is the part that matters for the SmartScreen investigation. The
# outer installer already verifies clean offline (signer "Unsloth AI Inc.", RFC3161
# timestamped, chain to Microsoft Identity Verification Root CA 2020, issuer "Microsoft
# ID Verified CS AOC CA 04"). The open question is whether the binaries INSIDE the
# bundle -- app exe, sidecars, DLLs, the NSIS uninstaller -- are signed too. Tauri's
# bundle.windows.signCommand should hand each one to trusted-signing-cli; this proves it
# on disk rather than trusting the config.

name: "desktop-e2e windows"

on:
  push:
    branches: [desktop-e2e]
    paths:
      - 'tests/studio/desktop_drive.py'
      - '.github/workflows/desktop-e2e-windows.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag in the desktop release repo'
        type: string
        default: 'desktop-v0.1.51-beta'
      scenarios:
        description: 'Comma-separated scenario list, or all'
        type: string
        default: 'all'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REL_REPO: unsloth-test/unsloth-test
  REL_TAG: ${{ inputs.release_tag || 'desktop-v0.1.51-beta' }}
  SCENARIOS: ${{ inputs.scenarios || 'all' }}
  UNSLOTH_STUDIO_DISABLE_PUBLIC_CHECK: '1'
  UNSLOTH_DRIVE_MTP_VARIANT: 'UD-Q4_K_XL'

jobs:
  windows:
    name: NSIS install + signature audit + drive
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the shipped installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dl logs artifacts
          gh release download "$REL_TAG" --repo "$REL_REPO" --pattern '*setup.exe' --dir dl
          ls -la dl
          sha256sum dl/*setup.exe | tee artifacts/setup.sha256

      - name: Locate signtool
        shell: pwsh
        run: |
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse `
                        -Filter signtool.exe -ErrorAction SilentlyContinue |
                      Where-Object FullName -like '*\x64\signtool.exe' |
                      Sort-Object FullName -Descending |
                      Select-Object -First 1
          if (-not $signtool) { Write-Host '::error::signtool.exe not found on the image'; exit 1 }
          Write-Host "signtool: $($signtool.FullName)"
          "SIGNTOOL=$($signtool.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify the INSTALLER signature before running it
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dl/*setup.exe | Select-Object -First 1).FullName
          # /pa  normal Authenticode policy (not the driver policy)
          # /all every embedded signature, not just the first
          # /tw  treat a missing timestamp as a failure, which a bare /pa accepts silently
          & $env:SIGNTOOL verify /pa /all /v /tw $exe 2>&1 |
            Tee-Object artifacts/signtool-installer.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::the shipped installer failed signtool verify /pa /all /tw (exit $LASTEXITCODE)"
            exit 1
          }
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "Status        : $($sig.Status)"
          Write-Host "Signer        : $($sig.SignerCertificate.Subject)"
          Write-Host "ISSUER CA     : $($sig.SignerCertificate.Issuer)"
          Write-Host "Leaf validity : $($sig.SignerCertificate.NotBefore) .. $($sig.SignerCertificate.NotAfter)"
          Write-Host "Timestamper   : $($sig.TimeStamperCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Host "::error::signature status $($sig.Status)"; exit 1 }
          if (-not $sig.TimeStamperCertificate) {
            Write-Host '::error::no RFC3161 timestamp; the signature dies when the 3-day leaf expires'
            exit 1
          }
          $global:LASTEXITCODE = 0

      - name: Strip the developer toolchain
        shell: pwsh
        run: |
          # Strawberry: windows-latest ships a MinGW toolchain (cmake, gcc) under
          # C:\Strawberry\c\bin, which names none of the other fragments.
          $drop = @('hostedtoolcache\windows\Python', 'WindowsApps', '\Git\', 'CMake',
                    'Microsoft Visual Studio', 'BuildTools', 'LLVM', 'MSYS', 'mingw',
                    'Strawberry')
          # winget is an app-execution alias under ...\Local\Microsoft\WindowsApps, so
          # dropping WindowsApps (needed to lose the Store python.exe alias) takes the OS
          # package manager with it. winget is not developer tooling -- every consumer
          # machine has it and the bundled install.ps1 reaches for it -- so shim it back.
          $wingetCmd = Get-Command winget -ErrorAction SilentlyContinue
          if (-not $wingetCmd) {
            Write-Host '::error::winget was not on PATH before the strip; this image ships it'
            exit 1
          }
          $shim = Join-Path $env:RUNNER_TEMP 'winget-shim'
          New-Item -ItemType Directory -Force -Path $shim | Out-Null
          Set-Content -LiteralPath (Join-Path $shim 'winget.cmd') -Encoding ascii `
            -Value "@`"$($wingetCmd.Source)`" %*"
          $scrub = {
            param($entries)
            ,@($entries | Where-Object { $p = $_; $p -and -not ($drop | Where-Object { $p -like "*$_*" }) })
          }
          "PATH=$shim;$((& $scrub ($env:PATH -split ';')) -join ';')" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Off disk, not just off PATH: py.exe lives in C:\Windows and uv does its own
          # discovery, so both reach the toolcache whatever PATH says.
          foreach ($tc in @("$env:AGENT_TOOLSDIRECTORY\Python", 'C:\hostedtoolcache\windows\Python')) {
            if ($tc -and (Test-Path $tc)) {
              try { Rename-Item -LiteralPath $tc -NewName 'Python.masked' -ErrorAction Stop
                    Write-Host "masked toolcache python: $tc" }
              catch { Write-Host "::error::could not mask $tc ($($_.Exception.Message))"; exit 1 }
            }
          }
          # install.ps1's Refresh-SessionPath MERGES the Machine and User registry PATHs
          # back into $env:Path, so a process-only scrub lasts until the first refresh.
          # The runner is ephemeral, so rewrite the registry copies too. Expand first:
          # SetEnvironmentVariable rewrites REG_EXPAND_SZ as REG_SZ (dotnet/runtime#1442).
          foreach ($scope in 'Machine','User') {
            $raw = [System.Environment]::GetEnvironmentVariable('Path', $scope)
            if ([string]::IsNullOrWhiteSpace($raw)) { continue }
            $expanded = [System.Environment]::ExpandEnvironmentVariables($raw) -split ';'
            try {
              [System.Environment]::SetEnvironmentVariable('Path', ((& $scrub $expanded) -join ';'), $scope)
            } catch {
              Write-Host "::error::could not scrub the $scope PATH ($($_.Exception.Message))"
              exit 1
            }
          }
          foreach ($v in 'VSINSTALLDIR','VCINSTALLDIR','WindowsSdkDir','INCLUDE','LIB','LIBPATH') {
            "$v=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          exit 0

      - name: Verify the strip took effect
        shell: pwsh
        run: |
          $leaked = @()
          foreach ($t in 'python','py','git','cmake','cl') {
            $f = Get-Command $t -ErrorAction SilentlyContinue
            Write-Host ("{0,-8} {1}" -f $t, $(if ($f) { $f.Source } else { 'ABSENT' }))
            if ($f -and $t -ne 'py') { $leaked += "$t -> $($f.Source)" }
          }
          # `py` lives in C:\Windows and stays; only an interpreter it can still START is
          # a leak, because Find-CompatiblePython probes `py` first. `py -0p` reads the
          # registry, which still names the renamed paths, so only a start attempt tells
          # the truth.
          if (Get-Command py -ErrorAction SilentlyContinue) {
            foreach ($v in '-3.11', '-3.12', '-3.13') {
              $out = & py $v -c "import sys; print(sys.executable)" 2>&1
              $rc = $LASTEXITCODE
              Write-Host ("py {0} -> exit {1}" -f $v, $rc)
              if ($rc -eq 0) { $leaked += "py $v -> $out" }
            }
            # A failing probe is what we want, but the runner appends
            # `exit $LASTEXITCODE` to every pwsh step (actions/runner#351).
            $global:LASTEXITCODE = 0
          }
          $winget = Get-Command winget -ErrorAction SilentlyContinue
          Write-Host ("winget   {0}" -f $(if ($winget) { $winget.Source } else { 'ABSENT' }))
          if (-not $winget) {
            Write-Host '::error::winget did not survive the strip'
            exit 1
          }
          if ($leaked) {
            Write-Host "::error::developer tooling survived the strip: $($leaked -join '; ')"
            exit 1
          }
          exit 0

      - name: Silent install
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dl/*setup.exe | Select-Object -First 1).FullName
          # /S is the NSIS silent switch. A user double-clicks, but an installer that
          # cannot run unattended cannot be MDM-deployed either.
          $p = Start-Process -FilePath $exe -ArgumentList '/S' -Wait -PassThru
          Write-Host "installer exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Host '::error::silent install failed'; exit 1 }
          $found = Get-ChildItem -Path "$env:LOCALAPPDATA","$env:ProgramFiles" -Recurse `
                     -Filter '*Unsloth*.exe' -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          if (-not $found) { Write-Host '::error::no installed executable found'; exit 1 }
          Write-Host "installed: $($found.FullName)"
          "APP_EXE=$($found.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APP_ROOT=$(Split-Path -Parent $found.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Audit EVERY installed PE's signature
        # The SmartScreen question the offline analysis cannot answer: is the outer
        # installer the only signed thing? Reports rather than gates on the inner files,
        # because "some bundled third-party DLL is unsigned" is a finding to weigh, not a
        # reason to abort the functional run that follows.
        shell: pwsh
        run: |
          $rows = @()
          $files = Get-ChildItem -Path $env:APP_ROOT -Recurse -Include '*.exe','*.dll' `
                     -ErrorAction SilentlyContinue
          Write-Host "auditing $($files.Count) PE files under $env:APP_ROOT"
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            $rows += [pscustomobject]@{
              path        = $f.FullName.Replace($env:APP_ROOT, '')
              status      = [string]$sig.Status
              signer      = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '' }
              issuer      = if ($sig.SignerCertificate) { $sig.SignerCertificate.Issuer } else { '' }
              timestamped = [bool]$sig.TimeStamperCertificate
            }
          }
          $rows | Format-Table -AutoSize | Out-String -Width 260 | Write-Host
          $rows | ConvertTo-Json -Depth 4 | Out-File artifacts/pe-signature-audit.json -Encoding utf8

          $unsigned = @($rows | Where-Object { $_.status -eq 'NotSigned' })
          $ours     = @($rows | Where-Object { $_.signer -like '*Unsloth*' })
          Write-Host "signed by Unsloth AI Inc.: $($ours.Count) / $($rows.Count)"
          Write-Host "unsigned                 : $($unsigned.Count)"
          foreach ($u in $unsigned) { Write-Host "::warning::unsigned PE: $($u.path)" }

          # The uninstaller is the one inner PE that MUST be signed: users launch it from
          # Add/Remove Programs and an unsigned one is its own SmartScreen prompt.
          $uninstall = @($rows | Where-Object { $_.path -match 'uninstall' })
          if ($uninstall.Count -eq 0) {
            Write-Host '::warning::no uninstaller found under the install root to audit'
          } else {
            foreach ($u in $uninstall) {
              if ($u.status -eq 'Valid') { Write-Host "uninstaller signed: $($u.path)" }
              else { Write-Host "::error::the uninstaller is $($u.status): $($u.path)" }
            }
          }
          exit 0

      - name: Run the bundled installer, the path first launch takes
        # The bundled installer resolves the llama.cpp / whisper.cpp prebuilts from
        # GitHub. Unauthenticated that is 60 requests/hour PER IP, and hosted runners
        # share IPs, so on macOS it 403s and the install dies (see D7). A real user is
        # not behind a shared CI egress IP, so passing a token here makes the job
        # measure the app instead of GitHub's rate limiter. prebuilt_core.py:332 picks
        # GH_TOKEN up automatically.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ps1 = Get-ChildItem -Path $env:APP_ROOT -Recurse -Filter 'install.ps1' `
                   -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ps1) { Write-Host '::error::the bundle ships no install.ps1 resource'; exit 1 }
          Write-Host "bundled installer: $($ps1.FullName)"
          # --tauri rejects a custom studio home (install.ps1:189-215), so drop the
          # override, as install.rs:354-357 does.
          Remove-Item Env:UNSLOTH_STUDIO_HOME -ErrorAction SilentlyContinue
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
              -File $ps1.FullName --tauri *>&1 | Tee-Object -FilePath logs/bundled-install.log
          $rc = $LASTEXITCODE
          Write-Host "bundled installer exit: $rc"
          if ($rc -ne 0) { Write-Host "::error::bundled installer exited $rc"; exit $rc }
          $py = Join-Path $env:USERPROFILE '.unsloth\studio\unsloth_studio\Scripts\python.exe'
          if (-not (Test-Path $py)) { Write-Host "::error::no venv at $py"; exit 1 }
          & $py -V
          & $py -c "import torch; print('torch', torch.__version__)"
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error::the bundled install produced a venv with no working torch'
            exit 1
          }

      - name: Launch the app with the WebView2 debug port open
        shell: pwsh
        run: |
          # WebView2 reads this env var and opens a CDP endpoint, which is the only way
          # to drive the REAL packaged renderer (rather than a Chromium pointed at the
          # same backend). Documented under the WebView2 win32 reference.
          # Start-Process was WRONG here, and it invented D10 wholesale. On Windows the
          # Actions runner tears down a step's spawned processes at the step boundary, so
          # the app was killed the moment this step returned -- its log stops dead at the
          # 20s mark. Its KILL_ON_JOB_CLOSE job object then took the backend with it,
          # silently and with no crash event, which is exactly the "backend never becomes
          # reachable" that seven spawn hypotheses failed to explain. Linux and macOS
          # never showed it because they launch with `nohup ... &`, which detaches.
          #
          # Win32_Process.Create has the WMI service create the process, so it is not a
          # child of this step and outlives it. WMI-created processes inherit the MACHINE
          # environment rather than ours, hence setting the WebView2 var there, and get no
          # inherited stdio, hence the .cmd wrapper doing the redirection.
          [Environment]::SetEnvironmentVariable(
            'WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS', '--remote-debugging-port=9222', 'Machine')
          $here = (Get-Location).Path
          $launcher = Join-Path $here 'launch-app.cmd'
          @"
          @echo off
          set WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS=--remote-debugging-port=9222
          "$env:APP_EXE" > "$here\logs\app-stdout.log" 2> "$here\logs\app-stderr.log"
          "@ -replace '(?m)^          ', '' | Set-Content -Path $launcher -Encoding ascii
          Get-Content $launcher | Write-Host

          $res = Invoke-CimMethod -ClassName Win32_Process -MethodName Create `
                   -Arguments @{ CommandLine = "cmd.exe /c `"$launcher`""; CurrentDirectory = $here }
          if ($res.ReturnValue -ne 0) {
            Write-Host "::error::Win32_Process.Create failed with $($res.ReturnValue)"
            exit 1
          }
          Start-Sleep -Seconds 20

          # The app is a grandchild of the WMI service now, so find it by image name.
          $app = Get-Process -Name 'unsloth-studio' -ErrorAction SilentlyContinue |
                   Sort-Object StartTime -Descending | Select-Object -First 1
          if (-not $app) {
            Write-Host '::error::the app is not running 20s after launch'
            Get-Content logs/app-stdout.log, logs/app-stderr.log -Tail 40 -ErrorAction SilentlyContinue
            exit 1
          }
          "APP_PID=$($app.Id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "app launched (pid $($app.Id)) via WMI, detached from this step"

      - name: Is the app still alive before we blame its backend?
        # The check that would have caught D10 on day one. If the app is dead here, its
        # KILL_ON_JOB_CLOSE job object has already taken the backend with it, and every
        # "the backend never came up" result below is about a process that was killed as
        # collateral damage rather than anything the backend did.
        shell: pwsh
        run: |
          $app = Get-Process -Id $env:APP_PID -ErrorAction SilentlyContinue
          if (-not $app) {
            Write-Host "::error::the app (pid $env:APP_PID) died before driving started."
            Write-Host '::error::Do NOT read the backend results below as a backend defect:'
            Write-Host '::error::the job object kills the backend when the app goes.'
            Get-Content logs/app-stderr.log -Tail 40 -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "app alive: pid $($app.Id), $([math]::Round($app.WorkingSet64/1MB))MB"

      - name: Drive the running app
        shell: pwsh
        run: |
          # The stripped machine has no python on PATH by design, so use the venv the
          # bundled installer just built -- which is also a check that it is usable.
          $py = Join-Path $env:USERPROFILE '.unsloth\studio\unsloth_studio\Scripts\python.exe'
          $env:UNSLOTH_DRIVE_APP_BINARY = $env:APP_EXE
          & $py tests/studio/desktop_drive.py `
              --scenarios $env:SCENARIOS `
              --discover-timeout 900 `
              --out artifacts/drive-report.json 2>&1 | Tee-Object logs/drive.log
          exit $LASTEXITCODE

      - name: Drive the packaged WebView2 renderer
        if: always()
        shell: pwsh
        run: |
          $py = Join-Path $env:USERPROFILE '.unsloth\studio\unsloth_studio\Scripts\python.exe'
          & $py -m pip install --quiet 'playwright>=1.45'
          # The native layer attaches to the ALREADY-RUNNING WebView2 over CDP, so it
          # needs no browser download; the attached layer does.
          & $py -m playwright install chromium
          & $py tests/studio/desktop_playwright.py `
              --layer both `
              --out artifacts/ui `
              --report artifacts/ui-report.json 2>&1 | Tee-Object logs/ui.log
          exit $LASTEXITCODE

      - name: D10 -- stack-dump the hung backend (the decisive one)
        # Seven hypotheses about HOW the app spawns the backend have now been tested and
        # refuted: the stdout pipe, the creation flags, cold-start cost, a console-less
        # GUI parent, inherited stdin, the injected Tauri owner env, and the job object.
        # Every one of them starts the backend fine. So stop guessing from outside and
        # ask the hung process directly what it is doing.
        #
        # No app rebuild needed: the backend writes its own PID into its session log
        # FILENAME (server-<ts>-pid<PID>.log), and the app records that exact path in
        # tauri.log. py-spy attaches to a running CPython process and prints the Python
        # stack, so it names the frame the import is stuck in.
        #
        # MUST run before the other D10 probes: those spawn extra backends that write
        # newer session logs and would poison the PID we pick.
        if: failure()
        shell: pwsh
        run: |
          $studio = Join-Path $env:USERPROFILE '.unsloth\studio'
          $py     = Join-Path $studio 'unsloth_studio\Scripts\python.exe'

          # Prefer the path the app itself recorded; fall back to the newest session log.
          $target = $null
          $tauriLog = Join-Path $studio 'tauri.log'
          if (Test-Path $tauriLog) {
            $m = Select-String -Path $tauriLog -Pattern 'Session log: (.+server-.+-pid(\d+)\.log)' |
                   Select-Object -Last 1
            if ($m) { $target = $m.Matches[0].Groups[2].Value }
          }
          if (-not $target) {
            $newest = Get-ChildItem (Join-Path $studio 'logs\server') -Filter 'server-*-pid*.log' `
                        -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending |
                      Select-Object -First 1
            if ($newest -and $newest.Name -match 'pid(\d+)\.log$') { $target = $matches[1] }
          }
          if (-not $target) { Write-Host '::warning::could not determine the backend PID'; exit 0 }

          Write-Host "backend PID from its own session log: $target"
          $proc = Get-Process -Id $target -ErrorAction SilentlyContinue
          if (-not $proc) {
            Write-Host "::warning::PID $target is NOT alive -- the backend DIED rather than hung."
            Write-Host '::warning::Every spawn hypothesis assumed a hang, which is why none reproduced.'

            # The app says "process is still running" while THIS pid is gone, so it is
            # watching a different process: unsloth.exe is a wrapper that subprocess-spawns
            # the real server and sits in wait(). Show the tree to prove it.
            Write-Host ''
            Write-Host '=== process tree: who does the app actually hold? ==='
            Get-CimInstance Win32_Process |
              Where-Object { $_.Name -match 'unsloth|python' } |
              Select-Object ProcessId, ParentProcessId, Name,
                            @{n='Cmd';e={$_.CommandLine -replace '^(.{140}).*','$1...'}} |
              Format-Table -AutoSize | Out-String -Width 260 | Write-Host
            Write-Host "app PID is $env:APP_PID"

            Write-Host '=== why did it die? Windows Error Reporting / crash events ==='
            $since = (Get-Date).AddMinutes(-90)
            foreach ($logName in 'Application', 'System') {
              Get-WinEvent -FilterHashtable @{LogName=$logName; StartTime=$since} -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Message -match 'unsloth|python|llama|torch' -or
                  $_.ProviderName -match 'Application Error|Windows Error Reporting|\.NET Runtime'
                } |
                Select-Object -First 12 TimeCreated, ProviderName, Id,
                              @{n='Msg';e={($_.Message -replace '\s+',' ') -replace '^(.{400}).*','$1...'}} |
                Format-List | Out-String -Width 260 | Write-Host
            }

            Write-Host '=== the diagnostics phase log (it records the exit) ==='
            Get-ChildItem (Join-Path $studio 'logs') -Filter 'backend-*.log' -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 2 | ForEach-Object {
                Write-Host "--- $($_.Name) ---"; Get-Content $_.FullName -Tail 40
              }

            Write-Host '=== does it die the same way when run by hand? ==='
            $uns = Join-Path $studio 'unsloth_studio\Scripts\unsloth.exe'
            $p2 = Start-Process -FilePath $uns -PassThru -NoNewWindow `
                    -ArgumentList 'studio','--api-only','-H','127.0.0.1','-p','8961' `
                    -RedirectStandardOutput logs/deathprobe.log -RedirectStandardError logs/deathprobe.err.log
            for ($i = 0; $i -lt 60; $i++) {
              if ($p2.HasExited) { break }
              try { Invoke-RestMethod -TimeoutSec 3 http://127.0.0.1:8961/api/health | Out-Null; break } catch {}
              Start-Sleep -Seconds 5
            }
            if ($p2.HasExited) {
              Write-Host "::warning::by hand it ALSO exited, code $($p2.ExitCode) -- reproducible outside the app"
            } else {
              Write-Host '::warning::by hand it stayed up, so the death needs the app context'
              Stop-Process -Id $p2.Id -Force -ErrorAction SilentlyContinue
            }
            Get-Content logs/deathprobe.log -Tail 25 -ErrorAction SilentlyContinue
            Get-Content logs/deathprobe.err.log -Tail 25 -ErrorAction SilentlyContinue
            exit 0
          }
          Write-Host "alive: $($proc.ProcessName), threads=$($proc.Threads.Count), WS=$([math]::Round($proc.WorkingSet64/1MB))MB, CPU=$($proc.CPU)s"

          & $py -m pip install --quiet --disable-pip-version-check py-spy 2>&1 | Select-Object -Last 3
          $pyspy = Join-Path $studio 'unsloth_studio\Scripts\py-spy.exe'
          if (-not (Test-Path $pyspy)) { Write-Host '::warning::py-spy did not install'; exit 0 }

          # Two dumps 45s apart. Identical stacks mean genuinely stuck; different stacks
          # mean it is progressing, just impossibly slowly -- a distinction no amount of
          # black-box probing could make.
          foreach ($round in 1, 2) {
            Write-Host ""
            Write-Host "=== py-spy dump #$round (PID $target) ==="
            & $pyspy dump --pid $target --locals 2>&1 | Tee-Object -FilePath "logs/pyspy-dump-$round.txt"
            Write-Host "=== py-spy dump #$round with native frames ==="
            & $pyspy dump --pid $target --native 2>&1 |
              Tee-Object -FilePath "logs/pyspy-native-$round.txt" | Select-Object -First 60
            if ($round -eq 1) {
              $cpu1 = (Get-Process -Id $target).CPU
              Start-Sleep -Seconds 45
              $cpu2 = (Get-Process -Id $target).CPU
              Write-Host "CPU seconds consumed over those 45s: $([math]::Round($cpu2 - $cpu1, 2))"
              Write-Host '(near zero = blocked on something; climbing = spinning or grinding)'
            }
          }
          exit 0

      - name: D10 -- control arm, does the backend start at all by hand?
        # Round 5 established that the backend is NOT slow and NOT broken: `import torch`
        # takes 1.6s, and the app's exact command served /api/health in ~14s when run by
        # hand. Yet spawned by the app it is still dead at 900s. The app's own log says
        # why it might be: it reaches "loading PyTorch, Unsloth and Transformers...",
        # and 15s later logs "Backend stdout stream ended, but process is still running".
        # 15s is exactly when the child emits its next burst -- the probe measured
        # "Imported FastAPI app in 13181.2ms".
        #
        # That is the shape of a pipe-drain deadlock: once nobody reads the pipe, the
        # child blocks forever on the write that fills it, having bound no socket yet.
        #
        # So run the SAME binary with the SAME arguments three times, varying only how
        # stdout is connected:
        #
        #   A  stdout -> file        (round 5's control; came up in ~14s)
        #   B  stdout -> pipe, never read
        #   C  stdout -> pipe, drained asynchronously
        #
        # If B hangs while A and C come up, D10 is a pipe-drain deadlock in the app's
        # spawn path and the fix is "always drain the child's stdout", which C proves.
        if: failure()
        shell: pwsh
        run: |
          $py  = Join-Path $env:USERPROFILE '.unsloth\studio\unsloth_studio\Scripts\python.exe'
          $uns = Join-Path $env:USERPROFILE '.unsloth\studio\unsloth_studio\Scripts\unsloth.exe'
          Write-Host '=== how long does importing torch alone take here? ==='
          & $py -c "import time; t=time.time(); import torch; print('torch', torch.__version__, 'imported in', round(time.time()-t,1), 's')"

          function Invoke-Arm {
            param([string]$Label, [int]$Port, [string]$Mode, [int]$WaitSeconds = 240)
            Write-Host ""
            Write-Host "=== arm $Label : stdout -> $Mode, port $Port ==="
            $psi = New-Object Diagnostics.ProcessStartInfo
            $psi.FileName        = $uns
            $psi.Arguments       = "studio --api-only -H 127.0.0.1 -p $Port"
            $psi.UseShellExecute = $false
            $psi.WorkingDirectory = (Get-Location).Path
            if ($Mode -eq 'file') {
              # cmd.exe does the redirection so the handle is a real file, not a pipe.
              $psi.FileName  = $env:ComSpec
              $psi.Arguments = "/c `"`"$uns`" studio --api-only -H 127.0.0.1 -p $Port > logs\arm-$Label.log 2>&1`""
            } else {
              $psi.RedirectStandardOutput = $true
              $psi.RedirectStandardError  = $true
            }
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p  = [Diagnostics.Process]::Start($psi)
            $task = $null
            if ($Mode -eq 'drained pipe') {
              # The whole point of arm C: keep reading for the process's lifetime.
              $task = $p.StandardOutput.ReadToEndAsync()
              $null = $p.StandardError.ReadToEndAsync()
            }
            # Arm B deliberately never touches $p.StandardOutput.
            $up = $false
            for ($i = 0; $i -lt [int]($WaitSeconds / 5); $i++) {
              try {
                Invoke-RestMethod -TimeoutSec 3 "http://127.0.0.1:$Port/api/health" | Out-Null
                $up = $true; break
              } catch { Start-Sleep -Seconds 5 }
            }
            $secs = [math]::Round($sw.Elapsed.TotalSeconds, 1)
            if ($up) { Write-Host "RESULT arm $Label ($Mode): UP after ${secs}s" }
            else     { Write-Host "RESULT arm $Label ($Mode): NEVER CAME UP in ${secs}s" }
            if ($task -and $task.IsCompleted) {
              Write-Host "  (drained $($task.Result.Length) bytes of stdout)"
            }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 5
            return $up
          }

          $a = Invoke-Arm -Label 'A' -Port 8907 -Mode 'file'

          Write-Host ""
          if ($a) {
            Write-Host '::warning::control arm OK: the app''s exact command serves /api/health when'
            Write-Host '::warning::run by hand, so the machine, venv, torch and backend are all fine.'
          } else {
            Write-Host '::warning::control arm FAILED: the backend does not start on this machine at'
            Write-Host '::warning::all, which would change D10 entirely. Check arm A output below.'
          }
          Write-Host '=== arm A output ==='
          Get-Content logs/arm-A.log -Tail 25 -ErrorAction SilentlyContinue
          exit 0

      - name: D10 -- which part of the app's spawn hangs it?
        # The stdout pipe is ruled out: file / undrained pipe / drained pipe all came up
        # (14.7s / 8.8s / 8.8s), and the child writes only a few hundred bytes before
        # binding, nowhere near enough to fill a pipe buffer anyway.
        #
        # The decisive evidence is that the backend's own *file* session log stops at
        # "loading PyTorch, Unsloth and Transformers..." and never reaches "Imported
        # FastAPI app", while the same command by hand imports in 7-11s. So the child
        # hangs inside the import, and something about how it was launched causes it.
        #
        # What no arm has controlled for yet is the console. process.rs:641 spawns with
        # CREATE_NEW_PROCESS_GROUP | CREATE_NO_WINDOW, and CREATE_NO_WINDOW leaves the
        # child with no console at all -- every arm so far inherited the runner's.
        # Bisect the flags one bit at a time.
        if: failure()
        shell: pwsh
        run: |
          $py  = Join-Path $env:USERPROFILE '.unsloth\studio\unsloth_studio\Scripts\python.exe'
          $uns = Join-Path $env:USERPROFILE '.unsloth\studio\unsloth_studio\Scripts\unsloth.exe'
          & $py tests/studio/win_spawn_probe.py `
              --exe $uns `
              --first-port 8920 `
              --wait 180 `
              --log-dir logs/spawn-probe `
              --report artifacts/spawn-probe.json
          exit 0

      - name: What did the app's own log say?
        if: always()
        shell: pwsh
        run: |
          # The backend the app spawns writes to ~/.unsloth/studio/logs (process.rs pipes
          # the child's stdout/stderr into diagnostics phase logs). Without these, a
          # backend that fails to start leaves tauri.log ending at "spawned" and no
          # explanation anywhere.
          $studio = Join-Path $env:USERPROFILE '.unsloth\studio'
          foreach ($d in 'logs','run') {
            $src = Join-Path $studio $d
            if (Test-Path $src) { Copy-Item $src "logs/studio-$d" -Recurse -ErrorAction SilentlyContinue }
          }
          Write-Host '=== backend phase logs ==='
          Get-ChildItem (Join-Path $studio 'logs') -File -ErrorAction SilentlyContinue |
            Select-Object -First 20 | ForEach-Object {
              Write-Host "--- $($_.FullName) ---"; Get-Content $_.FullName -Tail 60
            }
          Write-Host '=== listening sockets ==='
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
            Where-Object LocalPort -ge 8888 | Where-Object LocalPort -le 8908 |
            Format-Table -AutoSize | Out-String | Write-Host
          Write-Host '=== unsloth processes ==='
          Get-Process | Where-Object ProcessName -like '*unsloth*' |
            Format-Table -AutoSize | Out-String | Write-Host
          foreach ($f in @("$studio\tauri.log", 'logs/app-stdout.log', 'logs/app-stderr.log')) {
            if (Test-Path $f) {
              Write-Host "=== $f ==="
              Copy-Item $f logs/ -ErrorAction SilentlyContinue
              Get-Content $f -Tail 80
            }
          }

      - name: Stop the app
        if: always()
        shell: pwsh
        run: Stop-Process -Id $env:APP_PID -Force -ErrorAction SilentlyContinue

      - name: Upload logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-windows
          path: |
            logs/
            artifacts/
          retention-days: 7
          if-no-files-found: warn
