#
# Real MLX server-side tool-calling smoke on Apple Silicon (macos-14, M1).
#
# Loads small mlx-community 4-bit/8-bit quants through Studio's MLX backend
# and drives every server-side tool capability -- code execution, file editing,
# web search, MCP, plus client function-calling / render_html / thinking --
# through the /v1 API, mirroring the GGUF "Tool calling Tests" job in
# studio-mac-inference-smoke.yml. MLX routes through the SAME
# run_safetensors_tool_loop as GGUF/safetensors (via InferenceOrchestrator),
# so this is the first coverage of that loop on the MLX backend.
#
# One free macos-14 job per model (fail-fast: false). Core-tier Qwen2.5 /
# Llama-3.2 models must PASS the code-execution axis; Qwen3.5 and the gemma-4
# VLM are best-effort (WARN-tolerated) because low-bit Metal sampling drifts.

name: "MLX Tool Calling - macOS"

on:
  push:
    branches: [mlx-tool-calling-ci]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mlx-tools:
    name: ${{ matrix.model }}
    runs-on: macos-14
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: mlx-community/Qwen2.5-3B-Instruct-4bit
            require_core: '1'
          - model: mlx-community/Llama-3.2-3B-Instruct-4bit
            require_core: '1'
          - model: mlx-community/Qwen2.5-1.5B-Instruct-4bit
            require_core: '1'
          - model: mlx-community/Qwen3.5-2B-MLX-8bit
            require_core: '0'
          - model: mlx-community/gemma-4-e2b-it-4bit
            require_core: '0'
    env:
      STUDIO_PORT: '18899'
      UNSLOTH_COMPILE_DISABLE: '1'
      HF_HOME: ${{ github.workspace }}/hf-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      # Node 22 provides npx for the stdio filesystem MCP server.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Studio (--local, --no-torch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p logs
          set -o pipefail
          bash install.sh --local --no-torch 2>&1 | tee logs/install.log

      # PyPI unsloth_zoo lacks the MLX backend (see mlx-ci.yml), so overlay the
      # git build -- with deps -- INTO the Studio venv. It pulls mlx / mlx-lm /
      # mlx-vlm as darwin+arm64 extras. torch (CPU wheel) is added because the
      # hardware-dispatch path imports it even though MLX inference does not use it.
      - name: Overlay MLX stack into the Studio venv
        run: |
          VENV_PY="$HOME/.unsloth/studio/unsloth_studio/bin/python"
          if [ ! -x "$VENV_PY" ]; then
            VENV_PY=$(ls "$HOME"/.unsloth/studio/unsloth_studio/bin/python* 2>/dev/null | head -1)
          fi
          echo "Studio venv python: $VENV_PY"
          "$VENV_PY" -m pip install --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple 'torch==2.10.0'
          for attempt in 1 2 3; do
            if "$VENV_PY" -m pip install "unsloth_zoo @ git+https://github.com/unslothai/unsloth-zoo"; then
              break
            fi
            [ "$attempt" -eq 3 ] && { echo "::error::unsloth_zoo git install failed"; exit 1; }
            sleep $((5 * attempt))
          done
          echo "VENV_PY=$VENV_PY" >> "$GITHUB_ENV"

      - name: Assert the MLX stack is active on this runner
        # unsloth._IS_MLX = Darwin + arm64 + importable mlx + zoo's
        # is_mlx_available(); True proves the overlay produced a usable MLX
        # stack (a partial install would silently downgrade the backend to CPU).
        run: |
          "$VENV_PY" - <<'PY'
          import unsloth
          assert unsloth._IS_MLX is True, f"_IS_MLX={unsloth._IS_MLX} (expected True on Apple Silicon with full MLX stack)"
          print("OK: unsloth._IS_MLX is True")
          PY

      - name: Restore HF cache for ${{ matrix.model }}
        id: cache-hf
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        continue-on-error: true
        with:
          path: hf-cache
          key: ${{ runner.os }}-hf-${{ matrix.model }}-v1

      - name: Prime HF cache with the MLX model
        id: prime-hf
        if: steps.cache-hf.outputs.cache-hit != 'true' || steps.cache-hf.outcome != 'success'
        env:
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          python -m pip install --upgrade "huggingface_hub[cli]"
          for attempt in 1 2 3; do
            if hf download "${{ matrix.model }}"; then break; fi
            [ "$attempt" -eq 3 ] && { echo "::error::model download failed"; exit 1; }
            sleep $((10 * attempt))
          done

      - name: Save HF cache for ${{ matrix.model }}
        if: always() && steps.prime-hf.outcome == 'success'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: hf-cache
          key: ${{ runner.os }}-hf-${{ matrix.model }}-v1

      - name: Reset auth + boot Studio (API-only, stdio MCP allowed)
        # API-only mode (never `unsloth studio run`) leaves tool_policy=None so
        # each request's enable_tools field is honoured. ALLOW_STDIO_MCP enables
        # the filesystem MCP server the tool test registers.
        run: |
          unsloth studio reset-password
          mkdir -p logs
          UNSLOTH_STUDIO_ALLOW_STDIO_MCP=1 UNSLOTH_API_ONLY=1 \
            unsloth studio -H 127.0.0.1 -p "$STUDIO_PORT" > logs/studio.log 2>&1 &
          echo "STUDIO_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for /api/health, log in, change password
        run: |
          for i in $(seq 1 180); do
            if curl -fs "http://127.0.0.1:${STUDIO_PORT}/api/health" > /tmp/health.json; then
              jq -e '.status == "healthy"' /tmp/health.json && break
            fi
            sleep 1
          done
          jq -e '.status == "healthy"' /tmp/health.json
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CIMlx-$(python -c 'import secrets; print(secrets.token_urlsafe(12))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          OLD_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}" | jq -r .access_token)
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/change-password" \
            -H "Authorization: Bearer $OLD_TOKEN" -H 'content-type: application/json' \
            -d "{\"current_password\":\"$OLD\",\"new_password\":\"$NEW\"}" > /dev/null
          TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$NEW\"}" | jq -r .access_token)
          echo "API_KEY=$TOKEN" >> "$GITHUB_ENV"

      - name: MLX tool-calling smoke
        run: |
          FLAG=""
          [ "${{ matrix.require_core }}" = "1" ] && FLAG="--require-core"
          python tests/studio/run_mlx_tool_calling_smoke.py \
            --model "${{ matrix.model }}" \
            --port "$STUDIO_PORT" \
            --workdir "$HOME/mcp_fs" \
            $FLAG

      - name: Stop Studio
        if: always()
        run: |
          kill "${STUDIO_PID}" 2>/dev/null || true
          sleep 2

      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mlx-tools-${{ strategy.job-index }}
          path: |
            logs/studio.log
            logs/install.log
          retention-days: 7
