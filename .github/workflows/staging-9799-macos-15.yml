name: "staging-9799 macos-15"
on:
  push:
    branches: ["pr-9799-xplat-ci"]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_offload_planner_seam.py tests/test_fp8_fbgemm_block_shapes.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out.txt 2>&1 || rc=$?; cat pytest_out.txt; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && ! grep -qE "^FAILED " pytest_out.txt; then tot=$(awk '/^ERROR /{n++} END{print n+0}' pytest_out.txt); dep=$(awk '/^E +ModuleNotFoundError. No module named .(torch|unsloth_zoo|transformers).$/{n++} END{print n+0}' pytest_out.txt); if [ "$dep" -gt 0 ] && [ "$tot" -le "$dep" ]; then echo "collection needs a dep this runner does not ship"; rc=0; fi; fi; if [ "$rc" = "1" ] && ! grep -qE "^ERROR " pytest_out.txt; then tot=$(awk '/^FAILED /{n++} END{print n+0}' pytest_out.txt); dep=$(awk '/^FAILED .* No module named .(torch|unsloth_zoo|transformers).$/{n++} END{print n+0}' pytest_out.txt); if [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; fi; exit "$rc"
