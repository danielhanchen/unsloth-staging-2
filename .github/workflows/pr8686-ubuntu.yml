name: "PR-8686 ubuntu-latest"

on:
  push:
    branches: [pr8686-cross-os]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chat-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }

      - name: Install backend deps
        run: python -m pip install pydantic fastapi structlog pytest pytest-asyncio pytest-timeout python-multipart

      - name: Thread-scoped settings backend tests
        working-directory: studio/backend
        run: python -m pytest tests/test_chat_thread_settings.py tests/test_chat_settings_payload.py -q

      - name: SQLite migration and compatibility simulation
        run: python tests/studio/sim_thread_settings_portability.py

      - uses: actions/setup-node@v4
        with: { node-version: '24' }

      - name: Frontend unit tests
        working-directory: studio/frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
