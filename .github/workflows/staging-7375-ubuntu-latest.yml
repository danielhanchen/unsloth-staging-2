name: "staging-7375 ubuntu-latest"
on:
  push:
    branches: ["pr-7375-xplat-ci"]
    paths:
      - 'studio/backend/hub/services/models/cache_inventory.py'
      - 'studio/backend/hub/services/models/common.py'
      - 'studio/backend/hub/services/models/gguf_variants.py'
      - 'studio/backend/hub/tests/test_model_services.py'
      - 'studio/backend/hub/utils/gguf.py'
      - 'studio/backend/hub/utils/hf_cache_state.py'
      - 'studio/backend/hub/utils/inventory_scan.py'
      - 'studio/backend/picker/service.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/routes/models.py'
      - 'studio/backend/tests/test_active_generations.py'
      - 'studio/backend/tests/test_cached_gguf_routes.py'
      - 'studio/backend/tests/test_detect_mmproj_file.py'
      - 'studio/backend/tests/test_hf_cache_dangling_refs.py'
      - 'studio/backend/tests/test_picker_service.py'
      - 'studio/backend/utils/models/model_config.py'
      - 'studio/frontend/src/features/auth/api.ts'
      - 'studio/frontend/src/features/chat/api/chat-adapter.ts'
      - 'studio/frontend/src/features/chat/api/chat-api.ts'
      - 'studio/frontend/src/features/chat/chat-page.tsx'
      - '.github/workflows/staging-7375-ubuntu-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; for f in studio/backend/hub/tests/test_model_services.py studio/backend/tests/test_active_generations.py studio/backend/tests/test_cached_gguf_routes.py studio/backend/tests/test_detect_mmproj_file.py studio/backend/tests/test_hf_cache_dangling_refs.py studio/backend/tests/test_picker_service.py tests/studio/load_freeze/test_load_orchestrator.py tests/studio/test_chat_autoload_failure_gate.py tests/studio/test_model_picker_contracts.py; do frc=0; PYTHONPATH=studio/backend python -m pytest "$f" -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || frc=$?; if [ "$frc" = "5" ]; then echo "no tests ran in $f (deps absent on this runner)"; frc=0; fi; if [ "$frc" != "0" ]; then rc=$frc; fi; done; exit "$rc"
