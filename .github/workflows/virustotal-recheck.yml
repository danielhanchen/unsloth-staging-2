name: VirusTotal recheck, both dmgs together

# The PR run and the main baseline run scanned their macOS bundles minutes apart,
# and the baseline had six engines time out, so "0 malicious on main, 1 on the PR"
# could be a difference in the artifact or a difference in which engines answered.
# This scans BOTH files in one job: same moment, same engine versions, and by then
# VirusTotal has a completed analysis for each hash, so nothing is waiting on a
# first upload.

on:
  push:
    branches: ["vt-recheck"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vt-8592
          persist-credentials: false

      - name: Download both macOS bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p pair
          gh run download 31662345202 --repo ${{ github.repository }} -n vt-8592-macos-14 --dir pr
          gh run download 31665301586 --repo ${{ github.repository }} -n vt-8592-macos-14 --dir base
          # Renamed so the report says which is which; VirusTotal keys on content.
          for f in pr/*.dmg; do cp "$f" "pair/pr-8592-$(basename "$f")"; done
          for f in base/*.dmg; do cp "$f" "pair/main-baseline-$(basename "$f")"; done
          sha256sum pair/*

      # Six engines returned no verdict for the baseline bundle, so its "0
      # malicious" is not comparable with the PR's "1" until the same engines have
      # answered for both. Ask VirusTotal to re-analyse each hash and read the
      # fresh analysis directly; the scan script reports the cached report, which
      # is exactly what needs refreshing here.
      - name: Re-analyse both hashes and report per engine
        env:
          VT_API_KEY: ${{ secrets.VIRUS_TOTAL_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, time, urllib.request

          key = os.environ["VT_API_KEY"]
          root = "https://www.virustotal.com/api/v3"

          def call(method, url, body = None):
              request = urllib.request.Request(url, data = body, method = method)
              request.add_header("x-apikey", key)
              with urllib.request.urlopen(request, timeout = 120) as response:
                  return json.loads(response.read())

          for path in sorted(pathlib.Path("pair").iterdir()):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              analysis = call("POST", f"{root}/files/{digest}/analyse")["data"]["id"]
              print(f"{path.name}: re-analysis {analysis}", flush = True)
              for _ in range(40):
                  time.sleep(20)
                  result = call("GET", f"{root}/analyses/{analysis}")["data"]
                  if result["attributes"]["status"] == "completed":
                      break
              stats = result["attributes"]["stats"]
              results = result["attributes"].get("results", {})
              flagged = {
                  engine: verdict.get("result")
                  for engine, verdict in results.items()
                  if verdict.get("category") in ("malicious", "suspicious")
              }
              answered = sum(
                  1 for verdict in results.values()
                  if verdict.get("category") not in (None, "type-unsupported", "timeout", "failure")
              )
              print(f"{path.name}: {stats}", flush = True)
              print(f"{path.name}: engines answering={answered} flagged={flagged}", flush = True)
              microsoft = results.get("Microsoft", {})
              print(f"{path.name}: Microsoft -> {microsoft.get('category')} {microsoft.get('result')}", flush = True)
          PY


