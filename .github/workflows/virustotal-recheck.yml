name: VirusTotal recheck, both dmgs together

# The PR run and the main baseline run scanned their macOS bundles minutes apart,
# and the baseline had six engines time out, so "0 malicious on main, 1 on the PR"
# could be a difference in the artifact or a difference in which engines answered.
# This scans BOTH files in one job: same moment, same engine versions, and by then
# VirusTotal has a completed analysis for each hash, so nothing is waiting on a
# first upload.

on:
  push:
    branches: ["vt-recheck"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vt-8592
          persist-credentials: false

      - name: Download both macOS bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p pair
          gh run download 31662345202 --repo ${{ github.repository }} -n vt-8592-macos-14 --dir pr
          gh run download 31665301586 --repo ${{ github.repository }} -n vt-8592-macos-14 --dir base
          # Renamed so the report says which is which; VirusTotal keys on content.
          for f in pr/*.dmg; do cp "$f" "pair/pr-8592-$(basename "$f")"; done
          for f in base/*.dmg; do cp "$f" "pair/main-baseline-$(basename "$f")"; done
          sha256sum pair/*

      # The forced re-analysis did not finish inside the poll window, and an
      # unfinished analysis reads as all-zero stats, which is not a clean result.
      # Read the CURRENT file report for each hash instead: it carries the engine
      # table VirusTotal has now, so the question "did Microsoft ever answer for
      # the baseline bundle" can be answered directly rather than inferred from a
      # count of six silent engines.
      - name: Report the current per-engine verdicts for both hashes
        env:
          VT_API_KEY: ${{ secrets.VIRUS_TOTAL_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, time, urllib.request

          key = os.environ["VT_API_KEY"]

          def get(url):
              request = urllib.request.Request(url)
              request.add_header("x-apikey", key)
              with urllib.request.urlopen(request, timeout = 120) as response:
                  return json.loads(response.read())

          for path in sorted(pathlib.Path("pair").iterdir()):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              data = get(f"https://www.virustotal.com/api/v3/files/{digest}")["data"]
              attributes = data["attributes"]
              results = attributes.get("last_analysis_results", {})
              stats = attributes.get("last_analysis_stats", {})
              flagged = {
                  engine: verdict.get("result")
                  for engine, verdict in results.items()
                  if verdict.get("category") in ("malicious", "suspicious")
              }
              silent = sorted(
                  engine for engine, verdict in results.items()
                  if verdict.get("category") in ("timeout", "failure", "confirmed-timeout")
              )
              microsoft = results.get("Microsoft", {})
              print(f"{path.name} sha256={digest}", flush = True)
              print(f"  stats={stats}", flush = True)
              print(f"  flagged={flagged}", flush = True)
              print(f"  silent={silent}", flush = True)
              print(f"  Microsoft={microsoft.get('category')} / {microsoft.get('result')}", flush = True)
              time.sleep(20)
          PY
