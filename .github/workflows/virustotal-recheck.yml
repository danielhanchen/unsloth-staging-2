name: VirusTotal recheck, both dmgs together

# The PR run and the main baseline run scanned their macOS bundles minutes apart,
# and the baseline had six engines time out, so "0 malicious on main, 1 on the PR"
# could be a difference in the artifact or a difference in which engines answered.
# This scans BOTH files in one job: same moment, same engine versions, and by then
# VirusTotal has a completed analysis for each hash, so nothing is waiting on a
# first upload.

on:
  push:
    branches: ["vt-recheck"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vt-8592
          persist-credentials: false

      - name: Download both macOS bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p pair
          gh run download 31662345202 --repo ${{ github.repository }} -n vt-8592-macos-14 --dir pr
          gh run download 31665301586 --repo ${{ github.repository }} -n vt-8592-macos-14 --dir base
          # Renamed so the report says which is which; VirusTotal keys on content.
          for f in pr/*.dmg; do cp "$f" "pair/pr-8592-$(basename "$f")"; done
          for f in base/*.dmg; do cp "$f" "pair/main-baseline-$(basename "$f")"; done
          sha256sum pair/*

      # install.ps1 is a bundle RESOURCE on every platform, including the macOS
      # dmg, and the verdict on that dmg was Trojan:Script/...!ml -- a SCRIPT
      # verdict on a disk image. So scan the script itself, from both refs, and
      # find out whether the engine is reacting to this PR's installer changes
      # rather than to the bundle. If it is, that is a real problem for users:
      # Defender quarantining install.ps1 is worse than the bug being fixed.
      - name: Scan install.ps1 from both refs on its own
        env:
          VT_API_KEY: ${{ secrets.VIRUS_TOTAL_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p scripts_pair
          git fetch --depth 1 https://github.com/unslothai/unsloth main
          git show FETCH_HEAD:install.ps1 > scripts_pair/main-install.ps1
          git fetch --depth 1 https://github.com/unslothai/unsloth windows-application-control-8490
          git show FETCH_HEAD:install.ps1 > scripts_pair/pr8592-install.ps1
          git show FETCH_HEAD:studio/setup.ps1 > scripts_pair/pr8592-setup.ps1
          ls -la scripts_pair
          python3 scripts/virustotal_scan.py scripts_pair \
            --output-markdown "$RUNNER_TEMP/scripts.md"
          cat "$RUNNER_TEMP/scripts.md" | tee -a "$GITHUB_STEP_SUMMARY"
