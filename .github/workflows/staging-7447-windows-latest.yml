name: "staging-7447 windows-latest"
on:
  push:
    branches: ["pr-7447-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/llama_cpp.py'
      - 'studio/backend/core/inference/llama_server_args.py'
      - 'studio/backend/models/inference.py'
      - 'studio/backend/routes/chat_history.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/run.py'
      - 'studio/backend/tests/test_llama_server_args.py'
      - 'studio/backend/tests/test_parallel_slots_per_load.py'
      - 'studio/frontend/src/features/chat/api/chat-adapter.ts'
      - 'studio/frontend/src/features/chat/api/chat-api.ts'
      - 'studio/frontend/src/features/chat/chat-settings-sheet.tsx'
      - 'studio/frontend/src/features/chat/hooks/use-chat-model-runtime.ts'
      - 'studio/frontend/src/features/chat/lib/apply-inference-status-to-store.ts'
      - 'studio/frontend/src/features/chat/presets/preset-load-config.ts'
      - 'studio/frontend/src/features/chat/shared-composer.tsx'
      - 'studio/frontend/src/features/chat/stores/chat-runtime-store.ts'
      - 'studio/frontend/src/features/chat/types/api.ts'
      - 'studio/frontend/src/features/model-picker/components/model-config-page.tsx'
      - 'studio/frontend/src/features/model-picker/components/sidebar-model-config.tsx'
      - 'studio/frontend/src/features/model-picker/hooks/use-active-model-config.ts'
      - '.github/workflows/staging-7447-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests -q || true
