name: "staging-7914 ubuntu-latest"
on:
  push:
    branches: ["pr-7914-xplat-ci"]
    paths:
      - 'studio/frontend/src/features/settings/settings-dialog.tsx'
      - 'studio/frontend/src/features/settings/tabs/voice-tab.tsx'
      - '.github/workflows/staging-7914-ubuntu-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
      # These runners have no GPU, so unsloth_zoo.device_type raises
      # NotImplementedError("Unsloth cannot find any torch accelerator?") while
      # `import unsloth` is still running. That leaves unsloth half-initialised, and every
      # later test module reports the wreckage as
      # `cannot import name 'get_device_stats' from 'unsloth.device_type' (unknown
      # location)` -- which reads as a PR fault and is not one. This is the zoo's own
      # supported CPU escape hatch for exactly this case.
      UNSLOTH_ALLOW_CPU: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: python -m pip install torch torchvision transformers trl peft datasets accelerate git+https://github.com/unslothai/unsloth-zoo.git
      - run: python -m pip uninstall -y unsloth || true
      - run: python -m pip install -e . --no-deps
      - run: |
          python - <<'PY' || true
          import importlib.util, os, sys
          print('cwd', os.getcwd(), 'sys.path[0]', repr(sys.path[0]))
          spec = importlib.util.find_spec('unsloth')
          print('unsloth spec', spec.origin, list(spec.submodule_search_locations or []))
          import unsloth; print('imported', unsloth.__file__)
          PY
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest tests/studio/test_stt_model_search_locator_contract.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
