name: "anon rate-limit resolution test"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anon-resolve:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Anonymous resolution (no GITHUB_TOKEN / GH_TOKEN)
        shell: bash
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: python .ci/ci_anon_ratelimit.py
