name: "staging-7188 macos-14"
on:
  push:
    branches: ["pr-7188-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/llama_cpp.py'
      - 'studio/backend/core/inference/llama_server_args.py'
      - 'studio/backend/models/inference.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/routes/training_vram.py'
      - 'studio/backend/tests/test_chat_load_during_training.py'
      - 'studio/backend/tests/test_gguf_metadata.py'
      - 'studio/backend/tests/test_gpu_selection.py'
      - 'studio/backend/tests/test_inference_model_validation.py'
      - 'studio/backend/tests/test_llama_cpp_memory_mode.py'
      - 'studio/backend/tests/test_llama_server_args.py'
      - 'studio/backend/tests/test_mtp_vram_budget.py'
      - 'studio/backend/tests/test_tp_vision_regression.py'
      - 'studio/backend/utils/models/gguf_metadata.py'
      - 'studio/frontend/src/features/chat/api/chat-api.ts'
      - 'studio/frontend/src/features/chat/hooks/use-chat-model-runtime.ts'
      - 'studio/frontend/src/features/chat/lib/apply-inference-status-to-store.ts'
      - 'studio/frontend/src/features/chat/stores/chat-runtime-store.ts'
      - 'studio/frontend/src/features/chat/types/api.ts'
      - '.github/workflows/staging-7188-macos-14.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests -q || true
