name: "8519-cpu-freq ubuntu-latest full import"

# The other five workflows keep the dependency set light so Windows and the
# macOS runners stay fast. This one pays for the real `import unsloth` chain so
# tests/test_psutil_apple_cpu_freq.py and the import_fixes drift detector run
# the way they will upstream.

on:
  push:
    branches: [issue8519-cpu-freq-cross-os]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpu-freq-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
      UNSLOTH_ALLOW_CPU: '1'
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11'
          pip install 'transformers>=4.51,<5.5' psutil structlog pytest packaging huggingface_hub peft trl datasets unsloth_zoo

      - name: unsloth-side patch tests
        run: python -m pytest tests/test_psutil_apple_cpu_freq.py tests/test_import_fixes_drift.py -q --tb=short

      - name: Studio backend CPU frequency tests
        working-directory: studio/backend
        run: python -m pytest tests/test_apple_cpu_frequency.py -q --tb=short

      - name: Report what this host actually sees
        run: python .github/scripts/report_cpu_freq.py
