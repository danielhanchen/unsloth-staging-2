name: "staging-7074 windows-latest"
on:
  push:
    branches: ["pr-7074-xplat-ci"]
    paths:
      - 'studio/frontend/src/components/assistant-ui/thread.tsx'
      - 'studio/frontend/src/features/chat/adapters/studio-speech-synthesis-adapter.ts'
      - 'studio/frontend/src/features/chat/adapters/studio-web-speech-dictation-adapter.ts'
      - 'studio/frontend/src/features/chat/runtime-provider.tsx'
      - 'studio/frontend/src/features/chat/shared-composer.tsx'
      - 'studio/frontend/src/features/settings/settings-dialog.tsx'
      - 'studio/frontend/src/features/settings/stores/settings-dialog-store.ts'
      - 'studio/frontend/src/features/settings/stores/voice-settings-store.ts'
      - 'studio/frontend/src/features/settings/tabs/general-tab.tsx'
      - 'studio/frontend/src/features/settings/tabs/voice-tab.tsx'
      - 'studio/frontend/src/i18n/locales/en.ts'
      - 'studio/frontend/src/i18n/locales/ja.ts'
      - 'studio/frontend/src/i18n/locales/pt-br.ts'
      - 'studio/frontend/src/i18n/locales/zh-CN.ts'
      - 'studio/frontend/src/lib/mic-icon.tsx'
      - '.github/workflows/staging-7074-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests -q || true
