# Real Apple Silicon MLX validation for zoo#841 ddp training.
# Installs the PR branch(es) + real mlx/mlx-lm/mlx-vlm wheels (zoo [mlx] extra)
# on macos-14 and runs the PR's own tests, so the real-Metal / mlx.launch /
# real-Darwin cases skipped on Linux CI actually execute here.
name: "mlx-pr zoo841 macos-14"

on:
  push:
    branches: [mlx-pr-validation]
    paths:
      - '.github/workflows/zoo841-macos14.yml'
      - 'tests/staging/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: zoo#841 ddp training
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PR branch(es) + real MLX wheels
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          git clone --depth 1 -b feat/mlx-ddp https://github.com/Lyxot/unsloth-zoo zoo
          git -C zoo log --oneline -1
          pip install -e './zoo[mlx]'
          git clone --depth 1 -b main https://github.com/unslothai/unsloth unsloth_src
          git -C unsloth_src log --oneline -1
          pip install --no-deps -e ./unsloth_src
          rm -rf "$GITHUB_WORKSPACE/unsloth"
          pip install datasets sentencepiece protobuf trl peft 'pytest==9.0.3' pytest-timeout python-multipart fastapi
          python -c "import unsloth, unsloth_zoo; print('unsloth', unsloth.__file__); print('zoo', unsloth_zoo.__file__)"
      - name: Real Apple Silicon + real mlx sanity
        run: |
          python -c "
          import platform
          assert platform.system()=='Darwin' and platform.machine()=='arm64', platform.platform()
          import mlx.core as mx
          assert 'mlx_simulation' not in (getattr(mx,'__file__','') or ''), mx.__file__
          import unsloth
          assert getattr(unsloth,'DEVICE_TYPE',None)=='mlx', unsloth.DEVICE_TYPE
          print('OK real mlx', mx.__version__, '| DEVICE_TYPE=mlx')
          "
      - name: zoo#841 ddp training -- run PR tests on real MLX
        run: cd zoo && python -m pytest tests/test_mlx_ddp_metal.py tests/test_mlx_trainer_internals.py -q -p no:cacheprovider
