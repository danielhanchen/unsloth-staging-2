name: "staging-16468 studio-regress"
on:
  push:
    branches: ["pr-16468-verified-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  before-fast-ubuntu-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SR_HOME: ${{ github.workspace }}/sr-home
      UNSLOTH_STUDIO_HOME: ${{ github.workspace }}/sr-home
      # The installer's uv-managed interpreter (the venv's base python) must be cached with the
      # install: under ~/.local/share/uv a restored venv points at a python the new runner lacks.
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/sr-uv-python
      UNSLOTH_DISABLE_UPDATE_CHECK: '1'
      UNSLOTH_STUDIO_DISABLE_PUBLIC_CHECK: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: 2099086d8598731d70870437df4674ab2d9d2121
          path: src
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Studio install cache (2099086d8)
        id: sr-install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # --local installs editable from src/: the built frontend lives in the checkout, not the home
          path: |
            sr-home
            sr-uv-python
            src/studio/frontend/dist
          key: sr-studio-v3-ubuntu-latest-2099086d8598731d70870437df4674ab2d9d2121
      - name: Tiny model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # engine.SUITE_HF_HOME: run.py prefetches into <workspace>/temp/studio_regress/hf_home
          # (WORKSPACE unset here, so the checkout root), never ~/.cache/huggingface
          path: temp/studio_regress/hf_home
          key: sr-hf-v2-ubuntu-latest-e2a093344a8a
      - name: Install Studio at before (2099086d8)
        if: steps.sr-install.outputs.cache-hit != 'true'
        working-directory: src
        shell: bash
        run: |
          ./install.sh --local --no-torch
      - name: Playwright
        shell: bash
        run: |
          pip install 'playwright<2' httpx pillow numpy
          python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Journeys (fast, before)
        shell: bash
        env:
          PYTHONPATH: harness/.github/scripts
          # Windows: UTF-8 file and pipe I/O for the harness and the Studio it launches (cp1252 otherwise)
          PYTHONUTF8: '1'
        run: |
          set +e
          python harness/.github/scripts/studio_regress/run.py --pr 16468 --repo src --side before \
            --home-before "$SR_HOME" --tier fast --only auth,settings,crawl --root out --json > out-before-fast.json
          rc=$?
          echo "rc=$rc" | tee out-before-fast.rc
          exit "$rc"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: studio-regress-ubuntu-latest-before-fast
          path: |
            out/
            out-before-fast.*
            sr-home/logs/
          if-no-files-found: warn
  after-fast-ubuntu-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SR_HOME: ${{ github.workspace }}/sr-home
      UNSLOTH_STUDIO_HOME: ${{ github.workspace }}/sr-home
      # The installer's uv-managed interpreter (the venv's base python) must be cached with the
      # install: under ~/.local/share/uv a restored venv points at a python the new runner lacks.
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/sr-uv-python
      UNSLOTH_DISABLE_UPDATE_CHECK: '1'
      UNSLOTH_STUDIO_DISABLE_PUBLIC_CHECK: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: 3b4a3665145fcafbc0ed464da19908fc7466f598
          path: src
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Studio install cache (3b4a36651)
        id: sr-install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # --local installs editable from src/: the built frontend lives in the checkout, not the home
          path: |
            sr-home
            sr-uv-python
            src/studio/frontend/dist
          key: sr-studio-v3-ubuntu-latest-3b4a3665145fcafbc0ed464da19908fc7466f598
      - name: Tiny model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # engine.SUITE_HF_HOME: run.py prefetches into <workspace>/temp/studio_regress/hf_home
          # (WORKSPACE unset here, so the checkout root), never ~/.cache/huggingface
          path: temp/studio_regress/hf_home
          key: sr-hf-v2-ubuntu-latest-e2a093344a8a
      - name: Install Studio at after (3b4a36651)
        if: steps.sr-install.outputs.cache-hit != 'true'
        working-directory: src
        shell: bash
        run: |
          ./install.sh --local --no-torch
      - name: Playwright
        shell: bash
        run: |
          pip install 'playwright<2' httpx pillow numpy
          python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Journeys (fast, after)
        shell: bash
        env:
          PYTHONPATH: harness/.github/scripts
          # Windows: UTF-8 file and pipe I/O for the harness and the Studio it launches (cp1252 otherwise)
          PYTHONUTF8: '1'
        run: |
          set +e
          python harness/.github/scripts/studio_regress/run.py --pr 16468 --repo src --side after \
            --home-after "$SR_HOME" --tier fast --only auth,settings,crawl --root out --json > out-after-fast.json
          rc=$?
          echo "rc=$rc" | tee out-after-fast.rc
          exit "$rc"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: studio-regress-ubuntu-latest-after-fast
          path: |
            out/
            out-after-fast.*
            sr-home/logs/
          if-no-files-found: warn
  desktop-before:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: 2099086d8598731d70870437df4674ab2d9d2121
          path: src
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Tauri build deps + WebDriver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev patchelf xvfb webkit2gtk-driver
          cargo install tauri-driver --locked
      - name: Studio backend for the app (~/.unsloth/studio)
        working-directory: src
        run: ./install.sh --local --no-torch
      - name: tauri build --debug --no-bundle (before)
        working-directory: src
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          (cd studio/frontend && npm ci --no-fund --no-audit && npm run build)
          npm install --save-dev --prefix studio @tauri-apps/cli@2.10.1 --no-fund --no-audit
          npx --prefix studio tauri build --debug --no-bundle
      - name: Desktop journey (before)
        env:
          UNSLOTH_STUDIO_FAKE_UPDATE: '1'
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1440x900x24" python harness/.github/scripts/studio_regress/journeys/desktop.py \
            --bin src/studio/src-tauri/target/debug/unsloth-studio --side before --out out --backend real
          echo "rc=$?" | tee out-desktop-before.rc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: studio-regress-ubuntu-latest-before-desktop
          path: |
            out/
            out-desktop-before.rc
  desktop-after:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: 3b4a3665145fcafbc0ed464da19908fc7466f598
          path: src
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Tauri build deps + WebDriver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev patchelf xvfb webkit2gtk-driver
          cargo install tauri-driver --locked
      - name: Studio backend for the app (~/.unsloth/studio)
        working-directory: src
        run: ./install.sh --local --no-torch
      - name: tauri build --debug --no-bundle (after)
        working-directory: src
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          (cd studio/frontend && npm ci --no-fund --no-audit && npm run build)
          npm install --save-dev --prefix studio @tauri-apps/cli@2.10.1 --no-fund --no-audit
          npx --prefix studio tauri build --debug --no-bundle
      - name: Desktop journey (after)
        env:
          UNSLOTH_STUDIO_FAKE_UPDATE: '1'
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1440x900x24" python harness/.github/scripts/studio_regress/journeys/desktop.py \
            --bin src/studio/src-tauri/target/debug/unsloth-studio --side after --out out --backend real
          echo "rc=$?" | tee out-desktop-after.rc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: studio-regress-ubuntu-latest-after-desktop
          path: |
            out/
            out-desktop-after.rc
  diff-ubuntu-latest:
    needs: [before-fast-ubuntu-latest, after-fast-ubuntu-latest, desktop-before, desktop-after]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: studio-regress-ubuntu-latest-*
          path: art
          merge-multiple: true
      - name: Pair and diff (ubuntu-latest)
        env:
          PYTHONPATH: harness/.github/scripts
        run: |
          pip install pillow numpy
          diff_rc=0
          python harness/.github/scripts/studio_regress/diff.py --root art/out --json --report \
            --pr 16468 --base-sha 2099086d8598731d70870437df4674ab2d9d2121 --head-sha 3b4a3665145fcafbc0ed464da19908fc7466f598 --side-rc art/out-before-fast.rc art/out-after-fast.rc art/out-desktop-before.rc art/out-desktop-after.rc \
            > diff-ubuntu-latest.json || diff_rc=$?
          echo "STUDIO_REGRESS_DIFF_EXIT=$diff_rc"
          printf '%s\n' "$diff_rc" > diff.exitcode
          cp art/out/report.json report.json 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: studio-regress-report-ubuntu-latest
          path: |
            report.json
            diff-ubuntu-latest.json
            art/out/**/*.png
            art/out/**/*.json
      - name: Gate usable functional evidence
        if: always()
        env:
          SIDE_RESULTS: ${{ toJSON(needs) }}
          SIDE_RECEIPTS: "art/out-before-fast.rc art/out-after-fast.rc art/out-desktop-before.rc art/out-desktop-after.rc"
          DESKTOP_REQUIRED: "1"
          PYTHONPATH: harness/.github/scripts
        run: |
          python -c 'import json, os, pathlib, sys; r = json.load(open("report.json")); diff_ok = open("diff.exitcode").read().strip() == "0"; needs = json.loads(os.environ["SIDE_RESULTS"]); receipts = [pathlib.Path(p) for p in os.environ["SIDE_RECEIPTS"].split()]; sides_ok = bool(needs) and bool(receipts) and all(v.get("result") == "success" for v in needs.values()) and all(p.is_file() and p.read_text().strip() == "rc=0" for p in receipts); desktop_ok = os.environ["DESKTOP_REQUIRED"] != "1" or all((pathlib.Path("art/out") / side / "desktop" / (step.id + ".facts.json")).is_file() for side in ("before", "after") for step in __import__("studio_regress.journeys.desktop", fromlist=["JOURNEY"]).JOURNEY.steps); print("STUDIO_REGRESS_VOID: missing functional evidence") if diff_ok and r.get("functional") == "VOID" else None; sys.exit(0 if diff_ok and sides_ok and desktop_ok and r.get("functional") == "NO_REGRESSION" and r.get("steps") and all(s.get("verdict") != "VOID" for s in r["steps"]) else 1)'
