name: "staging-12342 ubuntu-latest"
on:
  push:
    branches: ["pr-12342-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; ran=0; rm -f pytest_out.txt; r=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_account_inference_isolation.py studio/backend/tests/test_audio_cpp_models.py studio/backend/tests/test_audio_cpp_runtime_status.py studio/backend/tests/test_audio_cpp_server_http.py studio/backend/tests/test_orchestrator_unload_cancel.py studio/backend/tests/test_presence_penalty.py studio/backend/tests/test_stt_ggml_sidecar.py studio/backend/tests/test_stt_registry.py studio/backend/tests/test_stt_sidecar.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' >> pytest_out.txt 2>&1 || r=$?; if [ "$r" != "5" ]; then ran=1; if [ "$r" -gt "$rc" ]; then rc=$r; fi; fi; r=0; PYTHONPATH=studio/backend python -m pytest tests/python/test_docker_hub_readme.py tests/test_installer_interactive_prompts.py tests/test_managed_tools_master_root.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' >> pytest_out.txt 2>&1 || r=$?; if [ "$r" != "5" ]; then ran=1; if [ "$r" -gt "$rc" ]; then rc=$r; fi; fi; r=0; PYTHONPATH=studio/backend python -m pytest tests/studio/install/test_install_audio_cpp_prebuilt_logic.py tests/studio/install/test_pr10648_offline_and_status.py tests/studio/install/test_update_idempotency.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' >> pytest_out.txt 2>&1 || r=$?; if [ "$r" != "5" ]; then ran=1; if [ "$r" -gt "$rc" ]; then rc=$r; fi; fi; if [ "$ran" = "0" ]; then rc=5; fi; cat pytest_out.txt; tot=$(grep -cE "^(FAILED|ERROR) " pytest_out.txt) || tot=0; dep=$(grep -cE "^(FAILED|ERROR) .* (ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers).$" pytest_out.txt) || dep=0; bare=$(awk '/^_+ ERROR collecting [^ ]+ _+$/ {cur=$4; next} /^(=|_)+ / {cur=""} cur != "" && /(ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers)./ {ok[cur]=1} /^ERROR [^ ]+$/ && ($2 in ok) {n++} END {print n+0}' pytest_out.txt) || bare=0; dep=$((dep + bare)); if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers)." pytest_out.txt && { [ "$tot" = "0" ] || [ "$tot" = "$dep" ]; }; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" = "1" ] && [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; exit "$rc"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - name: Install frontend deps
        working-directory: studio/frontend
        run: npm ci --no-fund --no-audit
      - name: Node tests
        working-directory: studio/frontend
        run: node --experimental-strip-types --test tests/audio-cpp-catalog.test.ts tests/audio-mode-task-filter.test.ts tests/audio-model-eject.test.ts tests/audio-options.test.ts tests/audio-page-policy.test.ts tests/audio-stt-download-fallback.test.ts tests/audio-stt-on-device.test.ts tests/audio-tts-download-manager.test.ts tests/vision-toggle-gating.test.ts
