name: "staging-10310 ubuntu-latest"
on:
  push:
    branches: ["pr-10310-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_active_generations.py studio/backend/tests/test_audio_tts_cancellation.py studio/backend/tests/test_gguf_load_cache_reuse.py studio/backend/tests/test_inference_dispatcher_resilience.py studio/backend/tests/test_inference_orchestrator_crash_message.py studio/backend/tests/test_inference_worker_stderr_tail.py studio/backend/tests/test_mlx_inference_backend.py studio/backend/tests/test_mlx_resident_batch.py studio/backend/tests/test_openai_auto_switch.py studio/backend/tests/test_orchestrator_idle_subprocess_teardown.py studio/backend/tests/test_orchestrator_load_cancel_event.py studio/backend/tests/test_orchestrator_unload_cancel.py studio/backend/tests/test_parallel_slots_per_load.py studio/backend/tests/test_presence_penalty.py studio/backend/tests/test_safetensors_capability_advertise.py studio/backend/tests/test_sf_client_tools_passthrough.py studio/backend/tests/test_shutdown_preserves_live_worker.py studio/backend/tests/test_stream_errors.py studio/backend/tests/test_warm_window_review_fixes.py tests/studio/test_model_picker_contracts.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out.txt 2>&1 || rc=$?; cat pytest_out.txt; tot=$(grep -cE "^(FAILED|ERROR) " pytest_out.txt) || tot=0; dep=$(grep -cE "^(FAILED|ERROR) .* (ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers).$" pytest_out.txt) || dep=0; bare=$(awk '/^_+ ERROR collecting [^ ]+ _+$/ {cur=$4; next} /^(=|_)+ / {cur=""} cur != "" && /(ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers)./ {ok[cur]=1} /^ERROR [^ ]+$/ && ($2 in ok) {n++} END {print n+0}' pytest_out.txt) || bare=0; dep=$((dep + bare)); if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers)." pytest_out.txt && { [ "$tot" = "0" ] || [ "$tot" = "$dep" ]; }; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" = "1" ] && [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; exit "$rc"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - name: Install frontend deps
        working-directory: studio/frontend
        run: npm ci --no-fund --no-audit
      - name: Node tests
        working-directory: studio/frontend
        run: node --experimental-strip-types --test tests/mlx-context-helpers.test.ts tests/non-gguf-parallel-slots-baseline.test.ts tests/resident-config-match.test.ts tests/resident-status-baselines.test.ts
