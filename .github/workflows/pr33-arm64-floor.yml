name: "pr33 arm64 floor"

# Validate unslothai/llama.cpp PR #33: the Linux arm64 CPU prebuilt should build on
# ubuntu-22.04-arm with clang-19 so it keeps a glibc 2.35 / GLIBCXX 3.4.30 loader floor
# (matching the x64 leg) while still compiling the armv9.2-a+sme ggml-cpu variant.
#
#   before-old-bundle : current published arm64 bundle (built on 24.04) -> show GLIBC_2.38
#                       floor and that it fails to load on 22.04-arm (the bug the PR fixes).
#   build-after       : rebuild on 22.04-arm with clang-19 exactly as the PR; audit the
#                       floor of llama-server + every libggml-*.so, then a GGUF chat smoke
#                       (proves clang-19 does not miscompile ggml + runtime variant dispatch).
#   fwd-24 / fwd-26   : run the same 22.04-built binary on 24.04-arm / 26.04-arm (forward compat).

on:
  push:
    branches: ['pr-33-ci']
    paths: ['.github/workflows/pr33-arm64-floor.yml']
  workflow_dispatch:

concurrency:
  group: pr33-arm64-floor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GGUF_URL: "https://huggingface.co/unsloth/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q4_K_M.gguf?download=true"
  GGUF_FILE: "Llama-3.2-1B-Instruct-Q4_K_M.gguf"

jobs:
  before-old-bundle:
    name: before (old 24.04 bundle on 22.04-arm)
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install objdump
        run: sudo apt-get update && sudo apt-get install -y binutils
      - name: Download current published arm64 CPU bundle
        run: |
          set -eux
          URL=$(gh api "repos/unslothai/llama.cpp/releases?per_page=15" --jq '[.[].assets[] | select(.name|test("linux-arm64-cpu"))][0].browser_download_url')
          echo "asset: $URL"
          curl -L -f -o bundle.tar.gz "$URL"
          mkdir -p old && tar -xzf bundle.tar.gz -C old
          ls -la old | head -20
      - name: Floor of old bundle (expect GLIBC_2.38 / GLIBCXX_3.4.32)
        run: |
          set +e
          : > oldsyms.txt
          for f in old/llama-server old/*.so; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            objdump -T "$f" 2>/dev/null | grep -oE 'GLIBC(XX)?_[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -Vu | tail -4
            objdump -T "$f" 2>/dev/null | grep -oE 'GLIBC(XX)?_[0-9]+\.[0-9]+(\.[0-9]+)?' >> oldsyms.txt
          done
          echo "=== OLD max GLIBC   = $(grep '^GLIBC_'   oldsyms.txt | sort -V | tail -1) ==="
          echo "=== OLD max GLIBCXX = $(grep '^GLIBCXX_' oldsyms.txt | sort -V | tail -1) ==="
      - name: Attempt to run old bundle (expect loader failure)
        run: |
          set +e
          cd old
          ldd ./llama-server 2>&1 | grep -iE 'not found|GLIBC' | head
          ./llama-server --version 2>run.log; rc=$?
          echo "exit=$rc"; cat run.log
          if grep -qE "GLIBC_2\.3[6-9]|not found|GLIBCXX_3\.4\.3[1-9]" run.log; then
            echo "CONFIRMED: old (24.04-built) bundle fails to load on 22.04-arm"
          elif [ $rc -eq 0 ]; then
            echo "::warning::old bundle unexpectedly ran on 22.04-arm"
          fi
          exit 0

  build-after:
    name: build-after (clang-19 on 22.04-arm)
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    steps:
      - name: Environment baseline
        run: |
          set +e
          uname -a
          (lsb_release -a 2>/dev/null || cat /etc/os-release) | head
          echo "glibc: $(ldd --version | head -1)"
          echo "libstdc++6: $(dpkg -l libstdc++6 | tail -1)"
          echo "system gcc: $(gcc --version | head -1)"
          echo "cmake: $(cmake --version | head -1)"
          true
      - name: Install build deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev ninja-build binutils cmake git wget curl
      - name: Install clang-19 (apt.llvm.org, exactly as PR)
        run: |
          set -eux
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          clang-19 --version
          clang++-19 --version
          echo "=== clang-19 origin (prove apt.llvm.org) ==="
          apt-cache policy clang-19 | head -8
      - name: Clone llama.cpp (ggml-org master)
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp src
      - name: Configure (PR flags, clang-19)
        working-directory: src
        env:
          CC: clang-19
          CXX: clang++-19
        run: |
          set -eux
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_RPC=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=OFF 2>&1 | tee cfg.log
          echo "=== proof: compiler is clang-19 and native tuning is OFF ==="
          grep -iE "CMAKE_C(XX)?_COMPILER:" build/CMakeCache.txt || true
          grep -iE "GGML_NATIVE:" build/CMakeCache.txt || true
      - name: Build
        working-directory: src
        run: |
          set -eux
          cmake --build build --config Release -j "$(nproc)"
          strip build/bin/llama-* 2>/dev/null || true
          echo "=== produced ggml-cpu variants (proves clang-19 compiled the sme variant) ==="
          ls -1 build/bin/ | grep -iE 'ggml-cpu' || ls -1 build/bin/*.so | sed 's#.*/##'
      - name: Floor audit (fail if > GLIBC_2.35 or > GLIBCXX_3.4.30)
        working-directory: src
        run: |
          set +e
          : > allsyms.txt
          SCAN=$(ls build/bin/llama-server build/bin/*.so 2>/dev/null)
          echo "scanning:"; echo "$SCAN" | sed 's#.*/#  #'
          for f in $SCAN; do
            objdump -T "$f" 2>/dev/null | grep -oE 'GLIBC(XX)?_[0-9]+\.[0-9]+(\.[0-9]+)?' >> allsyms.txt
          done
          MAXG=$(grep '^GLIBC_'   allsyms.txt | sort -V | tail -1)
          MAXX=$(grep '^GLIBCXX_' allsyms.txt | sort -V | tail -1)
          echo "max GLIBC   = ${MAXG:-none}"
          echo "max GLIBCXX = ${MAXX:-none}"
          fail=0
          [ "$(printf '%s\nGLIBC_2.35\n'    "$MAXG" | sort -V | tail -1)" = "GLIBC_2.35" ]    || { echo "::error::GLIBC floor too high: $MAXG"; fail=1; }
          [ "$(printf '%s\nGLIBCXX_3.4.30\n' "$MAXX" | sort -V | tail -1)" = "GLIBCXX_3.4.30" ] || { echo "::error::GLIBCXX floor too high: $MAXX"; fail=1; }
          if [ $fail -eq 0 ]; then echo "FLOOR OK: <= GLIBC_2.35 / GLIBCXX_3.4.30"; else exit 1; fi
      - name: Runtime smoke (chat 1+1) + variant dispatch
        working-directory: src
        run: |
          set +e
          curl -L -f --retry 5 --retry-delay 5 -o "$GGUF_FILE" "$GGUF_URL" || { echo "::error::gguf download failed"; exit 1; }
          ls -la "$GGUF_FILE"
          ./build/bin/llama-server -m "$GGUF_FILE" --host 127.0.0.1 --port 18080 -c 2048 -n 32 > ls.log 2>&1 &
          SPID=$!
          up=0
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:18080/health >/dev/null && { up=1; echo "healthy ${i}s"; break; }
            kill -0 $SPID 2>/dev/null || { echo "server exited early"; break; }
            sleep 2
          done
          echo "=== ggml-cpu backend selected at runtime ==="
          grep -aiE 'load_backend|loaded .*backend|ggml-cpu|CPU : |features|NEON|SVE|SME' ls.log | head -20
          if [ "$up" != 1 ]; then echo "::error::server never healthy"; tail -60 ls.log; kill $SPID 2>/dev/null; exit 1; fi
          R=$(curl -sf -X POST http://127.0.0.1:18080/v1/chat/completions -H 'Content-Type: application/json' \
                -d '{"messages":[{"role":"user","content":"What is 1+1? Reply with just the number."}],"temperature":0,"max_tokens":16}')
          kill $SPID 2>/dev/null
          echo "reply: $R"
          echo "$R" | grep -q '2' && echo "CHAT OK (contains 2)" || { echo "::error::no 2 in reply"; exit 1; }
      - name: Package bins for forward-compat jobs
        working-directory: src
        run: |
          set -eux
          cp LICENSE build/bin/ 2>/dev/null || true
          tar -czf "$GITHUB_WORKSPACE/arm64-bins.tar.gz" -C build/bin .
      - name: Upload bins
        uses: actions/upload-artifact@v4
        with:
          name: arm64-cpu-bins
          path: arm64-bins.tar.gz
          if-no-files-found: error

  fwd-24:
    name: fwd-compat (24.04-arm)
    needs: build-after
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arm64-cpu-bins
      - name: Run chat on 24.04-arm
        run: |
          set +e
          mkdir -p bin && tar -xzf arm64-bins.tar.gz -C bin
          curl -L -f --retry 5 -o m.gguf "$GGUF_URL" || { echo "::error::gguf dl failed"; exit 1; }
          ./bin/llama-server -m m.gguf --host 127.0.0.1 --port 18080 -c 2048 -n 32 > ls.log 2>&1 &
          SPID=$!
          up=0
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:18080/health >/dev/null && { up=1; break; }
            kill -0 $SPID 2>/dev/null || break
            sleep 2
          done
          if [ "$up" != 1 ]; then echo "::error::not healthy on 24.04-arm"; tail -60 ls.log; kill $SPID 2>/dev/null; exit 1; fi
          R=$(curl -sf -X POST http://127.0.0.1:18080/v1/chat/completions -H 'Content-Type: application/json' \
                -d '{"messages":[{"role":"user","content":"What is 1+1? Reply with just the number."}],"temperature":0,"max_tokens":16}')
          kill $SPID 2>/dev/null
          echo "reply: $R"
          echo "$R" | grep -q '2' && echo "FWD-24 OK" || { echo "::error::no 2"; exit 1; }

  fwd-26:
    name: fwd-compat (26.04-arm, preview)
    needs: build-after
    runs-on: ubuntu-26.04-arm
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arm64-cpu-bins
      - name: Run chat on 26.04-arm
        run: |
          set +e
          mkdir -p bin && tar -xzf arm64-bins.tar.gz -C bin
          curl -L -f --retry 5 -o m.gguf "$GGUF_URL" || { echo "::error::gguf dl failed"; exit 1; }
          ./bin/llama-server -m m.gguf --host 127.0.0.1 --port 18080 -c 2048 -n 32 > ls.log 2>&1 &
          SPID=$!
          up=0
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:18080/health >/dev/null && { up=1; break; }
            kill -0 $SPID 2>/dev/null || break
            sleep 2
          done
          if [ "$up" != 1 ]; then echo "::error::not healthy on 26.04-arm"; tail -60 ls.log; kill $SPID 2>/dev/null; exit 1; fi
          R=$(curl -sf -X POST http://127.0.0.1:18080/v1/chat/completions -H 'Content-Type: application/json' \
                -d '{"messages":[{"role":"user","content":"What is 1+1? Reply with just the number."}],"temperature":0,"max_tokens":16}')
          kill $SPID 2>/dev/null
          echo "reply: $R"
          echo "$R" | grep -q '2' && echo "FWD-26 OK" || { echo "::error::no 2"; exit 1; }
