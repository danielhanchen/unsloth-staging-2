name: "staging-8967 windows-latest"
on:
  push:
    branches: ["pr-8967-xplat-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_disable_vision_toggle.py studio/backend/tests/test_metal_paravirtual_guard.py studio/backend/tests/test_mmproj_cpu_pin_policy.py studio/backend/tests/test_mmproj_pin_heterogeneous_rank.py studio/backend/tests/test_mmproj_pin_platform_matrix.py studio/backend/tests/test_mmproj_pin_rocm_arch_gate.py studio/backend/tests/test_non_gguf_vision_fields_report_absent.py studio/backend/tests/test_zz_auto_pin_conservatism.py studio/backend/tests/test_zz_h4_old_binary_flag_safety.py studio/backend/tests/test_zz_h5_disable_vision_inherit.py studio/backend/tests/test_zz_h6_pin_premise_and_audio.py studio/backend/tests/test_zz_h7_local_mmproj_guard_charge.py studio/backend/tests/test_zz_hand_pin_charge_by_memory_kind.py studio/backend/tests/test_zz_mmproj_pin_x_mtp_standdown.py studio/backend/tests/test_zz_paravirtual_projector_charge.py studio/backend/tests/test_zz_r8967_vision_off_env_and_download_lock.py -q --tb=short --timeout=120 --timeout-method=thread -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out.txt 2>&1 || rc=$?; cat pytest_out.txt; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers)." pytest_out.txt && ! grep -qE "^(FAILED|ERROR) " pytest_out.txt; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" = "1" ] && ! grep -qE "^ERROR " pytest_out.txt; then tot=$(grep -cE "^FAILED " pytest_out.txt); dep=$(grep -cE "^FAILED .* No module named .(torch|unsloth_zoo|transformers).$" pytest_out.txt); if [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; fi; exit "$rc"
