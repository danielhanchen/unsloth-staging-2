name: "staging-7591 macos-14"
on:
  push:
    branches: ["pr-7591-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/llama_cpp.py'
      - 'studio/backend/core/inference/worker.py'
      - 'studio/backend/core/training/trainer.py'
      - 'studio/backend/core/training/worker.py'
      - 'studio/backend/picker/routes/templates.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/routes/models.py'
      - 'studio/backend/tests/test_active_generations.py'
      - 'studio/backend/tests/test_chat_load_during_training.py'
      - 'studio/backend/tests/test_gguf_load_cache_reuse.py'
      - 'studio/backend/tests/test_gpu_memory_mode.py'
      - 'studio/backend/tests/test_gpu_selection.py'
      - 'studio/backend/tests/test_offline_gguf_cache_fallback.py'
      - 'studio/backend/tests/test_offline_inference_parent.py'
      - 'studio/backend/tests/test_transformers_version.py'
      - 'studio/backend/tests/test_validate_offline_guard.py'
      - 'studio/backend/utils/hf_cache_settings.py'
      - 'studio/backend/utils/models/model_config.py'
      - 'studio/backend/utils/transformers_version.py'
      - 'studio/backend/utils/utils.py'
      - '.github/workflows/staging-7591-macos-14.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_active_generations.py studio/backend/tests/test_chat_load_during_training.py studio/backend/tests/test_gguf_load_cache_reuse.py studio/backend/tests/test_gpu_memory_mode.py studio/backend/tests/test_gpu_selection.py studio/backend/tests/test_offline_gguf_cache_fallback.py studio/backend/tests/test_offline_inference_parent.py studio/backend/tests/test_transformers_version.py studio/backend/tests/test_validate_offline_guard.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
