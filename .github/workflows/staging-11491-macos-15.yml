name: "staging-11491 macos-15"
on:
  push:
    branches: ["pr-11491-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_chat_history_routes.py studio/backend/tests/test_desktop_auth.py studio/backend/tests/test_diffusion_precision.py studio/backend/tests/test_engine_api_key_transport.py studio/backend/tests/test_engine_override_defaults.py studio/backend/tests/test_gguf_load_cache_reuse.py studio/backend/tests/test_managed_engine_tools.py studio/backend/tests/test_managed_engines.py studio/backend/tests/test_openai_auto_switch.py studio/backend/tests/test_openai_multi_image_route.py studio/backend/tests/test_orchestrator_unload_cancel.py studio/backend/tests/test_training_managed_engine_stop.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out.txt 2>&1 || rc=$?; cat pytest_out.txt; tot=$(grep -cE "^(FAILED|ERROR) " pytest_out.txt) || tot=0; dep=$(grep -cE "^(FAILED|ERROR) .* (ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers).$" pytest_out.txt) || dep=0; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers)." pytest_out.txt && { [ "$tot" = "0" ] || [ "$tot" = "$dep" ]; }; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" = "1" ] && [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; exit "$rc"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - name: Install frontend deps
        working-directory: studio/frontend
        run: npm ci --no-fund --no-audit
      - name: Node tests
        working-directory: studio/frontend
        run: node --experimental-strip-types --test tests/active-reasoning-intent.test.ts tests/chat-cache-miss-download-label.test.ts tests/compare-pane-managed-engine.test.ts tests/external-job-hidden-tab.test.ts tests/llama-extra-args-override-lookup.test.ts tests/managed-engine-readiness.test.ts tests/managed-engine-rollback.test.ts tests/model-config-handoff.test.ts tests/recommended-curated-row-metadata.test.ts tests/resident-config-match-accelerator-matrix.test.ts tests/server-tuning-settings.test.ts
