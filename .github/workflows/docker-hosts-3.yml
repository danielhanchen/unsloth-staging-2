# Round 3: Docker inside WSL 2 on the Windows runner. Round 2's attempt died on
# shell quoting across the pwsh -> wsl -> sh boundary, so every Linux step is now a
# script file written from pwsh and run with bash inside the distro.
name: Docker on hosted runners, round 3 (WSL 2)

on:
  push:
    branches: ['docker-hosts-*']
  workflow_dispatch:

jobs:
  windows-wsl2:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Import a fresh Ubuntu 24.04 WSL distro
        shell: pwsh
        run: |
          wsl --set-default-version 2
          $url = 'https://cloud-images.ubuntu.com/wsl/releases/24.04/20240423/ubuntu-noble-wsl-amd64-24.04lts.rootfs.tar.gz'
          $expected = '2a790896740b14d637dbdc583cce1ba081ac53b9e9cdb46dc09a2f73abbd9934'
          New-Item -ItemType Directory -Force -Path wsl-dist | Out-Null
          Invoke-WebRequest -Uri $url -OutFile wsl-dist/rootfs.tar.gz -UseBasicParsing -TimeoutSec 900
          $actual = (Get-FileHash wsl-dist/rootfs.tar.gz -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { Write-Host "::error::rootfs checksum mismatch: got $actual"; exit 1 }
          wsl --import unsloth-ci "$PWD/wsl-dist/instance" "$PWD/wsl-dist/rootfs.tar.gz" --version 2
          wsl -d unsloth-ci -- uname -a

      - name: Write the Linux-side scripts
        shell: pwsh
        run: |
          $setup = @'
          set -eu
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl docker.io iptables >/dev/null
          dockerd --version
          nohup dockerd --iptables=false --bridge=none >/var/log/dockerd.log 2>&1 &
          for i in $(seq 1 40); do docker info >/dev/null 2>&1 && break; sleep 2; done
          docker info --format '{{.OSType}}/{{.Architecture}} {{.ServerVersion}} storage={{.Driver}}' || { tail -40 /var/log/dockerd.log; exit 1; }
          df -h / | tail -1; nproc; free -g | head -2
          '@
          $run = @'
          set -eu
          docker pull unsloth/unsloth:core 2>&1 | tail -3
          docker image inspect unsloth/unsloth:core --format 'arch={{.Architecture}} size={{.Size}}'
          # -i: without it the heredoc never reaches python, which exits 0 having run nothing
          OUT=$(docker run -i --rm -e UNSLOTH_ALLOW_CPU=1 -e UNSLOTH_SKIP_NOTEBOOK_SYNC=1 unsloth/unsloth:core python - <<'PY'
          import platform, torch, unsloth, subprocess
          print("machine", platform.machine(), "torch", torch.__version__, "cuda", torch.cuda.is_available(), "unsloth", unsloth.__version__)
          print(subprocess.run(["unsloth", "--version"], capture_output=True, text=True).stdout.strip())
          PY
          )
          echo "$OUT"
          echo "$OUT" | grep -q 'torch 2.11' || { echo 'import step printed nothing usable'; exit 1; }
          '@
          $jupyter = @'
          set -eu
          CID=$(docker run -d -e UNSLOTH_ALLOW_CPU=1 -e UNSLOTH_SKIP_NOTEBOOK_SYNC=1 -p 127.0.0.1:8888:8888 unsloth/unsloth:core jupyter lab --ip 0.0.0.0 --port 8888 --allow-root --no-browser)
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8888/api/status && break; sleep 2; done
          TOK=$(docker logs "$CID" 2>&1 | grep -o 'token=[0-9a-f]*' | head -1 | cut -d= -f2)
          NOTOK=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8888/api/status)
          OK=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8888/api/status?token=$TOK")
          echo "no token: $NOTOK  with token: $OK"
          docker logs "$CID" 2>&1 | grep -i 'unsloth container\|CPU' | head -3 || true
          docker rm -f "$CID" >/dev/null
          test "$NOTOK" = 403 && test "$OK" = 200
          '@
          # LF endings: a CRLF script breaks on the first line inside Linux
          foreach ($pair in @(@('setup', $setup), @('run', $run), @('jupyter', $jupyter))) {
            [IO.File]::WriteAllText("$PWD/wsl-dist/$($pair[0]).sh", ($pair[1] -replace "`r`n", "`n"))
          }
          wsl -d unsloth-ci -- wslpath -a "$PWD/wsl-dist" | Tee-Object -Variable p
          Add-Content -Path $env:GITHUB_ENV -Value "WSL_DIR=$p"

      - name: Install Docker inside WSL 2 and start the daemon
        shell: pwsh
        run: wsl -d unsloth-ci -u root -- bash "$env:WSL_DIR/setup.sh"

      - name: Pull and run the entrypoint (CPU mode)
        shell: pwsh
        run: wsl -d unsloth-ci -u root -- bash "$env:WSL_DIR/run.sh"

      - name: JupyterLab boots and authenticates inside WSL 2
        shell: pwsh
        run: wsl -d unsloth-ci -u root -- bash "$env:WSL_DIR/jupyter.sh"
