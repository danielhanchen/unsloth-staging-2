name: mac-p152-readahead
on:
  push:
    branches: [llama-mac-p152]
jobs:
  bench:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Sources (b11368 + patches)
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp upstream
          for a in A B C; do
            git -C upstream worktree add -q --detach "$PWD/src_$a" 1fb7ef3e3327f18f1e99d294115b8493d54e196a
            git -C src_$a log -1 --format='%h %s'
          done
          git -C src_B apply "$PWD/patches/p152.patch"
          git -C src_C apply "$PWD/patches/p152.patch"
          git -C src_C apply "$PWD/patches/carry_mac_readahead.patch"
          for a in A B C; do echo "$a: $(git -C src_$a diff --stat | tail -1)"; done
      - name: Build (Metal)
        run: |
          for a in A B C; do
            cmake -S src_$a -B src_$a/build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF > /dev/null
            cmake --build src_$a/build -j 3 --target llama-batched-bench llama-completion 2>&1 | tail -1
          done
      - name: Model
        run: |
          mkdir -p model
          curl -sSL -o model/gemma-4-E2B-it-Q4_K_M.gguf https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF/resolve/main/gemma-4-E2B-it-Q4_K_M.gguf
          ls -l model
      - name: Bench
        run: bash mac_bench.sh 2>&1 | tee bench.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-p152-out
          path: |
            out/
            bench.txt
