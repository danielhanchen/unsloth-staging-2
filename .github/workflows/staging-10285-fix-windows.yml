name: "staging-10285 fix Windows (shipped vs fixed)"

on:
  push:
    branches: [pr-10285-fix-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: ${{ matrix.runner }} ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-2022]
        include:
          - label: shipped
            ref: 35d6cd295aa8031d9376b425c1c953a2ed39d644
          - label: fixed
            ref: pr-10285-fixed
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Fetch the probe driver from the workflow branch
        run: |
          git fetch --depth 1 origin pr-10285-fix-ci
          git show origin/pr-10285-fix-ci:.github/scripts/pr10285_probe.py | Set-Content -Path "$env:RUNNER_TEMP\pr10285_probe.py" -Encoding utf8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps
        run: |
          python -m pip install -q -r studio/backend/requirements/studio.txt
          python -m pip install -q python-multipart aiofiles sqlalchemy cryptography psutil pyyaml jinja2 mammoth requests 'numpy<3' pytest pytest-asyncio httpx structlog 'transformers>=4.51,<5.5'
          python -m pip install -q --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11'
      - name: Host facts
        run: |
          $py = (Get-Command python).Source
          Write-Host "PR10285_HOST runner=${{ matrix.runner }} ref=${{ matrix.label }} python=$py admin=$(([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          icacls $py | Select-Object -First 8
      - name: Capability probe (first)
        working-directory: studio/backend
        run: python "$env:RUNNER_TEMP\pr10285_probe.py" capability --label first
      - name: Capability probe (second, cached path)
        working-directory: studio/backend
        run: python "$env:RUNNER_TEMP\pr10285_probe.py" capability --label second
      - name: LPAC and sandbox suites
        working-directory: studio/backend
        run: |
          python -m pytest -q -rs --tb=short -p no:cacheprovider tests/test_windows_lpac.py tests/test_os_sandbox.py tests/test_tool_isolation_api.py 2>&1 | Select-Object -Last 70
      - name: Terminal escape probe
        working-directory: studio/backend
        run: python "$env:RUNNER_TEMP\pr10285_probe.py" escape
        continue-on-error: true
      - name: Python tool escape probe
        working-directory: studio/backend
        run: python "$env:RUNNER_TEMP\pr10285_probe.py" python-escape
        continue-on-error: true
      - name: Limited mode detached child check
        working-directory: studio/backend
        run: python "$env:RUNNER_TEMP\pr10285_probe.py" limited-survivor
        continue-on-error: true
      - name: Shared suites (existing tests at both refs)
        working-directory: studio/backend
        run: |
          python -m pytest -q --tb=line -p no:cacheprovider tests/test_secure_tools_execute.py tests/test_bypass_permissions.py tests/test_tool_output_streaming.py tests/test_studio_tool_loop.py tests/test_orphaned_children.py tests/test_exec_utf8.py tests/test_windows_bash_shell.py tests/test_sandbox_files_and_storage_roots.py -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' 2>&1 | Select-String -Pattern '^(FAILED|ERROR)|passed|failed' | ForEach-Object { ($_.Line -split ' - ')[0] } | Sort-Object -Unique
        continue-on-error: true
