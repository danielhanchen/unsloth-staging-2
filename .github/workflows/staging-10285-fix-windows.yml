name: "staging-10285 fix Windows (shipped vs fixed)"

on:
  push:
    branches: [pr-10285-fix-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: ${{ matrix.runner }} ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-2022]
        label: [shipped, fixed]
        include:
          - label: shipped
            ref: 35d6cd295aa8031d9376b425c1c953a2ed39d644
          - label: fixed
            ref: pr-10285-fixed
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Fetch the probe driver from the workflow branch
        run: |
          git fetch --depth 1 origin pr-10285-fix-ci
          git show origin/pr-10285-fix-ci:.github/scripts/pr10285_probe.py | Set-Content -Path "$env:RUNNER_TEMP\pr10285_probe.py" -Encoding utf8
          git show origin/pr-10285-fix-ci:.github/scripts/pr10285_timing.py | Set-Content -Path "$env:RUNNER_TEMP\pr10285_timing.py" -Encoding utf8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps
        run: |
          python -m pip install -q -r studio/backend/requirements/studio.txt
          python -m pip install -q python-multipart aiofiles sqlalchemy cryptography psutil pyyaml jinja2 mammoth requests 'numpy<3' pytest pytest-asyncio httpx structlog 'transformers>=4.51,<5.5'
          python -m pip install -q --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11'
      - name: Host facts
        run: |
          $py = (Get-Command python).Source
          Write-Host "PR10285_HOST runner=${{ matrix.runner }} ref=${{ matrix.label }} python=$py admin=$(([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          icacls $py | Select-Object -First 8
      - name: Capability probe (first)
        working-directory: studio/backend
        run: python "$env:RUNNER_TEMP\pr10285_probe.py" capability --label first
      - name: Capability probe (second, cached path)
        working-directory: studio/backend
        run: python "$env:RUNNER_TEMP\pr10285_probe.py" capability --label second
      - name: Launch timing breakdown
        working-directory: studio/backend
        continue-on-error: true
        run: python "$env:RUNNER_TEMP\pr10285_timing.py"
      - name: LPAC and sandbox suites
        working-directory: studio/backend
        continue-on-error: true
        run: |
          python -m pytest -q -rf --tb=short -p no:cacheprovider tests/test_windows_lpac.py tests/test_os_sandbox.py tests/test_tool_isolation_api.py > pytest_out.txt 2>&1
          Select-String -Path pytest_out.txt -Pattern '^(FAILED|ERROR) ' | ForEach-Object { 'PR10285_FAIL ' + ($_.Line -split ' - ')[0] } | Sort-Object -Unique
          Select-String -Path pytest_out.txt -Pattern 'passed|failed' | Select-Object -Last 1 | ForEach-Object { 'PR10285_SUMMARY ' + $_.Line }
          Select-String -Path pytest_out.txt -Pattern '^E  |^_{3,} test_|^_{3,} ERROR' | Select-Object -First 200 | ForEach-Object { $_.Line }
      - name: Symlink tests with full tracebacks and readlink facts
        working-directory: studio/backend
        continue-on-error: true
        run: |
          python -c "import os,sys,tempfile; d=tempfile.mkdtemp(); os.makedirs(os.path.join(d,'b','bin')); open(os.path.join(d,'b','bin','t'),'w').close(); os.makedirs(os.path.join(d,'a','bin')); os.symlink('../../b/bin/t', os.path.join(d,'a','bin','rel')); os.symlink(os.path.join(d,'b','bin','t'), os.path.join(d,'a','bin','abs')); print('PR10285_READLINK tmp=', tempfile.gettempdir(), 'rel=', repr(os.readlink(os.path.join(d,'a','bin','rel'))), 'abs=', repr(os.readlink(os.path.join(d,'a','bin','abs'))), 'exists_rel=', os.path.exists(os.path.join(d,'a','bin','rel')), 'realpath_rel=', os.path.realpath(os.path.join(d,'a','bin','rel')), 'exe=', sys.executable, 'realexe=', os.path.realpath(sys.executable))"
          python -m pytest -q --tb=long -p no:cacheprovider tests/test_os_sandbox.py -k "symlink" 2>&1 | Select-Object -Last 150
      - name: Terminal escape probe
        working-directory: studio/backend
        run: python "$env:RUNNER_TEMP\pr10285_probe.py" escape
        continue-on-error: true
      - name: Python tool escape probe
        working-directory: studio/backend
        run: python "$env:RUNNER_TEMP\pr10285_probe.py" python-escape
        continue-on-error: true
      - name: Limited mode detached child check
        working-directory: studio/backend
        run: python "$env:RUNNER_TEMP\pr10285_probe.py" limited-survivor
        continue-on-error: true
      - name: Shared suites (existing tests at both refs)
        working-directory: studio/backend
        timeout-minutes: 25
        continue-on-error: true
        run: |
          python -m pytest -q -v --tb=line -o faulthandler_timeout=180 -p no:cacheprovider tests/test_secure_tools_execute.py tests/test_bypass_permissions.py tests/test_tool_output_streaming.py tests/test_studio_tool_loop.py tests/test_orphaned_children.py tests/test_exec_utf8.py tests/test_windows_bash_shell.py tests/test_sandbox_files_and_storage_roots.py -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > shared_out.txt 2>&1
          Select-String -Path shared_out.txt -Pattern '^(FAILED|ERROR)|passed|failed' | ForEach-Object { 'PR10285_SHARED ' + ($_.Line -split ' - ')[0] } | Sort-Object -Unique
      - name: Shared suites tail (also after a timeout)
        if: always()
        working-directory: studio/backend
        run: |
          if (Test-Path shared_out.txt) { Get-Content shared_out.txt | Select-Object -Last 120 } else { 'no shared_out.txt' }
