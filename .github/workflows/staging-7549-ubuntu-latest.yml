name: "staging-7549 ubuntu-latest"
on:
  push:
    branches: ["pr-7549-xplat-ci"]
    paths:
      - 'studio/install_node_prebuilt.py'
      - 'studio/setup.ps1'
      - '.github/workflows/staging-7549-ubuntu-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest tests/python/test_cross_platform_parity.py tests/python/test_windows_arm64_python_choice.py tests/python/test_windows_git_gate.py tests/python/test_windows_vcredist_download_tls.py tests/studio/install/test_install_node_prebuilt_logic.py -q --tb=short || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
