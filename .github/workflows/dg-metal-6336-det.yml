name: dg-metal-6336-det
on:
  push:
    branches: [dg-metal-6336-det]
jobs:
  det:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 200
    env:
      DG_SHA: 6a7388aac74ab896d9d4f0fb187ddac4847c02f0
      MODEL_URL: https://huggingface.co/unsloth/diffusiongemma-26B-A4B-it-GGUF/resolve/main/diffusiongemma-26B-A4B-it-Q4_K_M.gguf
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          python3 -m venv venv && . venv/bin/activate && pip install -q numpy tqdm pyyaml requests
          mkdir -p src && cd src
          git init -q && git remote add origin https://github.com/danielhanchen/llama.cpp
          git fetch -q --depth 1 origin "$DG_SHA" && git checkout -q FETCH_HEAD
          pip install -q --no-deps ./gguf-py
          cmake -B build -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DLLAMA_CURL=OFF -DLLAMA_BUILD_SERVER=OFF -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build build -j 4 --target llama-diffusion-cli 2>&1 | tail -1
      - name: truncated model
        run: |
          . venv/bin/activate && mkdir -p model && python -u scripts/dg_trunc.py "$MODEL_URL" model/dg.gguf --keep 0,5
      - name: determinism
        run: bash scripts/dg_metal/run_det.sh src/build/bin model/dg.gguf out/det 2>&1 | tee det.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dg-det-${{ matrix.os }}
          path: |
            *.log
            out/
