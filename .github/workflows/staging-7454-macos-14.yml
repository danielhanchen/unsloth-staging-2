name: "staging-7454 macos-14"
on:
  push:
    branches: ["pr-7454-xplat-ci"]
    paths:
      - 'studio/backend/auth/authentication.py'
      - 'studio/backend/core/inference/api_monitor.py'
      - 'studio/backend/core/inference/llama_keepwarm.py'
      - 'studio/backend/core/inference/local_model_resolver.py'
      - 'studio/backend/core/inference/model_ids.py'
      - 'studio/backend/core/inference/openai_auto_download.py'
      - 'studio/backend/hub/services/download_lifecycle.py'
      - 'studio/backend/hub/services/models/downloads.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/routes/settings.py'
      - 'studio/backend/tests/test_api_monitor.py'
      - 'studio/backend/tests/test_model_ids.py'
      - 'studio/backend/tests/test_openai_auto_download.py'
      - 'studio/backend/tests/test_openai_auto_switch.py'
      - 'studio/backend/tests/test_openai_catalog.py'
      - 'studio/backend/tests/test_openai_tool_passthrough.py'
      - 'studio/backend/tests/test_training_worker_flash_attn.py'
      - 'studio/backend/utils/openai_auto_switch_settings.py'
      - 'studio/frontend/src/features/chat/types/api.ts'
      - 'studio/frontend/src/features/settings/api/openai-auto-switch.ts'
      - '.github/workflows/staging-7454-macos-14.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests -q || true
