name: "staging-10597 ubuntu-latest"
on:
  push:
    branches: ["pr-10597-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_diffusion_compile_cache.py studio/backend/tests/test_hf_cache_settings.py studio/backend/tests/test_setup_cache_env_containment.py studio/backend/tests/test_setup_cache_env_hf_home.py tests/studio/install/test_denied_llama_cpp_preflight.py tests/studio/install/test_install_llama_prebuilt_logic.py tests/studio/install/test_pr10648_offline_and_status.py tests/studio/install/test_selection_logic.py tests/studio/install/test_setup_denied_install_tree.py tests/studio/test_pull_requests_cancel_superseded_runs.py tests/test_installer_system32_guard.py tests/test_managed_tools_master_root.py tests/test_setup_master_root.py tests/test_studio_install_workspace_guard.py tests/test_studio_root_resilience.py tests/test_unsloth_home_root_agreement.py unsloth_cli/tests/test_export_cache_env.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out.txt 2>&1 || rc=$?; cat pytest_out.txt; tot=$(grep -cE "^(FAILED|ERROR) " pytest_out.txt) || tot=0; dep=$(grep -cE "^(FAILED|ERROR) .* No module named .(torch|unsloth_zoo|transformers).$" pytest_out.txt) || dep=0; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers)." pytest_out.txt && { [ "$tot" = "0" ] || [ "$tot" = "$dep" ]; }; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" = "1" ] && [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; exit "$rc"
