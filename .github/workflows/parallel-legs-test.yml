# Minimal unsigned stand-in for release-desktop.yml, to prove the three
# platform legs build in parallel and that publish-release still collects all
# of them. Signing, notarization and the real Tauri build are stripped: the job
# graph is what is under test, not the bundles.
name: Parallel Legs Test

on:
  push:
    branches: [parallel-legs-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.v.outputs.app_version }}
    steps:
      - id: v
        run: echo "app_version=0.1.526-beta" >> "$GITHUB_OUTPUT"

  build:
    strategy:
      fail-fast: false
      # No max-parallel: this is the change under test.
      matrix:
        include:
          # Third leg stands in on Linux: the account's macOS pool is contended
          # and the artifact plumbing under test is platform independent. The
          # real macOS leg is covered by the production release run.
          - platform: ubuntu-22.04
            label: macOS (Apple Silicon)
            artifact: macos-aarch64
          - platform: ubuntu-22.04
            label: Linux (x64)
            artifact: linux-x64
          - platform: windows-latest
            label: Windows (x64)
            artifact: windows-x64

    name: Build ${{ matrix.label }}
    needs: prepare-version
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 15
    steps:
      # Stands in for the Tauri build. Long enough that serialised legs would
      # stagger visibly, short enough to iterate on.
      - name: Fake build
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/desktop-release-assets"
          mkdir -p "$out"
          echo "${{ matrix.artifact }} ${{ needs.prepare-version.outputs.app_version }}" > "$out/unsloth-${{ matrix.artifact }}.txt"
          date -u +%s > "$out/started-${{ matrix.artifact }}.txt"
          sleep 120

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-release-${{ matrix.artifact }}
          path: ${{ runner.temp }}/desktop-release-assets/*

  publish-release:
    needs: [prepare-version, build]
    runs-on: ubuntu-latest
    steps:
      # Same pattern + merge-multiple as the real publish-release job.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: desktop-release-*
          path: ${{ runner.temp }}/desktop-release-assets
          merge-multiple: true

      - name: Assert every leg landed
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/desktop-release-assets"
          ls -1
          for a in macos-aarch64 linux-x64 windows-x64; do
            test -f "unsloth-$a.txt" || { echo "::error::missing $a"; exit 1; }
          done
          echo "all three legs published"
          # Spread of the legs' own start stamps: small means they ran together.
          python3 - <<'PY'
          import glob, pathlib
          s = sorted(int(pathlib.Path(p).read_text().strip()) for p in glob.glob('started-*.txt'))
          print('leg start stamps:', s, 'spread(s):', s[-1] - s[0])
          PY
