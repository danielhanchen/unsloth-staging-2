name: "staging-10649 ubuntu-24.04-arm"
on:
  push:
    branches: ["pr-10649-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
      # The installer's end-to-end suites build sandboxes with `uv venv --python 3.12/3.13`.
      # A runner ships one interpreter, and uv then refuses with "No virtual environment or
      # system Python installation found" -- a harness gap that reads as PR breakage.
      UV_PYTHON_DOWNLOADS: automatic
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart uv && python -m pip install --no-deps -e . unsloth_zoo
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_transformers_version_optional_tiktoken.py tests/python/test_cross_platform_parity.py tests/python/test_tokenizers_and_torch_constraint.py tests/studio/install/test_base_requirements_reach_install.py tests/studio/install/test_dependency_pass_skips.py tests/studio/install/test_install_manifest.py tests/studio/install/test_install_manifest_damage.py tests/studio/install/test_install_manifest_pass_evidence.py tests/studio/install/test_installed_family_hermeticity.py tests/studio/install/test_mlx_install.py tests/studio/install/test_rocm_companion_probe.py tests/studio/install/test_rocm_support.py tests/studio/install/test_setup_fast_path_guard.py tests/studio/install/test_windows_torch_flavor_invariant.py tests/studio/test_xpu_triton_swap.py tests/test_installer_interactive_prompts.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out.txt 2>&1 || rc=$?; cat pytest_out.txt; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers)." pytest_out.txt && ! grep -qE "^(FAILED|ERROR) " pytest_out.txt; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" = "1" ] && ! grep -qE "^ERROR " pytest_out.txt; then tot=$(grep -cE "^FAILED " pytest_out.txt); dep=$(grep -cE "^FAILED .* No module named .(torch|unsloth_zoo|transformers).$" pytest_out.txt); if [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; fi; exit "$rc"
