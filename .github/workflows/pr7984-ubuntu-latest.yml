name: "PR-7984 sims ubuntu-latest"
on:
  push:
    branches: [pr7984-cross-os]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  sims:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Check out the PR head next to the sims
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/mahiatlinux/unsloth.git pr
          cd pr
          git fetch --depth 1 origin feat/studio-audio-page
          git checkout FETCH_HEAD
      - name: Install the studio backend requirements
        run: python -m pip install -r pr/studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - name: Report the host
        run: python -c "import sys,platform,os; print(sys.platform, platform.platform(), os.name, sys.getfilesystemencoding())"
      - name: Run the simulations on this OS
        env:
          PR_BACKEND: ${{ github.workspace }}/pr/studio/backend
        run: python -m pytest sims -q --timeout=180
