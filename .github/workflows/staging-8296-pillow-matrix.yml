name: "staging-8296 pillow matrix"
on:
  push:
    branches: ["pr-8296-xplat-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-13, windows-latest]
        pillow: ["10.4.0", "11.3.0", "12.3.0"]
        include:
          - os: ubuntu-latest
            pillow: "9.5.0"
            python: "3.11"
          - os: windows-latest
            pillow: "9.5.0"
            python: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python || '3.12' }}
      - run: python -m pip install "pillow==${{ matrix.pillow }}" numpy pytest
      - name: drift probe
        run: python ci_dmg_probe.py .
      - name: stale asset must be rejected
        run: |
          git show HEAD~1^1:studio/src-tauri/dmg/background.tiff > stale.tiff
          python ci_dmg_probe.py . stale.tiff
      - name: the branding suite itself
        run: python -m pytest tests/studio/test_tauri_branding_contract.py -q --tb=short
