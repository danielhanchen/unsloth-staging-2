name: "OS sandbox setup and warm-up end to end"
on:
  push:
    branches: [t3c-*]
  workflow_dispatch:
jobs:
  sbv2:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONPATH: studio/backend
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Studio home
        shell: bash
        run: echo "UNSLOTH_STUDIO_HOME=$RUNNER_TEMP/studio" >> "$GITHUB_ENV"
      - run: python -m pip install -q -r studio/backend/requirements/studio.txt pytest python-multipart aiofiles sqlalchemy cryptography psutil pyyaml jinja2 requests httpx "numpy<3"
      - name: Host state before (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then sudo apt-get remove -y bubblewrap >/dev/null 2>&1 || true; fi
          echo "bwrap: $(command -v bwrap || echo missing) $(bwrap --version 2>/dev/null || true)"
          echo "restrict_userns: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"
          ls -la /etc/apparmor.d/bwrap-userns-restrict 2>&1 || true
          echo "sudo -n: $(sudo -n true && echo yes || echo no)"
      - name: Unit tests for the new pieces
        shell: bash
        run: |
          cd studio/backend
          python -m pytest -q -p no:cacheprovider tests/test_permission_mode_degrade.py tests/test_sandbox_setup_plan.py tests/test_sandbox_setup_job.py tests/test_sandbox_setup_route.py tests/test_sandbox_settings_route.py tests/test_mxc_host_prep_job.py tests/test_sandbox_probe.py 2>&1 | tail -15
      - name: Setup end to end
        shell: bash
        run: |
          python -u sbv2_e2e.py 2>&1 | grep -v -E '"level": "info"|\[info' ; echo "e2e exit=${PIPESTATUS[0]}"
      - name: Host state after (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "bwrap: $(command -v bwrap || echo missing) $(bwrap --version 2>/dev/null || true)"
          ls -la /etc/apparmor.d/bwrap-userns-restrict 2>&1 || true
          bwrap --unshare-user --ro-bind / / true && echo "bwrap userns ok" || echo "bwrap userns blocked"
      - name: Probe and first-call latency, with and without warm-up
        shell: bash
        run: |
          python -u sbv2_perf.py --backend-dir studio/backend --reps 5 --rounds 3 --json perf_${{ matrix.os }}.json 2>&1 | tail -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-${{ matrix.os }}
          path: perf_*.json
