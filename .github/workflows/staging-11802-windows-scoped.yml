name: "staging-11802-windows-scoped"
on:
  push:
    branches: ["pr-11802-xplat-ci"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -c "import os, sys, tempfile, pathlib; d = pathlib.Path(tempfile.mkdtemp()); (d / 'a').write_text('x'); os.link(d / 'a', d / 'b'); print('platform', sys.platform, 'hardlink nlink', os.stat(d / 'b').st_nlink)"
      - run: cd studio/backend && python -m pytest tests/test_diffusion_memory.py && python -m pytest tests/test_diffusion_backend.py -q --tb=short -k 'precast or plan_memory or 24g_denoiser' -q --tb=short -rs
