name: par-probe-2
on:
  push:
    branches: [ci-par-probe]
jobs:
  fg-fails-wait-not-cancelled:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: bg
        id: bg
        background: true
        run: sleep 20; echo "BG-DONE"
      - name: fg-fails
        if: ${{ !cancelled() }}
        run: sleep 2; exit 1
      - name: fg-after (if !cancelled, should RUN)
        if: ${{ !cancelled() }}
        run: echo "FG-AFTER-RAN"
      - name: fg-default (should be skipped)
        run: echo SHOULD-NOT-RUN
      - name: advisory
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: exit 5
      - wait: bg
        if: ${{ !cancelled() }}
      - name: summary
        if: always()
        run: echo "bg=${{ steps.bg.outcome }}"
  fg-fails-no-wait-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: bg
        id: bg
        background: true
        run: sleep 20; echo "BG-DONE"
      - name: fg-fails
        run: sleep 2; exit 1
      - wait: bg
      - name: summary
        if: always()
        run: echo "bg=${{ steps.bg.outcome }}"
  bg-continue-on-error:
    runs-on: ubuntu-24.04
    steps:
      - name: bg
        id: bg
        background: true
        continue-on-error: true
        run: sleep 5; exit 4
      - name: fg
        run: echo fg
      - wait: bg
      - name: after (should RUN)
        run: echo "AFTER-RAN outcome=${{ steps.bg.outcome }} conclusion=${{ steps.bg.conclusion }}"
  never-waited:
    runs-on: ubuntu-24.04
    steps:
      - name: bg
        id: bg
        background: true
        run: sleep 15; echo "BG-DONE"; exit 6
      - name: fg
        run: echo fg-green
