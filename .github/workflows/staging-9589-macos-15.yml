name: "staging-9589 macos-15"
on:
  push:
    branches: ["pr-9589-mlxspec-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; ran=0; rm -f pytest_out.txt; r=0; PYTHONPATH=studio/backend python -m pytest studio/backend/hub/tests/test_model_services.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' >> pytest_out.txt 2>&1 || r=$?; if [ "$r" != "5" ]; then ran=1; if [ "$rc" = "0" ]; then rc=$r; fi; fi; r=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_gguf_load_cache_reuse.py studio/backend/tests/test_gpu_selection.py studio/backend/tests/test_mlx_inference_backend.py studio/backend/tests/test_validate_model_error.py tests/studio/test_chat_autoload_failure_gate.py tests/studio/test_model_picker_contracts.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' >> pytest_out.txt 2>&1 || r=$?; if [ "$r" != "5" ]; then ran=1; if [ "$rc" = "0" ]; then rc=$r; fi; fi; if [ "$ran" = "0" ]; then rc=5; fi; cat pytest_out.txt; tot=$(grep -cE "^(FAILED|ERROR) " pytest_out.txt) || tot=0; dep=$(grep -cE "^(FAILED|ERROR) .* (ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers).$" pytest_out.txt) || dep=0; bare=$(awk '/^_+ ERROR collecting [^ ]+ _+$/ {cur=$4; next} /^(=|_)+ / {cur=""} cur != "" && /(ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers)./ {ok[cur]=1} /^ERROR [^ ]+$/ && ($2 in ok) {n++} END {print n+0}' pytest_out.txt) || bare=0; dep=$((dep + bare)); if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers)." pytest_out.txt && { [ "$tot" = "0" ] || [ "$tot" = "$dep" ]; }; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" = "1" ] && [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; exit "$rc"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - name: Install frontend deps
        working-directory: studio/frontend
        run: npm ci --no-fund --no-audit
      - name: Node tests
        working-directory: studio/frontend
        run: node --experimental-strip-types --test tests/batch-schema-version.test.ts tests/mlx-context-pin-record-compat.test.ts tests/mlx-speculative-intent.test.ts tests/resident-config-match-accelerator-matrix.test.ts tests/server-tuning-settings.test.ts
      - name: "jobs: install MLX (Apple Silicon)"
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch
          for attempt in 1 2 3; do python -m pip install "unsloth_zoo @ git+https://github.com/unslothai/unsloth-zoo" && break; [ "$attempt" = 3 ] && exit 1; sleep $((5 * attempt)); done
          python -m pip install -e . --no-deps
          python -m pip install -U transformers mlx-vlm mlx-lm structlog pyyaml
          python -m pip list 2>/dev/null | grep -iE '^(transformers|mlx|mlx-lm|mlx-vlm|trl|peft|torch) '
      - name: "job: mlx_spec_inference (MLX (Apple Silicon))"
        if: ${{ !cancelled() }}
        run: |
          env -u UNSLOTH_IS_PRESENT -u UNSLOTH_COMPILE_DISABLE python .github/scripts/jobs/mlx_spec_inference.py --out job_0_mlx_spec_inference_macos-15.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ always() }}
        with:
          name: job-results-macos-15
          path: job_*.json
          if-no-files-found: warn
