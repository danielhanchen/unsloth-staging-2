name: "PR-7082 ubuntu-latest"
on:
  push:
    branches: ["pr-7082-ci"]
    paths:
      - 'studio/backend/**'
      - '.github/workflows/pr7082-ubuntu.yml'
      - '.github/scripts/pr7082/**'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest structlog starlette
      - name: Browse/denylist/path unit suites
        run: |
          PYTHONPATH=studio/backend python -m pytest -q \
            studio/backend/tests/test_browse_denylist.py \
            studio/backend/tests/test_windows_external_drive_paths.py \
            studio/backend/tests/test_linux_external_media_paths.py
      - name: Before/after security probe (/etc via '/')
        run: python .github/scripts/pr7082/security_beforeafter.py
