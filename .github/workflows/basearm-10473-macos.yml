name: "basearm-10473 macos-15"
on:
  push:
    branches: ["pr-10473-basearm-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      # PURE upstream main on Windows, same runner and same file as the PR arm. The PR arm
      # reports 67 failures here; this says how many of them main already has. PR 10473 does
      # not add this file, it edits 45 lines of it, so only a side-by-side count separates
      # "the PR broke Windows" from "this file was never Windows-clean".
      - run: PYTHONPATH=studio/backend python -m pytest tests/studio/install/test_rocm_support.py studio/backend/tests/test_install_resolve_prebuilt.py -q --tb=line
