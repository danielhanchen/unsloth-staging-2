name: "staging-7973 ubuntu-latest"
on:
  push:
    branches: ["pr-7973-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/llama_cpp.py'
      - 'studio/backend/core/inference/llama_server_args.py'
      - 'studio/backend/models/inference.py'
      - 'studio/backend/routes/chat_history.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/routes/settings.py'
      - 'studio/backend/tests/test_batch_sizes_per_load.py'
      - 'studio/backend/tests/test_chat_history_routes.py'
      - 'studio/backend/tests/test_chat_load_during_training.py'
      - 'studio/backend/utils/openai_auto_switch_settings.py'
      - 'studio/frontend/src/features/api-monitor/components/saved-model-settings.tsx'
      - 'studio/frontend/src/features/chat/api/chat-adapter.ts'
      - 'studio/frontend/src/features/chat/api/chat-api.ts'
      - 'studio/frontend/src/features/chat/chat-settings-sheet.tsx'
      - 'studio/frontend/src/features/chat/hooks/use-chat-model-runtime.ts'
      - 'studio/frontend/src/features/chat/lib/apply-inference-status-to-store.ts'
      - 'studio/frontend/src/features/chat/lib/resolve-batch-size-seed.ts'
      - 'studio/frontend/src/features/chat/presets/preset-load-config.ts'
      - 'studio/frontend/src/features/chat/shared-composer.tsx'
      - 'studio/frontend/src/features/chat/stores/chat-runtime-store.ts'
      - '.github/workflows/staging-7973-ubuntu-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_batch_sizes_per_load.py studio/backend/tests/test_chat_history_routes.py studio/backend/tests/test_chat_load_during_training.py tests/studio/test_model_picker_contracts.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
