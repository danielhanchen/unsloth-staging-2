# The ARM64 inference-only tier, end to end on real Windows ARM64 hardware:
# install with UNSLOTH_NO_DATASETS=1 (what install.ps1 sets when it cannot obtain
# an x64 interpreter), then prove the server boots without datasets and says so.
name: "8495 win-arm64 inference-only tier"
on:
  push:
    branches: [pr8495-arm64-cross-os]
    paths:
      - 'install.ps1'
      - 'studio/setup.ps1'
      - 'studio/install_python_stack.py'
      - 'studio/install_manifest.py'
      - 'studio/backend/**'
      - '.github/workflows/arm-win-tier.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tier:
    runs-on: windows-11-arm
    timeout-minutes: 90
    env:
      UNSLOTH_STUDIO_HOME: ${{ github.workspace }}\studio_home
      UNSLOTH_NO_DATASETS: '1'
      UNSLOTH_STUDIO_PASSWORD: 'ci-tier-probe-pw'
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Install uv
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # The tier's whole premise: with the wheel-less packages filtered out, the rest
      # of the stack resolves on a native ARM64 interpreter. Checked before paying for
      # a full install so a failure here names the package rather than a timeout.
      - name: The filtered requirement set resolves natively
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          # Read from the installer itself so this cannot drift from what ships.
          $ps1 = Get-Content install.ps1 -Raw
          $skipBlock = [regex]::Match($ps1, '(?s)\$script:ArmInferenceSkipPackages = @\((.*?)\)').Groups[1].Value
          $skip = [regex]::Matches($skipBlock, '"([^"]+)"') | ForEach-Object { $_.Groups[1].Value }
          $liftBlock = [regex]::Match($ps1, '(?s)\$script:ArmInferenceLiftPackages = @\{(.*?)\}').Groups[1].Value
          $lift = @{}
          foreach ($m in [regex]::Matches($liftBlock, '"([^"]+)"\s*=\s*"([^"]+)"')) { $lift[$m.Groups[1].Value] = $m.Groups[2].Value }
          "skipping: $($skip -join ', ')"
          "lifting:  $($lift.Keys -join ', ')"
          # Torch-family packages the tier never installs directly, plus the pure-Python
          # sdist-only entries (randomname, argbind, openai-whisper) that --only-binary
          # rejects but pip builds fine anywhere.
          $skip += @("torchcodec", "triton", "triton-windows", "triton_kernels", "xformers", "bitsandbytes",
                     "randomname", "argbind", "openai-whisper", "torch", "torchvision", "torchaudio")
          $failed = @()
          $files = Get-ChildItem studio/backend/requirements/*.txt, studio/backend/requirements/single-env/*.txt |
            Where-Object { $_.Name -notlike "*overrides*" -and $_.Name -notlike "*constraints*" } |
            ForEach-Object { $_.FullName }
          foreach ($file in $files) {
            Get-Content $file | ForEach-Object {
              $line = ($_ -split '#')[0].Trim()
              if (-not $line -or $line.StartsWith("-")) { return }
              $name = (($line -split '[=<>!~;\[ ]')[0]).Trim().ToLowerInvariant().Replace("_", "-")
              if ($skip -contains $name) { return }
              # Direct references (git+ or an https source archive, e.g. the
              # diffusers commit pin) carry no wheel by definition, so --only-binary
              # rejects them everywhere, not just on ARM64. diffusers is pure Python.
              if ($line -like "*@ git+*" -or $line -like "*@ http*") { return }
              if ($lift.ContainsKey($name)) { $line = $lift[$name] }
              # --no-deps mirrors how the tier installs this file: a torch-bound
              # dependency of accelerate/peft is not this check's business.
              uv pip install --dry-run --system --no-deps --only-binary ":all:" "$line" *> $null
              if ($LASTEXITCODE -ne 0) { $failed += "$file :: $line" }
            }
          }
          if ($failed.Count -gt 0) {
            "STILL UNRESOLVABLE ON win-arm64:"
            $failed | ForEach-Object { "  $_" }
            exit 1
          }
          "every remaining requirement resolves on a native ARM64 interpreter"
          exit 0

      # --local, or this proves nothing about the Python half: without it the setup
      # phase runs setup.ps1 / install_python_stack.py out of the RELEASED unsloth
      # wheel, and the tier logic under test never executes. --no-torch bounds the
      # runtime; the datasets filtering is identical on both torch paths.
      - name: Install the tier from this checkout
        shell: pwsh
        run: .\install.ps1 --local --no-torch 2>&1 | Tee-Object -FilePath tier-install.log

      - name: The venv is ARM64 and has no datasets
        shell: pwsh
        run: |
          $py = "$env:UNSLOTH_STUDIO_HOME\unsloth_studio\Scripts\python.exe"
          $tag = & $py -S -c "import sysconfig; print(sysconfig.get_platform())"
          "venv platform tag = $tag"
          if ($tag -ne "win-arm64") { "expected a native ARM64 venv in this tier"; exit 1 }
          & $py -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('datasets') is None else 1)"
          if ($LASTEXITCODE -ne 0) { "datasets is installed; the tier did not filter it"; exit 1 }
          "datasets is absent, as the tier intends"
          # The marker is what keeps `unsloth studio update` inside the tier.
          if (-not (Test-Path "$env:UNSLOTH_STUDIO_HOME\unsloth_studio\.unsloth-no-datasets")) {
            "the .unsloth-no-datasets marker was not written"
            exit 1
          }
          "tier marker present"

      - name: The server boots and reports datasets_unavailable
        shell: pwsh
        run: |
          $bin = "$env:UNSLOTH_STUDIO_HOME\bin\unsloth.exe"
          if (-not (Test-Path $bin)) { $bin = "$env:UNSLOTH_STUDIO_HOME\unsloth_studio\Scripts\unsloth.exe" }
          Start-Process -FilePath $bin -ArgumentList "studio", "-H", "127.0.0.1", "-p", "8899" `
            -RedirectStandardOutput studio.log -RedirectStandardError studio.err -NoNewWindow
          $healthy = $false
          foreach ($i in 1..90) {
            Start-Sleep -Seconds 5
            try {
              $r = Invoke-RestMethod -Uri "http://127.0.0.1:8899/api/health" -TimeoutSec 10
              if ($r) { $healthy = $true; $health = $r; break }
            } catch { }
          }
          if (-not $healthy) { "server never became healthy"; Get-Content studio.log -Tail 60; Get-Content studio.err -Tail 60; exit 1 }
          $health | ConvertTo-Json -Depth 4
          if (-not $health.chat_only) { "expected chat_only in a tier install"; exit 1 }
          "the server booted without datasets and reports chat_only"

          # chat_only_reason rides on the AUTHED half of /api/health (main.py assembles
          # it after the bearer check), so log in with the bootstrap password first.
          $login = Invoke-RestMethod -Uri "http://127.0.0.1:8899/api/auth/login" -Method Post `
            -ContentType "application/json" `
            -Body (@{ username = "unsloth"; password = $env:UNSLOTH_STUDIO_PASSWORD } | ConvertTo-Json)
          $token = $login.access_token
          if (-not $token) { "could not obtain a token"; $login | ConvertTo-Json -Depth 4; exit 1 }
          $authed = Invoke-RestMethod -Uri "http://127.0.0.1:8899/api/health" -TimeoutSec 15 `
            -Headers @{ Authorization = "Bearer $token" }
          $authed | ConvertTo-Json -Depth 4
          if ($authed.chat_only_reason -ne "datasets_unavailable") {
            "expected chat_only_reason=datasets_unavailable, got '$($authed.chat_only_reason)'"
            exit 1
          }
          if (-not $authed.chat_only_detail) { "expected a detail explaining the reason"; exit 1 }
          "the verdict names datasets, so the UI can explain the greyed-out Train"

          # The gate is per route, so check both halves. check-format reaches
          # `from datasets import` and must answer 503 with a reason rather than a 500
          # traceback; the local listing only walks the filesystem and must still work,
          # or the tier has lost a feature it can serve.
          $status = 0
          try {
            Invoke-WebRequest -Uri "http://127.0.0.1:8899/api/hub/datasets/check-format" `
              -Method Post -TimeoutSec 15 -ContentType "application/json" `
              -Body '{"dataset_name":"unsloth/LaTeX_OCR"}' `
              -Headers @{ Authorization = "Bearer $token" } | Out-Null
          } catch { $status = [int]$_.Exception.Response.StatusCode }
          if ($status -ne 503) { "expected 503 from check-format, got $status"; exit 1 }
          "the routes that need datasets answer 503, not 500"

          $local = Invoke-WebRequest -Uri "http://127.0.0.1:8899/api/hub/datasets/local" `
            -TimeoutSec 15 -Headers @{ Authorization = "Bearer $token" }
          if ($local.StatusCode -ne 200) {
            "expected 200 from the local listing, got $($local.StatusCode)"; exit 1
          }
          "the routes that do not need it keep working"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-tier-logs
          path: |
            tier-install.log
            studio.log
            studio.err

  # The path the tier job above deliberately does not take. --no-torch bounds that
  # job's runtime, but it also skips extras.txt, which is the ONE phase installed
  # with dependency resolution -- where a pure-Python line drags a compiled package
  # into the tier through its metadata (openai-whisper -> tiktoken, torch-stoi ->
  # torchaudio, librosa -> numba, none of which have win_arm64 wheels). A target
  # platform resolution says those are now filtered; this says it on the hardware.
  tier-with-torch:
    runs-on: windows-11-arm
    timeout-minutes: 150
    env:
      UNSLOTH_STUDIO_HOME: ${{ github.workspace }}\studio_home_torch
      UNSLOTH_NO_DATASETS: '1'
      UNSLOTH_STUDIO_PASSWORD: 'ci-tier-torch-pw'
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Install uv
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install the tier from this checkout, with torch
        shell: pwsh
        run: .\install.ps1 --local 2>&1 | Tee-Object -FilePath tier-torch-install.log

      - name: Nothing was built from source, and the audio stack stayed out
        shell: pwsh
        run: |
          $built = Select-String -Path tier-torch-install.log -Pattern "Building [a-zA-Z0-9._-]+==" -AllMatches
          if ($built) {
              "packages were built from source on ARM64, which is what this tier exists to avoid:"
              $built.Matches.Value | Sort-Object -Unique
              exit 1
          }
          "no source builds"
          $py = "$env:UNSLOTH_STUDIO_HOME\unsloth_studio\Scripts\python.exe"
          & $py -c "import torch; print('torch', torch.__version__)"
          if ($LASTEXITCODE -ne 0) { "torch did not install on native ARM64"; exit 1 }
          foreach ($mod in @("torchaudio", "numba", "librosa", "datasets", "pyarrow")) {
              & $py -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('$mod') is None else 1)"
              if ($LASTEXITCODE -ne 0) { "$mod is installed; the tier should have filtered it"; exit 1 }
          }
          "torchaudio, numba, librosa, datasets and pyarrow are all absent, as intended"

      - name: The server still boots and can answer
        shell: pwsh
        run: |
          $bin = "$env:UNSLOTH_STUDIO_HOME\bin\unsloth.exe"
          if (-not (Test-Path $bin)) { $bin = "$env:UNSLOTH_STUDIO_HOME\unsloth_studio\Scripts\unsloth.exe" }
          Start-Process -FilePath $bin -ArgumentList "studio", "-H", "127.0.0.1", "-p", "8901" `
            -RedirectStandardOutput studio-torch.log -RedirectStandardError studio-torch.err -NoNewWindow
          $healthy = $false
          foreach ($i in 1..90) {
            Start-Sleep -Seconds 5
            try {
              $r = Invoke-RestMethod -Uri "http://127.0.0.1:8901/api/health" -TimeoutSec 10
              if ($r) { $healthy = $true; $health = $r; break }
            } catch { }
          }
          if (-not $healthy) {
            "server never became healthy"
            Get-Content studio-torch.log -Tail 80
            Get-Content studio-torch.err -Tail 80
            exit 1
          }
          $health | ConvertTo-Json -Depth 4
          "the tier boots with torch installed"
