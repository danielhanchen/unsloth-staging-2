name: "cpu-matrix-6311 studio win"

# Stand up full Unsloth Studio on windows-latest with the fork CPU bundle, load
# unsloth/Qwen3.5-2B-MTP-GGUF UD-Q4_K_XL via Studio's API, and trace the
# 0xC0000409 spawn crash: llama_cpp.py is patched to log argv/cwd/PATH before
# every llama-server spawn (SPAWN_DEBUG -> spawn-debug.jsonl). A post-mortem then
# re-runs Studio's exact captured command (a) clean and (b) with Studio's cwd+PATH
# to isolate whether the crash is env/cwd-driven.

on:
  push:
    branches: ['**']
    paths: ['.github/workflows/cpu-matrix-6311-studiowin.yml', 'studio/backend/core/inference/llama_cpp.py']
  workflow_dispatch:

concurrency:
  group: cpu-matrix-6311-studiowin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  studio-win:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      STUDIO_PORT: '18888'
      GGUF_REPO: unsloth/Qwen3.5-2B-MTP-GGUF
      GGUF_VARIANT: UD-Q4_K_XL
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # hf_transfer hard-errors on this Windows runner instead of stalling, so Studio's
      # xet->HTTP stall fallback never triggers. Force plain HTTP (what Studio's own
      # hf_download worker does) so the GGUF lands on disk and llama-server actually spawns.
      HF_HUB_ENABLE_HF_TRANSFER: '0'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Pre-install tweaks (npm 11 + Defender exclusions)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          npm install -g 'npm@^11' 2>&1 | Out-Host
          foreach ($p in @("$env:USERPROFILE\.unsloth","$env:USERPROFILE\AppData\Local\uv",
                           "$env:GITHUB_WORKSPACE\studio\frontend\node_modules","$env:GITHUB_WORKSPACE\studio\frontend\dist")) {
            try { Add-MpPreference -ExclusionPath $p -ErrorAction Stop } catch {}
          }

      - name: Install Studio (--local, --no-torch)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          $ProgressPreference = 'SilentlyContinue'
          & ./install.ps1 --local --no-torch *>&1 | Tee-Object -FilePath logs/install.log

      - name: Assert Windows prebuilt used + record build
        shell: bash
        run: |
          INFO=~/.unsloth/llama.cpp/UNSLOTH_PREBUILT_INFO.json
          [ -f "$INFO" ] || { echo "::error::no prebuilt info"; exit 1; }
          echo "=== installed fork bundle ==="; cat "$INFO"

      - name: Add Studio shim to PATH
        shell: bash
        run: cygpath -w ~/.unsloth/studio/bin >> "$GITHUB_PATH"

      - name: Boot Studio (API-only)
        shell: bash
        run: |
          unsloth studio reset-password
          mkdir -p logs
          UNSLOTH_API_ONLY=1 unsloth studio -H 127.0.0.1 -p "$STUDIO_PORT" > logs/studio.log 2>&1 &
          echo "STUDIO_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for /api/health
        shell: bash
        run: |
          for i in $(seq 1 180); do
            curl -fs "http://127.0.0.1:${STUDIO_PORT}/api/health" >/tmp/h.json && { echo "healthy"; exit 0; }
            sleep 1
          done
          echo "::error::studio not healthy"; tail -100 logs/studio.log; exit 1

      - name: Login + rotate password for an unblocked token
        shell: bash
        run: |
          # Bootstrap password is flagged "change required": login with it, rotate,
          # then login with the new one -> that token is unblocked for /api/inference.
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CIStudioWin-$(python -c 'import secrets; print(secrets.token_urlsafe(12))')"
          echo "::add-mask::$OLD"; echo "::add-mask::$NEW"
          OLD_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}" | jq -r .access_token)
          [ -n "$OLD_TOKEN" ] && [ "$OLD_TOKEN" != null ] || { echo "bootstrap login failed"; exit 1; }
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/change-password" \
            -H "Authorization: Bearer $OLD_TOKEN" -H 'content-type: application/json' \
            -d "{\"current_password\":\"$OLD\",\"new_password\":\"$NEW\"}" > /dev/null
          TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' -d "{\"username\":\"unsloth\",\"password\":\"$NEW\"}" | jq -r .access_token)
          [ -n "$TOKEN" ] && [ "$TOKEN" != null ] || { echo "post-rotation login failed"; exit 1; }
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Load Qwen3.5-2B-MTP UD-Q4_K_XL via Studio + chat 1+1
        id: load
        shell: bash
        run: |
          HTTP=$(curl -s -o /tmp/load.json -w '%{http_code}' \
            -X POST "http://127.0.0.1:${STUDIO_PORT}/api/inference/load" \
            -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' --max-time 600 \
            -d "{\"model_path\":\"$GGUF_REPO\",\"gguf_variant\":\"$GGUF_VARIANT\",\"is_lora\":false,\"max_seq_length\":2048}")
          echo "load HTTP=$HTTP"; cat /tmp/load.json; echo
          if [ "$HTTP" != 200 ]; then echo "loadok=0" >> "$GITHUB_OUTPUT"; else
            echo "loadok=1" >> "$GITHUB_OUTPUT"
            # chat via OpenAI-compatible endpoint
            RESP=$(curl -s -X POST "http://127.0.0.1:${STUDIO_PORT}/v1/chat/completions" \
              -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
              -d '{"messages":[{"role":"user","content":"What is 1+1? /no_think"}],"temperature":0,"max_tokens":64}')
            echo "chat: $(printf '%s' "$RESP" | head -c 600)"
          fi

      - name: Post-mortem - capture + reproduce the spawn
        if: always()
        shell: bash
        run: |
          echo "=== studio.log tail (0xC0000409 + SPAWN_DEBUG) ==="
          tail -80 logs/studio.log 2>/dev/null | grep -aiE 'llama-server|exited with code|hard-crash|SPAWN_DEBUG|spec|embedder|failed to start' | head -40 || true
          DBG=~/.unsloth/studio/logs/spawn-debug.jsonl
          echo "=== spawn-debug.jsonl ==="; [ -f "$DBG" ] && cat "$DBG" || echo "(none)"
          if [ "${{ steps.load.outputs.loadok }}" = 1 ]; then echo "LOAD SUCCEEDED - no crash to reproduce (fork build works under Studio today)"; exit 0; fi
          [ -f "$DBG" ] || { echo "no spawn debug captured"; exit 0; }
          python - "$DBG" <<'PY'
          import json,sys,os,subprocess,shlex
          rows=[json.loads(l) for l in open(sys.argv[1]) if l.strip()]
          print(f"captured {len(rows)} spawn(s)")
          for i,r in enumerate(rows):
              print(f"  [{i}] {' '.join(r['argv'])[:300]}")
          # pick the main MODEL spawn (Studio may spawn a concurrent embedder first);
          # prefer the row whose argv references the loaded GGUF, else the last spawn.
          def is_model(r): return any('Qwen3.5' in a or a.endswith('.gguf') for a in r['argv'])
          row=next((r for r in rows if is_model(r)), rows[-1])
          argv=row["argv"]; cwd=row["cwd"]; path=row["PATH"]
          print("CAPTURED argv:", " ".join(argv))
          print("CAPTURED cwd:", cwd)
          print("CAPTURED PATH head:", path[:400])
          def run(tag, env=None, cwd_=None):
              a=list(argv)
              # give it a fresh port + short run so we only test startup
              try: pi=a.index("--port"); a[pi+1]="18099"
              except ValueError: a+=["--port","18099"]
              print(f"\n=== REPRODUCE [{tag}] ===")
              p=subprocess.run(a, env=env, cwd=cwd_, capture_output=True, text=True, timeout=120)
              print(f"[{tag}] exit={p.returncode} (0xC0000409={p.returncode==3221225785 or p.returncode==-1073740791})")
              print(f"[{tag}] stdout tail:", (p.stdout or '')[-400:])
              print(f"[{tag}] stderr tail:", (p.stderr or '')[-400:])
              return p.returncode
          # (a) clean env, default cwd
          run("clean-env")
          # (b) studio PATH + cwd
          e=dict(os.environ); e["PATH"]=path
          run("studio-PATH+cwd", env=e, cwd_=cwd if os.path.isdir(cwd) else None)
          # (c) studio cwd only
          run("studio-cwd-only", cwd_=cwd if os.path.isdir(cwd) else None)
          PY

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studiowin-logs
          path: |
            logs/studio.log
            logs/install.log
          if-no-files-found: ignore
