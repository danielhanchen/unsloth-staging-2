name: "heavy-thread windows-latest"
on:
  push:
    branches: ["pr-9016-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      SMOKE_HEAVY_CHARS: "25000,100000,300000"
      SMOKE_HEAVY_ENGINES: "chromium,webkit,firefox"
      SMOKE_HEAVY_REPEATS: "2"
      SMOKE_LABEL: "${{ github.ref_name }}-windows-latest"
      PW_ART_DIR: "logs/heavy-thread"
    steps:
      - name: Check out with the repo's own line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-fund --no-audit
        working-directory: studio/frontend
      - run: python -m pip install 'playwright>=1.45,<2'
      - run: python -m playwright install chromium webkit firefox
      # The numbers are the whole point of this job, so print the machine they came off.
      # A 4-core hosted runner is not anyone's desktop and the table has to be read that way.
      - name: Runner shape
        run: |
          node -e "const os=require('os');console.log(os.cpus().length,'cpus |',os.cpus()[0].model,'|',Math.round(os.totalmem()/1e9),'GB |',process.platform,os.release())"
      - name: Heavy thread
        run: python -u tests/studio/playwright_heavy_thread.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: heavy-thread-${{ github.ref_name }}-windows-latest
          path: logs/heavy-thread
          retention-days: 5
          if-no-files-found: warn
