name: "staging-7705 windows-latest"
on:
  push:
    branches: ["pr-7705-xplat-ci"]
    paths:
      - 'studio/frontend/src/hooks/use-tauri-update.ts'
      - 'studio/frontend/src/lib/tauri-updater.ts'
      - 'studio/src-tauri/Cargo.lock'
      - 'studio/src-tauri/Cargo.toml'
      - 'studio/src-tauri/src/desktop_updater.rs'
      - 'studio/src-tauri/src/main.rs'
      - 'studio/src-tauri/src/windows_job.rs'
      - '.github/workflows/staging-7705-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests -q || true
