name: "staging-7631 uninstaller suites"

# The generic cross-platform template filters on studio/** and only runs
# studio/backend/tests, so it never fires for PR 7631 (scripts/** + tests/**).
# This runs the suites the PR actually adds, on the OS triple. It exists because
# upstream Backend CI cannot give this PR a green record: its "Shell installer
# tests" step is skipped after an unrelated pre-existing pytest failure on main.
on:
  push:
    branches: ["pr-7631-xplat-ci"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell-suites:
    name: "shell suites (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Shell syntax check (uninstall.sh)
        shell: bash
        run: |
          set -e
          bash -n scripts/uninstall.sh
          bash -n tests/sh/test_uninstall_arg_guard.sh
          bash -n tests/sh/test_uninstall_shared_icon.sh
          echo "syntax ok on ${{ matrix.os }}"

      - name: Argument guard suite (the PR's own new test)
        shell: bash
        run: bash tests/sh/test_uninstall_arg_guard.sh

      - name: Shared icon suite (edited by this PR)
        shell: bash
        run: bash tests/sh/test_uninstall_shared_icon.sh

      - name: Install pipe safety suite (the sibling contract)
        shell: bash
        run: bash tests/sh/test_install_pipe_safety.sh

  powershell-suites:
    name: "powershell suites (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Parse uninstall.ps1
        shell: pwsh
        run: |
          $t = $null; $e = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath scripts/uninstall.ps1).Path, [ref]$t, [ref]$e) | Out-Null
          if ($e) { $e | ForEach-Object { $_.ToString() }; exit 1 }
          Write-Host "uninstall.ps1 parses: $($t.Count) tokens"

      - name: Argument guard suite
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/studio/test_uninstall_arg_guard.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Dual install icon suite
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/studio/test_uninstall_dual_install_icon.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  windows-powershell-51:
    name: "Windows PowerShell 5.1 argument guard"
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The PR's .ps1 suite is self-hosting via (Get-Process -Id $PID).Path, so
      # launching it from powershell.exe exercises 5.1, which is the shell the
      # README one-liner lands in on a stock Windows box. Nothing in the repo
      # covers 5.1 today.
      - name: Run the guard suite under Windows PowerShell 5.1
        shell: powershell
        run: |
          powershell -NoProfile -File tests/studio/test_uninstall_arg_guard.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
