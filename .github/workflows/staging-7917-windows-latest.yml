name: "staging-7917 windows-latest"
on:
  push:
    branches: ["pr-7917-xplat-ci"]
    paths:
      - 'studio/backend/core/training/training.py'
      - 'studio/backend/core/training/worker.py'
      - 'studio/backend/models/training.py'
      - 'studio/backend/tests/test_training_raw_support.py'
      - 'studio/frontend/src/features/training/api/mappers.ts'
      - 'studio/frontend/src/features/training/types/api.ts'
      - 'studio/frontend/tests/training-start-payload-grad-norm.test.ts'
      - '.github/workflows/staging-7917-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: python -m pip install 'torch==2.10.0' 'unsloth_zoo @ git+https://github.com/unslothai/unsloth-zoo' 'mlx; sys_platform == "darwin" and platform_machine == "arm64"' 'mlx-lm; sys_platform == "darwin" and platform_machine == "arm64"' 'mlx-vlm; sys_platform == "darwin" and platform_machine == "arm64"'
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_training_raw_support.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
