# Staging-only workflow (never upstream): Studio setup on Python 3.10, base (main) vs this PR.
name: py310-setup
on:
  push:
    branches: ['py310-setup-*']
env:
  BASE_SHA: a5e941bb9c9bc1a2c192cb3decb6607b894b8539
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
        arm: [base, head]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: base arm uses main's plugins
        if: matrix.arm == 'base'
        run: git checkout "$BASE_SHA" -- studio/backend/plugins && git status --short | head
      - name: install with Python 3.10
        run: |
          echo "UNSLOTH_STUDIO_HOME=$RUNNER_TEMP/studio_home" >> "$GITHUB_ENV"
          export UNSLOTH_STUDIO_HOME="$RUNNER_TEMP/studio_home"
          set +e
          ./install.sh --local --python 3.10 2>&1 | tee install.log
          echo "INSTALL-EXIT ${PIPESTATUS[0]}"
          grep -n "requires a different Python\|studio setup failed\|restoring previous environment" install.log || true
      - name: plugins and backend import
        run: |
          PY="$UNSLOTH_STUDIO_HOME/unsloth_studio/bin/python"
          cd studio/backend  # the plugins import the backend's utils package, as the running Studio does
          "$PY" -c "import sys; assert sys.version_info[:2]==(3,10), sys.version; from importlib.metadata import entry_points, version; print('PY310', '${{ matrix.arm }}', version('data-designer-unstructured-seed'), version('data-designer-github-repo-seed')); [e.load() for e in entry_points(group='data_designer.plugins')]"
          "$PY" -c "import main; print('BACKEND-IMPORT ok')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: py310-${{ matrix.os }}-${{ matrix.arm }}
          path: install.log
