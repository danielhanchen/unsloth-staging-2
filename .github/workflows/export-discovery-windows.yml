name: "PR-7897 export discovery (windows-latest)"
on:
  push:
    branches: [pr7897-cross-os]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      UNSLOTH_ALLOW_CPU: "1"
      UNSLOTH_IS_PRESENT: "1"
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio httpx python-multipart "numpy<3"
      - name: Export discovery on real NTFS
        working-directory: studio/backend
        run: python -m pytest tests/test_export_gguf_discovery.py tests/test_export_absolute_paths.py tests/test_training_finalizing_phase.py -q -p no:cacheprovider
