name: "staging-10285 Linux runtime-scan diagnostic"

on:
  push:
    branches: [pr-10285-lpac-diag]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: ${{ matrix.runner }} runtime scan budget
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bubblewrap and backend deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          python -m pip install -q -r studio/backend/requirements/studio.txt
          python -m pip install -q python-multipart aiofiles sqlalchemy cryptography psutil pyyaml jinja2 mammoth requests 'numpy<3' pytest pytest-asyncio httpx structlog 'transformers>=4.51,<5.5'
          python -m pip install -q --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11'
      - name: Ubuntu 24.04 remediation (bwrap AppArmor profile)
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
      - name: Time the PR's system-root scan exactly as prepare() runs it
        run: |
          du -sh /usr/lib /usr/share /usr/bin 2>/dev/null | tail -3
          echo "entries: $(find /usr/lib /usr/share -xdev 2>/dev/null | wc -l)"
          set +e
          START=$(date +%s.%N)
          timeout 300 find -H /usr/bin /usr/sbin /usr/lib /usr/lib64 /usr/share /bin /sbin /lib /lib64 /etc/alternatives /etc/ld.so.cache /etc/ld.so.conf /etc/ld.so.conf.d /etc/localtime /etc/nsswitch.conf -xdev \( -type d ! -executable \) -prune -o \( -type s -o -type p -o -type b -o -type c \) -print -quit > /tmp/find.out 2> /tmp/find.err
          RC=$?
          END=$(date +%s.%N)
          echo "find rc=$RC seconds=$(echo "$END - $START" | bc)"
          echo "stdout: $(cat /tmp/find.out)"
          echo "stderr tail:"; tail -5 /tmp/find.err
          echo "second (warm) run:"
          START=$(date +%s.%N)
          timeout 300 find -H /usr/bin /usr/sbin /usr/lib /usr/lib64 /usr/share /bin /sbin /lib /lib64 -xdev \( -type d ! -executable \) -prune -o \( -type s -o -type p -o -type b -o -type c \) -print -quit >/dev/null 2>&1
          END=$(date +%s.%N)
          echo "warm seconds=$(echo "$END - $START" | bc)"
      - name: Capability with the shipped 8 s budget, then with 120 s (staging-only edit)
        working-directory: studio/backend
        run: |
          python - <<'PY'
          import time
          from core.inference.os_sandbox import capability_snapshot
          t0 = time.time(); c = capability_snapshot(force=True)
          print("SHIPPED", round(time.time() - t0, 2), "s ->", c.protection_state, "|", c.reason)
          PY
          grep -n "timeout = 8," core/inference/os_sandbox.py
          sed -i 's/timeout = 8,/timeout = 120,/' core/inference/os_sandbox.py
          python - <<'PY'
          import time
          from core.inference.os_sandbox import capability_snapshot
          t0 = time.time(); c = capability_snapshot(force=True)
          print("BUDGET120", round(time.time() - t0, 2), "s ->", c.protection_state, "qualified=", c.qualified, "|", c.reason)
          PY
      - name: Live enforcement tests and escape probes with the 120 s budget
        working-directory: studio/backend
        run: |
          python -m pytest -q -rs --tb=short -p no:cacheprovider tests/test_os_sandbox.py 2>&1 | tail -40
          echo "===== full traceback of the symlinked-virtualenv live test"
          python -m pytest -q --tb=long -p no:cacheprovider tests/test_os_sandbox.py -k symlink_virtualenv 2>&1 | tail -70
          python - <<'PY'
          import os, json, socket, tempfile, textwrap, subprocess, time
          os.environ["UNSLOTH_STUDIO_HOME"] = tempfile.mkdtemp(prefix="pr10285-home-")
          os.environ["PR10285_HF_CANARY"] = "hf_canary_should_never_leak"
          from core.inference import tools
          from core.inference.os_sandbox import capability_snapshot
          c = capability_snapshot(force=True)
          print("capability:", c.protection_state, c.qualified)
          secret = tempfile.NamedTemporaryFile("w", prefix="pr10285-secret-", delete=False); secret.write("SECRET"); secret.close()
          srv = socket.socket(); srv.bind(("127.0.0.1", 0)); srv.listen(1); port = srv.getsockname()[1]
          usock = os.path.join(tempfile.mkdtemp(), "studio.sock"); us = socket.socket(socket.AF_UNIX); us.bind(usock); us.listen(1)
          code = f'''
          import os, socket, json, subprocess
          r = {{}}
          def attempt(name, fn):
              try:
                  r[name] = "ALLOWED:" + str(fn())[:60]
              except Exception as e:
                  r[name] = "denied:" + type(e).__name__
          attempt("read_host_secret", lambda: open({secret.name!r}).read())
          attempt("read_ssh_dir", lambda: os.listdir(os.path.expanduser("~/.ssh")))
          attempt("write_etc", lambda: open("/etc/pr10285", "w").write("x"))
          attempt("write_root", lambda: open("/pr10285-escape", "w").write("x"))
          attempt("write_workdir", lambda: open("ok.txt", "w").write("x"))
          attempt("tcp_loopback", lambda: socket.create_connection(("127.0.0.1", {port}), timeout=1))
          attempt("tcp_internet", lambda: socket.create_connection(("1.1.1.1", 443), timeout=2))
          attempt("dns", lambda: socket.getaddrinfo("example.com", 443))
          attempt("unix_socket_host", lambda: socket.socket(socket.AF_UNIX).connect({usock!r}))
          attempt("parent_environ", lambda: open("/proc/{os.getpid()}/environ").read())
          attempt("dev_gpu_nodes", lambda: [d for d in os.listdir("/dev") if d.startswith(("nvidia","kfd","dri"))])
          attempt("dev_listing", lambda: sorted(os.listdir("/dev"))[:12])
          attempt("setsid_survivor", lambda: subprocess.Popen(["sh","-c","setsid sleep 300 >/dev/null 2>&1 &"]).wait())
          attempt("import_torch", lambda: __import__("torch").__version__)
          r["canary_in_env"] = "PR10285_HF_CANARY" in os.environ or any("hf_canary" in v for v in os.environ.values())
          r["uid"] = os.getuid(); r["cwd"] = os.getcwd(); r["pid"] = os.getpid()
          print("PROBE_JSON=" + json.dumps(r))
          '''
          out = tools._python_exec(textwrap.dedent(code), session_id="pr10285-escape", timeout=120)
          print(out[-3000:])
          # The Python tool's static pre-scan rejects the probe text before bwrap sees it, so the
          # same escape attempts go through the Terminal tool, where only the OS sandbox decides.
          term = f'''
          echo "TERM_UID=$(id -u) $(id -un)"
          echo "TERM_SECRET=$(cat {secret.name} 2>&1 | head -c 60)"
          echo "TERM_SSH=$(ls -a ~/.ssh /home/runner/.ssh 2>&1 | head -c 80)"
          echo "TERM_HOME_LIST=$(ls /home 2>&1 | head -c 80)"
          echo "TERM_WRITE_ETC=$( (echo x > /etc/pr10285) 2>&1 | head -c 80)"
          echo "TERM_WRITE_ROOT=$( (echo x > /pr10285) 2>&1 | head -c 80)"
          echo "TERM_WRITE_USR=$( (echo x > /usr/pr10285) 2>&1 | head -c 80)"
          echo "TERM_WRITE_WORKDIR=$( (echo x > ok.txt && echo written) 2>&1 | head -c 80)"
          echo "TERM_TCP_LOOPBACK=$( (timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/{port}' && echo CONNECTED) 2>&1 | head -c 80)"
          echo "TERM_TCP_INTERNET=$( (timeout 3 bash -c 'exec 3<>/dev/tcp/1.1.1.1/443' && echo CONNECTED) 2>&1 | head -c 80)"
          echo "TERM_DNS=$(getent hosts example.com 2>&1 | head -c 80)"
          echo "TERM_IFACES=$(ls /sys/class/net 2>&1 | tr '\\n' ' ')"
          echo "TERM_UNIX_SOCKET=$(python3 -c "import socket; s=socket.socket(socket.AF_UNIX); s.connect({usock!r}); print('CONNECTED')" 2>&1 | tail -1 | head -c 80)"
          echo "TERM_PROC1_ENVIRON=$(cat /proc/1/environ 2>&1 | head -c 60)"
          echo "TERM_PROC_LIST=$(ls /proc | grep -c '^[0-9]')"
          echo "TERM_DEV=$(ls /dev | tr '\\n' ' ')"
          echo "TERM_GPU_NODES=$(ls /dev/dri /dev/kfd /dev/nvidia* 2>&1 | head -c 80)"
          echo "TERM_CANARY=$(env | grep -c hf_canary)"
          echo "TERM_ENV_COUNT=$(env | wc -l)"
          echo "TERM_MOUNTS=$(cat /proc/self/mounts | wc -l)"
          echo "TERM_CAPS=$(grep CapEff /proc/self/status)"
          echo "TERM_NNP=$(grep NoNewPrivs /proc/self/status)"
          echo "TERM_SECCOMP=$(grep Seccomp: /proc/self/status)"
          echo "TERM_USERNS_NESTED=$(unshare -U true 2>&1 && echo nested-userns-ALLOWED)"
          echo "TERM_MOUNT=$( (mount -t tmpfs none /mnt) 2>&1 | head -c 80)"
          echo "TERM_KILL_PID1=$( (kill -0 1 && echo can-signal-pid1) 2>&1 | head -c 80)"
          setsid sleep 300 >/dev/null 2>&1 &
          echo "TERM_SETSID_SPAWNED=yes"
          '''
          tout = tools._bash_exec(textwrap.dedent(term), session_id="pr10285-escape", timeout=60)
          print(tout[-4000:])
          time.sleep(2)
          ps = subprocess.run(["pgrep", "-af", "sleep 300"], capture_output=True, text=True).stdout
          print("SURVIVING setsid sleep processes after the terminal call returned:", repr(ps))
          time.sleep(1)
          ps = subprocess.run(["pgrep", "-af", "sleep 300"], capture_output=True, text=True).stdout
          print("SURVIVING setsid sleep processes:", repr(ps))
          out2 = tools._bash_exec("id; ls -la /dev | head -20; cat /etc/passwd; ls ~; env | sort | head -30", session_id="pr10285-escape", timeout=60)
          print("TERMINAL:", out2[-2500:])
          PY
