name: "staging-7530 ubuntu-latest"
on:
  push:
    branches: ["pr-7530-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/llama_cpp.py'
      - 'studio/backend/core/inference/llama_server_args.py'
      - 'studio/backend/models/inference.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/tests/test_chat_load_during_training.py'
      - 'studio/backend/tests/test_gpu_memory_mode.py'
      - 'studio/backend/tests/test_kv_cache_estimation.py'
      - 'studio/backend/tests/test_llama_cpp_mmproj_fallback.py'
      - 'studio/backend/tests/test_llama_cpp_mtp_detection.py'
      - 'studio/backend/tests/test_llama_cpp_props_readback.py'
      - 'studio/backend/tests/test_llama_cpp_slot_resume.py'
      - 'studio/backend/tests/test_llama_server_args.py'
      - 'studio/backend/tests/test_mtp_vram_budget.py'
      - 'studio/backend/tests/test_slot_offload_fit.py'
      - 'studio/backend/tests/test_tensor_parallel.py'
      - 'studio/backend/tests/test_tp_vision_regression.py'
      - 'studio/frontend/src/features/chat/api/chat-adapter.ts'
      - 'studio/frontend/src/features/chat/api/chat-api.ts'
      - 'studio/frontend/src/features/chat/hooks/use-chat-model-runtime.ts'
      - 'studio/frontend/src/features/chat/shared-composer.tsx'
      - '.github/workflows/staging-7530-ubuntu-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_chat_load_during_training.py studio/backend/tests/test_gpu_memory_mode.py studio/backend/tests/test_kv_cache_estimation.py studio/backend/tests/test_llama_cpp_mmproj_fallback.py studio/backend/tests/test_llama_cpp_mtp_detection.py studio/backend/tests/test_llama_cpp_props_readback.py studio/backend/tests/test_llama_cpp_slot_resume.py studio/backend/tests/test_llama_server_args.py studio/backend/tests/test_mtp_vram_budget.py studio/backend/tests/test_slot_offload_fit.py studio/backend/tests/test_tensor_parallel.py studio/backend/tests/test_tp_vision_regression.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
