name: "PR-9187 macos-15"

# Throwaway cross-OS validation for unslothai/unsloth#9187 (durable Studio chat runs).
# Backend CI upstream is Linux-only, so Windows and macOS answers about SQLite file
# locking, asyncio event loop policy and shutdown signals have to come from here.

on:
  push:
    branches: [pr9187-cross-os]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: "chat-run simulation (macos-15)"
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      UNSLOTH_ALLOW_CPU: '1'
      UNSLOTH_IS_PRESENT: '1'
      UNSLOTH_DIFFUSION_ATTENTION_INSTALL: '0'
      UNSLOTH_STUDIO_DISABLE_DEVICE_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Report the SQLite the runner actually links
        run: |
          python -c "import sqlite3, sys; print('python', sys.version); print('sqlite', sqlite3.sqlite_version)"
          python -c "import sqlite3; v=tuple(int(p) for p in sqlite3.sqlite_version.split('.')); assert v >= (3,35,0), 'Studio already needs RETURNING (3.35); this runner has ' + sqlite3.sqlite_version"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install python-multipart aiofiles sqlalchemy cryptography psutil \
            pyyaml jinja2 mammoth unpdf requests 'numpy<3' \
            pytest pytest-asyncio pytest-timeout httpx
          pip install --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple 'torch>=2.4,<2.11'
          pip install 'transformers>=4.51,<5.5'
          pip install "$(grep -m1 -E '^peft==' studio/backend/requirements/extras-no-deps.txt)"

      - name: The suites this PR ships
        working-directory: studio/backend
        run: |
          python -m pytest tests/test_chat_generation_runs.py \
            tests/test_chat_generation_supervisor.py \
            tests/test_orchestrator_load_cancel_event.py \
            tests/test_active_generations.py \
            -q --tb=short --timeout=600

      - name: The simulation catalogue
        working-directory: studio/backend
        env:
          PR9187_BACKEND_ROOT: ${{ github.workspace }}/studio/backend
        run: |
          python -m pytest ../../tests/pr9187_sim -q --tb=short --timeout=900

  frontend:
    name: "frontend unit tests (macos-15)"
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: studio/frontend
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test
