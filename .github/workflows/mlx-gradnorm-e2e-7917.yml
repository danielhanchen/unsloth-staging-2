# Disposable staging gate for unslothai/unsloth#7917.
#
# The repo's own mlx-ci.yml already runs on macos-14, but its end-to-end step
# (tests/studio/run_real_mlx_smoke.py) pins max_grad_norm=0.0 and drives the
# PUBLIC MLX API, so it never touches the code this PR changes. This job drives
# Studio's own _run_mlx_training on real Metal, twice, and asserts the
# before/after that the PR claims: gradient norms appear with the new unset
# default and do not appear with an explicit 0.0.
#
# The filename deliberately avoids the `staging-7917-*` prefix that
# staging_ci.py's cross-platform generator sweeps and deletes on each re-run.
#
# Install ladder mirrors .github/workflows/mlx-ci.yml: unsloth_zoo excludes
# torch on darwin+arm64 while studio/backend/utils/hardware imports it eagerly,
# and the zoo's MLX modules only exist on git main.

name: "MLX grad-norm e2e (7917)"

on:
  push:
    branches: ["pr-7917-xplat-ci"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gradnorm:
    name: gradnorm
    runs-on: macos-14
    timeout-minutes: 45
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      PYTHONPATH: ${{ github.workspace }}/studio/backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install pytest pytest-asyncio pytest-timeout python-multipart numpy
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 'torch==2.10.0'
          for attempt in 1 2 3; do
            if pip install "unsloth_zoo @ git+https://github.com/unslothai/unsloth-zoo"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::pip install unsloth_zoo failed after 3 attempts"
              exit 1
            fi
            sleep $((5 * attempt))
          done
          pip install -e . --no-deps

      - name: Report the resolved MLX stack
        run: |
          python -c "
          import platform, mlx.core as mx, mlx_lm, unsloth_zoo
          print('host       :', platform.system(), platform.machine())
          print('mlx        :', mx.__version__)
          print('mlx-lm     :', mlx_lm.__version__)
          print('unsloth_zoo:', unsloth_zoo.__version__)
          "

      - name: Resolver + clip-precedence checks (real Metal)
        run: python tests/staging/mlx_grad_norm_e2e.py checks

      - name: Train with max_grad_norm unset (the PR's new default)
        run: |
          python tests/staging/mlx_grad_norm_e2e.py train \
            --mode default --out default.json --workdir "$PWD/mlx_e2e_workdir"

      - name: Train with max_grad_norm = 0.0 (today's behavior)
        run: |
          python tests/staging/mlx_grad_norm_e2e.py train \
            --mode zero --out zero.json --workdir "$PWD/mlx_e2e_workdir"

      - name: Compare
        run: python tests/staging/mlx_grad_norm_e2e.py compare default.json zero.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlx-gradnorm-7917
          path: |
            default.json
            zero.json
          if-no-files-found: warn
