name: "staging-7455 windows-latest"
on:
  push:
    branches: ["pr-7455-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/inference.py'
      - 'studio/backend/core/inference/llama_admission.py'
      - 'studio/backend/core/inference/llama_cpp.py'
      - 'studio/backend/core/inference/mlx_inference.py'
      - 'studio/backend/core/inference/orchestrator.py'
      - 'studio/backend/core/inference/safetensors_agentic.py'
      - 'studio/backend/core/inference/tool_loop_controller.py'
      - 'studio/backend/core/inference/tools.py'
      - 'studio/backend/models/inference.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/run.py'
      - 'studio/backend/state/active_generations.py'
      - 'studio/backend/tests/test_active_generations.py'
      - 'studio/backend/tests/test_anthropic_admission.py'
      - 'studio/backend/tests/test_anthropic_passthrough_respawn.py'
      - 'studio/backend/tests/test_inference_dispatcher_resilience.py'
      - 'studio/backend/tests/test_llama_admission.py'
      - 'studio/backend/tests/test_llama_cpp_tool_loop.py'
      - 'studio/backend/tests/test_openai_auto_switch.py'
      - 'studio/backend/tests/test_openai_tool_passthrough.py'
      - '.github/workflows/staging-7455-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests -q || true
