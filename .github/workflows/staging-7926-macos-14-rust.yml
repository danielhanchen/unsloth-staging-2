name: "staging-7926 macos-14 rust"
on:
  push:
    branches: ["pr-7926-xplat-ci"]
    paths:
      - 'studio/**'
      - '.github/workflows/staging-7926-macos-14-rust.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  rust:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Linux native deps for Tauri / WebKit2GTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: studio/src-tauri -> target
      - name: Frontend build (tauri-build needs the dist)
        working-directory: studio/frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build
          test -f dist/index.html
      - name: Rust unit tests (studio/src-tauri)
        working-directory: studio/src-tauri
        run: cargo test --no-fail-fast
