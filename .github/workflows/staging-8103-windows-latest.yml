name: "staging-8103 windows-latest"
on:
  push:
    branches: ["pr-8103-xplat-ci"]
    paths:
      - 'studio/backend/core/export/worker.py'
      - 'studio/backend/core/inference/audio_codecs.py'
      - 'studio/backend/core/inference/worker.py'
      - 'studio/backend/core/training/trainer.py'
      - 'studio/backend/core/training/training.py'
      - 'studio/backend/core/training/worker.py'
      - 'studio/backend/hub/services/datasets/local_options.py'
      - 'studio/backend/hub/tests/test_dataset_local_options.py'
      - 'studio/backend/mcp_server.py'
      - 'studio/backend/models/training.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/routes/models.py'
      - 'studio/backend/routes/training.py'
      - 'studio/backend/tests/test_completion_masking.py'
      - 'studio/backend/tests/test_consent_gate.py'
      - 'studio/backend/tests/test_gpu_selection.py'
      - 'studio/backend/tests/test_local_options_match_start_validation.py'
      - 'studio/backend/tests/test_mcp_server.py'
      - 'studio/backend/tests/test_offline_gguf_cache_fallback.py'
      - 'studio/backend/tests/test_ssm_runtime.py'
      - '.github/workflows/staging-8103-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/hub/tests/test_dataset_local_options.py studio/backend/tests/test_completion_masking.py studio/backend/tests/test_consent_gate.py studio/backend/tests/test_gpu_selection.py studio/backend/tests/test_local_options_match_start_validation.py studio/backend/tests/test_mcp_server.py studio/backend/tests/test_offline_gguf_cache_fallback.py studio/backend/tests/test_ssm_runtime.py studio/backend/tests/test_third_party_source.py studio/backend/tests/test_training_cached_start.py studio/backend/tests/test_training_preflight.py studio/backend/tests/test_training_start_idempotency.py studio/backend/tests/test_training_status_terminal.py studio/backend/tests/test_training_stop_watchdog.py studio/backend/tests/test_training_streaming.py studio/backend/tests/test_training_worker_flash_attn.py studio/backend/tests/test_validate_model_error.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
