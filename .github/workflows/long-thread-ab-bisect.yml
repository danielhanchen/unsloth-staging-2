name: long-thread A/B wheel sweep, 17588
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ab:
    name: ab ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: aa, base: b2784e3e6db19b3d2df3a26f5d166589943ca75c, head: b2784e3e6db19b3d2df3a26f5d166589943ca75c}
          - {label: main_17597, base: b2784e3e6db19b3d2df3a26f5d166589943ca75c, head: 61afe2599a19ad12d56b2820737db5daca8c1417}
          - {label: base_17588, base: e91e7be4d0880b557ba436572c9b742353168013, head: fb4a3fdd674f7666f1e9756656516cd2a90f1d34}
          - {label: p17597_combo, base: 61afe2599a19ad12d56b2820737db5daca8c1417, head: 80ad66a45213a882c9bd98fa461acf3280881bde}
          - {label: pre_pr, base: 4589af4fa24eb15bcde71e018d4ee0bec735dd1e, head: 60855079b1d6bdec3ea98d8c6cc76b786edfbea6}
    env:
      BASE: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch the fix branches
        run: |
          git fetch --no-tags origin 'refs/heads/verify-1759*:refs/remotes/origin/verify-1759*' 'refs/heads/verify-17504-*:refs/remotes/origin/verify-17504-*'
          git fetch --no-tags https://github.com/unslothai/unsloth refs/pull/17588/head refs/pull/17597/head
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      - name: npm ci
        working-directory: studio/frontend
        run: |
          npm install -g npm@^11 --no-fund --no-audit
          npm ci --strict-allow-scripts --no-fund --no-audit
      - name: Chromium
        run: |
          python3 -m pip install 'playwright>=1.45,<2'
          python3 -m playwright install --with-deps chromium
      - name: A/B base vs ${{ matrix.label }}, wheel sweep
        run: python3 -u tests/studio/long_thread_ab.py --base-ref "$BASE" --head-ref "${{ matrix.head }}" --reps 5 --areas wheel_sweep --gated wheel_sweep --json "out/sweep_${{ matrix.label }}.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ab-${{ matrix.label }}
          path: out/
          if-no-files-found: ignore
