name: long-thread A/B 17588 on main
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ab:
    name: ab ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: aa, base: 6c15abd99119f26e44ecb1efc18a142a5d640d7f, head: 6c15abd99119f26e44ecb1efc18a142a5d640d7f}
          - {label: main_17588, base: 6c15abd99119f26e44ecb1efc18a142a5d640d7f, head: e970f0de026578f27854c174df6a800bdebb0325}
          - {label: main_17588_b, base: 6c15abd99119f26e44ecb1efc18a142a5d640d7f, head: e970f0de026578f27854c174df6a800bdebb0325}
    env:
      BASE: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch the fix branches
        run: |
          git fetch --no-tags origin 'refs/heads/verify-1759*:refs/remotes/origin/verify-1759*' 'refs/heads/verify-17504-*:refs/remotes/origin/verify-17504-*'
          git fetch --no-tags https://github.com/unslothai/unsloth refs/pull/17588/head main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      - name: npm ci
        working-directory: studio/frontend
        run: |
          npm install -g npm@^11 --no-fund --no-audit
          npm ci --strict-allow-scripts --no-fund --no-audit
      - name: Chromium
        run: |
          python3 -m pip install 'playwright>=1.45,<2'
          python3 -m playwright install --with-deps chromium
      - name: A/B base vs ${{ matrix.label }}, the CI gate's three runs
        run: |
          set -e
          python3 -u tests/studio/long_thread_ab.py --base-ref "$BASE" --head-ref "${{ matrix.head }}" --reps 5 --areas stream,type,thread_scroll --json "out/short_${{ matrix.label }}.json"
          python3 -u tests/studio/long_thread_ab.py --base-ref "$BASE" --head-ref "${{ matrix.head }}" --reps 5 --areas stream_scroll --tall 6 --stream-ms 10 --json "out/scroll_${{ matrix.label }}.json"
          python3 -u tests/studio/long_thread_ab.py --base-ref "$BASE" --head-ref "${{ matrix.head }}" --reps 5 --areas wheel_sweep --json "out/sweep_${{ matrix.label }}.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ab-${{ matrix.label }}
          path: out/
          if-no-files-found: ignore
