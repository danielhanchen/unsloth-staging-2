name: long-thread A/B 17504 fixes
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ab:
    name: ab ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: aa, head: 4589af4fa24eb15bcde71e018d4ee0bec735dd1e}
          - {label: pr, head: 60855079b1d6bdec3ea98d8c6cc76b786edfbea6}
          - {label: fix1, head: f51e79d5ec3927e08d25df3b2c52666eba5c355f}
          - {label: fix2, head: d35cfd27f7825903047b0ba7e5918052dd532b87}
          - {label: fix3, head: 1dabae44d0158e2166355df237525524df36bf4e}
          - {label: fix4, head: e0b0a36d4582318c40f64036987e94eec6dd4c22}
    env:
      BASE: 4589af4fa24eb15bcde71e018d4ee0bec735dd1e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch the fix branches
        run: git fetch --no-tags origin 'refs/heads/verify-17504-*:refs/remotes/origin/verify-17504-*'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      - name: npm ci
        working-directory: studio/frontend
        run: |
          npm install -g npm@^11 --no-fund --no-audit
          npm ci --strict-allow-scripts --no-fund --no-audit
      - name: Chromium
        run: |
          python3 -m pip install 'playwright>=1.45,<2'
          python3 -m playwright install --with-deps chromium
      - name: A/B base vs ${{ matrix.label }}, the gate's reply
        run: python3 -u tests/studio/long_thread_ab.py --base-ref "$BASE" --head-ref "${{ matrix.head }}" --reps 5 --json "out/short_${{ matrix.label }}.json"
      - name: A/B base vs ${{ matrix.label }}, a 20 kchar reply
        if: always()
        run: python3 -u tests/studio/long_thread_ab.py --base-ref "$BASE" --head-ref "${{ matrix.head }}" --reps 5 --areas stream --gated stream --stream-chars 20000 --json "out/long_${{ matrix.label }}.json"
      - name: A/B base vs ${{ matrix.label }}, the reader scrolls away mid-stream
        if: always()
        run: python3 -u tests/studio/long_thread_ab.py --base-ref "$BASE" --head-ref "${{ matrix.head }}" --reps 5 --areas stream_scroll --gated stream_scroll --tall 4 --json "out/scroll_${{ matrix.label }}.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ab-${{ matrix.label }}
          path: out/
          if-no-files-found: ignore
