name: "staging-7330 ubuntu-latest"
on:
  push:
    branches: ["pr-7330-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/external_agentic.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/tests/test_external_local_tool_loop.py'
      - 'studio/backend/tests/test_openai_tool_passthrough.py'
      - 'studio/frontend/src/features/chat/api/chat-adapter.ts'
      - 'studio/frontend/src/features/chat/chat-page.tsx'
      - 'studio/frontend/src/features/chat/provider-capabilities.ts'
      - '.github/workflows/staging-7330-ubuntu-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests -q || true
