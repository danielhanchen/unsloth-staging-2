name: p2-fg-fails-wait-not-cancelled
on:
  push:
    branches:
    - ci-par-probe
jobs:
  fg-fails-wait-not-cancelled:
    runs-on: ubuntu-24.04
    steps:
    - name: Harden runner (audit)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        egress-policy: audit
    - name: bg
      id: bg
      background: true
      run: sleep 20; echo "BG-DONE"
    - name: fg-fails
      if: ${{ !cancelled() }}
      run: sleep 2; exit 1
    - name: fg-after (if !cancelled, should RUN)
      if: ${{ !cancelled() }}
      run: echo "FG-AFTER-RAN"
    - name: fg-default (should be skipped)
      run: echo SHOULD-NOT-RUN
    - name: advisory
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: exit 5
    - wait: bg
      if: ${{ !cancelled() }}
    - name: summary
      if: always()
      run: echo "bg=${{ steps.bg.outcome }}"
