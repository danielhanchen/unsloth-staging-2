name: "issue-13604 windows desktop composer"
on:
  push:
    branches: ["issue-13604-win-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: mtp-905-100, first: '', tag: v0.1.905-beta, scale: 100}
          - {name: mtp-906-100, first: '', tag: v0.1.906-beta, scale: 100}
          - {name: mtp-906-125, first: '', tag: v0.1.906-beta, scale: 125}
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Driver deps
        shell: pwsh
        run: python -m pip install pywinauto pillow
      - name: Screen 1920x1080 at ${{ matrix.scale }}%
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "Set-DisplayResolution: $($_.Exception.Message)" }
          python ci/set_scale.py ${{ matrix.scale }}
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Select-Object pv | Format-List
      - name: Download installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          for t in ${{ matrix.first }} ${{ matrix.tag }}; do
            mkdir -p "dl/$t"
            gh release download "$t" --repo unslothai/unsloth --pattern 'Unsloth-Desktop-Windows.exe' --dir "dl/$t"
          done
          find dl -type f
      - name: Install + first session on ${{ matrix.first }}
        if: matrix.first != ''
        shell: pwsh
        run: |
          ./ci/install_release.ps1 -Tag '${{ matrix.first }}'
          python -u ci/i13604_win.py --app "$env:APP_EXE" --out out --label "${{ matrix.name }}-seed-${{ matrix.first }}" --seed-only
      - name: Install ${{ matrix.tag }} (over the old one when upgrading)
        shell: pwsh
        run: ./ci/install_release.ps1 -Tag '${{ matrix.tag }}'
      - name: Drive ${{ matrix.tag }}
        shell: pwsh
        run: python -u ci/i13604_win.py --app "$env:APP_EXE" --out out --label "${{ matrix.name }}" --model unsloth/Qwen3.5-2B-MTP-GGUF --variant IQ4_XS
      - name: Collect app logs
        if: always()
        shell: pwsh
        run: |
          Copy-Item "$env:USERPROFILE\.unsloth\studio\tauri.log" out/ -ErrorAction SilentlyContinue
          Get-ChildItem "$env:APPDATA","$env:LOCALAPPDATA" -Directory -Filter '*unsloth*' -ErrorAction SilentlyContinue | ForEach-Object {
            Get-ChildItem $_.FullName -Recurse -Include *.json,*.dat -ErrorAction SilentlyContinue | Where-Object { $_.Length -lt 200kb } |
              Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300 | Write-Host }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i13604-${{ matrix.name }}
          path: out/
