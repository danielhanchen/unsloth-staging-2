name: "8519-cpu-freq macos-14"

on:
  push:
    branches: [issue8519-cpu-freq-cross-os]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpu-freq:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }

      - name: Install light deps
        run: python -m pip install --upgrade pip psutil structlog pytest packaging

      - name: Studio backend CPU frequency tests
        working-directory: studio/backend
        run: python -m pytest tests/test_apple_cpu_frequency.py -q --tb=short

      - name: Report what this host actually sees
        # Loads unsloth/import_fixes.py by path so no torch / transformers is
        # needed: the module only imports the standard library and packaging.
        run: python .github/scripts/report_cpu_freq.py
