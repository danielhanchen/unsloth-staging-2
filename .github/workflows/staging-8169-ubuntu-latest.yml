name: "staging-8169 ubuntu-latest"
on:
  push:
    branches: ["pr-8169-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/tool_loop_controller.py'
      - 'studio/backend/core/inference/tools.py'
      - 'studio/backend/routes/chat_history.py'
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/tests/test_sandbox_files_and_storage_roots.py'
      - 'studio/backend/tests/test_tool_sandbox_per_thread.py'
      - 'studio/backend/utils/cache_cleanup.py'
      - 'studio/backend/utils/paths/storage_roots.py'
      - 'studio/frontend/src/components/assistant-ui/sandbox-files-view.tsx'
      - 'studio/frontend/src/components/assistant-ui/sandbox-files.ts'
      - 'studio/frontend/src/components/assistant-ui/tool-ui-python.tsx'
      - 'studio/frontend/src/components/assistant-ui/tool-ui-terminal.tsx'
      - 'studio/frontend/src/features/chat/api/chat-adapter.ts'
      - '.github/workflows/staging-8169-ubuntu-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_sandbox_files_and_storage_roots.py studio/backend/tests/test_tool_sandbox_per_thread.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
