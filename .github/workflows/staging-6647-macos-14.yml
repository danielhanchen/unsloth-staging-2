name: "staging-6647 macos-14"
on:
  push:
    branches: ["pr-6647-xplat-ci"]
    paths:
      - 'studio/backend/hub/schemas/inventory.py'
      - 'studio/backend/hub/services/models/cache_inventory.py'
      - 'studio/backend/main.py'
      - 'studio/backend/picker/__init__.py'
      - 'studio/backend/picker/routes/__init__.py'
      - 'studio/backend/picker/routes/templates.py'
      - 'studio/backend/picker/schemas.py'
      - 'studio/backend/picker/service.py'
      - 'studio/backend/tests/test_model_update_robustness.py'
      - 'studio/backend/tests/test_picker_service.py'
      - 'studio/backend/utils/models/gguf_metadata.py'
      - 'studio/frontend/src/app/routes/__root.tsx'
      - 'studio/frontend/src/components/assistant-ui/model-selector/remembered-load-settings.ts'
      - 'studio/frontend/src/features/chat/api/chat-adapter.ts'
      - 'studio/frontend/src/features/chat/chat-page.tsx'
      - 'studio/frontend/src/features/chat/chat-settings-sheet.tsx'
      - 'studio/frontend/src/features/chat/hooks/use-chat-model-runtime.ts'
      - 'studio/frontend/src/features/chat/hooks/use-staged-model-preparation.ts'
      - 'studio/frontend/src/features/chat/index.ts'
      - 'studio/frontend/src/features/chat/lib/apply-inference-status-to-store.ts'
      - '.github/workflows/staging-6647-macos-14.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests -q || true
