name: PR 8382 cross-OS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-test:
    name: pytest ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Show line endings as checked out
        shell: python
        run: |
          from pathlib import Path
          p = Path("studio/frontend/src/features/chat/api/chat-adapter.ts")
          raw = p.read_bytes()
          print("CRLF pairs:", raw.count(b"\r\n"), "bare LF:", raw.count(b"\n") - raw.count(b"\r\n"))
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Run the thread-read consolidation test
        run: python -m pytest tests/studio/test_chat_thread_read_consolidation.py -q

  node-test:
    name: node ${{ matrix.os }} node${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run the shared-read unit tests
        working-directory: studio/frontend
        run: node --experimental-strip-types --test tests/retryable-shared-read.test.ts
