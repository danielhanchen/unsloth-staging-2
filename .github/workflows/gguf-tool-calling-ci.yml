#
# GGUF server-side tool-calling smoke on Apple Silicon (macos-14, M1).
#
# The GGUF control for the MLX tool-calling matrix (mlx-tool-calling-ci.yml).
# Loads ~4-bit unsloth/* GGUFs through Studio's llama.cpp backend and drives the
# SAME server-side tool axes (code exec, file edit, web search, MCP, function
# calling, render_html, thinking) with identical prompts/seed/temperature, so a
# per-axis GGUF-vs-MLX diff isolates whether an MLX "WARN" is model/quant drift
# (also WARNs on GGUF) or an MLX-backend-specific tool-calling issue (PASSes on
# GGUF). GGUF does not need the MLX venv overlay -- a plain install.sh --local
# --no-torch boot + assert-llama-loads suffices.
#
# Model pairing with the MLX set:
#   * Llama-3.2-3B-Instruct  -- IDENTICAL checkpoint to mlx-community/
#     Llama-3.2-3B-Instruct-4bit (exact apples-to-apples).
#   * Qwen2.5-Coder-3B/1.5B-Instruct -- unsloth publishes no plain
#     Qwen2.5-3B/1.5B-Instruct GGUF, so these are the closest same-architecture
#     same-size unsloth GGUFs (code-tuned Qwen2.5) standing in for the MLX
#     mlx-community/Qwen2.5-3B/1.5B-Instruct-4bit rows.

name: "GGUF Tool Calling - macOS"

on:
  push:
    branches: [gguf-tool-calling-compare]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gguf-tools:
    name: ${{ matrix.label }}
    runs-on: macos-14
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exact MLX match: mlx-community/Llama-3.2-3B-Instruct-4bit
          - label: Llama-3.2-3B-Instruct
            repo: unsloth/Llama-3.2-3B-Instruct-GGUF
            file: Llama-3.2-3B-Instruct-UD-Q4_K_XL.gguf
          # Qwen2.5 3B family proxy for mlx-community/Qwen2.5-3B-Instruct-4bit
          - label: Qwen2.5-Coder-3B-Instruct
            repo: unsloth/Qwen2.5-Coder-3B-Instruct-GGUF
            file: Qwen2.5-Coder-3B-Instruct-Q4_K_M.gguf
          # Qwen2.5 1.5B family proxy for mlx-community/Qwen2.5-1.5B-Instruct-4bit
          - label: Qwen2.5-Coder-1.5B-Instruct
            repo: unsloth/Qwen2.5-Coder-1.5B-Instruct-GGUF
            file: Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf
    env:
      STUDIO_PORT: '18896'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      # Node 22 provides npx for the stdio filesystem MCP server.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Restore GGUF model file
        id: cache-gguf
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        continue-on-error: true
        with:
          path: gguf-cache
          key: ${{ runner.os }}-gguf-${{ matrix.repo }}-${{ matrix.file }}-v1

      - name: Download GGUF if cache miss
        id: download-gguf
        if: steps.cache-gguf.outputs.cache-hit != 'true' || steps.cache-gguf.outcome != 'success'
        env:
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p gguf-cache
          bash .github/scripts/hf-download-with-retry.sh "${{ matrix.repo }}" "${{ matrix.file }}" gguf-cache

      - name: Save GGUF model file
        if: always() && steps.download-gguf.outcome != 'skipped' && hashFiles('gguf-cache/**/*.gguf') != ''
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: gguf-cache
          key: ${{ runner.os }}-gguf-${{ matrix.repo }}-${{ matrix.file }}-v1

      - name: Install Studio (--local, --no-torch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p logs
          set -o pipefail
          bash install.sh --local --no-torch 2>&1 | tee logs/install.log

      - name: Assert llama.cpp loads on this macOS
        run: bash .github/scripts/assert-llama-loads.sh

      - name: Reset auth + boot Studio (API-only, stdio MCP allowed)
        # API-only mode leaves tool_policy=None so each request's enable_tools
        # field is honoured (standard function-calling test needs this).
        # ALLOW_STDIO_MCP enables the filesystem MCP server the tool test
        # registers.
        run: |
          unsloth studio reset-password
          mkdir -p logs
          UNSLOTH_STUDIO_ALLOW_STDIO_MCP=1 UNSLOTH_API_ONLY=1 \
            unsloth studio -H 127.0.0.1 -p "$STUDIO_PORT" > logs/studio.log 2>&1 &
          echo "STUDIO_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for /api/health, log in, change password
        run: |
          for i in $(seq 1 180); do
            if curl -fs "http://127.0.0.1:${STUDIO_PORT}/api/health" > /tmp/health.json; then
              jq -e '.status == "healthy"' /tmp/health.json && break
            fi
            sleep 1
          done
          jq -e '.status == "healthy"' /tmp/health.json
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CIGguf-$(python -c 'import secrets; print(secrets.token_urlsafe(12))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          OLD_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}" | jq -r .access_token)
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/change-password" \
            -H "Authorization: Bearer $OLD_TOKEN" -H 'content-type: application/json' \
            -d "{\"current_password\":\"$OLD\",\"new_password\":\"$NEW\"}" > /dev/null
          TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$NEW\"}" | jq -r .access_token)
          echo "API_KEY=$TOKEN" >> "$GITHUB_ENV"

      - name: GGUF tool-calling smoke
        run: |
          GGUF_PATH="$GITHUB_WORKSPACE/gguf-cache/${{ matrix.file }}"
          ls -lh "$GGUF_PATH"
          python tests/studio/run_gguf_tool_calling_smoke.py \
            --gguf-path "$GGUF_PATH" \
            --label "${{ matrix.label }}" \
            --port "$STUDIO_PORT" \
            --workdir "$HOME/mcp_fs" \
            --require-load

      - name: Stop Studio
        if: always()
        run: |
          kill "${STUDIO_PID}" 2>/dev/null || true
          sleep 2

      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gguf-tools-${{ strategy.job-index }}
          path: |
            logs/studio.log
            logs/install.log
          retention-days: 7
