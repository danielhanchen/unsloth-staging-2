name: "staging-12607 macos-15"
on:
  push:
    branches: ["pr-12607-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: python -m pip install git+https://github.com/unslothai/unsloth-zoo mlx mlx-lm mlx-vlm gguf
      - run: python -c "import importlib.util as u, mlx.core as mx, mlx_lm; assert u.find_spec('unsloth_zoo'), 'unsloth_zoo missing'; print('mlx', mx.__version__, mx.default_device())"
      - run: rc=0; ran=0; rm -f pytest_out.txt; r=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_account_media_isolation.py studio/backend/tests/test_audio_cpp_clone_requests.py studio/backend/tests/test_audio_cpp_models.py studio/backend/tests/test_audio_cpp_server_http.py studio/backend/tests/test_audio_gallery.py studio/backend/tests/test_audio_inputs.py studio/backend/tests/test_audio_run_route.py studio/backend/tests/test_audio_runtime_errors.py studio/backend/tests/test_audio_voices.py studio/backend/tests/test_audio_workflows.py studio/backend/tests/test_gguf_load_cache_reuse.py studio/backend/tests/test_pr7699_worker_audio_mirror.py studio/backend/tests/test_stt_audiocpp_details.py studio/backend/tests/test_stt_capabilities.py studio/backend/tests/test_stt_details.py studio/backend/tests/test_transcribe_source_route.py studio/backend/tests/test_transcript_gallery.py studio/backend/tests/test_transcript_stream.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' >> pytest_out.txt 2>&1 || r=$?; if [ "$r" != "5" ]; then ran=1; if [ "$r" -gt "$rc" ]; then rc=$r; fi; fi; if [ "$ran" = "0" ]; then rc=5; fi; cat pytest_out.txt; tot=$(grep -cE "^(FAILED|ERROR) " pytest_out.txt) || tot=0; dep=$(grep -cE "^(FAILED|ERROR) .* ((ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers).|ImportError. Unsloth. (torch|unsloth_zoo|transformers) not found. Please install .*)$" pytest_out.txt) || dep=0; bare=$(awk '/^_+ ERROR collecting [^ ]+ _+$/ {cur=$4; next} /^(=|_)+ / {cur=""} cur != "" && /((ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers).|ImportError. Unsloth. (torch|unsloth_zoo|transformers) not found)/ {ok[cur]=1} /^ERROR [^ ]+$/ && ($2 in ok) {n++} END {print n+0}' pytest_out.txt) || bare=0; dep=$((dep + bare)); if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers).|Unsloth. (torch|unsloth_zoo|transformers) not found" pytest_out.txt && { [ "$tot" = "0" ] || [ "$tot" = "$dep" ]; }; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" = "1" ] && [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; exit "$rc"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - name: Install frontend deps
        working-directory: studio/frontend
        run: npm ci --no-fund --no-audit
      - name: Node tests
        working-directory: studio/frontend
        run: node --experimental-strip-types --test tests/audio-clone-panels.test.ts tests/audio-clone-store.test.ts tests/audio-cpp-catalog.test.ts tests/audio-generation-stop.test.ts tests/audio-handoff-intent.test.ts tests/audio-mode-task-filter.test.ts tests/audio-model-eject.test.ts tests/audio-page-policy.test.ts tests/audio-picker-filter.test.ts tests/audio-picker-policy.test.ts tests/audio-run-api.test.ts tests/audio-sidebar-workflows.test.ts tests/audio-source-input.test.ts tests/audio-stt-download-fallback.test.ts tests/audio-tool-panels.test.ts tests/audio-transcribe-rail.test.ts tests/audio-transcribe-store.test.ts tests/audio-transcript-lifecycle.test.ts tests/audio-transcript-output.test.ts tests/audio-tts-download-manager.test.ts tests/audio-waveform-peaks.test.ts tests/audio-workflows.test.ts tests/audio-workspace-split.test.ts tests/audio-workspace-store.test.ts tests/chat-speech-model-not-adopted.test.ts tests/media-plan-failure-fallback.test.ts tests/model-picker-partial-downloads.test.ts tests/offload-warning-load-paths.test.ts tests/pcm-recorder.test.ts tests/read-aloud-tts-model-row.test.ts tests/reload-snapshot.test.ts tests/transcribe-capabilities.test.ts tests/transcript-export.test.ts tests/transcript-model.test.ts
