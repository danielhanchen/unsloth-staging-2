name: "staging-7670 macos-14"
on:
  push:
    branches: ["pr-7670-xplat-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_gpu_arch_gate_7624.py studio/backend/tests/test_gpu_arch_gate_consumers_7624.py studio/backend/tests/test_gpu_arch_gate_os_matrix_7624.py studio/backend/tests/test_gpu_init_crash_message.py studio/backend/tests/test_gpu_memory_mode.py studio/backend/tests/test_llama_cpp_placement.py studio/backend/tests/test_mtp_drafter_companion.py studio/backend/tests/test_rag_embed_llama_server.py tests/studio/install/test_install_llama_prebuilt_logic.py tests/studio/install/test_selection_logic.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
