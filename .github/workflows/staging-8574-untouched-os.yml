name: "staging-8574 untouched OSes"
# Platforms the PR does NOT target, run to prove it did not break them:
# older and newer Linux, Intel macOS, and Windows on ARM. The darwin branch
# this PR adds must stay invisible on every one of them except the Macs, and
# on the Intel Mac it must behave exactly as it does on Apple Silicon.
on:
  push:
    branches: ["pr-8574-xplat-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-13, macos-26, windows-11-arm]
        include:
          - os: macos-13
            note: Intel Mac
          - os: windows-11-arm
            note: Windows on ARM
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - name: Changed-area tests
        run: |
          set -uo pipefail
          rc=0
          PYTHONPATH=studio/backend python -m pytest \
            studio/backend/tests/test_llama_cpp_darwin_loader_env.py \
            studio/backend/tests/test_llama_cpp_start_failure_classification.py \
            studio/backend/tests/test_rag_embed_llama_server.py \
            studio/backend/tests/test_llama_cpp_mtp_detection.py \
            studio/backend/tests/test_gpu_init_crash_message.py \
            -q --tb=short > out.txt 2>&1 || rc=$?
          cat out.txt
          exit "$rc"
      - name: The loader variable matches this host, and the env is stable
        run: |
          set -euo pipefail
          PYTHONPATH=studio/backend python - <<'PY'
          import os, sys, tempfile, pathlib
          from core.inference.llama_cpp import LlamaCppBackend, _loader_path_var

          expected = {"darwin": "DYLD_LIBRARY_PATH", "win32": "PATH"}.get(
              sys.platform, "LD_LIBRARY_PATH"
          )
          got = _loader_path_var()
          print(f"platform={sys.platform} loader_var={got}")
          assert got == expected, f"expected {expected}, got {got}"

          d = pathlib.Path(tempfile.mkdtemp()) / "build" / "bin"
          d.mkdir(parents = True)
          (d / "llama-server").write_bytes(b"\x00\x00\x00\x00")
          env = LlamaCppBackend._llama_server_env_for_binary(str(d / "llama-server"))
          assert env[expected], f"{expected} is empty"
          assert str(d) in env[expected].split(os.pathsep), env[expected]
          if sys.platform != "darwin":
              assert "DYLD_LIBRARY_PATH" not in env, "macOS variable leaked here"
          # Idempotent: three builds, one answer.
          assert env == LlamaCppBackend._llama_server_env_for_binary(str(d / "llama-server"))
          assert env == LlamaCppBackend._llama_server_env_for_binary(str(d / "llama-server"))
          print("loader variable and child environment are correct and stable")
          PY
