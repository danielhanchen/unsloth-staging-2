name: "staging-7432 windows-latest"
on:
  push:
    branches: ["pr-7432-xplat-ci"]
    paths:
      - 'studio/backend/main.py'
      - 'studio/backend/utils/changelog.py'
      - 'studio/backend/utils/update_status.py'
      - 'studio/frontend/src/app/provider.tsx'
      - 'studio/frontend/src/components/llama-update-banner.tsx'
      - 'studio/frontend/src/components/tauri/update-banner.tsx'
      - 'studio/frontend/src/components/update/release-notes-panel.tsx'
      - 'studio/frontend/src/components/web/update-banner.tsx'
      - 'studio/frontend/src/features/hub/download-manager/download-manager-panel.tsx'
      - 'studio/frontend/src/hooks/use-release-notes.ts'
      - 'studio/frontend/src/hooks/use-tauri-update.ts'
      - 'studio/frontend/src/lib/changelog-links.ts'
      - 'studio/frontend/src/lib/markdown-code-spans.ts'
      - 'studio/frontend/src/lib/markdown-inline-comments.ts'
      - 'studio/frontend/src/lib/markdown-list-columns.ts'
      - 'studio/frontend/src/lib/release-notes-preview.ts'
      - 'studio/src-tauri/src/desktop_update_policy.rs'
      - '.github/workflows/staging-7432-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest tests/studio/test_update_release_notes.py -q --tb=short || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
