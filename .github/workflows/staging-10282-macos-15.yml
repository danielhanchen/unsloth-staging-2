name: "staging-10282 macos-15"
on:
  push:
    branches: ["pr-10282-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest tests/python/test_windows_arm64_requirement_markers.py tests/python/test_windows_arm64_wheelhouse_tags.py tests/python/test_windows_installer_native_type_fallback.py tests/python/test_windows_xformers_installer.py tests/studio/install/test_arm64_cuda_digest_verification.py tests/studio/install/test_cuda_repair.py tests/studio/install/test_diffusers_pin.py tests/studio/install/test_install_manifest_pass_evidence.py tests/studio/install/test_llama_kind_gate_matches_selector.py tests/studio/install/test_rdna1_unsupported_message_8529.py tests/studio/install/test_seed_plugin_pandas_range.py tests/studio/install/test_selection_logic.py tests/studio/install/test_windows_torch_flavor_invariant.py tests/studio/install/test_woa_torch_index_persistence.py tests/studio/install/test_woa_wheelhouse_guard_behaviour.py tests/studio/install/test_woa_wheelhouse_prefers_pypi.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out.txt 2>&1 || rc=$?; cat pytest_out.txt; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers)." pytest_out.txt && ! grep -qE "^(FAILED|ERROR) " pytest_out.txt; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" = "1" ] && ! grep -qE "^ERROR " pytest_out.txt; then tot=$(grep -cE "^FAILED " pytest_out.txt); dep=$(grep -cE "^FAILED .* No module named .(torch|unsloth_zoo|transformers).$" pytest_out.txt); if [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; fi; exit "$rc"
