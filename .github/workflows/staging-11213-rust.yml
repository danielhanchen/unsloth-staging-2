name: "staging-11213 rust windows"
on:
  push:
    branches: ["pr-11213-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # tauri::generate_context! reads frontendDist (../frontend/dist) at COMPILE time, so
      # the bundle has to exist before cargo touches the crate, even for a unit test run.
      - name: Frontend build
        working-directory: studio/frontend
        run: npm ci && npm run build
      - name: Probe the closed-port classification
        working-directory: studio/src-tauri
        run: "cargo test --bin unsloth-studio commands::tests:: -- --nocapture --test-threads=1"
  connect_latency:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: How long does a closed loopback port take to refuse
        shell: bash
        run: |
          cat > probe.py <<'EOF'
          import socket, time, statistics

          def closed_port():
              for c in range(20200, 20400):
                  s = socket.socket()
                  try:
                      s.bind(("127.0.0.1", c)); s.close(); return c
                  except OSError:
                      s.close()
              raise SystemExit("no free port")

          # How long does a REFUSAL actually take, with a budget generous enough to always get one.
          times, kinds = [], []
          for rep in range(12):
              port = closed_port()
              s = socket.socket(); s.settimeout(30.0)
              t = time.perf_counter()
              try:
                  s.connect(("127.0.0.1", port)); kind = "ACCEPTED"
              except socket.timeout:
                  kind = "TIMEOUT"
              except OSError as e:
                  kind = f"refused(errno={e.errno})"
              el = (time.perf_counter() - t) * 1000
              s.close()
              times.append(el); kinds.append(kind)
              print(f"rep {rep:>2} port {port}: {kind} after {el:8.1f}ms", flush=True)

          print(f"KINDS {sorted(set(kinds))}", flush=True)
          print(f"REFUSAL_MS min={min(times):.1f} median={statistics.median(times):.1f} "
                f"max={max(times):.1f} n={len(times)}", flush=True)

          srv = socket.socket(); srv.bind(("127.0.0.1", 0)); srv.listen(1)
          live = srv.getsockname()[1]
          c = socket.socket(); c.settimeout(5.0)
          t = time.perf_counter(); c.connect(("127.0.0.1", live))
          print(f"control: live listener accepted after {(time.perf_counter()-t)*1000:.1f}ms", flush=True)
          EOF
          python probe.py
