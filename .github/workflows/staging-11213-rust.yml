name: "staging-11213 rust windows"
on:
  push:
    branches: ["pr-11213-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Probe the closed-port classification
        working-directory: studio/src-tauri
        run: "cargo test --bin unsloth-studio commands::tests:: -- --nocapture --test-threads=1"
