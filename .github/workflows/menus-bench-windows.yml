name: menus-bench-windows
on:
  push:
    branches: ["bench/menus-win"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  menus:
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
        include:
          - rep: 1
            order: "main pr17005 pr17006"
          - rep: 2
            order: "pr17005 pr17006 main"
          - rep: 3
            order: "pr17006 main pr17005"
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: benchsrc
      - uses: actions/checkout@v4
        with:
          repository: danielhanchen/unsloth-staging-2
          ref: bench/r7-main
          path: src_main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: danielhanchen/unsloth-staging-2
          ref: bench/r7-pr17005
          path: src_pr17005
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: danielhanchen/unsloth-staging-2
          ref: bench/r7-pr17006
          path: src_pr17006
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Studio from the main checkout (backend); every frontend served with -f
        shell: pwsh
        working-directory: src_main
        run: |
          $child = '$ErrorActionPreference = ''Stop''; $ProgressPreference = ''SilentlyContinue''; & ./install.ps1 --local --no-torch; exit $LASTEXITCODE'
          pwsh -NoProfile -ExecutionPolicy Bypass -Command $child 2>&1 | Tee-Object -FilePath ../install.log | Select-Object -Last 40
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited with code $LASTEXITCODE" }
      - name: Build all frontends the same way (vite build in each checkout)
        run: |
          for arm in main pr17005 pr17006; do
            ( cd src_$arm/studio/frontend && { [ -d node_modules ] || npm ci --no-audit --no-fund; } && npx vite build > ../../../build_$arm.log 2>&1 ) || { tail -40 build_$arm.log; exit 1; }
            echo "$arm $(git -C src_$arm rev-parse HEAD) $(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' src_$arm/studio/frontend/dist/index.html)"
          done
      - name: main vs pr17005 vs pr17006 in rotated order on this runner (Edge), 1 vs 150 turns, solid
        run: |
          python -m pip install -q 'playwright<2' httpx pillow huggingface_hub
          mkdir -p work out && tar -xzf benchsrc/bench/pack_menus.tgz -C work
          export PACK="$PWD/work/pack" WORKSPACE="$PWD/work/pack"
          export PATH=~/.unsloth/studio/bin:"$PATH"
          HOME_W=$(cygpath -w ~/.unsloth/studio)
          for arm in ${{ matrix.order }}; do
            DIST_W=$(cygpath -w "$PWD/src_$arm/studio/frontend/dist")
            nohup unsloth studio -H 127.0.0.1 -p 12611 -f "$DIST_W" > studio_$arm.log 2>&1 &
            for i in $(seq 1 90); do curl -sf http://127.0.0.1:12611/api/health >/dev/null && break; sleep 5; done
            curl -sf http://127.0.0.1:12611/api/health >/dev/null || { tail -60 studio_$arm.log; exit 1; }
            {
              echo "arm=$arm src_head=$(git -C src_$arm rev-parse HEAD)"
              echo "served:"; curl -sf http://127.0.0.1:12611/ | grep -oE '/assets/[A-Za-z0-9_.-]+\.(js|css)' | sort -u
              echo "built:"; grep -oE '/assets/[A-Za-z0-9_.-]+\.(js|css)' src_$arm/studio/frontend/dist/index.html | sort -u
            } > out/build_manifest_$arm.txt
            [ -f out/threads.json ] || python -u work/pack/menu_bench.py seed --base-url http://127.0.0.1:12611 --home "$HOME_W" --turns 1 150 --out out/threads.json
            python -u work/pack/menu_bench.py run --base-url http://127.0.0.1:12611 --home "$HOME_W" --threads out/threads.json \
              --arm $arm --engines msedge --out out/menus_${arm}_win.json 2>&1 | tee out/menus_$arm.log | grep -E "^MENU" || true
            unsloth studio stop || true
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:12611/api/health >/dev/null || break; sleep 2; done
            curl -sf http://127.0.0.1:12611/api/health >/dev/null && { echo "studio did not stop"; exit 1; }
            sleep 3
          done
          for arm in ${{ matrix.order }}; do test -s out/menus_${arm}_win.json; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r7-windows-r${{ matrix.rep }}
          path: |
            out
            studio_*.log
            build_*.log
            install.log
