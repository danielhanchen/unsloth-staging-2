name: menus-bench-windows
on:
  push:
    branches: ["bench/menus-win"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  menus:
    strategy:
      fail-fast: false
      matrix:
        arm: [main-now2]
        rep: [1, 2]
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: benchsrc
      - uses: actions/checkout@v4
        with:
          repository: danielhanchen/unsloth-staging-2
          ref: bench/${{ matrix.arm }}
          path: src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Studio from this build (install.ps1 --local --no-torch)
        shell: pwsh
        working-directory: src
        run: |
          $child = '$ErrorActionPreference = ''Stop''; $ProgressPreference = ''SilentlyContinue''; & ./install.ps1 --local --no-torch; exit $LASTEXITCODE'
          pwsh -NoProfile -ExecutionPolicy Bypass -Command $child 2>&1 | Tee-Object -FilePath ../install.log | Select-Object -Last 40
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited with code $LASTEXITCODE" }
      - name: Launch Studio
        run: |
          SHIM_DIR=~/.unsloth/studio/bin
          ls "$SHIM_DIR/unsloth.exe"
          export PATH="$SHIM_DIR:$PATH"
          nohup unsloth studio -H 127.0.0.1 -p 12611 > studio.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:12611/api/health && break; sleep 5; done
          curl -sf http://127.0.0.1:12611/api/health || { tail -60 studio.log; exit 1; }
      - name: Record which build is served
        run: |
          mkdir -p out
          {
            echo "arm=${{ matrix.arm }} src_head=$(git -C src rev-parse HEAD)"
            echo "served:"; curl -sf http://127.0.0.1:12611/ | grep -oE '/assets/[A-Za-z0-9_.-]+\.(js|css)' | sort -u
            for f in src/studio/frontend/dist/index.html; do
              [ -f "$f" ] && { echo "built ($f):"; grep -oE '/assets/[A-Za-z0-9_.-]+\.(js|css)' "$f" | sort -u; }
            done
          } | tee out/build_manifest.txt
      - name: Seed short and long threads, run the menu bench (Edge = WebView2 engine, Chromium)
        run: |
          python -m pip install -q 'playwright<2' httpx pillow huggingface_hub
          python -m playwright install chromium
          mkdir -p work && tar -xzf benchsrc/bench/pack_menus.tgz -C work
          export PACK="$PWD/work/pack" WORKSPACE="$PWD/work/pack"
          HOME_W=$(cygpath -w ~/.unsloth/studio)
          python -u work/pack/menu_bench.py seed --base-url http://127.0.0.1:12611 --home "$HOME_W" --turns 1 150 --out out/threads.json
          python -u work/pack/menu_bench.py run --base-url http://127.0.0.1:12611 --home "$HOME_W" --threads out/threads.json \
            --arm ${{ matrix.arm }} --engines msedge,chromium --shots out/shots --out out/menus_${{ matrix.arm }}_win.json 2>&1 | tee out/menus.log | grep -E "^MENU" || true
          python -u work/pack/menu_bench.py run --base-url http://127.0.0.1:12611 --home "$HOME_W" --threads out/threads.json \
            --arm ${{ matrix.arm }}_glass --material glass --engines msedge,chromium --out out/menus_${{ matrix.arm }}_glass_win.json 2>&1 | tee out/menus_glass.log | grep -E "^MENU" || true
          test -s out/menus_${{ matrix.arm }}_win.json && test -s out/menus_${{ matrix.arm }}_glass_win.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menus-windows-${{ matrix.arm }}-r${{ matrix.rep }}
          path: |
            out
            studio.log
            install.log
