# Issue 8495 holes 2 and 3: an ARM64 interpreter that is *reused* rather than
# freshly selected never meets install.ps1's x64 swap.
#   hole 2 - install.ps1 migrates a legacy venv without probing its arch
#   hole 3 - setup.ps1 accepts UNSLOTH_SETUP_PYTHON on version + conda only
name: "8495 win-arm64 venv reuse"
on:
  push:
    branches: [pr8495-arm64-cross-os]
    paths:
      - 'install.ps1'
      - 'studio/setup.ps1'
      - '.github/workflows/arm-win-reuse.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  reuse:
    runs-on: windows-11-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Install uv
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Seed a native ARM64 venv where install.ps1 looks for a legacy environment.
      - name: Seed an ARM64 venv at the legacy path
        shell: pwsh
        run: |
          $home_ = "${{ github.workspace }}\studio_home"
          New-Item -ItemType Directory -Force -Path $home_ | Out-Null
          uv venv "$home_\.venv"
          $py = "$home_\.venv\Scripts\python.exe"
          "seeded venv tag = $(& $py -S -c 'import sysconfig; print(sysconfig.get_platform())')"

      # The fix: Test-CompatibleSetupPythonArch must reject the ARM64 interpreter
      # that Get-CompatiblePythonVersion (version only) still accepts. Run both
      # functions verbatim out of setup.ps1 against the seeded venv.
      - name: setup.ps1 arch gate rejects an ARM64 interpreter
        shell: pwsh
        run: |
          $src = Get-Content studio/setup.ps1 -Raw
          foreach ($fn in @('Get-CompatiblePythonVersion', 'Get-PythonPlatformTag', 'Test-CompatibleSetupPythonArch')) {
            $m = [regex]::Match($src, "(?s)function $fn \{.*?\r?\n\}")
            if (-not $m.Success) { "$fn not found in setup.ps1"; exit 1 }
            Invoke-Expression $m.Value
          }
          function Get-HostMachineArch { return "arm64" }
          $script:NoDatasetsMode = $false
          $py = "${{ github.workspace }}\studio_home\.venv\Scripts\python.exe"
          $ver = Get-CompatiblePythonVersion $py
          $tag = Get-PythonPlatformTag $py
          "interpreter tag        = $tag"
          "version gate verdict   = $ver"
          if ($tag -ne "win-arm64") { "the seeded venv is not ARM64; nothing to prove"; exit 1 }
          if (Test-CompatibleSetupPythonArch $py) {
            "FAIL: the ARM64 interpreter was accepted for reuse"
            exit 1
          }
          "FIXED: the ARM64 interpreter is rejected before any package work"
          # And the tier still accepts it, or a Snapdragon could install nothing at all.
          $script:NoDatasetsMode = $true
          if (-not (Test-CompatibleSetupPythonArch $py)) {
            "FAIL: the inference-only tier must accept a native ARM64 interpreter"
            exit 1
          }
          "FIXED: the ARM64 inference-only tier still accepts it"

      - name: Does the reused interpreter resolve the stack?
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $py = "${{ github.workspace }}\studio_home\.venv\Scripts\python.exe"
          uv pip install --python $py --only-binary ":all:" "datasets==4.3.0" 2>&1 | Select-Object -Last 12
          if ($LASTEXITCODE -eq 0) { "UNEXPECTED: datasets installed on ARM64"; exit 1 }
          "EXPECTED: the reused ARM64 venv cannot install datasets (pyarrow)"
          exit 0
