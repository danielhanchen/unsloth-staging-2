name: "staging-7082 ubuntu-latest"
on:
  push:
    branches: ["pr-7082-xplat-ci"]
    paths:
      - 'studio/backend/hub/services/models/folder_browser.py'
      - 'studio/backend/hub/storage/scan_folders.py'
      - 'studio/backend/hub/tests/test_model_services.py'
      - 'studio/backend/routes/models.py'
      - 'studio/backend/storage/studio_db.py'
      - 'studio/backend/tests/test_browse_denylist.py'
      - 'studio/backend/tests/test_linux_external_media_paths.py'
      - 'studio/backend/tests/test_windows_external_drive_paths.py'
      - 'studio/backend/utils/paths/external_media.py'
      - '.github/workflows/staging-7082-ubuntu-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests -q || true
