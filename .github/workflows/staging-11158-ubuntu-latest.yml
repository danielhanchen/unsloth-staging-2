name: "staging-11158 ubuntu-latest"
on:
  push:
    branches: ["pr-11158-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_bootstrap_banner_password_visibility.py studio/backend/tests/test_startup_defers_torch.py studio/backend/tests/test_torch_cpu_build_on_nvidia_host.py tests/studio/install/test_llama_kind_gate_matches_selector.py tests/studio/install/test_pr10648_offline_and_status.py tests/studio/install/test_setup_fast_path_guard.py tests/studio/install/test_woa_wheelhouse_guard_behaviour.py tests/studio/install/test_woa_wheelhouse_prefers_pypi.py tests/studio/studiobench/scene/selftest/test_studiobench_queued_idle_live.py tests/studio/test_cache_budget_discipline.py tests/test_formatter_fixed_point.py tests/test_scripts_write_lf.py tests/test_windows_amd_gpu_scan_fallback.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out.txt 2>&1 || rc=$?; cat pytest_out.txt; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers)." pytest_out.txt && ! grep -qE "^(FAILED|ERROR) " pytest_out.txt; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" = "1" ] && ! grep -qE "^ERROR " pytest_out.txt; then tot=$(grep -cE "^FAILED " pytest_out.txt); dep=$(grep -cE "^FAILED .* No module named .(torch|unsloth_zoo|transformers).$" pytest_out.txt); if [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; fi; exit "$rc"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node tests
        working-directory: studio/frontend
        run: node --experimental-strip-types --test tests/pasted-text-attachment.test.ts
