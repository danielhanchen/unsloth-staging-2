# STAGING. Installs the SHIPPED .deb on a machine stripped of developer tooling, then
# actually DRIVES it.
#
# desktop-app-clean-machine-ci.yml already proves the bundle installs and that the
# process is alive after 90 s. It stops there, because a hosted runner has nobody to
# click Install. This job goes further: it runs the bundled installer the way first
# launch does, launches the app under Xvfb, waits for the backend the app itself spawns
# (127.0.0.1:8888-8908, recorded in ~/.unsloth/studio/run/desktop_backend.json), logs in
# with the app's own desktop secret, and exercises inference, parallel chats, settings,
# the llama.cpp/whisper.cpp prebuilts, API serving and the updater endpoint.
#
# Two deliberate differences from the upstream job:
#   * REL_REPO points at unsloth-test/unsloth-test, which is where the CURRENT desktop
#     bundle lives. Upstream defaults to github.repository, whose newest desktop release
#     is the stale draft desktop-v0.1.50-beta.
#   * The "KNOWN OUTCOME PIN" blocks are gone. v0.1.51-beta's bundled install.sh carries
#     #7547 (verified: _SMART_APT_OPTIONAL x3, _check_macos_deps x2), which is exactly
#     the condition those pins say to retire them on.

name: "desktop-e2e linux deb"

on:
  push:
    branches: [desktop-e2e]
    paths:
      - 'tests/studio/desktop_drive.py'
      - 'tests/studio/desktop_playwright.py'
      - '.github/workflows/desktop-e2e-linux-deb.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag in the desktop release repo'
        type: string
        default: 'desktop-v0.1.51-beta'
      scenarios:
        description: 'Comma-separated scenario list, or all'
        type: string
        default: 'all'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REL_REPO: unsloth-test/unsloth-test
  REL_TAG: ${{ inputs.release_tag || 'desktop-v0.1.51-beta' }}
  SCENARIOS: ${{ inputs.scenarios || 'all' }}
  UNSLOTH_STUDIO_DISABLE_PUBLIC_CHECK: '1'
  # The 2 B Q4 quant on a 16 GB runner; the macOS legs drop to UD-Q2_K_XL.
  UNSLOTH_DRIVE_MTP_VARIANT: 'UD-Q4_K_XL'

jobs:
  deb:
    name: deb install + drive (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # 22.04 is where the app died right after spawning its backend; 24.04 passed the
        # whole suite. Both, so that split is measured rather than inferred.
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # torch + a 2 B GGUF + the llama.cpp prebuilt do not fit alongside the image's
      # preinstalled SDKs on a 14 GB disk.
      - name: Reclaim disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Download the shipped .deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dl logs artifacts
          gh release download "$REL_TAG" --repo "$REL_REPO" --pattern '*.deb' --dir dl
          ls -la dl
          sha256sum dl/*.deb | tee artifacts/deb.sha256

      - name: Strip the developer toolchain
        run: |
          bash .github/scripts/clean-machine-env.sh mask --remove
          set -a; . ./clean-machine.env; set +a
          bash .github/scripts/clean-machine-assert.sh absent

      - name: Install with NO dev tooling, only runtime libs
        run: |
          # Deliberately no build-essential/cmake/git: a user installing a .deb has none.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb jq x11-apps
          sudo apt-get install -y ./dl/*.deb || {
            echo "::error::the .deb does not declare its runtime dependencies correctly"
            exit 1
          }
          BIN="$(dpkg -L "$(dpkg-deb -f dl/*.deb Package)" | grep -E '/usr/bin/' | head -1)"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          echo "binary: $BIN"

      - name: Re-assert the toolchain is still absent
        run: |
          set -a; . ./clean-machine.env; set +a
          bash .github/scripts/clean-machine-assert.sh absent
          deps="$(dpkg-deb -f dl/*.deb Depends)"
          echo "declared Depends: $deps"
          if printf '%s' "$deps" | grep -qE '(^|[ ,])(git|cmake|build-essential|gcc|g\+\+|clang|llvm)([ ,(]|$)'; then
            echo "::error::the bundle now declares a developer toolchain dependency: $deps"
            exit 1
          fi

      - name: Run the bundled installer, the path first launch takes
        # The bundled installer resolves the llama.cpp / whisper.cpp prebuilts from
        # GitHub. Unauthenticated that is 60 requests/hour PER IP, and hosted runners
        # share IPs, so on macOS it 403s and the install dies (see D7). A real user is
        # not behind a shared CI egress IP, so passing a token here makes the job
        # measure the app instead of GitHub's rate limiter. prebuilt_core.py:332 picks
        # GH_TOKEN up automatically.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -a; . ./clean-machine.env; set +a
          set -o pipefail
          SH="$(dpkg -L "$(dpkg-deb -f dl/*.deb Package)" | grep -E '/install\.sh$' | head -1)"
          [ -n "$SH" ] && [ -f "$SH" ] || { echo "::error::the bundle ships no install.sh resource"; exit 1; }
          echo "bundled installer: $SH"
          # The upstream job pins a pre-#7547 outcome here. This bundle carries #7547
          # (_SMART_APT_OPTIONAL present), so the pin's own retirement condition is met
          # and a clean exit 0 is now the requirement.
          if ! grep -q '_SMART_APT_OPTIONAL' "$SH"; then
            echo "::error::this bundle predates #7547; it cannot install on a stripped machine"
            exit 1
          fi
          rc=0
          env -u UNSLOTH_STUDIO_HOME \
            bash "$SH" --tauri < /dev/null 2>&1 | tee logs/bundled-install.log || rc=$?
          echo "bundled installer exit code: $rc"
          [ "$rc" -eq 0 ] || { echo "::error::bundled installer exited $rc"; exit 1; }
          PY="$HOME/.unsloth/studio/unsloth_studio/bin/python"
          [ -x "$PY" ] || { echo "::error::bundled installer left no venv at $PY"; exit 1; }
          "$PY" -V
          "$PY" -c "import torch; print('torch', torch.__version__)"

      - name: Launch the app under Xvfb and keep it up
        run: |
          set -a; . ./clean-machine.env; set +a
          # WebKitGTK on a hosted runner needs both mitigations or it dies on the
          # compositor; the release notes name the blank-window failure this avoids.
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          nohup xvfb-run -n 99 -f "$PWD/.xvfb-auth" --server-args="-screen 0 1440x900x24" \
            "$BIN" > logs/app-stdout.log 2>&1 &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> "$GITHUB_ENV"
          sleep 20
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "app launched (pid $APP_PID)"
          else
            # `wait` on the child gives its status; 128+N means signal N, which is the
            # difference between "it chose to exit" and "the kernel killed it" -- and a
            # bare "exited during startup" says neither.
            wait "$APP_PID" 2>/dev/null; rc=$?
            echo "::error::the app exited during startup with status $rc"
            if [ "$rc" -gt 128 ]; then
              echo "::error::that is signal $((rc - 128)) (11=SIGSEGV, 9=SIGKILL/OOM, 6=SIGABRT)"
            fi
            echo "=== kernel ring buffer (segfault / OOM kill) ==="
            dmesg 2>/dev/null | tail -40 | grep -iE "segfault|killed process|oom|unsloth" || \
              echo "(dmesg unreadable or nothing relevant)"
            echo "=== memory ==="
            free -m || true
            tail -60 logs/app-stdout.log
            exit 1
          fi

      - name: Drive the running app
        id: drive
        run: |
          set -a; . ./clean-machine.env; set +a
          # pipefail or the tee swallows the harness's exit code and the job goes green
          # over a red report -- the worst possible outcome for a test job.
          set -o pipefail
          export UNSLOTH_DRIVE_APP_BINARY="$BIN"
          python3 tests/studio/desktop_drive.py \
            --scenarios "$SCENARIOS" \
            --discover-timeout 420 \
            --out artifacts/drive-report.json 2>&1 | tee logs/drive.log

      - name: Is the window actually painted, or blank?
        if: always()
        run: |
          # The release notes warn the AppImage "can show a blank window on some
          # Tauri/WebKitGTK + Wayland/Mesa stacks". Nothing else in this job can see
          # that: the process is alive, the backend is healthy, the logs are clean.
          # xvfb-run exports XAUTHORITY to its child only, so this step has to be
          # pointed at the same cookie or xwd reports "unable to open display".
          XAUTHORITY="$PWD/.xvfb-auth" xwd -root -display :99 -out artifacts/screen.xwd
          python3 tests/studio/xwd_not_blank.py artifacts/screen.xwd \
            --png artifacts/desktop-window.png

      - name: Serve an API with `unsloth run`
        if: always()
        run: |
          set -a; . ./clean-machine.env; set +a
          set -o pipefail
          # Opt-in scenario: it boots a SECOND Studio, so it gets its own step and a
          # port well outside the desktop app's 8888-8908 range. The small GGUF keeps
          # both resident comfortably on a 16 GB runner.
          UNSLOTH_DRIVE_RUN_PORT=8951 \
          UNSLOTH_DRIVE_RUN_LOG=logs/unsloth-run.log \
          python3 tests/studio/desktop_drive.py \
            --scenarios unsloth_run \
            --discover-timeout 120 \
            --out artifacts/unsloth-run-report.json 2>&1 | tee logs/drive-unsloth-run.log

      - name: Drive the UI
        if: always()
        run: |
          set -a; . ./clean-machine.env; set +a
          set -o pipefail
          python3 -m pip install --quiet --user 'playwright>=1.45' || true
          python3 -m playwright install --with-deps chromium || true
          python3 tests/studio/desktop_playwright.py \
            --layer attached \
            --out artifacts/ui \
            --report artifacts/ui-report.json 2>&1 | tee logs/ui.log

      - name: What did the app's own log say?
        if: always()
        run: |
          # The backend the app spawns writes to ~/.unsloth/studio/logs (process.rs pipes
          # the child's stdout/stderr into diagnostics phase logs). Without these a
          # backend that fails to start leaves tauri.log ending at "spawned" and no
          # explanation anywhere -- which is exactly what the first run hit.
          cp -r "$HOME/.unsloth/studio/logs" logs/studio-logs 2>/dev/null || true
          cp -r "$HOME/.unsloth/studio/run" logs/studio-run 2>/dev/null || true
          for f in "$HOME/.unsloth/studio/tauri.log" logs/app-stdout.log; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            cp "$f" logs/ 2>/dev/null || true
            tail -80 "$f"
          done
          echo "=== backend phase logs ==="
          find "$HOME/.unsloth/studio/logs" -type f 2>/dev/null | head -20 | while read -r f; do
            echo "--- $f ---"; tail -60 "$f"
          done
          echo "=== listening sockets ==="
          ss -ltnp 2>/dev/null | head -20 || true
          echo "=== unsloth processes ==="
          ps aux | grep -i unsloth | grep -v grep | head -10 || true

      - name: Stop the app
        if: always()
        run: kill -TERM "${APP_PID:-0}" 2>/dev/null || true

      - name: Restore the runner
        if: always()
        run: |
          if [ -f .clean-machine/restore.sh ]; then
            bash .clean-machine/restore.sh
          else
            echo "no .clean-machine/restore.sh: nothing to restore"
          fi

      - name: If the backend never came up, run its exact command by hand
        # D8: on some Linux launches the app's spawned backend produces ZERO bytes and
        # never writes its session log -- the diagnostics phase log holds only the
        # "Starting backend:" meta line. That is either "the venv cannot run this
        # command on this machine" or "the exec was killed". Running the identical
        # command directly separates the two, which nothing in the app's own logs can.
        if: failure()
        run: |
          set -a; . ./clean-machine.env; set +a
          PY="$HOME/.unsloth/studio/unsloth_studio/bin/python"
          UNS="$HOME/.unsloth/studio/unsloth_studio/bin/unsloth"
          echo "=== can the venv python start at all? ==="
          "$PY" -c "import sys; print(sys.version)" || echo "venv python FAILED"
          echo "=== the exact command the app spawns, on a free port ==="
          timeout 300 env -u UNSLOTH_STUDIO_HOME "$UNS" studio --api-only \
            -H 127.0.0.1 -p 8907 > logs/manual-backend.log 2>&1 &
          MPID=$!
          for i in $(seq 1 60); do
            curl -fsS --max-time 3 http://127.0.0.1:8907/api/health >/dev/null 2>&1 && break
            sleep 5
          done
          if curl -fsS --max-time 3 http://127.0.0.1:8907/api/health >/dev/null 2>&1; then
            echo "::warning::the SAME command works when run directly -- so the venv is"
            echo "::warning::fine and the app's spawn path is what fails (D8)"
          else
            echo "::warning::the same command also fails when run directly -- the venv or"
            echo "::warning::its environment is what is broken, not the spawn path"
          fi
          echo "=== manual backend output ==="
          cat logs/manual-backend.log || true
          kill -TERM "$MPID" 2>/dev/null || true

      - name: Upload logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-linux-deb-${{ matrix.os }}
          path: |
            logs/
            artifacts/
          retention-days: 7
          if-no-files-found: warn
