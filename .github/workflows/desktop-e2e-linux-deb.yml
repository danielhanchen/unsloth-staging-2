# STAGING. Installs the SHIPPED .deb on a machine stripped of developer tooling, then
# actually DRIVES it.
#
# desktop-app-clean-machine-ci.yml already proves the bundle installs and that the
# process is alive after 90 s. It stops there, because a hosted runner has nobody to
# click Install. This job goes further: it runs the bundled installer the way first
# launch does, launches the app under Xvfb, waits for the backend the app itself spawns
# (127.0.0.1:8888-8908, recorded in ~/.unsloth/studio/run/desktop_backend.json), logs in
# with the app's own desktop secret, and exercises inference, parallel chats, settings,
# the llama.cpp/whisper.cpp prebuilts, API serving and the updater endpoint.
#
# Two deliberate differences from the upstream job:
#   * REL_REPO points at unsloth-test/unsloth-test, which is where the CURRENT desktop
#     bundle lives. Upstream defaults to github.repository, whose newest desktop release
#     is the stale draft desktop-v0.1.50-beta.
#   * The "KNOWN OUTCOME PIN" blocks are gone. v0.1.51-beta's bundled install.sh carries
#     #7547 (verified: _SMART_APT_OPTIONAL x3, _check_macos_deps x2), which is exactly
#     the condition those pins say to retire them on.

name: "desktop-e2e linux deb"

on:
  push:
    branches: [desktop-e2e]
    paths:
      - 'tests/studio/desktop_drive.py'
      - 'tests/studio/xwd_not_blank.py'
      - 'tests/studio/desktop_playwright.py'
      - 'tests/studio/spawn_with_ignored_rt_signals.py'
      - 'tests/studio/test_pipe_tolerant_stream.py'
      - 'unsloth_cli/_pipe_guard.py'
      - '.github/workflows/desktop-e2e-linux-deb.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag in the desktop release repo'
        type: string
        default: 'desktop-v0.1.51-beta'
      scenarios:
        description: 'Comma-separated scenario list, or all'
        type: string
        default: 'all'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REL_REPO: unsloth-test/unsloth-test
  REL_TAG: ${{ inputs.release_tag || 'desktop-v0.1.51-beta' }}
  SCENARIOS: ${{ inputs.scenarios || 'all' }}
  UNSLOTH_STUDIO_DISABLE_PUBLIC_CHECK: '1'
  # The 2 B Q4 quant on a 16 GB runner; the macOS legs drop to UD-Q2_K_XL.
  UNSLOTH_DRIVE_MTP_VARIANT: 'UD-Q4_K_XL'

jobs:
  deb:
    name: "deb install + drive (${{ matrix.os }} #${{ matrix.attempt }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Weighted toward the OS that actually fails. Cumulative tally: ubuntu-22.04 has
        # failed 10 of 25 legs (~40%), ubuntu-24.04 0 of 25. At 40% a three-leg run comes
        # back all-green by chance more than a fifth of the time, which is exactly how I
        # talked myself into two different "this instrument masks it" conclusions. Six
        # attempts drops that to under 5%, so a green 22.04 run starts meaning something.
        # 24.04 stays at two purely as a control.
        include:
          - {os: ubuntu-22.04, attempt: 1}
          - {os: ubuntu-22.04, attempt: 2}
          - {os: ubuntu-22.04, attempt: 3}
          - {os: ubuntu-22.04, attempt: 4}
          - {os: ubuntu-22.04, attempt: 5}
          - {os: ubuntu-22.04, attempt: 6}
          - {os: ubuntu-24.04, attempt: 1}
          - {os: ubuntu-24.04, attempt: 2}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # torch + a 2 B GGUF + the llama.cpp prebuilt do not fit alongside the image's
      # preinstalled SDKs on a 14 GB disk.
      - name: Reclaim disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Download the shipped .deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dl logs artifacts
          gh release download "$REL_TAG" --repo "$REL_REPO" --pattern '*.deb' --dir dl
          ls -la dl
          sha256sum dl/*.deb | tee artifacts/deb.sha256

      - name: Strip the developer toolchain
        run: |
          bash .github/scripts/clean-machine-env.sh mask --remove
          set -a; . ./clean-machine.env; set +a
          bash .github/scripts/clean-machine-assert.sh absent

      - name: Install with NO dev tooling, only runtime libs
        run: |
          # Deliberately no build-essential/cmake/git: a user installing a .deb has none.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb jq x11-apps strace
          sudo apt-get install -y ./dl/*.deb || {
            echo "::error::the .deb does not declare its runtime dependencies correctly"
            exit 1
          }
          BIN="$(dpkg -L "$(dpkg-deb -f dl/*.deb Package)" | grep -E '/usr/bin/' | head -1)"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          echo "binary: $BIN"

      - name: Re-assert the toolchain is still absent
        run: |
          set -a; . ./clean-machine.env; set +a
          bash .github/scripts/clean-machine-assert.sh absent
          deps="$(dpkg-deb -f dl/*.deb Depends)"
          echo "declared Depends: $deps"
          if printf '%s' "$deps" | grep -qE '(^|[ ,])(git|cmake|build-essential|gcc|g\+\+|clang|llvm)([ ,(]|$)'; then
            echo "::error::the bundle now declares a developer toolchain dependency: $deps"
            exit 1
          fi

      - name: Run the bundled installer, the path first launch takes
        # The bundled installer resolves the llama.cpp / whisper.cpp prebuilts from
        # GitHub. Unauthenticated that is 60 requests/hour PER IP, and hosted runners
        # share IPs, so on macOS it 403s and the install dies (see D7). A real user is
        # not behind a shared CI egress IP, so passing a token here makes the job
        # measure the app instead of GitHub's rate limiter. prebuilt_core.py:332 picks
        # GH_TOKEN up automatically.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -a; . ./clean-machine.env; set +a
          set -o pipefail
          SH="$(dpkg -L "$(dpkg-deb -f dl/*.deb Package)" | grep -E '/install\.sh$' | head -1)"
          [ -n "$SH" ] && [ -f "$SH" ] || { echo "::error::the bundle ships no install.sh resource"; exit 1; }
          echo "bundled installer: $SH"
          # The upstream job pins a pre-#7547 outcome here. This bundle carries #7547
          # (_SMART_APT_OPTIONAL present), so the pin's own retirement condition is met
          # and a clean exit 0 is now the requirement.
          if ! grep -q '_SMART_APT_OPTIONAL' "$SH"; then
            echo "::error::this bundle predates #7547; it cannot install on a stripped machine"
            exit 1
          fi
          rc=0
          env -u UNSLOTH_STUDIO_HOME \
            bash "$SH" --tauri < /dev/null 2>&1 | tee logs/bundled-install.log || rc=$?
          echo "bundled installer exit code: $rc"
          [ "$rc" -eq 0 ] || { echo "::error::bundled installer exited $rc"; exit 1; }
          PY="$HOME/.unsloth/studio/unsloth_studio/bin/python"
          [ -x "$PY" ] || { echo "::error::bundled installer left no venv at $PY"; exit 1; }
          "$PY" -V
          "$PY" -c "import torch; print('torch', torch.__version__)"

      - name: Wrap the backend entry point so the child cannot die silently
        # D8: on 22.04 the app spawns the backend and then logs nothing at all -- no
        # [backend] stdout, no [stderr], and a diagnostics session log containing only
        # the spawn line. Zero bytes on both streams is not something a Python traceback
        # does, so either the child never reached Python or its output died in a pipe
        # buffer. Both are invisible from outside, hence this wrapper.
        #
        # It answers three things the app's own pipes cannot:
        #   1. what the child ACTUALLY inherits. /proc/PID/environ is the exec-time
        #      snapshot of the app's own stack -- it does not show runtime setenv(), and
        #      process.rs:599 documents exactly such a case (AppImage injecting
        #      LD_LIBRARY_PATH and breaking the spawned Python). So the environment has
        #      to be read from inside the child, not inferred from the parent.
        #   2. the output, unbuffered. Python block-buffers stdout onto a pipe, so a
        #      process that dies before flushing loses everything it printed.
        #   3. how it ended -- exit code, or signal, which is the difference between
        #      "it failed" and "the kernel killed it".
        run: |
          BINDIR="$HOME/.unsloth/studio/unsloth_studio/bin"
          [ -x "$BINDIR/unsloth" ] || { echo "::error::no $BINDIR/unsloth to wrap"; exit 1; }
          mv "$BINDIR/unsloth" "$BINDIR/unsloth.real"
          cat > "$BINDIR/unsloth" <<'WRAP'
          #!/bin/bash
          # Diagnostic shim (staging only) -- see "Wrap the backend entry point".
          LOG="$HOME/unsloth-child.log"
          # Only the backend launch is instrumented. Every other invocation is passed
          # through untouched, because the app PARSES the stdout of some of them:
          # `studio desktop-capabilities --json` is read back as JSON, and an earlier
          # version of this shim wrote a probe line to the real stdout, corrupting that
          # JSON. The app then declared the install stale and went into an update loop
          # instead of ever spawning a backend, and the run measured nothing. An
          # instrument that writes to the stream under test is not an instrument.
          case " $* " in
            *" --api-only "*) ;;
            *) exec "$HOME/.unsloth/studio/unsloth_studio/bin/unsloth.real" "$@" ;;
          esac
          {
            echo "=============================================================="
            echo "[$(date -u +%H:%M:%S)] pid=$$ ppid=$PPID cwd=$PWD"
            echo "argv: $0 $*"
            # NO warm-up probe here. The first version of this shim ran
            # `python -c 'import encodings'` before every spawn, and D8 stopped
            # reproducing on all four legs. Removing it brought the failure straight back
            # (3/3 on 22.04), so that probe was masking the defect, not measuring it.
            echo "--- inherited env (loader / python relevant) ---"
            # The previous pattern had UNSLOTH_ followed directly by '=', so it could only
            # ever match a variable literally named UNSLOTH_. Every reading of "(none of
            # them are set)" was therefore silent about UNSLOTH_STUDIO_DESKTOP_OWNER_TOKEN
            # and friends, which process.rs:582-614 does inject.
            env | grep -E '^(LD_LIBRARY_PATH|LD_PRELOAD|PYTHONHOME|PYTHONPATH|PYTHONEXECUTABLE|VIRTUAL_ENV|APPIMAGE|APPDIR|GTK_PATH|GIO_MODULE_DIR|UNSLOTH_[A-Z0-9_]*|STUDIO_[A-Z0-9_]*)=' \
              || echo "(none of them are set)"
            # A signal mask or ignored-signal set inherited from a GTK/WebKit parent
            # survives exec, and is one of the few things that can change how a child
            # behaves without changing its environment or its fds.
            echo "--- inherited signal disposition ---"
            grep -E "^Sig(Blk|Ign|Cgt)" /proc/self/status 2>/dev/null | sed "s/^/  /" || true
            echo "--- limits / fds ---"
            ulimit -a 2>/dev/null | grep -iE "open files|max memory|virtual|processes" || true
            # EVERY inherited fd, not just 0/1/2. Listing only the standard three was a
            # real gap: a GUI stack that opens files without CLOEXEC leaks them into its
            # children, and an inherited lock or database handle is exactly the kind of
            # thing that changes a child's behaviour while leaving env and argv identical.
            echo "--- every inherited fd ---"
            ls -lL /proc/self/fd 2>&1 | sed "s/^/  /"
            echo "--- running the real entry point ---"
          } >> "$LOG" 2>&1
          # Is the app actually reading the pipe it gave us, and for how long? A pipe with
          # no reader reproduces this defect's exact signature and nothing else does
          # (deadpipe 8/8 silent exit 1; file and live-pipe 8/8 fine), so the remaining
          # question is when the app's reader goes away. This probe answers it with a
          # timeline instead of an inference.
          #
          # Safe on this invocation specifically: the app treats the backend's stdout as
          # log lines, so an extra line is logged and ignored. It would NOT be safe on
          # `desktop-capabilities --json`, whose stdout the app parses -- doing that broke
          # an entire earlier run.
          exec 3>&1
          (
            # Without this, bash takes SIGPIPE and the subshell dies before it can report
            # what happened, which is the one outcome that makes the probe useless.
            trap "" PIPE
            t=0
            while [ "$t" -lt 60 ]; do
              if echo "SHIM_PIPE_ALIVE t=${t}s" >&3 2>/dev/null; then
                echo "[$(date -u +%H:%M:%S)] stdout pipe still has a reader at t=${t}s" >> "$LOG"
              else
                echo "[$(date -u +%H:%M:%S)] !! stdout pipe has NO READER at t=${t}s" >> "$LOG"
                break
              fi
              sleep 2
              t=$((t + 2))
            done
          ) &
          PIPE_PROBE=$!
          export PYTHONUNBUFFERED=1
          export PYTHONFAULTHANDLER=1
          # PYTHONVERBOSE was tried here and MASKED the defect: 3/3 green on 22.04 with
          # it, 3/3 red without. That is the second instrument to do so (the first was an
          # interpreter warm-up), and both of them add work to the child's early startup.
          # Two independent maskings of that shape say the failure is timing-sensitive, so
          # the app's own attempt is now left completely unperturbed and the question is
          # asked somewhere else -- see "Does it reproduce without the app at all?".
          # Tee both streams to files while still passing them through to the app, so the
          # output that has been invisible all through this investigation is recoverable
          # even if the app never logs it. `wait` for the tees, so the shim cannot exit
          # before they have flushed.
          # The child writes nothing at all, so there is no output to diagnose and it has
          # to be watched from outside. strace goes to a FILE, never to the streams under
          # test. It does perturb timing, and at a ~50% rate across three legs that is a
          # real risk of not reproducing -- but a silent process that leaves no trace is
          # the one case where syscalls are the only remaining evidence.
          REAL="$HOME/.unsloth/studio/unsloth_studio/bin/unsloth.real"
          if command -v strace > /dev/null 2>&1; then
            strace -f -tt -qq -o "$LOG.strace" \
              -e trace=execve,exit_group,exit,write,openat,clone,clone3,wait4,kill,tgkill \
              "$REAL" "$@" > >(tee -a "$LOG.out") 2> >(tee -a "$LOG.err" >&2)
            rc=$?
          else
            "$REAL" "$@" > >(tee -a "$LOG.out") 2> >(tee -a "$LOG.err" >&2)
            rc=$?
          fi
          kill "$PIPE_PROBE" 2>/dev/null || true
          wait 2>/dev/null
          if [ "$rc" -gt 128 ]; then
            echo "[$(date -u +%H:%M:%S)] pid=$$ EXIT rc=$rc -> killed by signal $((rc - 128)) (11=SIGSEGV 9=SIGKILL/OOM 6=SIGABRT 13=SIGPIPE)" >> "$LOG"
          else
            echo "[$(date -u +%H:%M:%S)] pid=$$ EXIT rc=$rc" >> "$LOG"
          fi
          exit $rc
          WRAP
          chmod +x "$BINDIR/unsloth"
          head -3 "$BINDIR/unsloth"

      - name: Launch the app under Xvfb and keep it up
        run: |
          set -a; . ./clean-machine.env; set +a
          # WebKitGTK on a hosted runner needs both mitigations or it dies on the
          # compositor; the release notes name the blank-window failure this avoids.
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          nohup xvfb-run -n 99 -f "$PWD/.xvfb-auth" --server-args="-screen 0 1440x900x24" \
            "$BIN" > logs/app-stdout.log 2>&1 &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> "$GITHUB_ENV"
          sleep 20
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "app launched (pid $APP_PID)"
          else
            # `wait` on the child gives its status; 128+N means signal N, which is the
            # difference between "it chose to exit" and "the kernel killed it" -- and a
            # bare "exited during startup" says neither.
            wait "$APP_PID" 2>/dev/null; rc=$?
            echo "::error::the app exited during startup with status $rc"
            if [ "$rc" -gt 128 ]; then
              echo "::error::that is signal $((rc - 128)) (11=SIGSEGV, 9=SIGKILL/OOM, 6=SIGABRT)"
            fi
            echo "=== kernel ring buffer (segfault / OOM kill) ==="
            dmesg 2>/dev/null | tail -40 | grep -iE "segfault|killed process|oom|unsloth" || \
              echo "(dmesg unreadable or nothing relevant)"
            echo "=== memory ==="
            free -m || true
            tail -60 logs/app-stdout.log
            exit 1
          fi

      - name: Is the app still alive before we blame its backend?
        # The check that would have made D10 obvious on day one instead of after seven
        # experiments. On Windows the app was being killed at a step boundary, and its
        # job object then took the backend with it -- so every "the backend never came
        # up" result was about a process killed as collateral damage. Linux detaches with
        # `nohup ... &` so it should not happen here, but "should not" is exactly the
        # assumption that cost those seven rounds. Measure it.
        run: |
          # $APP_PID is xvfb-run, NOT the app: the launch is
          # `nohup xvfb-run ... "$BIN" &`, so $! is the wrapper. xvfb-run stays alive as
          # long as Xvfb does, so checking it reports "app alive" even when the app is
          # dead -- which is how a run showed `app alive: pid 4569` whose only child was
          # Xvfb. Watching the wrapper instead of the thing under test is exactly the
          # mistake that made D10 take seven rounds; resolve the real process by name.
          APP_REAL="$(pgrep -x "$(basename "$BIN")" 2>/dev/null | head -1)"
          if [ -z "$APP_REAL" ]; then
            APP_REAL="$(pgrep -f "$BIN" 2>/dev/null | grep -vx "$APP_PID" | head -1)"
          fi
          echo "wrapper pid: $APP_PID   real app pid: ${APP_REAL:-<none found>}"
          if [ -n "$APP_REAL" ] && kill -0 "$APP_REAL" 2>/dev/null; then
            echo "app alive: pid $APP_REAL"
            echo "APP_REAL=$APP_REAL" >> "$GITHUB_ENV"
            ps -o pid,ppid,stat,etime,rss,comm -p "$APP_REAL" || true
            # Sample the children only AFTER the app has actually spawned the backend.
            # The fixed 20 s sleep sampled at t+20 while the app does not reach
            # "Starting backend" until t+32 (30 s of it stalled registering deep-link
            # handlers), so "children: (none)" meant "too early", not "the backend died".
            # An instrument that reports absence before the event can happen is worse
            # than none -- it reads as evidence.
            for _ in $(seq 60); do
              grep -q "Starting backend" logs/app-stdout.log 2>/dev/null && break
              sleep 1
            done
            if grep -q "Starting backend" logs/app-stdout.log 2>/dev/null; then
              echo "--- the app has spawned its backend; children now ---"
            else
              echo "--- the app never even reached 'Starting backend' in 60 s ---"
            fi
            pgrep -P "$APP_REAL" -a || echo "(none)"
            # And again a few seconds later: a child that appears and then vanishes is a
            # different defect from one that never appears.
            sleep 8
            echo "--- children, 8 s later ---"
            pgrep -P "$APP_REAL" -a || echo "(none)"
            # Save the environment the backend inherits WHILE THE APP IS ALIVE. The first
            # attempt read /proc/PID/environ from an `if: failure()` step at the end of
            # the job, by which point "Stop the app" had run and the file was gone -- so
            # it printed "the app has no LD_LIBRARY_PATH" when it simply could not look.
            mkdir -p logs
            tr '\0' '\n' < "/proc/$APP_REAL/environ" > logs/app-environ.txt 2>/dev/null || true
            echo "--- what its child inherits ---"
            grep -E '^(LD_LIBRARY_PATH|PYTHONHOME|PYTHONPATH|APPIMAGE|APPDIR|LD_PRELOAD)=' \
              logs/app-environ.txt | sed 's/^/  /' || echo "  (none of those are set)"
          else
            echo "::error::the APP is NOT running before driving started (wrapper $APP_PID"
            echo "::error::is alive, but that is only xvfb-run holding Xvfb open)."
            echo "--- what is still running ---"
            ps -o pid,ppid,stat,etime,comm -p "$APP_PID" || true
            pgrep -P "$APP_PID" -a || echo "(wrapper has no children)"
            echo "::error::Any backend failure below is about a process that lost its parent,"
            echo "::error::not a backend defect. Fix the launch, not the backend."
            tail -40 logs/app-stdout.log logs/app-stderr.log 2>/dev/null || true
            exit 1
          fi

      - name: Drive the running app
        id: drive
        run: |
          set -a; . ./clean-machine.env; set +a
          # pipefail or the tee swallows the harness's exit code and the job goes green
          # over a red report -- the worst possible outcome for a test job.
          set -o pipefail
          export UNSLOTH_DRIVE_APP_BINARY="$BIN"
          python3 tests/studio/desktop_drive.py \
            --scenarios "$SCENARIOS" \
            --discover-timeout 420 \
            --out artifacts/drive-report.json 2>&1 | tee logs/drive.log

      - name: Is the window actually painted, or blank?
        if: always()
        run: |
          # The release notes warn the AppImage "can show a blank window on some
          # Tauri/WebKitGTK + Wayland/Mesa stacks". Nothing else in this job can see
          # that: the process is alive, the backend is healthy, the logs are clean.
          # xvfb-run exports XAUTHORITY to its child only, so this step has to be
          # pointed at the same cookie or xwd reports "unable to open display".
          XAUTHORITY="$PWD/.xvfb-auth" xwd -root -display :99 -out artifacts/screen.xwd
          python3 tests/studio/xwd_not_blank.py artifacts/screen.xwd \
            --png artifacts/desktop-window.png

      - name: Serve an API with `unsloth run`
        if: always()
        run: |
          set -a; . ./clean-machine.env; set +a
          set -o pipefail
          # Opt-in scenario: it boots a SECOND Studio, so it gets its own step and a
          # port well outside the desktop app's 8888-8908 range. The small GGUF keeps
          # both resident comfortably on a 16 GB runner.
          UNSLOTH_DRIVE_RUN_PORT=8951 \
          UNSLOTH_DRIVE_RUN_LOG=logs/unsloth-run.log \
          python3 tests/studio/desktop_drive.py \
            --scenarios unsloth_run \
            --discover-timeout 120 \
            --out artifacts/unsloth-run-report.json 2>&1 | tee logs/drive-unsloth-run.log

      - name: Drive the UI
        if: always()
        run: |
          set -a; . ./clean-machine.env; set +a
          set -o pipefail
          python3 -m pip install --quiet --user 'playwright>=1.45' || true
          python3 -m playwright install --with-deps chromium || true
          python3 tests/studio/desktop_playwright.py \
            --layer attached \
            --out artifacts/ui \
            --report artifacts/ui-report.json 2>&1 | tee logs/ui.log

      - name: Does it reproduce without the app at all?
        if: always()
        # Everything that instruments the app's own spawn has changed its outcome, so
        # stop instrumenting it. Run the SAME command the app runs, from this shell,
        # repeatedly, and let the exit codes answer whether the app's spawn context is
        # required to reproduce.
        #
        # Reading the result: rc=124 means `timeout` had to stop it, i.e. it started and
        # kept running, which is success. rc=1 is the defect. Each attempt gets its own
        # port so a survivor never blocks the next one.
        run: |
          set -a; . ./clean-machine.env; set +a
          BIN_REAL="$HOME/.unsloth/studio/unsloth_studio/bin/unsloth.real"
          [ -x "$BIN_REAL" ] || BIN_REAL="$HOME/.unsloth/studio/unsloth_studio/bin/unsloth"
          echo "using: $BIN_REAL"
          ones=0; started=0
          for i in $(seq 1 12); do
            port=$((8960 + i))
            out="logs/repro-$i.log"
            # `|| rc=$?`, not a bare `rc=$?`: the step runs under `bash -e`, and the
            # SUCCESS case here exits 124 (timeout had to stop a healthy server), so a
            # bare assignment aborted the whole step on the first good attempt.
            rc=0
            timeout 25 "$BIN_REAL" studio --api-only -H 127.0.0.1 -p "$port" > "$out" 2>&1 || rc=$?
            bytes=$(wc -c < "$out" 2>/dev/null || echo 0)
            case "$rc" in
              124) started=$((started + 1)); verdict="started ok (timeout stopped it)" ;;
              1)   ones=$((ones + 1));       verdict="** REPRODUCED: silent exit 1 **" ;;
              *)   verdict="unexpected" ;;
            esac
            echo "attempt $i: rc=$rc bytes=$bytes  $verdict"
            [ "$rc" = "1" ] && { echo "--- what it wrote ---"; head -20 "$out"; }
            pkill -f "api-only -H 127.0.0.1 -p $port" 2>/dev/null || true
          done
          echo "=================================================="
          echo "12 attempts outside the app: $started started, $ones silent exit 1"
          if [ "$ones" -gt 0 ]; then
            echo "So the app is NOT required to reproduce it -- this is the backend's own"
            echo "startup, and the app is only the messenger."
          else
            echo "So it does NOT reproduce outside the app, in $started/12 attempts."
            echo "Something about the app's spawn context is required."
          fi

      - name: Which part of the app's spawn context reproduces it?
        if: always()
        # Bisecting the spawn context, because that is what the controls narrowed it to:
        # the app's own child exits 1 silently on 22.04, while on the same machine in the
        # same job a shell-spawned one started 12/12.
        #
        # Already ruled out: the inherited signal state. ubuntu-22.04 hands its children
        # SigIgn 0000000180000007 vs 24.04's 0000000000000007 -- signals 32 and 33,
        # glibc's SIGCANCEL and SIGSETXID, ignored and surviving execve. It was the only
        # difference left after env, rlimits and fds all came back byte-identical, but it
        # is not the cause: reproducing that exact state outside the app started 12/12,
        # and the 22.04 leg that PASSED carried the same mask anyway.
        #
        # The remaining untested difference is one I introduced into my own control: it
        # redirected to a FILE, while the app uses PIPES. That matters here specifically,
        # because a Python process whose stdout is a closed pipe raises BrokenPipeError,
        # fails to write the traceback to a stderr that is also closed, and exits 1 having
        # printed nothing -- which is the exact signature of this defect.
        #
        #   file      the existing control, for comparison in the same step
        #   pipe      a live reader draining it, as the app intends
        #   deadpipe  a reader that exits immediately, so writes get EPIPE
        #
        # If deadpipe reproduces, the mechanism is settled and the question becomes why
        # the app's pipes are closed on 22.04. If it does not, then this signature is not
        # reachable through stdio at all.
        run: |
          set -a; . ./clean-machine.env; set +a
          BIN_REAL="$HOME/.unsloth/studio/unsloth_studio/bin/unsloth.real"
          [ -x "$BIN_REAL" ] || BIN_REAL="$HOME/.unsloth/studio/unsloth_studio/bin/unsloth"
          run_variant() {
            variant="$1"; base_port="$2"
            ones=0; started=0; other=0
            for i in $(seq 1 8); do
              port=$((base_port + i))
              out="logs/var-$variant-$i.log"
              rc=0
              case "$variant" in
                file)
                  timeout 25 "$BIN_REAL" studio --api-only -H 127.0.0.1 -p "$port" \
                    > "$out" 2>&1 || rc=$?
                  ;;
                pipe)
                  timeout 25 "$BIN_REAL" studio --api-only -H 127.0.0.1 -p "$port" \
                    2>&1 | cat > "$out" || rc=$?
                  rc=${PIPESTATUS[0]:-$rc}
                  ;;
                deadpipe)
                  # `head -0` closes its end at once, so the child's first write EPIPEs.
                  timeout 25 "$BIN_REAL" studio --api-only -H 127.0.0.1 -p "$port" \
                    2>&1 | head -0 > "$out" || rc=$?
                  rc=${PIPESTATUS[0]:-$rc}
                  ;;
              esac
              case "$rc" in
                124) started=$((started + 1)) ;;
                1)   ones=$((ones + 1)) ;;
                *)   other=$((other + 1)); echo "  $variant attempt $i: rc=$rc" ;;
              esac
              pkill -f "api-only -H 127.0.0.1 -p $port" 2>/dev/null || true
            done
            echo "$variant: $started started, $ones SILENT EXIT 1, $other other"
          }
          run_variant file     8900
          run_variant pipe     8920
          run_variant deadpipe 8940
          echo "=================================================="
          echo "The app's own child on this machine: see unsloth-child.log for its rc."

      - name: Does the pipe guard actually fix the reproduction?
        if: always()
        # The before/after for the fix, on the exact condition that reproduces D8.
        # `deadpipe` -- a pipe whose reader exits immediately -- was the only variant that
        # reproduced the defect's signature, 8/8 on both OS versions, where a file or a
        # live reader started 8/8.
        #
        # The guard goes in through sitecustomize rather than by overwriting the bundle's
        # unsloth_cli/__init__.py, because the shipped v0.1.51-beta package and this
        # checkout are different versions and overwriting one with the other would test a
        # version bump as much as a fix. sitecustomize loads the real _pipe_guard.py from
        # this checkout, by path, so what runs is the shipped fix and not a copy of it --
        # which is also why that module is dependency-free.
        run: |
          set -a; . ./clean-machine.env; set +a
          VENV="$HOME/.unsloth/studio/unsloth_studio"
          BIN_REAL="$VENV/bin/unsloth.real"
          [ -x "$BIN_REAL" ] || BIN_REAL="$VENV/bin/unsloth"
          SITE="$("$VENV/bin/python" -c 'import site; print(site.getsitepackages()[0])')"
          echo "site-packages: $SITE"

          deadpipe_trial() {
            label="$1"; base="$2"
            ones=0; started=0; other=0
            for i in $(seq 1 8); do
              port=$((base + i))
              rc=0
              timeout 25 "$BIN_REAL" studio --api-only -H 127.0.0.1 -p "$port" \
                2>&1 | head -0 > /dev/null || rc=$?
              rc=${PIPESTATUS[0]:-$rc}
              case "$rc" in
                124) started=$((started + 1)) ;;
                1)   ones=$((ones + 1)) ;;
                *)   other=$((other + 1)) ;;
              esac
              pkill -f "api-only -H 127.0.0.1 -p $port" 2>/dev/null || true
            done
            echo "$label: $started started, $ones silent exit 1, $other other"
          }

          echo "=== BEFORE: shipped bundle, reader-less pipe ==="
          deadpipe_trial "before" 8700

          cat > "$SITE/sitecustomize.py" <<SITEPY
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location(
              "_unsloth_pipe_guard", "$GITHUB_WORKSPACE/unsloth_cli/_pipe_guard.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.install()
          SITEPY
          "$VENV/bin/python" -c "import sys; print('guard active:', type(sys.stdout).__name__)"

          echo "=== AFTER: same bundle, same pipe, guard installed ==="
          deadpipe_trial "after " 8720
          rm -f "$SITE/sitecustomize.py"

      - name: The pipe guard's own tests
        if: always()
        run: |
          VENV="$HOME/.unsloth/studio/unsloth_studio"
          "$VENV/bin/python" -m pytest -q tests/studio/test_pipe_tolerant_stream.py 2>&1 | tail -25 \
            || echo "(pytest unavailable in the bundle venv; the CI matrix runs these elsewhere)"

      - name: Where exactly is the backend stuck?
        if: always()
        # The right instrument for a HANG, which is what D8 turned out to be. The shim
        # showed the child reaching the real entry point and then never exiting and never
        # printing -- alive, silent, not listening. A process that hangs cannot be
        # diagnosed from its output, because it has none; it has to be asked for its stack.
        #
        # py-spy goes into its OWN venv, never the studio one. Installing into the venv
        # under test would change the thing being measured, which is exactly the mistake
        # the first version of the shim made with its interpreter warm-up.
        run: |
          BACKEND_PID="$(pgrep -f 'unsloth studio --api-only' | head -1)"
          if [ -z "$BACKEND_PID" ]; then
            echo "no live 'unsloth studio --api-only' process to dump"
            exit 0
          fi
          echo "backend pid: $BACKEND_PID"
          echo "--- the kernel's view: state, and what it is blocked in ---"
          grep -E "^(State|Threads|VmRSS|SigBlk|SigIgn|SigCgt)" "/proc/$BACKEND_PID/status" 2>/dev/null || true
          echo "wchan: $(cat "/proc/$BACKEND_PID/wchan" 2>/dev/null || echo unknown)"
          echo "--- kernel stack of the main thread ---"
          sudo cat "/proc/$BACKEND_PID/stack" 2>/dev/null | head -20 || echo "(kernel stack unreadable)"
          echo "--- open fds: a hang on a socket, a pipe or a lock file shows here ---"
          ls -l "/proc/$BACKEND_PID/fd" 2>/dev/null | tail -25 || true
          echo "--- python stacks, every thread, with locals ---"
          python3 -m venv /tmp/pyspy-venv 2>/dev/null || true
          /tmp/pyspy-venv/bin/pip install -q py-spy 2>&1 | tail -2 || true
          sudo /tmp/pyspy-venv/bin/py-spy dump --pid "$BACKEND_PID" --locals 2>&1 | head -100 \
            || echo "(py-spy could not attach)"

      - name: What did the app's own log say?
        if: always()
        run: |
          # The backend the app spawns writes to ~/.unsloth/studio/logs (process.rs pipes
          # the child's stdout/stderr into diagnostics phase logs). Without these a
          # backend that fails to start leaves tauri.log ending at "spawned" and no
          # explanation anywhere -- which is exactly what the first run hit.
          cp -r "$HOME/.unsloth/studio/logs" logs/studio-logs 2>/dev/null || true
          cp -r "$HOME/.unsloth/studio/run" logs/studio-run 2>/dev/null || true
          for f in "$HOME/.unsloth/studio/tauri.log" logs/app-stdout.log; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            cp "$f" logs/ 2>/dev/null || true
            tail -80 "$f"
          done
          echo "=== backend phase logs ==="
          find "$HOME/.unsloth/studio/logs" -type f 2>/dev/null | head -20 | while read -r f; do
            echo "--- $f ---"; tail -60 "$f"
          done
          echo "=== listening sockets ==="
          ss -ltnp 2>/dev/null | head -20 || true
          echo "=== unsloth processes ==="
          ps aux | grep -i unsloth | grep -v grep | head -10 || true
          # D8: what the child itself saw, from inside the child. This is the one log
          # that survives the child dying before it flushes anything to the app's pipes.
          echo "=== the backend child's own log (D8 shim) ==="
          if [ -f "$HOME/unsloth-child.log" ]; then
            cp "$HOME/unsloth-child.log" logs/ 2>/dev/null || true
            cp "$HOME/unsloth-child.log.out" "$HOME/unsloth-child.log.err" logs/ 2>/dev/null || true
            cp "$HOME/unsloth-child.log.strace" logs/ 2>/dev/null || true
            cat "$HOME/unsloth-child.log"
            echo "=== what the backend WROTE (recovered past the app's pipe) ==="
            echo "--- stdout ---"; tail -60 "$HOME/unsloth-child.log.out" 2>/dev/null || echo "(nothing)"
            echo "--- stderr ---"; tail -60 "$HOME/unsloth-child.log.err" 2>/dev/null || echo "(nothing)"
            echo "--- the last syscalls before it died ---"
            tail -60 "$HOME/unsloth-child.log.strace" 2>/dev/null || echo "(no strace)"
          else
            echo "(the shim never ran -- the app never executed bin/unsloth at all)"
          fi
          echo "=== kernel ring buffer: was the child killed? ==="
          sudo dmesg -T 2>/dev/null | tail -80 | grep -iE "segfault|killed process|oom|unsloth|python|traps" \
            || echo "(nothing relevant in dmesg)"
          echo "=== memory headroom ==="
          free -m || true

      - name: Stop the app
        if: always()
        run: kill -TERM "${APP_PID:-0}" 2>/dev/null || true

      - name: Restore the runner
        if: always()
        run: |
          if [ -f .clean-machine/restore.sh ]; then
            bash .clean-machine/restore.sh
          else
            echo "no .clean-machine/restore.sh: nothing to restore"
          fi

      - name: If the backend never came up, run its exact command by hand
        # D8: on some Linux launches the app's spawned backend produces ZERO bytes and
        # never writes its session log -- the diagnostics phase log holds only the
        # "Starting backend:" meta line. That is either "the venv cannot run this
        # command on this machine" or "the exec was killed". Running the identical
        # command directly separates the two, which nothing in the app's own logs can.
        if: failure()
        run: |
          set -a; . ./clean-machine.env; set +a
          PY="$HOME/.unsloth/studio/unsloth_studio/bin/python"
          UNS="$HOME/.unsloth/studio/unsloth_studio/bin/unsloth"
          echo "=== can the venv python start at all? ==="
          "$PY" -c "import sys; print(sys.version)" || echo "venv python FAILED"
          echo "=== the exact command the app spawns, on a free port ==="
          timeout 300 env -u UNSLOTH_STUDIO_HOME "$UNS" studio --api-only \
            -H 127.0.0.1 -p 8907 > logs/manual-backend.log 2>&1 &
          MPID=$!
          for i in $(seq 1 60); do
            curl -fsS --max-time 3 http://127.0.0.1:8907/api/health >/dev/null 2>&1 && break
            sleep 5
          done
          if curl -fsS --max-time 3 http://127.0.0.1:8907/api/health >/dev/null 2>&1; then
            echo "::warning::the SAME command works when run directly -- so the venv is"
            echo "::warning::fine and the app's spawn path is what fails (D8)"
          else
            echo "::warning::the same command also fails when run directly -- the venv or"
            echo "::warning::its environment is what is broken, not the spawn path"
          fi
          echo "=== manual backend output ==="
          cat logs/manual-backend.log || true
          kill -TERM "$MPID" 2>/dev/null || true

      - name: D8 -- why did the app's own child produce zero bytes?
        # ubuntu-22.04 fails where 24.04 passes, on both .deb and .AppImage. The app logs
        # `start_managed_server spawned` and then NOTHING: no [backend] stdout, no
        # [stderr], and no server session log at all -- and the backend writes that within
        # its first three lines, so the child died before printing anything. Run by hand
        # on the same machine it comes up in ~12s.
        #
        # The app spawn and a shell spawn differ in environment, so dump both and diff
        # them. process.rs scrubs LD_LIBRARY_PATH/PYTHONHOME/PYTHONPATH only under
        # APPIMAGE, and its own comment says an unscrubbed one breaks the spawned Python
        # with "No module named encodings" -- exactly a child that dies before its first
        # print. The .deb leg takes no such scrub.
        if: failure()
        run: |
          set +e
          BIN="$HOME/.unsloth/studio/unsloth_studio/bin/unsloth"
          echo "=== the app's environment (saved at the liveness gate) ==="
          if [ -s logs/app-environ.txt ]; then
            grep -E '^(LD_LIBRARY_PATH|PYTHONHOME|PYTHONPATH|APPIMAGE|APPDIR|LD_PRELOAD|PATH)=' \
              logs/app-environ.txt | sed 's/^/  app: /'
          else
            echo "  (no capture; the gate could not read /proc/PID/environ)"
          fi
          echo "=== this shell's, for comparison ==="
          for v in LD_LIBRARY_PATH PYTHONHOME PYTHONPATH APPIMAGE APPDIR LD_PRELOAD; do
            echo "  shell: $v=${!v-<unset>}"
          done

          echo "=== does the child die under the app's LD_LIBRARY_PATH? ==="
          APPENV="$(grep '^LD_LIBRARY_PATH=' logs/app-environ.txt 2>/dev/null | cut -d= -f2-)"
          if [ -n "$APPENV" ]; then
            echo "  replaying with LD_LIBRARY_PATH=$APPENV"
            LD_LIBRARY_PATH="$APPENV" timeout 90 "$BIN" studio --api-only -H 127.0.0.1 -p 8971 \
              > logs/d8-replay.log 2>&1
            echo "  exit: $?"
            echo "  --- output (empty here reproduces the defect) ---"
            head -20 logs/d8-replay.log
          else
            echo "  the app has no LD_LIBRARY_PATH, so that is not the difference"
          fi
          exit 0

      - name: Upload logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-linux-deb-${{ matrix.os }}-${{ matrix.attempt }}
          path: |
            logs/
            artifacts/
          retention-days: 7
          if-no-files-found: warn
