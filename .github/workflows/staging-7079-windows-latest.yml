name: "staging-7079 windows-latest"
on:
  push:
    branches: ["pr-7079-xplat-ci"]
    paths:
      - 'studio/**'
      - '.github/workflows/staging-7079-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart ddgs
      - name: permission_mode + backward-compat suites
        run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_permission_mode.py studio/backend/tests/test_bypass_permissions.py studio/backend/tests/test_tool_confirm_loop.py studio/backend/tests/test_sandbox_tools.py studio/backend/tests/test_secure_tools_execute.py -q
