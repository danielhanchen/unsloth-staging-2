        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - name: Install frontend deps
        working-directory: studio/frontend
        run: npm ci --no-fund --no-audit
      - name: Node tests
        working-directory: studio/frontend
        run: node --experimental-strip-types --test tests/admission-sse-stream.test.ts tests/admission-status.test.ts tests/chat-continuation.test.ts tests/chat-runtime-reload-status.test.ts tests/chat-save-conflict-detail.test.ts tests/continuation-paused-reason.test.ts tests/durable-follower-renders-the-pause.test.ts tests/generation-length-toast-advice.test.ts tests/generation-tool-recovery.test.ts tests/load-rollback-after-lost-reply.test.ts tests/load-warning-toast.test.ts tests/paused-tool-turn-still-explains-itself.test.ts tests/preempt-gave-up-survives-reload.test.ts tests/preempt-gave-up-then-answered.test.ts tests/preempt-gave-up-turn.test.ts tests/thread-read-sharing.test.ts tests/tool-approval-gone.test.ts
