name: "staging-10301 windows-latest"
on:
  push:
    branches: ["pr-10301-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; ran=0; rm -f pytest_out.txt; r=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_a_declined_pause_unsticks_the_participant.py studio/backend/tests/test_a_failed_pause_wait_is_not_permission_to_decode.py studio/backend/tests/test_a_give_up_tells_the_client.py studio/backend/tests/test_a_holder_streaming_its_next_tool_call_is_still_preemptable.py studio/backend/tests/test_a_holder_that_parks_during_the_erases_keeps_its_charge.py studio/backend/tests/test_a_parallel_round_charges_its_arguments_once.py studio/backend/tests/test_a_pause_charges_what_the_attempt_decoded.py studio/backend/tests/test_a_pause_on_a_spent_cap_ends_the_turn.py studio/backend/tests/test_a_provider_round_bounds_its_overlap.py studio/backend/tests/test_a_reasoning_only_resume_keeps_the_whole_answer.py studio/backend/tests/test_a_resume_counts_only_the_cells_it_owns.py studio/backend/tests/test_a_resume_holds_its_room_and_a_pause_keeps_its_lease_alive.py studio/backend/tests/test_a_resume_keeps_the_thought_before_its_prose.py studio/backend/tests/test_a_resume_replays_its_prompt_and_a_choice_starts_afresh.py studio/backend/tests/test_a_solo_chat_pays_for_no_sweep.py studio/backend/tests/test_a_spent_allowance_is_not_charged_twice.py studio/backend/tests/test_a_waiting_chat_is_not_stuck_while_others_decode.py studio/backend/tests/test_admission_sse_contract.py studio/backend/tests/test_an_unavailable_slots_probe_says_so_once.py studio/backend/tests/test_arming_into_a_full_cache_costs_no_prefill.py studio/backend/tests/test_chat_generation_lease_compat.py studio/backend/tests/test_checkpoint_compaction.py studio/backend/tests/test_context_overflow_truncation.py studio/backend/tests/test_declined_continuation_tells_the_client.py studio/backend/tests/test_disarm_keeps_the_prefix_cache.py studio/backend/tests/test_durable_runs_relay_the_pause.py studio/backend/tests/test_external_tool_edge_cases.py studio/backend/tests/test_final_answer_pass_pauses_and_resumes.py studio/backend/tests/test_gguf_admission_token_count.py studio/backend/tests/test_llama_admission_compat_matrix.py studio/backend/tests/test_llama_admission_enforced_max_tokens.py studio/backend/tests/test_llama_admission_enforced_paths.py studio/backend/tests/test_llama_admission_kv_budget.py studio/backend/tests/test_llama_admission_kv_budget_media_and_tools.py studio/backend/tests/test_llama_admission_stated_cap_overcommits.py studio/backend/tests/test_llama_admission_unstated_max_tokens.py studio/backend/tests/test_llama_cpp_tool_loop.py studio/backend/tests/test_llama_plain_chat_preempt_resume.py studio/backend/tests/test_llama_preemption.py studio/backend/tests/test_llama_preemption_is_armed_on_chat_surfaces.py studio/backend/tests/test_llama_preemption_resume_order.py studio/backend/tests/test_llama_preemption_signal.py studio/backend/tests/test_llama_preemption_wiring.py studio/backend/tests/test_llama_server_args.py studio/backend/tests/test_llama_stream_preempt.py studio/backend/tests/test_llama_tool_loop_preempt_resume.py studio/backend/tests/test_parallel_round_budget_counts_launched_calls.py studio/backend/tests/test_parallel_round_divides_room_among_launched_calls.py studio/backend/tests/test_parallel_round_prepares_before_it_starts.py studio/backend/tests/test_parked_holder_gives_its_cells_back.py studio/backend/tests/test_preempt_resume_seam_is_seamless.py studio/backend/tests/test_preempt_resume_wastes_no_work.py studio/backend/tests/test_preempt_resumes_end_on_stalls_not_counts.py studio/backend/tests/test_preempt_signal_reaches_the_tool_loop_stream.py studio/backend/tests/test_preempted_usage_counts_every_attempt.py studio/backend/tests/test_preemption_matches_the_benchmarked_policy.py studio/backend/tests/test_preemption_survives_a_respawn_and_a_slow_server.py studio/backend/tests/test_preemption_sweep_arithmetic.py studio/backend/tests/test_preemption_wiring_holes.py studio/backend/tests/test_recost_wait_is_patient_with_a_busy_leader.py studio/backend/tests/test_research_internal_call_tool_gate.py studio/backend/tests/test_slot_probes_are_authenticated.py studio/backend/tests/test_studio_tool_loop.py studio/backend/tests/test_studio_tool_loop_preemption.py studio/backend/tests/test_the_anthropic_tool_loop_reports_like_the_gguf_one.py studio/backend/tests/test_the_batch_reserve_is_only_held_while_something_prefills.py studio/backend/tests/test_the_final_pass_charges_each_attempt_once.py studio/backend/tests/test_the_final_pass_stays_under_kv_control.py studio/backend/tests/test_the_optimism_matches_what_can_be_reclaimed.py studio/backend/tests/test_tool_calls_run_in_parallel.py studio/backend/tests/test_tool_calls_within_one_turn_overlap.py studio/backend/tests/test_tool_loop_arms_after_its_admission_wait.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' >> pytest_out.txt 2>&1 || r=$?; if [ "$r" != "5" ]; then ran=1; if [ "$r" -gt "$rc" ]; then rc=$r; fi; fi; if [ "$ran" = "0" ]; then rc=5; fi; cat pytest_out.txt; tot=$(grep -cE "^(FAILED|ERROR) " pytest_out.txt) || tot=0; dep=$(grep -cE "^(FAILED|ERROR) .* ((ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers).|ImportError. Unsloth. (torch|unsloth_zoo|transformers) not found. Please install .*)$" pytest_out.txt) || dep=0; bare=$(awk '/^_+ ERROR collecting [^ ]+ _+$/ {cur=$4; next} /^(=|_)+ / {cur=""} cur != "" && /((ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers).|ImportError. Unsloth. (torch|unsloth_zoo|transformers) not found)/ {ok[cur]=1} /^ERROR [^ ]+$/ && ($2 in ok) {n++} END {print n+0}' pytest_out.txt) || bare=0; dep=$((dep + bare)); if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers).|Unsloth. (torch|unsloth_zoo|transformers) not found" pytest_out.txt && { [ "$tot" = "0" ] || [ "$tot" = "$dep" ]; }; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" = "1" ] && [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; exit "$rc"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - name: Install frontend deps
        working-directory: studio/frontend
        run: npm ci --no-fund --no-audit
      - name: Node tests
        working-directory: studio/frontend
        run: node --experimental-strip-types --test tests/admission-sse-stream.test.ts tests/admission-status.test.ts tests/chat-continuation.test.ts tests/chat-runtime-reload-status.test.ts tests/chat-save-conflict-detail.test.ts tests/continuation-paused-reason.test.ts tests/durable-follower-renders-the-pause.test.ts tests/generation-length-toast-advice.test.ts tests/generation-tool-recovery.test.ts tests/load-rollback-after-lost-reply.test.ts tests/load-warning-toast.test.ts tests/preempt-gave-up-survives-reload.test.ts tests/preempt-gave-up-then-answered.test.ts tests/preempt-gave-up-turn.test.ts tests/tool-approval-gone.test.ts
