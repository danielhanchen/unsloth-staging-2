kend/tests/test_the_optimism_matches_what_can_be_reclaimed.py studio/backend/tests/test_tool_approval_context_release.py studio/backend/tests/test_tool_calls_run_in_parallel.py studio/backend/tests/test_tool_calls_within_one_turn_overlap.py studio/backend/tests/test_tool_loop_arms_after_its_admission_wait.py studio/backend/tests/test_two_probes_started_on_one_epoch_keep_the_later_reading.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' >> pytest_out.txt 2>&1 || r=$?; if [ "$r" != "5" ]; then ran=1; if [ "$r" -gt "$rc" ]; then rc=$r; fi; fi; if [ "$ran" = "0" ]; then rc=5; fi; cat pytest_out.txt; tot=$(grep -cE "^(FAILED|ERROR) " pytest_out.txt) || tot=0; dep=$(grep -cE "^(FAILED|ERROR) .* ((ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers).|ImportError. Unsloth. (torch|unsloth_zoo|transformers) not found. Please install .*)$" pytest_out.txt) || dep=0; bare=$(awk '/^_+ ERROR collecting [^ ]+ _+$/ {cur=$4; next} /^(=|_)+ / {cur=""} cur != "" && /((ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers).|ImportError. Unsloth. (torch|unsloth_zoo|transformers) not found)/ {ok[cur]=1} /^ERROR [^ ]+$/ && ($2 in ok) {n++} END {print n+0}' pytest_out.txt) || bare=0; dep=$((dep + bare)); if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers).|Unsloth. (torch|unsloth_zoo|transformers) not found" pytest_out.txt && { [ "$tot" = "0" ] || [ "$tot" = "$dep" ]; }; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" = "1" ] && [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; exit "$rc"
