name: "staging-10301 windows-latest"
on:
  push:
    branches: ["pr-10301-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; ran=0; rm -f pytest_out.txt; r=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_a_cancelled_round_drains_every_call.py studio/backend/tests/test_a_caption_holder_is_refused_when_its_victims_stay_wedged.py studio/backend/tests/test_a_closed_gguf_round_stops_its_siblings.py studio/backend/tests/test_a_contended_report_reclaims_idle_residue_before_it_plans.py studio/backend/tests/test_a_diffusion_runner_never_asks_for_an_exact_reload.py studio/backend/tests/test_a_direct_holder_never_goes_upstream_before_its_victims_let_go.py studio/backend/tests/test_a_direct_holder_waits_for_its_victims_to_let_go.py studio/backend/tests/test_a_direct_holder_waits_for_the_victim_that_replaced_a_revoked_one.py studio/backend/tests/test_a_failed_pause_wait_is_not_permission_to_decode.py studio/backend/tests/test_a_failed_props_read_keeps_the_park_notices.py studio/backend/tests/test_a_first_token_waits_for_a_probe_started_after_it.py studio/backend/tests/test_a_fitted_plain_prompt_is_what_the_ledger_counts.py studio/backend/tests/test_a_generically_erased_approval_waits_to_recost.py studio/backend/tests/test_a_holder_that_parks_during_the_erases_keeps_its_charge.py studio/backend/tests/test_a_legacy_completion_is_counted_beside_a_chat.py studio/backend/tests/test_a_load_in_flight_counts_for_the_exact_reload.py studio/backend/tests/test_a_long_prefill_keeps_its_batch_reserve.py studio/backend/tests/test_a_parallel_round_charges_its_arguments_once.py studio/backend/tests/test_a_parallel_round_classifies_the_healed_arguments_before_overlapping.py studio/backend/tests/test_a_parallel_round_dedupes_healed_calls_and_freezes_its_branch.py studio/backend/tests/test_a_park_keepalive_cannot_outlive_the_cap.py studio/backend/tests/test_a_parked_victim_counts_as_freed_only_once_erased.py studio/backend/tests/test_a_parking_server_admits_every_chat_that_fits_alone.py studio/backend/tests/test_a_pause_inside_a_textual_tool_call_restarts_the_call.py studio/bac