name: video-xplat
on: [push]
concurrency:
  group: video-xplat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      UNSLOTH_IS_PRESENT: "1"
      UNSLOTH_COMPILE_DISABLE: "1"
      UNSLOTH_ALLOW_CPU: "1"
      UNSLOTH_STUDIO_DISABLE_DEVICE_PROBE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart httpx
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: run the video behaviour suite
        working-directory: studio/backend
        run: python -m pytest tests/test_video_chat_completions_behaviour.py -q --tb=short
