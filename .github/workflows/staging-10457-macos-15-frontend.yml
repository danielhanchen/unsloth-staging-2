name: "staging-10457 macos-15 frontend"
on:
  push:
    branches: ["pr-10457-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: studio/frontend
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: node --experimental-strip-types --no-warnings --test tests/mlx-community-repo-detection.test.ts
