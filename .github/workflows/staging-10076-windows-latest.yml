name: "staging-10076 windows-latest"
on:
  push:
    branches: ["pr-10076-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_consent_gate.py studio/backend/tests/test_export_absolute_paths.py studio/backend/tests/test_hub_download_ambient_token.py studio/backend/tests/test_hub_token_cache_isolation.py studio/backend/tests/test_hub_token_caller_identity.py studio/backend/tests/test_non_gguf_reload_settings.py tests/kaggle/test_t4_smoke_harness.py tests/studio/test_cache_budget_discipline.py tests/studio/test_cli_attach_load_knobs.py tests/studio/test_mlx_context_platform_matrix.py tests/studio/test_model_picker_contracts.py tests/test_rl_config_compat.py tests/test_warnings_issued_guard.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out.txt 2>&1 || rc=$?; cat pytest_out.txt; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && ! grep -qE "^FAILED " pytest_out.txt; then errs=$(grep -cE "^ERROR " pytest_out.txt); dep=$(grep -cE "^E +ModuleNotFoundError:.+No module named .(torch|unsloth_zoo|transformers).$" pytest_out.txt); if [ "$errs" -gt 0 ] && [ "$errs" = "$dep" ]; then echo "collection needs a dep this runner does not ship"; rc=0; fi; fi; if [ "$rc" = "1" ] && ! grep -qE "^ERROR " pytest_out.txt; then tot=$(grep -cE "^FAILED " pytest_out.txt); dep=$(grep -cE "^FAILED .* No module named .(torch|unsloth_zoo|transformers).$" pytest_out.txt); if [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; fi; exit "$rc"
