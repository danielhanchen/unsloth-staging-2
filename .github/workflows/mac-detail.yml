name: mac new failures detail
on:
  push:
    branches: [pr-11209-xplat-ci]
  workflow_dispatch:
jobs:
  detail:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - name: The two tests that differ from the base arm, with full tracebacks
        run: |
          PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_tool_output_streaming.py \
            -vv --tb=long -k "missing_path_hint or grandchild_after_leader_exit" || true
