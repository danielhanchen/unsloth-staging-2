name: "staging-10285 fix macOS (shipped vs fixed)"

on:
  push:
    branches: [pr-10285-fix-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: ${{ matrix.runner }} ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
        include:
          - label: shipped
            ref: 35d6cd295aa8031d9376b425c1c953a2ed39d644
          - label: fixed
            ref: pr-10285-fixed
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Fetch the probe driver from the workflow branch
        run: |
          git fetch --depth 1 origin pr-10285-fix-ci
          git show origin/pr-10285-fix-ci:.github/scripts/pr10285_probe.py > /tmp/pr10285_probe.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps
        run: |
          python -m pip install -q -r studio/backend/requirements/studio.txt
          python -m pip install -q python-multipart aiofiles sqlalchemy cryptography psutil pyyaml jinja2 mammoth requests 'numpy<3' pytest pytest-asyncio httpx structlog 'transformers>=4.51,<5.5'
          python -m pip install -q 'torch>=2.4,<2.11'
      - name: Host facts
        run: echo "PR10285_HOST runner=${{ matrix.runner }} ref=${{ matrix.label }} arch=$(uname -m) macos=$(sw_vers -productVersion) python=$(which python)"
      - name: Capability probe
        working-directory: studio/backend
        run: |
          python /tmp/pr10285_probe.py capability --label first
          python /tmp/pr10285_probe.py capability --label second
      - name: All sandbox suites in ONE pytest session (contamination check)
        working-directory: studio/backend
        run: |
          python -m pytest -q -rs --tb=short -p no:cacheprovider tests/test_macos_seatbelt.py tests/test_os_sandbox.py tests/test_tool_isolation_api.py tests/test_bypass_permissions.py tests/test_orphaned_children.py tests/test_secure_tools_execute.py tests/test_safetensors_tool_loop.py tests/test_studio_tool_loop.py tests/test_tool_output_streaming.py tests/test_full_access_tool_prompt.py tests/test_tool_loop_controller.py tests/test_exec_utf8.py -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' 2>&1 | grep -E "^(FAILED|ERROR)|passed|failed|SKIPPED" | sed 's/ - .*//' | sort -u | tail -60
      - name: Terminal escape probe
        working-directory: studio/backend
        run: python /tmp/pr10285_probe.py escape
      - name: Python tool escape probe
        working-directory: studio/backend
        run: python /tmp/pr10285_probe.py python-escape
      - name: Limited mode detached child check
        working-directory: studio/backend
        run: python /tmp/pr10285_probe.py limited-survivor || true
