name: mlx-zbase-verify

on:
  push:
    branches: ["mlx-zbase-*"]
  workflow_dispatch: {}

concurrency:
  group: mlx-zbase-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_XET: "1"
  HF_HUB_DOWNLOAD_TIMEOUT: "60"
  TOKENIZERS_PARALLELISM: "false"
  UNSLOTH_DIFFUSION_NO_MIRROR: "1"
  STUDIO_SHA: 0c1fef29be09c2b738f2c3738b5a31738f1612be

jobs:
  bisect:
    runs-on: macos-15
    timeout-minutes: 200
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Studio trees (main and head = main + fix)
        run: |
          set -euo pipefail
          mkdir -p out/logs
          git init -q base && git -C base remote add origin https://github.com/unslothai/unsloth
          git -C base fetch -q --depth 1 origin "$STUDIO_SHA" && git -C base checkout -q FETCH_HEAD
          git -C base log -1 --format='main %H %cI' | tee out/revisions.txt
          cp -R base head
          git -C head apply --whitespace=nowarn ../patches/head.patch
          git -C head diff --stat | tee -a out/revisions.txt
      - name: Install
        run: |
          set -euo pipefail
          {
            python -m pip install --upgrade pip
            pip install "mlx>=0.32.0,<0.33.0"
            pip install "mflux==0.24.0" --no-deps
            pip install "transformers>=5.5.0,<6" tokenizers "huggingface_hub>=1.1.6,<2" piexif platformdirs regex \
              toml tqdm pyyaml rich sentencepiece safetensors numpy gguf requests jinja2 filelock
            pip install fastapi pydantic structlog attrs cryptography pyjwt email-validator python-multipart \
              sqlite-vec httpx psutil
            pip install "pillow>=12.3.0,<13"
            python -c "import PIL._typing, jinja2, mflux.models.z_image; print('imports ok')"
            pip freeze
          } 2>&1 | tee out/logs/install.log
          { sysctl -n machdep.cpu.brand_string hw.memsize hw.ncpu; sw_vers; df -h .; } | tee out/logs/env.txt
      - name: Downloads (no XET)
        run: |
          set -euo pipefail
          python - <<'EOF' 2>&1 | tee out/logs/download.log
          import time
          from huggingface_hub import hf_hub_download, snapshot_download
          t = time.time()
          pats = ["text_encoder/*", "tokenizer/*", "vae/*", "scheduler/*", "model_index.json"]
          print(hf_hub_download("unsloth/Z-Image-GGUF", "z-image-Q4_0.gguf"), round(time.time() - t), flush=True)
          print(snapshot_download("Tongyi-MAI/Z-Image", allow_patterns=pats), round(time.time() - t), flush=True)
          print(hf_hub_download("unsloth/Z-Image-Turbo-GGUF", "z-image-turbo-Q4_0.gguf"), round(time.time() - t), flush=True)
          print(snapshot_download("Tongyi-MAI/Z-Image-Turbo", allow_patterns=pats), round(time.time() - t), flush=True)
          EOF
          df -h . | tee -a out/logs/env.txt
      - name: Arms
        run: |
          set +e -uo pipefail
          rmconv() { python -c "import json,shutil,sys; d=json.load(open(sys.argv[1])).get('convert_dir'); d and shutil.rmtree(d, ignore_errors=True); print('removed', d)" "$1"; }
          arm() { tag=$1; tree=$2; shift 2
            env "$@" python -u bench/zb_arm.py --backend-dir $tree/studio/backend --out out --tag $tag $ARGS > out/logs/$tag.log 2>&1
            echo "$tag rc=$?" | tee -a out/rc.txt; grep -E " (load|text|probe|gen|steps) " out/logs/$tag.log | cut -c1-500; }
          UNSLOTH_DIFFUSION_MLX_DENSE_BITS=0 UNSLOTH_DIFFUSION_MLX_PRECISION=bf16 python -u bench/zb_ablate.py \
            --backend-dir head/studio/backend --out out > out/logs/ablate.log 2>&1
          echo "ablate rc=$?" | tee -a out/rc.txt; grep -E "ablate (ref|.*@)" out/logs/ablate.log | cut -c1-400; rmconv out/ablate.json
          ZB="--guidance 3.0 --steps 12"
          ARGS="$ZB"; arm vb_main_def base; rmconv out/vb_main_def.json
          ARGS="$ZB"; arm vb_head_def head
          ARGS="$ZB"; arm vb_head_fp16 head UNSLOTH_DIFFUSION_MLX_PRECISION=fp16
          TB="--repo unsloth/Z-Image-Turbo-GGUF --gguf z-image-turbo-Q4_0.gguf --base-repo Tongyi-MAI/Z-Image-Turbo --guidance 0 --steps 9 --no-probe --fox"
          ARGS="$TB"; arm vt_main base
          ARGS="$TB"; arm vt_head head
          ARGS="$TB"; arm vt_main_2 base
          rmconv out/vt_main.json
          ARGS="--guidance 3.0 --steps 25 --no-probe"; arm vb_head_def_25 head
          rmconv out/vb_head_def.json
          cat out/rc.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zverify-studio
          path: out
          retention-days: 14
      - name: mflux-only reference (Hub bf16 weights, mflux quantize 4)
        run: |
          set +e -uo pipefail
          python - <<'EOF' 2>&1 | tee -a out/logs/download.log
          import shutil, time
          from huggingface_hub import scan_cache_dir, snapshot_download
          for repo in scan_cache_dir().repos:
              if repo.repo_id in ("Tongyi-MAI/Z-Image-Turbo", "unsloth/Z-Image-Turbo-GGUF"):
                  shutil.rmtree(repo.repo_path, ignore_errors=True); print("removed", repo.repo_id)
          t = time.time()
          print(snapshot_download("Tongyi-MAI/Z-Image", allow_patterns=["transformer/*"]), round(time.time() - t), flush=True)
          EOF
          df -h . | tee -a out/logs/env.txt
          python -u bench/zb_arm.py --mode mflux --quantize 4 --out out --tag m_ref_q4 --guidance 3.0 --steps 12 > out/logs/m_ref_q4.log 2>&1
          echo "m_ref_q4 rc=$?" | tee -a out/rc.txt; grep -E " (load|text|probe|gen|steps) " out/logs/m_ref_q4.log | cut -c1-500; tail -3 out/logs/m_ref_q4.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zverify-all
          path: out
          retention-days: 14
