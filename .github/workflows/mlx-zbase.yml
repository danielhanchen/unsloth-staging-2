name: mlx-zbase-bisect

on:
  push:
    branches: ["mlx-zbase-*"]
  workflow_dispatch: {}

concurrency:
  group: mlx-zbase-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_XET: "1"
  HF_HUB_DOWNLOAD_TIMEOUT: "60"
  TOKENIZERS_PARALLELISM: "false"
  UNSLOTH_DIFFUSION_NO_MIRROR: "1"
  STUDIO_SHA: 0c1fef29be09c2b738f2c3738b5a31738f1612be

jobs:
  bisect:
    runs-on: macos-15
    timeout-minutes: 200
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Studio tree
        run: |
          set -euo pipefail
          mkdir -p out/logs
          git init -q base && git -C base remote add origin https://github.com/unslothai/unsloth
          git -C base fetch -q --depth 1 origin "$STUDIO_SHA" && git -C base checkout -q FETCH_HEAD
          git -C base log -1 --format='studio %H %cI' | tee out/revisions.txt
      - name: Install
        run: |
          set -euo pipefail
          {
            python -m pip install --upgrade pip
            pip install "mlx>=0.32.0,<0.33.0"
            pip install "mflux==0.24.0" --no-deps
            pip install "transformers>=5.5.0,<6" tokenizers "huggingface_hub>=1.1.6,<2" piexif platformdirs regex \
              toml tqdm pyyaml rich sentencepiece safetensors numpy gguf requests jinja2 filelock
            pip install fastapi pydantic structlog attrs cryptography pyjwt email-validator python-multipart \
              sqlite-vec httpx psutil
            pip install "pillow>=12.3.0,<13"
            python -c "import PIL._typing, jinja2, mflux.models.z_image; print('imports ok')"
            pip freeze
          } 2>&1 | tee out/logs/install.log
          { sysctl -n machdep.cpu.brand_string hw.memsize hw.ncpu; sw_vers; df -h .; } | tee out/logs/env.txt
      - name: Downloads (no XET)
        run: |
          set -euo pipefail
          python - <<'EOF' 2>&1 | tee out/logs/download.log
          import time
          from huggingface_hub import hf_hub_download, snapshot_download
          t = time.time()
          print(hf_hub_download("unsloth/Z-Image-GGUF", "z-image-Q4_0.gguf"), round(time.time() - t), flush=True)
          print(snapshot_download("Tongyi-MAI/Z-Image", allow_patterns=["text_encoder/*", "tokenizer/*", "vae/*", "scheduler/*", "model_index.json"]), round(time.time() - t), flush=True)
          EOF
      - name: Arms
        run: |
          set +e -uo pipefail
          arm() { tag=$1; shift
            env "$@" python -u bench/zb_arm.py --backend-dir base/studio/backend --out out --tag $tag $ARGS > out/logs/$tag.log 2>&1
            echo "$tag rc=$?" | tee -a out/rc.txt; grep -E " (load|text|probe|gen|steps) " out/logs/$tag.log | cut -c1-600; }
          ARGS="--guidance 3.0"; arm s_bf16_cfg3 UNSLOTH_DIFFUSION_MLX_PRECISION=bf16 UNSLOTH_DIFFUSION_MLX_DENSE_BITS=4 UNSLOTH_DIFFUSION_MLX_TE_BITS=4
          ARGS="--guidance 1.0"; arm s_bf16_cfg1 UNSLOTH_DIFFUSION_MLX_PRECISION=bf16 UNSLOTH_DIFFUSION_MLX_DENSE_BITS=4 UNSLOTH_DIFFUSION_MLX_TE_BITS=4
          ARGS="--guidance 3.0"; arm s_bf16_d0 UNSLOTH_DIFFUSION_MLX_PRECISION=bf16 UNSLOTH_DIFFUSION_MLX_DENSE_BITS=0 UNSLOTH_DIFFUSION_MLX_TE_BITS=4
          ARGS="--guidance 3.0"; arm s_bf16_te8 UNSLOTH_DIFFUSION_MLX_PRECISION=bf16 UNSLOTH_DIFFUSION_MLX_DENSE_BITS=4 UNSLOTH_DIFFUSION_MLX_TE_BITS=8
          ARGS="--guidance 3.0"; arm s_fp16_cfg3 UNSLOTH_DIFFUSION_MLX_PRECISION=fp16 UNSLOTH_DIFFUSION_MLX_DENSE_BITS=4 UNSLOTH_DIFFUSION_MLX_TE_BITS=4
          ARGS="--guidance 3.0 --scheduler linear"; arm s_bf16_linear UNSLOTH_DIFFUSION_MLX_PRECISION=bf16 UNSLOTH_DIFFUSION_MLX_DENSE_BITS=4 UNSLOTH_DIFFUSION_MLX_TE_BITS=4
          cat out/rc.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zbase-studio
          path: out
          retention-days: 14
      - name: mflux-only reference (Hub bf16 weights, quantize 4) + weight check
        run: |
          set +e -uo pipefail
          rm -rf out/*.png.tmp
          python - <<'EOF' 2>&1 | tee -a out/logs/download.log
          import time
          from huggingface_hub import snapshot_download
          t = time.time()
          print(snapshot_download("Tongyi-MAI/Z-Image", allow_patterns=["transformer/*"]), round(time.time() - t), flush=True)
          EOF
          python -u bench/zb_arm.py --mode mflux --quantize 4 --out out --tag m_ref_q4 --guidance 3.0 > out/logs/m_ref_q4.log 2>&1
          echo "m_ref_q4 rc=$?" | tee -a out/rc.txt; grep -E " (load|text|probe|gen|steps) " out/logs/m_ref_q4.log | cut -c1-600
          HFD=$(python -c "from huggingface_hub import snapshot_download as s; print(s('Tongyi-MAI/Z-Image', allow_patterns=['transformer/*'], local_files_only=True))")/transformer
          for d in 4 0; do
            CD=$(python -c "import json,sys; d=json.load(open('out/s_bf16_$([ $d = 4 ] && echo cfg3 || echo d0).json')); print(d.get('convert_dir',''))")
            [ -n "$CD" ] && python -u bench/wcheck.py --converted "$CD/transformer/0.safetensors" --hf-dir "$HFD" --out out/wcheck_d$d.json > out/logs/wcheck_d$d.log 2>&1
            echo "wcheck_d$d rc=$?" | tee -a out/rc.txt; head -c 3000 out/logs/wcheck_d$d.log
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zbase-all
          path: out
          retention-days: 14
