name: "staging-11672 macos-15"
on:
  push:
    branches: ["pr-11672-mlxdefault-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest tests/test_image_processing_reexports.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out.txt 2>&1 || rc=$?; cat pytest_out.txt; tot=$(grep -cE "^(FAILED|ERROR) " pytest_out.txt) || tot=0; dep=$(grep -cE "^(FAILED|ERROR) .* (ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers).$" pytest_out.txt) || dep=0; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers)." pytest_out.txt && { [ "$tot" = "0" ] || [ "$tot" = "$dep" ]; }; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" = "1" ] && [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; exit "$rc"
      - name: "jobs: install MLX (Apple Silicon)"
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch
          for attempt in 1 2 3; do python -m pip install "unsloth_zoo @ git+https://github.com/unslothai/unsloth-zoo" && break; [ "$attempt" = 3 ] && exit 1; sleep $((5 * attempt)); done
          python -m pip install -e . --no-deps
          python -m pip install -U transformers mlx-vlm mlx-lm
          python -m pip list 2>/dev/null | grep -iE '^(transformers|mlx|mlx-lm|mlx-vlm|trl|peft|torch) '
      - name: "job: mlx_sft (MLX (Apple Silicon))"
        if: ${{ !cancelled() }}
        run: |
          env -u UNSLOTH_IS_PRESENT -u UNSLOTH_COMPILE_DISABLE python .github/scripts/jobs/mlx_sft.py --out job_0_mlx_sft_macos-15.json
      - name: "job: mlx_sft --memorise (MLX (Apple Silicon))"
        if: ${{ !cancelled() }}
        run: |
          env -u UNSLOTH_IS_PRESENT -u UNSLOTH_COMPILE_DISABLE python .github/scripts/jobs/mlx_sft.py --memorise --out job_1_mlx_sft_macos-15.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: job-results-macos-15
          path: job_*.json
          if-no-files-found: warn
