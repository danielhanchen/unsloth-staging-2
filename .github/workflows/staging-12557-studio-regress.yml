  diff-ubuntu-latest:
    needs: [before-fast-ubuntu-latest, after-fast-ubuntu-latest, before-model-ubuntu-latest, after-model-ubuntu-latest, desktop-before, desktop-after]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
