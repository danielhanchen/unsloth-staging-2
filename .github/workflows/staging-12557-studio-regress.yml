name: "staging-12557 studio-regress"
on:
  push:
    branches: ["pr-12557-regress-ci"]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  before-fast-ubuntu-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SR_HOME: ${{ github.workspace }}/sr-home
      UNSLOTH_STUDIO_HOME: ${{ github.workspace }}/sr-home
      # The installer's uv-managed interpreter (the venv's base python) must be cached with the
      # install: under ~/.local/share/uv a restored venv points at a python the new runner lacks.
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/sr-uv-python
      UNSLOTH_DISABLE_UPDATE_CHECK: '1'
      UNSLOTH_STUDIO_DISABLE_PUBLIC_CHECK: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      STUDIO_REGRESS_UPSTREAM_SUITES: 'playwright_chat_ui.py,playwright_extra_ui.py'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: 6a25e672f50ef362b8faf5c29268865386767615
          path: src
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Studio install cache (6a25e672f)
        id: sr-install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # --local installs editable from src/: the built frontend lives in the checkout, not the home
          path: |
            sr-home
            sr-uv-python
            src/studio/frontend/dist
          key: sr-studio-v3-ubuntu-latest-6a25e672f50ef362b8faf5c29268865386767615
      - name: Tiny model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          # engine.SUITE_HF_HOME: run.py prefetches into <workspace>/temp/studio_regress/hf_home
          # (WORKSPACE unset here, so the checkout root), never ~/.cache/huggingface
          path: temp/studio_regress/hf_home
          key: sr-hf-v2-ubuntu-latest-e2a093344a8a
      - name: Install Studio at before (6a25e672f)
        if: steps.sr-install.outputs.cache-hit != 'true'
        working-directory: src
        shell: bash
        run: |
          ./install.sh --local --no-torch
      - name: Playwright
        shell: bash
        run: |
          pip install 'playwright<2' httpx pillow numpy
          python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Journeys (fast, before)
        shell: bash
        env:
          PYTHONPATH: harness/.github/scripts
          # Windows: UTF-8 file and pipe I/O for the harness and the Studio it launches (cp1252 otherwise)
          PYTHONUTF8: '1'
        run: |
          set +e
          python harness/.github/scripts/studio_regress/run.py --pr 12557 --repo src --side before \
            --home-before "$SR_HOME" --tier fast --only auth,settings,model_picker,crawl --root out --json > out-before-fast.json
          echo "rc=$?" | tee out-before-fast.rc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: studio-regress-ubuntu-latest-before-fast
          path: |
            out/
            out-before-fast.*
            sr-home/logs/
          if-no-files-found: warn
