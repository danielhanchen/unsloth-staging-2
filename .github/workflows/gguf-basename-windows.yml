name: "PR-7897 gguf basename (windows-latest)"
on:
  push:
    branches: [pr7897-cross-os]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CUDA_VISIBLE_DEVICES: ""
      UNSLOTH_ALLOW_CPU: "1"
      UNSLOTH_IS_PRESENT: "1"
      UNSLOTH_COMPILE_DISABLE: "1"
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }
      - name: Ground truth on a REAL Windows runner
        run: |
          python -c "import os,sys; r=os.path.join(r'C:\exp\_gguf', r'D:\M\X.Q5_K_M.gguf'); print('join ->', r); sys.exit(0 if r==r'D:\M\X.Q5_K_M.gguf' else 1)"
          python -c "import glob,os,sys,tempfile; d=tempfile.mkdtemp(); open(os.path.join(d,'.BF16.gguf'),'w').close(); g=glob.glob(os.path.join(d,'*.gguf')); print('glob ->', g); sys.exit(0 if g==[] else 1)"
      - name: Drive letters available
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Select-Object Name,Root
      - run: python -m pip install pytest
      - name: Basename + native Windows semantics
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_gguf_model_basename.py tests/test_gguf_windows_native.py -q -p no:cacheprovider
