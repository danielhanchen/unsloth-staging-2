name: q21-mps-fuse-bench

on:
  push:
    branches: ["mps-q21fuse-*"]
  workflow_dispatch: {}

concurrency:
  group: q21-mps-fuse-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  MERGE_BASE: 0c1fef29be09c2b738f2c3738b5a31738f1612be

jobs:
  bench:
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Base and head trees
        run: |
          set -euo pipefail
          mkdir -p out/logs
          git init -q base && git -C base remote add origin https://github.com/unslothai/unsloth
          git -C base fetch -q --depth 1 origin "$MERGE_BASE" && git -C base checkout -q FETCH_HEAD
          git -C base log -1 --format='base %H %cI' | tee out/revisions.txt
          cp -R base head
          git -C head apply --whitespace=nowarn ../patches/head.patch
          git -C head status --short | tee -a out/revisions.txt
      - name: Install
        run: |
          set -euo pipefail
          {
            python -m pip install --upgrade pip
            pip install torch "diffusers==0.42.1" "transformers>=5.5.0,<6" "huggingface_hub>=1.1.6,<2" safetensors numpy \
              pillow regex requests filelock importlib_metadata pyyaml
            pip install fastapi pydantic structlog attrs cryptography pyjwt email-validator python-multipart \
              httpx psutil pytest pytest-asyncio pytest-timeout
            # torch 2.15 skips the runner's paravirtual GPU (no Metal 2.0 trigonometric support): newest torch that keeps it.
            chosen=""
            for v in 2.14.1 2.13.0 2.12.1 2.11.0 2.10.0 2.9.1 2.8.0; do
              pip install -q "torch==$v" || continue
              rm -f mps_ok; python bench/probe.py head/studio/backend || echo "probe rc=$?"
              if [ -f mps_ok ]; then chosen=$v; break; fi
            done
            echo "chosen torch: ${chosen:-none}"
            test -n "$chosen"
            pip freeze
          } 2>&1 | tee out/logs/install.log
          { sysctl -n machdep.cpu.brand_string hw.memsize hw.ncpu; sw_vers; system_profiler SPDisplaysDataType || true; } 2>&1 | tee out/logs/env.txt
      - name: Head CPU unit tests (and the patch registry parity)
        run: |
          set +e -o pipefail
          cd head/studio/backend
          python -m pytest -p no:cacheprovider -q -rfEs tests/test_diffusion_qwenimage21_mps.py tests/test_diffusion_qwenimage21_math.py \
            tests/test_diffusion_autoopt_core.py 2>&1 | tee ../../../out/logs/pytest_head.log
          echo "pytest rc=${PIPESTATUS[0]}" | tee -a ../../../out/logs/pytest_head.log
      - name: Arms
        run: |
          set +e -uo pipefail
          run() { tag=$1; tree=$2; shift 2
            env "$@" python -u bench/arm.py --backend-dir $tree/studio/backend --out out --tag $tag $EXTRA > out/logs/$tag.log 2>&1; rc=$?
            echo "$tag rc=$rc" | tee -a out/rc.txt; tail -3 out/logs/$tag.log; }
          EXTRA=""
          run base_1 base X=1
          run head_1 head X=1
          run base_2 base X=1
          run head_2 head X=1
          run head_mod head UNSLOTH_DIFFUSION_Q21_MPS_RESIDUAL=0 UNSLOTH_DIFFUSION_Q21_MPS_ROPE=0
          run head_res head UNSLOTH_DIFFUSION_Q21_MPS_MODULATE=0 UNSLOTH_DIFFUSION_Q21_MPS_ROPE=0
          run head_rope head UNSLOTH_DIFFUSION_Q21_MPS_MODULATE=0 UNSLOTH_DIFFUSION_Q21_MPS_RESIDUAL=0
          run head_off head UNSLOTH_DIFFUSION_Q21_MPS_FUSED=0
          run base_3 base X=1
          EXTRA="--ops"
          run head_ops head X=1
          cat out/rc.txt
          python bench/summarize.py out | tee out/summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q21-mps-fuse
          path: out
          retention-days: 14

  studio_load:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Base and head trees
        run: |
          set -euo pipefail
          mkdir -p out/logs
          git init -q base && git -C base remote add origin https://github.com/unslothai/unsloth
          git -C base fetch -q --depth 1 origin "$MERGE_BASE" && git -C base checkout -q FETCH_HEAD
          cp -R base head
          git -C head apply --whitespace=nowarn ../patches/head.patch
          git -C head status --short | tee out/revisions.txt
      - name: Install Studio Mac deps with torch 2.14.1 (2.15 skips the paravirtual GPU)
        run: |
          set -euo pipefail
          {
            python -m pip install --upgrade pip
            pip install "torch==2.14.1" "diffusers==0.42.1" "transformers>=5.5.0,<6" "huggingface_hub>=1.1.6,<2" safetensors \
              numpy pillow regex requests filelock importlib_metadata pyyaml accelerate sentencepiece tokenizers torchvision
            pip install fastapi pydantic structlog attrs cryptography pyjwt email-validator python-multipart \
              httpx psutil pytest
            pip install git+https://github.com/unslothai/unsloth_zoo --no-deps || echo "unsloth_zoo install failed"
            pip freeze
          } 2>&1 | tee out/logs/install.log
      - name: Probes and fast-math check
        run: |
          set +e -o pipefail
          python bench/probe.py head/studio/backend 2>&1 | tee out/logs/probe.log
      - name: Eager-tier install test with unsloth_zoo (CPU)
        run: |
          set +e -o pipefail
          cd head/studio/backend
          python -m pytest -p no:cacheprovider -q -rs tests/test_diffusion_qwenimage21_mps.py 2>&1 | tee ../../../out/logs/pytest_zoo.log
      - name: Build the real-geometry tiny pipeline
        run: |
          set -euo pipefail
          hf download hf-internal-testing/tiny-qwenimage21-pipe --local-dir tiny_pipe > /dev/null
          python bench/build_pipe.py --src tiny_pipe --out q21_real --heads 32 --layers 2 2>&1 | tail -1 | tee out/logs/build.log
          du -sh q21_real/transformer | tee -a out/logs/build.log
      - name: Studio load + generate arms
        run: |
          set +e -uo pipefail
          export HF_HUB_OFFLINE=1
          run() { tag=$1; tree=$2; shift 2
            env "$@" python -u bench/studio_load.py --backend-dir $tree/studio/backend --model q21_real --out out --tag $tag \
              --size 512 --steps 4 --repeats 3 > out/logs/$tag.log 2>&1; rc=$?
            echo "$tag rc=$rc" | tee -a out/rc.txt
            grep -h "diffusion.q21_mps\|diffusion.loaded" out/logs/$tag.log | cut -c1-400; }
          run s_base_1 base X=1
          run s_head_1 head X=1
          run s_head_kill head UNSLOTH_DIFFUSION_Q21_MPS_FUSED=0
          run s_base_2 base X=1
          run s_head_2 head X=1
          cat out/rc.txt
          python bench/summarize_studio.py out | tee out/summary_studio.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q21-mps-studio
          path: out
          retention-days: 14
