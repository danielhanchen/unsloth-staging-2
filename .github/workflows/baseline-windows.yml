name: "BASELINE main windows-latest"

on:
  push:
    branches: [pr8686-baseline]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chat-settings:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }

      - name: Install backend deps
        run: python -m pip install pydantic fastapi structlog pyyaml pyjwt cryptography filelock python-multipart huggingface-hub sqlite-vec pytest pytest-asyncio pytest-timeout



      - uses: actions/setup-node@v4
        with: { node-version: '24' }

      - name: Frontend unit tests
        working-directory: studio/frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
