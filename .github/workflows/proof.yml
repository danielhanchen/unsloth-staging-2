name: Windows proof
on:
  push:
    branches: [proof-12167-12169]
    paths: ['.github/workflows/proof.yml', 'exp/mxc_proof.py']
permissions:
  contents: read
jobs:
  proof:
    name: ${{ matrix.pr }} ${{ matrix.arm }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        arm: [base, head]
        pr: ['12182']
        include:
          - {arm: base, sha: e417798d3fece7432280e2ecba02c3cf1c3f264a}
          - {pr: '12182', arm: head, sha: b0f433b18d78db6c839dae869acaff82aa16c83f}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: unslothai/unsloth
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proofkit
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip pytest
      - name: real Windows PowerShell 5.1 run
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          python proofkit/exp/mxc_proof.py 2>&1 | Tee-Object proof.log
          $code = $LASTEXITCODE
          Write-Host "PROOF_EXIT=$code"
          exit $code
      - name: pytest
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python -m pytest -rA -p no:cacheprovider studio/backend/tests/test_install_mxc_prebuilt.py 2>&1 | Tee-Object pytest.log
          $code = $LASTEXITCODE
          Select-String -Path pytest.log -Pattern '^(PASSED|FAILED|SKIPPED|ERROR) ' | ForEach-Object { "ID " + $_.Line }
          Write-Host "PROOF_PYTEST_EXIT=$code"
          exit $code
