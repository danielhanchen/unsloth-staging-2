name: "staging-7463 macos-14"
on:
  push:
    branches: ["pr-7463-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/llama_cpp.py'
      - 'studio/backend/hub/services/models/deletion.py'
      - 'studio/backend/hub/tests/test_model_services.py'
      - 'studio/backend/hub/utils/gguf.py'
      - 'studio/backend/hub/workers/hf_download.py'
      - 'studio/backend/picker/service.py'
      - 'studio/backend/routes/models.py'
      - 'studio/backend/tests/test_mtp_drafter_companion.py'
      - 'studio/backend/tests/test_offline_gguf_cache_fallback.py'
      - 'studio/backend/tests/test_resolve_quant_gguf.py'
      - 'studio/backend/utils/models/model_config.py'
      - '.github/workflows/staging-7463-macos-14.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests -q || true
