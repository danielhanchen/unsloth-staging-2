name: VirusTotal baseline scan of main

# Temporary. Builds the desktop bundles from the PR 8592 branch, unsigned, and runs
# the repo's own scripts/virustotal_scan.py over them plus bin\unsloth.cmd, the one
# new artifact that PR ships. Delete this file and its branch once the answer is in.
#
# Unsigned on purpose: signing needs the Apple, Azure and Tauri secrets, and none of
# them change what the engines see in the payload. createUpdaterArtifacts=false is
# what removes the need for the Tauri key.

on:
  push:
    branches: ["vt-main-baseline"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vt-scan-8592
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.label }} (unsigned)
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: linux deb
            bundles: deb
            extra_config: '{}'
          - platform: macos-14
            label: macos dmg
            bundles: dmg
            extra_config: '{}'
          - platform: windows-latest
            label: windows nsis
            bundles: nsis
            # tauri.windows.conf.json points signCommand at
            # sign-with-trusted-signing.ps1, which shells out to
            # trusted-signing-cli. That binary is a release-only download and the
            # Azure credentials behind it are org secrets, so bundling here dies
            # at CommandNotFoundException. Replaced with a command that accepts
            # the path and does nothing, which is what "unsigned" means for a
            # scan: the payload the engines see is the same either way.
            extra_config: '{"bundle":{"windows":{"signCommand":{"cmd":"cmd","args":["/c","echo","skipping signing for %1"]}}}}' 
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install --save-dev --prefix studio @tauri-apps/cli@2.10.1 --no-fund --no-audit

      - name: Install frontend dependencies
        working-directory: studio/frontend
        run: npm install --no-fund --no-audit

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the bundle
        working-directory: studio
        shell: bash
        run: |
          npx --prefix . tauri build -v --bundles ${{ matrix.bundles }} \
            --config '{"bundle":{"createUpdaterArtifacts":false}}' \
            --config '${{ matrix.extra_config }}'

      - name: Collect what was built
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p to_scan
          find studio/src-tauri/target -path '*bundle*' -type f \
            \( -name '*.deb' -o -name '*.dmg' -o -name '*-setup.exe' -o -name '*.msi' \) \
            -exec cp {} to_scan/ \;
          ls -la to_scan

      - uses: actions/upload-artifact@v4
        with:
          name: vt-8592-${{ matrix.platform }}
          path: to_scan/
          if-no-files-found: error
          retention-days: 3

  scan:
    name: VirusTotal scan
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: vt-8592-*
          path: ${{ runner.temp }}/bundles
          merge-multiple: true

      - name: Generate the .cmd shim exactly as install.ps1 does
        # main predates the shim, so there is nothing to generate here. Kept in
        # place, and allowed to fail, so the two branches run the same workflow.
        continue-on-error: true
        shell: pwsh
        run: |
          # Not a build output, so it is not in the bundle download: install.ps1
          # writes it at install time. Generated here with the same generator, by
          # AST, so what is scanned is what users get rather than a hand copy.
          $install = Join-Path $PWD 'install.ps1'
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($install, [ref]$tokens, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { $_.ToString() }; exit 1 }
          foreach ($name in @('Get-RelativeShimPath', 'Get-UnslothCmdShimContent')) {
            $fn = $ast.FindAll({ param($n)
              $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $name
            }, $true)
            if ($fn.Count -ne 1) { Write-Host "::error::expected one $name"; exit 1 }
            Invoke-Expression $fn[0].Extent.Text
          }
          # Read from the file rather than retyped, for the same reason.
          $script:UnslothCmdShimMarker = 'unsloth-studio-managed-launcher'
          $trampolineLine = Select-String -Path $install -Pattern '^\s*\$script:UnslothCliTrampoline = "(.+)"$' |
            Select-Object -First 1
          if (-not $trampolineLine) { Write-Host '::error::could not read the trampoline'; exit 1 }
          $script:UnslothCliTrampoline = $trampolineLine.Matches[0].Groups[1].Value
          $body = Get-UnslothCmdShimContent -ShimDir 'C:\Users\dan\.unsloth\studio\bin' `
            -PythonPath 'C:\Users\dan\.unsloth\studio\unsloth_studio\Scripts\python.exe'
          $target = Join-Path $env:RUNNER_TEMP 'bundles/unsloth.cmd'
          [System.IO.File]::WriteAllText($target, $body, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content -LiteralPath $target | Write-Host

      - name: Scan
        env:
          VT_API_KEY: ${{ secrets.VIRUS_TOTAL_API_TOKEN }}
        run: |
          set -euo pipefail
          ls -la "$RUNNER_TEMP/bundles"
          python3 scripts/virustotal_scan.py \
            "$RUNNER_TEMP/bundles" \
            --output-markdown "$RUNNER_TEMP/virustotal-summary.md"

      - name: Publish the summary
        if: always()
        run: |
          summary="$RUNNER_TEMP/virustotal-summary.md"
          if [ -f "$summary" ]; then
            cat "$summary" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'no summary produced' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
