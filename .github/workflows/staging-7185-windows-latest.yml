name: "staging-7185 windows-latest"
on:
  push:
    branches: ["pr-7185-xplat-ci"]
    paths:
      - 'studio/backend/tests/test_openai_auto_switch.py'
      - 'studio/backend/utils/openai_auto_switch_settings.py'
      - 'studio/frontend/src/features/settings/components/model-auto-switch-section.tsx'
      - 'studio/frontend/src/i18n/locales/ar.ts'
      - 'studio/frontend/src/i18n/locales/de.ts'
      - 'studio/frontend/src/i18n/locales/en.ts'
      - 'studio/frontend/src/i18n/locales/es.ts'
      - 'studio/frontend/src/i18n/locales/fr.ts'
      - 'studio/frontend/src/i18n/locales/hi.ts'
      - 'studio/frontend/src/i18n/locales/ja.ts'
      - 'studio/frontend/src/i18n/locales/ko.ts'
      - 'studio/frontend/src/i18n/locales/pt-br.ts'
      - 'studio/frontend/src/i18n/locales/ru.ts'
      - 'studio/frontend/src/i18n/locales/zh-CN.ts'
      - '.github/workflows/staging-7185-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu || python -m pip install torch
      - run: PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_openai_auto_switch.py -v
