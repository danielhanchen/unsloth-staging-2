name: "staging-11516 windows-latest"
on:
  push:
    branches: ["pr-11516-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: python -m pip install torch unsloth_zoo transformers triton-windows
      - run: python -m pip install peft trl bitsandbytes || echo "optional deps unavailable on windows-latest"
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_diffusion_xpu_training.py tests/test_trust_remote_code_native_compile.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out.txt 2>&1 || rc=$?; cat pytest_out.txt; tot=$(grep -cE "^(FAILED|ERROR) " pytest_out.txt) || tot=0; dep=$(grep -cE "^(FAILED|ERROR) .* ((ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers).|- ImportError. Unsloth. torch not found. Please install torch first.)$" pytest_out.txt) || dep=0; other=$(grep -E "^(FAILED |ERROR .+ - )" pytest_out.txt | grep -cvE " ((ModuleNotFoundError|ImportError). No module named .(torch|unsloth_zoo|transformers).|- ImportError. Unsloth. torch not found. Please install torch first.)$") || other=0; eother=$(grep -E "^E +[A-Za-z_][A-Za-z_.]*(Error|Exception). " pytest_out.txt | grep -cvE "(No module named .(torch|unsloth_zoo|transformers).|Unsloth. torch not found. Please install torch first.)") || eother=0; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers).|Unsloth. torch not found. Please install torch first." pytest_out.txt && [ "$other" = "0" ] && [ "$eother" = "0" ]; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" = "1" ] && [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; exit "$rc"
