name: "staging-7742 windows-latest"
on:
  push:
    branches: ["pr-7742-xplat-ci"]
    paths:
      - 'studio/backend/hub/schemas/downloads.py'
      - 'studio/backend/hub/services/datasets/downloads.py'
      - 'studio/backend/hub/services/download_lifecycle.py'
      - 'studio/backend/hub/services/models/downloads.py'
      - 'studio/backend/hub/tests/conftest.py'
      - 'studio/backend/hub/tests/test_download_lifecycle.py'
      - 'studio/backend/hub/utils/download_registry.py'
      - 'studio/backend/hub/utils/hf_cache_state.py'
      - 'studio/backend/hub/workers/hf_download.py'
      - 'studio/backend/main.py'
      - 'studio/backend/tests/conftest.py'
      - 'studio/backend/tests/test_hf_xet_fallback.py'
      - 'studio/backend/tests/test_hub_download_transport_auto.py'
      - 'studio/backend/utils/child_stdio.py'
      - 'studio/backend/utils/hf_cache_settings.py'
      - 'studio/backend/utils/hf_xet_fallback.py'
      - 'studio/frontend/src/features/hub/catalog/transport-toggle.tsx'
      - 'studio/frontend/src/features/hub/download-manager/api.ts'
      - 'studio/frontend/src/features/hub/download-manager/constants.ts'
      - 'studio/frontend/src/features/hub/download-manager/download-api-adapter.ts'
      - '.github/workflows/staging-7742-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: python -m pip install 'hf_xet>=1.5.2' 'unsloth_zoo @ git+https://github.com/unslothai/unsloth-zoo@feat/xet-http-auto-fallback'
      - run: python -m pip install 'diceware' 'pymupdf' 'fastmcp' 'ddgs' || echo "optional deps unavailable on windows-latest"
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/hub/tests/test_download_lifecycle.py studio/backend/tests/test_hf_xet_fallback.py studio/backend/tests/test_hub_download_transport_auto.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
