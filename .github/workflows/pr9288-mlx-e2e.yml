name: "pr9288 MLX end-to-end (Apple silicon)"

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr9288-mlx-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mlx:
    # macos-15 runners are Apple silicon, so real MLX generation is available here.
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: before
            ref: b01b6ab82e50e2def89ef82063b8274a446afe78
          - id: after
            ref: 3612593edeb9b36eb82620a3c5234b61ba06fe75
    name: "mlx ${{ matrix.id }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stash the harness, then check out the code under test
        run: |
          cp pr9288_mlx_e2e.py "$RUNNER_TEMP/harness.py"
          git checkout --force "${{ matrix.ref }}"
          git log --oneline -1
          cp "$RUNNER_TEMP/harness.py" pr9288_mlx_e2e.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm this really is Apple silicon
        run: |
          uname -m
          test "$(uname -m)" = "arm64" || { echo "::error::not arm64, MLX cannot run"; exit 1; }

      - name: Install MLX and the studio backend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install mlx mlx-lm
          python -m pip install -r studio/backend/requirements/studio.txt
          python -m pip install "transformers>=4.51,<5.5" jinja2
          python -c "import mlx.core as mx; print('mlx ok', mx.default_device())"

      - name: Real MLX generation through the shipped decision and extractor
        env:
          HF_HOME: ${{ runner.temp }}/hf
          UNSLOTH_ALLOW_CPU: "1"
          UNSLOTH_IS_PRESENT: "1"
          UNSLOTH_COMPILE_DISABLE: "1"
          UNSLOTH_STUDIO_DISABLE_DEVICE_PROBE: "1"
        run: |
          python pr9288_mlx_e2e.py \
            --model mlx-community/Qwen3.5-0.8B-4bit \
            --backend "$PWD/studio/backend" \
            --json "mlx_${{ matrix.id }}.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlx-e2e-${{ matrix.id }}
          path: mlx_*.json

  # Qwen3.8-27B is 16 GB, which no hosted runner can hold, but weights never enter this
  # decision: the generation prompt's <think> shape comes from the tokenizer alone. So this
  # job downloads config + tokenizer + template only, and renders both tokenizer objects
  # Studio can end up holding (mlx-lm's TokenizerWrapper, and a processor's plain HF
  # tokenizer) to see which one the PR's verdict is reconstructing.
  tokenizers:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: before
            ref: b01b6ab82e50e2def89ef82063b8274a446afe78
          - id: after
            ref: 3612593edeb9b36eb82620a3c5234b61ba06fe75
    name: "tokenizers ${{ matrix.id }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stash the harness, then check out the code under test
        run: |
          cp pr9288_mlx_tokenizer_probe.py "$RUNNER_TEMP/probe.py"
          git checkout --force "${{ matrix.ref }}"
          git log --oneline -1
          cp "$RUNNER_TEMP/probe.py" pr9288_mlx_tokenizer_probe.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm this really is Apple silicon
        run: |
          uname -m
          test "$(uname -m)" = "arm64" || { echo "::error::not arm64, MLX cannot run"; exit 1; }

      - name: Install MLX and the studio backend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install mlx mlx-lm
          python -m pip install -r studio/backend/requirements/studio.txt
          python -m pip install "transformers>=4.51,<5.5" jinja2
          python -c "import mlx_lm, transformers; print('mlx-lm', mlx_lm.__version__, 'transformers', transformers.__version__)"

      - name: Render both tokenizer paths and compare against the PR's verdict
        env:
          HF_HOME: ${{ runner.temp }}/hf
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          UNSLOTH_ALLOW_CPU: "1"
          UNSLOTH_IS_PRESENT: "1"
          UNSLOTH_COMPILE_DISABLE: "1"
          UNSLOTH_STUDIO_DISABLE_DEVICE_PROBE: "1"
        run: |
          python pr9288_mlx_tokenizer_probe.py \
            --backend "$PWD/studio/backend" \
            --models \
              mlx-community/Qwen3.8-27B-4bit \
              mlx-community/Qwen3.8-27B-8bit \
              mlx-community/Qwen3.8-27B-mxfp4 \
              mlx-community/Qwen3.5-0.8B-4bit \
            --json "tok_${{ matrix.id }}.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlx-tokenizers-${{ matrix.id }}
          path: tok_*.json
