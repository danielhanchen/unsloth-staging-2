name: staging-8586 unsigned bundle contents

on:
  push:
    branches: [pr-8586-bundle-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: linux
          - platform: windows-latest
            label: windows
          - platform: macos-latest
            label: macos
    name: unsigned bundle (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Linux bundle deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Frontend
        working-directory: studio/frontend
        run: npm install --no-fund --no-audit && npm run build

      # Unsigned on purpose: a staging repo has no Azure Trusted Signing, no Apple
      # identity and no updater key. The question here is bundle CONTENTS, which
      # signing does not affect.
      # createUpdaterArtifacts off, not an empty signing key: a staging repo has no updater
      # key, and Tauri tries to decode an empty one and fails after the bundle is already
      # built. Nothing here depends on the updater artifact.
      # Azure Trusted Signing exists only on the org repo, and the NSIS bundler runs signCommand
      # for every binary, so on staging it has to come out of the config entirely. Signing does
      # not affect which files a bundle carries, which is the whole question here.
      - name: Drop the Windows sign command
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -e
          python -c "import json,pathlib; p=pathlib.Path('studio/src-tauri/tauri.windows.conf.json'); c=json.loads(p.read_text()); c['bundle'].pop('windows',None); p.write_text(json.dumps(c,indent=2))"
          cat studio/src-tauri/tauri.windows.conf.json

      - name: Build bundles (unsigned)
        working-directory: studio/src-tauri
        shell: bash
        run: |
          set -o pipefail
          npx --yes @tauri-apps/cli@2 build --config '{"bundle":{"createUpdaterArtifacts":false}}' 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -40

      - name: Assert each bundle carries only its own installer
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          TARGET=studio/src-tauri/target/release/bundle
          echo "=== bundle tree ==="
          find "$TARGET" -maxdepth 2 -type d 2>/dev/null | head -20 || true
          echo "=== staged resources ==="
          find studio/src-tauri/target/release -maxdepth 3 -name 'install.*' 2>/dev/null | head -20 || true
          fail=0
          case "${{ matrix.label }}" in
            linux)
              DEB="$(find "$TARGET" -name '*.deb' | head -1)"
              [ -n "$DEB" ] || { echo "::error::no .deb built"; exit 1; }
              echo "deb: $DEB"
              dpkg-deb -c "$DEB" > "$RUNNER_TEMP/deb.list"
              grep -E '/install\.sh$' "$RUNNER_TEMP/deb.list" || { echo "::error::deb ships no install.sh"; fail=1; }
              if grep -qE '/install\.ps1$' "$RUNNER_TEMP/deb.list"; then
                echo "::error::deb still ships install.ps1"; fail=1
              else
                echo "OK: deb carries no install.ps1"
              fi
              ;;
            windows)
              RES="$(find studio/src-tauri/target/release -maxdepth 3 -name 'install.ps1' | head -1 || true)"
              if [ -n "$RES" ]; then echo "windows staged installer: $RES"; else echo "::error::windows build staged no install.ps1"; fail=1; fi
              STRAY="$(find studio/src-tauri/target/release -maxdepth 3 -name 'install.sh' | head -1 || true)"
              if [ -n "$STRAY" ]; then echo "::error::windows build staged install.sh: $STRAY"; fail=1; else echo "OK: no install.sh staged"; fi
              ;;
            macos)
              APP="$(find "$TARGET/macos" -maxdepth 1 -name '*.app' | head -1)"
              [ -n "$APP" ] || { echo "::error::no .app built"; exit 1; }
              echo "app: $APP"
              find "$APP" -name 'install.*' | sed 's/^/  /'
              find "$APP" -name 'install.sh' | grep -q . || { echo "::error::.app ships no install.sh"; fail=1; }
              if find "$APP" -name 'install.ps1' | grep -q .; then
                echo "::error::.app still ships install.ps1"; fail=1
              else
                echo "OK: .app carries no install.ps1"
              fi
              ;;
          esac
          [ "$fail" -eq 0 ] || exit 1

      # The AppImage is the asset VirusTotal returned malicious=1 for, and Tauri does not build
      # it: release-desktop.yml wraps the deb with build-thin-appimage.sh. Same tool versions and
      # same pinned digests as the release job, so the thing being scanned is the real shape.
      - name: Build the thin AppImage
        if: matrix.platform == 'ubuntu-22.04'
        env:
          APPIMAGETOOL_URL: "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          APPIMAGE_RUNTIME_URL: "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64"
          APPIMAGE_RUNTIME_SHA256: "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/appimage-tools"
          mkdir -p "$tools_dir"
          appimagetool="$tools_dir/appimagetool-x86_64.AppImage"
          runtime="$tools_dir/runtime-x86_64"
          curl -fsSL "$APPIMAGETOOL_URL" -o "$appimagetool"
          curl -fsSL "$APPIMAGE_RUNTIME_URL" -o "$runtime"
          # Digest before chmod, as the release job does.
          echo "${APPIMAGETOOL_SHA256}  ${appimagetool}" | sha256sum -c -
          echo "${APPIMAGE_RUNTIME_SHA256}  ${runtime}" | sha256sum -c -
          chmod +x "$appimagetool"
          deb="$(find studio/src-tauri/target/release/bundle -name '*.deb' | head -1)"
          out="studio/src-tauri/target/release/bundle/appimage"
          mkdir -p "$out"
          appimage="$out/unsloth-studio_staging-8586_amd64.AppImage"
          export APPIMAGE_PATH="$appimage"
          studio/src-tauri/linux/build-thin-appimage.sh "$deb" "$appimagetool" "$runtime" "$appimage"
          ls -la "$appimage"
          echo "=== the AppImage must carry install.sh and no install.ps1 ==="
          "$appimage" --appimage-extract >/dev/null
          find squashfs-root -name 'install.*' -printf '%s\t%p\n'
          if find squashfs-root -name 'install.ps1' | grep -q .; then
            echo "::error::AppImage still ships install.ps1"; exit 1
          fi
          echo "OK: AppImage carries no install.ps1"
          rm -rf squashfs-root

      - name: Upload bundles for scanning
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-8586-bundle-${{ matrix.label }}
          path: |
            studio/src-tauri/target/release/bundle/**/*.deb
            studio/src-tauri/target/release/bundle/**/*.AppImage
            studio/src-tauri/target/release/bundle/**/*.dmg
            studio/src-tauri/target/release/bundle/**/*setup.exe
            studio/src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: warn
          retention-days: 3

  # The release pipeline's own scan step, unmodified, pointed at the bundles above. This is what
  # returned malicious=1 for the 0.1.701-beta AppImage in run 31528647838.
  virustotal:
    name: VirusTotal scan of the PR bundles
    needs: [bundle]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/virustotal_scan.py
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          pattern: staging-8586-bundle-*
          path: ${{ runner.temp }}/bundles
          merge-multiple: true

      # collect_paths uses iterdir(), not rglob: the release job hands it a flat directory of
      # assets, so the bundle/<type>/ tree the artifacts preserve here reads as zero files and the
      # scan reports "no scannable bundles found". Flatten to match the shape the script expects.
      - name: Flatten the assets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flat"
          find "$RUNNER_TEMP/bundles" -type f -exec mv -t "$RUNNER_TEMP/flat" {} +
          find "$RUNNER_TEMP/flat" -maxdepth 1 -type f -printf '%s\t%p\n' | sort

      # The staging bundles are unsigned: no Apple identity, no Azure Trusted Signing. Microsoft's
      # Wacatac.B!ml is a generic ML verdict that weights code signing heavily, so a detection here
      # says nothing about what ships until the signed equivalent is measured the same way. These
      # are the SIGNED 0.1.701-beta release assets; the script looks a hash up before uploading, so
      # this reads VirusTotal's existing report rather than submitting anything new.
      - name: Baseline the signed shipped release
        env:
          GH_TOKEN: ${{ github.token }}
          VT_API_KEY: ${{ secrets.VIRUS_TOTAL_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signed"
          for asset in Unsloth-Desktop-0_1_701_beta-MacOS.dmg \
                       Unsloth-Desktop-0_1_701_beta-Windows.exe \
                       Unsloth-Desktop-0_1_701_beta-Linux.AppImage \
                       Unsloth-Desktop-0_1_701_beta-Ubuntu.deb; do
            gh release download v0.1.701-beta -R unslothai/unsloth -p "$asset" \
              -D "$RUNNER_TEMP/signed" --clobber
          done
          find "$RUNNER_TEMP/signed" -type f -printf '%s\t%p\n' | sort
          python3 scripts/virustotal_scan.py \
            "$RUNNER_TEMP/signed" \
            --output-markdown "$RUNNER_TEMP/signed-summary.md"
          {
            echo '## Signed shipped 0.1.701-beta, for comparison'
            echo
            cat "$RUNNER_TEMP/signed-summary.md"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/signed-summary.md"

      - name: VirusTotal scan
        env:
          VT_API_KEY: ${{ secrets.VIRUS_TOTAL_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/virustotal_scan.py \
            "$RUNNER_TEMP/flat" \
            --output-markdown "$RUNNER_TEMP/virustotal-summary.md"

      - name: Publish the summary
        if: always()
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/virustotal-summary.md"
          if [ -f "$summary" ]; then
            cat "$summary" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "The scan step produced no summary." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
