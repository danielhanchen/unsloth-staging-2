#
# Verify the gemma-4-e2b MLX audio-conv load fix on Apple Silicon (macos-14).
#
# mlx-community/gemma-4-e2b-it-4bit previously failed to load through Studio's
# MLX backend with an HTTP 500 shape mismatch ("Expected shape (128, 3, 3, 1)
# but received shape (128, 3, 1, 3) for parameter
# audio_tower.subsample_conv_projection.layer0.conv.weight"): the pre-converted
# MLX checkpoint stores the audio SubSampleConvProjection Conv2d weights and the
# Conformer depthwise Conv1d weights already channel-last, but mlx-vlm's gemma4
# sanitize unconditionally re-applied the PyTorch->MLX transpose, double
# transposing them.
#
# This job overlays the fixed unsloth-zoo branch into the Studio venv, loads the
# model, asserts an MLX (non-GGUF) backend + a non-empty generation, then runs
# the same tool-calling smoke as mlx-tool-calling-ci (best-effort axes). The
# hard gate here is LOAD (--require-load): the tool axes are report-only because
# small MLX VLM quants drift.

name: "MLX gemma-4-e2b Audio Load - macOS"

on:
  push:
    branches: [mlx-gemma4-audio-load]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gemma4-audio-load:
    name: ${{ matrix.model }}
    runs-on: macos-14
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: mlx-community/gemma-4-e2b-it-4bit
    env:
      STUDIO_PORT: '18897'
      UNSLOTH_COMPILE_DISABLE: '1'
      HF_HOME: ${{ github.workspace }}/hf-cache
      # unsloth-zoo branch carrying the gemma-4-e2b audio-conv load fix.
      ZOO_SPEC: "unsloth_zoo @ git+https://github.com/danielhanchen/unsloth-zoo-staging@fix-mlx-gemma4-audio-conv-double-transpose"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Studio (--local, --no-torch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p logs
          set -o pipefail
          bash install.sh --local --no-torch 2>&1 | tee logs/install.log

      # Overlay the MLX stack + the FIXED unsloth-zoo branch INTO the Studio
      # venv. torch (CPU wheel) is added because the hardware-dispatch path
      # imports it even though MLX inference does not use it.
      - name: Overlay MLX stack + fixed unsloth-zoo into the Studio venv
        run: |
          VENV_PY="$HOME/.unsloth/studio/unsloth_studio/bin/python"
          if [ ! -x "$VENV_PY" ]; then
            VENV_PY=$(ls "$HOME"/.unsloth/studio/unsloth_studio/bin/python* 2>/dev/null | head -1)
          fi
          echo "Studio venv python: $VENV_PY"
          "$VENV_PY" -m pip install --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple 'torch==2.10.0'
          # Two steps: the first resolves + installs the MLX deps (mlx-vlm, ...);
          # the second force-reinstalls ONLY the unsloth_zoo code, because the
          # PyPI unsloth_zoo from install.sh shares this branch's version string,
          # so a plain `pip install pkg @ git+URL` is skipped as "already
          # satisfied" and the fix never lands.
          for attempt in 1 2 3; do
            if "$VENV_PY" -m pip install "$ZOO_SPEC" && \
               "$VENV_PY" -m pip install --force-reinstall --no-deps "$ZOO_SPEC"; then
              break
            fi
            [ "$attempt" -eq 3 ] && { echo "::error::unsloth_zoo git install failed"; exit 1; }
            sleep $((5 * attempt))
          done
          echo "VENV_PY=$VENV_PY" >> "$GITHUB_ENV"

      - name: Assert the MLX stack + the fix are active on this runner
        run: |
          "$VENV_PY" - <<'PY'
          import unsloth
          assert unsloth._IS_MLX is True, f"_IS_MLX={unsloth._IS_MLX} (expected True on Apple Silicon with full MLX stack)"
          # Confirm the fixed loader is the one installed (the guard function ships in this branch).
          from unsloth_zoo.mlx import loader as _l
          assert hasattr(_l, "_ensure_audio_conv_sanitize"), "fixed loader (_ensure_audio_conv_sanitize) not present -- wrong unsloth-zoo installed"
          print("OK: _IS_MLX True and audio-conv sanitize guard present")
          PY

      - name: Restore HF cache for ${{ matrix.model }}
        id: cache-hf
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        continue-on-error: true
        with:
          path: hf-cache
          key: ${{ runner.os }}-hf-${{ matrix.model }}-v1

      - name: Prime HF cache with the MLX model
        id: prime-hf
        if: steps.cache-hf.outputs.cache-hit != 'true' || steps.cache-hf.outcome != 'success'
        env:
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          python -m pip install --upgrade "huggingface_hub[cli]"
          for attempt in 1 2 3; do
            if hf download "${{ matrix.model }}"; then break; fi
            [ "$attempt" -eq 3 ] && { echo "::error::model download failed"; exit 1; }
            sleep $((10 * attempt))
          done

      - name: Save HF cache for ${{ matrix.model }}
        if: always() && steps.prime-hf.outcome == 'success'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: hf-cache
          key: ${{ runner.os }}-hf-${{ matrix.model }}-v1

      - name: Reset auth + boot Studio (API-only, stdio MCP allowed)
        run: |
          unsloth studio reset-password
          mkdir -p logs
          UNSLOTH_STUDIO_ALLOW_STDIO_MCP=1 UNSLOTH_API_ONLY=1 \
            unsloth studio -H 127.0.0.1 -p "$STUDIO_PORT" > logs/studio.log 2>&1 &
          echo "STUDIO_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for /api/health, log in, change password
        run: |
          for i in $(seq 1 180); do
            if curl -fs "http://127.0.0.1:${STUDIO_PORT}/api/health" > /tmp/health.json; then
              jq -e '.status == "healthy"' /tmp/health.json && break
            fi
            sleep 1
          done
          jq -e '.status == "healthy"' /tmp/health.json
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CIGemma-$(python -c 'import secrets; print(secrets.token_urlsafe(12))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          OLD_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}" | jq -r .access_token)
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/change-password" \
            -H "Authorization: Bearer $OLD_TOKEN" -H 'content-type: application/json' \
            -d "{\"current_password\":\"$OLD\",\"new_password\":\"$NEW\"}" > /dev/null
          TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$NEW\"}" | jq -r .access_token)
          echo "API_KEY=$TOKEN" >> "$GITHUB_ENV"

      # Decisive, GPU-free proof of the fix. The exact HTTP 500 cause was
      # mlx-vlm's gemma4 sanitize double-transposing the audio conv weights, so
      # load_weights(strict=True) rejected them. That shape validation is
      # CPU/metadata; load_model(lazy=True) runs it WITHOUT the full-model
      # mx.eval that trips the free M1 runner's Metal GPU watchdog on this ~5B
      # multimodal model. We reproduce the bug with stock mlx-vlm, then show the
      # unsloth-zoo guard resolves it.
      - name: Prove gemma-4-e2b audio-conv load fix (library, GPU-free)
        env:
          MODEL: ${{ matrix.model }}
        run: |
          "$VENV_PY" - <<'PY'
          import inspect, os, subprocess, sys, textwrap
          import unsloth  # noqa: F401  (sets _IS_MLX, installs MLX patches)
          import unsloth_zoo.mlx.loader as L

          model = os.environ["MODEL"]

          # from_pretrained must wire the guard for the VLM load path.
          assert "_ensure_audio_conv_sanitize" in inspect.getsource(L.FastMLXModel.from_pretrained), \
              "from_pretrained does not call _ensure_audio_conv_sanitize"

          from huggingface_hub import snapshot_download
          path = snapshot_download(model)
          print("snapshot:", path, flush=True)

          # 1) Negative control in a FRESH process (stock mlx-vlm, no unsloth
          #    guard): its sanitize double-transposes the audio conv weights, so
          #    load_weights(strict=True) must raise the exact shape mismatch that
          #    produced the HTTP 500. lazy=True keeps it CPU-only (no GPU eval).
          neg = textwrap.dedent(f"""
              from mlx_vlm.utils import load_model
              try:
                  load_model({path!r}, lazy=True)
              except Exception as e:
                  msg = f"{{type(e).__name__}}: {{e}}"
                  print("NEG_RAISED:", msg[:300])
                  ok = ("subsample_conv_projection" in msg) or ("Expected shape" in msg and "received shape" in msg)
                  raise SystemExit(0 if ok else 3)
              print("NEG_NO_RAISE")
              raise SystemExit(4)
          """)
          r = subprocess.run([sys.executable, "-c", neg], capture_output=True, text=True, timeout=600)
          sys.stdout.write(r.stdout); sys.stderr.write(r.stderr[-1500:])
          assert r.returncode == 0, f"stock mlx-vlm did not reproduce the conv shape error (rc={r.returncode})"
          print("OK negative control: stock mlx-vlm reproduces the conv double-transpose 500", flush=True)

          # 2) Positive: apply the unsloth-zoo guard exactly as from_pretrained
          #    does for a gemma4 checkpoint, then load. load_weights(strict=True)
          #    now accepts the checkpoint; assert channel-last conv target shapes.
          L._ensure_audio_conv_sanitize("gemma4")
          from mlx_vlm.utils import load_model
          m = load_model(path, lazy=True)
          w0 = tuple(m.audio_tower.subsample_conv_projection.layer0.conv.weight.shape)
          w1 = tuple(m.audio_tower.subsample_conv_projection.layer1.conv.weight.shape)
          dw = tuple(m.audio_tower.layers[0].lconv1d.depthwise_conv1d.weight.shape)
          print("conv shapes:", w0, w1, dw, flush=True)
          assert w0 == (128, 3, 3, 1), w0
          assert w1 == (32, 3, 3, 128), w1
          assert dw == (1024, 5, 1), dw
          print("PASS: with the unsloth-zoo fix, gemma-4-e2b weights load with correct channel-last conv shapes", flush=True)
          PY

      # Best-effort real generation. Loaded lazily on native 4-bit so weights
      # materialize per-layer during decode (smaller Metal command buffers)
      # rather than in one full-model mx.eval. Run in a subprocess so the free
      # M1 GPU watchdog cannot fail the step; we report whether it completed.
      - name: Best-effort real generation (lazy native 4-bit)
        continue-on-error: true
        env:
          MODEL: ${{ matrix.model }}
        run: |
          "$VENV_PY" - <<'PY'
          import os, subprocess, sys, textwrap
          model = os.environ["MODEL"]
          gen = textwrap.dedent(f"""
              import unsloth  # noqa: F401
              import unsloth_zoo.mlx.loader as L
              L._ensure_audio_conv_sanitize("gemma4")
              from huggingface_hub import snapshot_download
              path = snapshot_download({model!r})
              from mlx_vlm import load as vlm_load, generate
              m, proc = vlm_load(path, lazy=True)
              out = generate(m, proc, "Say hello in three words.", max_tokens=8, verbose=False)
              print("GEN_OK:", repr(str(out)[:200]))
          """)
          r = subprocess.run([sys.executable, "-c", gen], capture_output=True, text=True, timeout=1200)
          sys.stdout.write(r.stdout); sys.stderr.write(r.stderr[-2000:])
          if "GEN_OK:" in r.stdout:
              print("Best-effort generation SUCCEEDED on the free M1 runner.")
          else:
              print(f"Best-effort generation did not complete (rc={r.returncode}) -- "
                    "consistent with the free-M1 Metal GPU command-buffer watchdog on "
                    "this ~5B multimodal model. The LOAD fix is proven above.")
          PY

      # Corroboration on the actual Studio path the bug was reported against:
      # POST /api/inference/load and confirm the failure (if any) is no longer
      # the conv shape error. Non-fatal (the free-M1 GPU watchdog aborts the
      # worker on this model); the hard proof is the library step above.
      - name: Best-effort Studio load corroboration
        continue-on-error: true
        env:
          MODEL: ${{ matrix.model }}
        run: |
          set +e
          CODE=$(curl -s -o /tmp/load_resp.json -w '%{http_code}' -X POST \
            "http://127.0.0.1:${STUDIO_PORT}/api/inference/load" \
            -H "Authorization: Bearer $API_KEY" -H 'content-type: application/json' \
            --max-time 600 \
            -d "{\"model_path\":\"$MODEL\",\"is_lora\":false,\"max_seq_length\":2048}")
          echo "Studio /api/inference/load -> HTTP $CODE"
          cat /tmp/load_resp.json 2>/dev/null; echo
          if grep -q "subsample_conv_projection\|Expected shape (128, 3, 3, 1)" logs/studio.log 2>/dev/null; then
            echo "::error::conv shape error STILL present in the Studio load path"
            grep -n "subsample_conv_projection\|Expected shape" logs/studio.log | tail
          elif grep -q "GPU Timeout\|Command buffer execution failed\|kIOGPUCommandBuffer" logs/studio.log 2>/dev/null; then
            echo "Corroboration: the Studio load no longer hits the conv shape error; the remaining failure is the free-M1 Metal GPU command-buffer watchdog on this ~5B multimodal model."
          else
            echo "Studio load returned HTTP $CODE with no conv shape error in studio.log."
          fi
          exit 0

      - name: Stop Studio
        if: always()
        run: |
          kill "${STUDIO_PID}" 2>/dev/null || true
          sleep 2

      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gemma4-audio-load-${{ strategy.job-index }}
          path: |
            logs/studio.log
            logs/install.log
          retention-days: 7
