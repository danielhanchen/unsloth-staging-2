name: "staging-7490 windows-latest"
on:
  push:
    branches: ["pr-7490-xplat-ci"]
    paths:
      - 'studio/src-tauri/src/commands.rs'
      - 'studio/src-tauri/src/install.rs'
      - 'studio/src-tauri/src/preflight.rs'
      - 'studio/src-tauri/src/preflight/managed.rs'
      - 'studio/src-tauri/src/process.rs'
      - '.github/workflows/staging-7490-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest unsloth_cli/tests/test_studio_runtime_readiness.py -q --tb=short || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
