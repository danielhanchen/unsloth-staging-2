name: mac-mps-bench
on:
  push:
    branches: ["mac-mps-*"]
jobs:
  bench:
    runs-on: macos-15-xlarge
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {leg: xl_latest, torch: "torch", env: "SIDES='512 1024' ROUNDS='1 2 3'"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q '${{ matrix.torch }}' torchao mlx numpy safetensors huggingface_hub pytest
          if [ -f bench/requirements.txt ]; then python -m pip install -q -r bench/requirements.txt; fi
          python -m pip list 2>/dev/null | grep -i -E "torch|mlx|diffusers|transformers|numpy"
      - name: run
        env:
          PYTHONUNBUFFERED: "1"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: env LEG=${{ matrix.leg }} ${{ matrix.env }} bash bench/run.sh
      - name: results
        if: always()
        run: for f in out/*.json; do echo "=== $f"; cat "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ matrix.leg }}
          path: out/
