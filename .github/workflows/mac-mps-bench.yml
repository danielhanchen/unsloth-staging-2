name: mac-mps-bench
on:
  push:
    branches: ["mac-mps-*"]
jobs:
  gate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-xlarge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q torch numpy pytest
          git clone -q --depth 1 -b studio-mps-int8pack https://github.com/unslothai/unsloth head0 && python -m pip install -q -r head0/studio/backend/requirements/studio.txt pytest-asyncio pytest-timeout python-multipart
          git clone -q --depth 1 -b studio-mps-int8pack https://github.com/unslothai/unsloth head
          git -C head log -1 --format=%H
          sysctl -n machdep.cpu.brand_string hw.memsize
      - name: tests
        run: |
          cd head/studio/backend
          python -m pytest -q -p no:cacheprovider -rs tests/test_diffusion_native_quant_mps.py -k "not image_gate and not video_gate" 2>&1 | tee ../../../pytest.txt | tail -15
          grep -q " passed" ../../../pytest.txt
          ! grep -q "skipped" ../../../pytest.txt || ! grep -q "needs an MPS device" ../../../pytest.txt
      - name: probe
        run: python bench/probe_gate.py
