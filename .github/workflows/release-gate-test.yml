# Prove the release gate proposed for unslothai/unsloth release-desktop.yml
# actually works, before asking anyone to merge it.
#
# .github/scripts/release-gate-step.ps1 is a VERBATIM copy of the step's `run:`
# block, so this exercises the shipped logic rather than a paraphrase of it.
#
# Two cases, and the gate has to get both right:
#   negative -- the two real installers, including the one Defender flagged in
#               the wild. Must exit 0 and print "scanned clean".
#   positive -- the EICAR test file. Must exit 1. A gate that cannot fail is not
#               a gate, and this is exactly the failure mode the -DisableRemediation
#               ambiguity and the runner image's blanket exclusions can produce.

name: "Release gate self-test"

on:
  push:
    branches: [defender-fp-ci]
    paths:
      - '.github/workflows/release-gate-test.yml'
      - '.github/scripts/release-gate-step.ps1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASE_URL: 'https://github.com/danielhanchen/unsloth-staging-2/releases/download/defender-fp-samples'

jobs:
  gate-self-test:
    name: "Gate must pass clean bundles and fail a bad one"
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: Fetch the real bundles
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\bundles" | Out-Null
          foreach ($n in @('old_0.1.51', 'new_0.1.512')) {
            Invoke-WebRequest -Uri "$env:BASE_URL/$n.exe" -OutFile "$env:GITHUB_WORKSPACE\bundles\$n.exe" -UseBasicParsing -TimeoutSec 600
          }
          Get-ChildItem "$env:GITHUB_WORKSPACE\bundles" | Format-Table Name, Length -AutoSize | Out-String | Write-Host

      - name: NEGATIVE case - real bundles must pass
        id: negative
        continue-on-error: true
        run: |
          # Build the JSON with ConvertTo-Json. A literal Windows path contains
          # sequences like \a that are invalid JSON escapes, and hand-writing this
          # is what made the first run of this test scan nothing and still pass.
          $env:ARTIFACT_PATHS = @(
            "$env:GITHUB_WORKSPACE\bundles\old_0.1.51.exe",
            "$env:GITHUB_WORKSPACE\bundles\new_0.1.512.exe"
          ) | ConvertTo-Json -Compress
          Write-Host "ARTIFACT_PATHS = $env:ARTIFACT_PATHS"
          .github/scripts/release-gate-step.ps1
          Write-Host "gate exit code: $LASTEXITCODE"

      - name: POSITIVE case - a known-bad bundle must fail the gate
        id: positive
        continue-on-error: true
        run: |
          $bad = "$env:GITHUB_WORKSPACE\bundles\known-bad.exe"
          [System.IO.File]::WriteAllText(
            $bad,
            'X5O!P%@AP[4\PZX54(P^)7CC)7}' + '$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!' + '$H+H*')
          $env:ARTIFACT_PATHS = @($bad) | ConvertTo-Json -Compress
          Write-Host "ARTIFACT_PATHS = $env:ARTIFACT_PATHS"
          .github/scripts/release-gate-step.ps1
          Write-Host "gate exit code: $LASTEXITCODE"

      # Regression test for the bug the first run of this self-test exposed: the
      # gate could not parse artifactPaths, warned, and exited 0 having scanned
      # nothing. It must refuse instead.
      - name: UNPARSEABLE case - a bad artifactPaths must fail the gate
        id: unparseable
        continue-on-error: true
        run: |
          $env:ARTIFACT_PATHS = '["D:\a\bundles\thing.exe"]'   # \a is an invalid JSON escape
          .github/scripts/release-gate-step.ps1
          Write-Host "gate exit code: $LASTEXITCODE"

      - name: EMPTY case - no artifactPaths must fail the gate
        id: empty
        continue-on-error: true
        run: |
          $env:ARTIFACT_PATHS = ''
          .github/scripts/release-gate-step.ps1
          Write-Host "gate exit code: $LASTEXITCODE"

      - name: Assert every case behaved
        run: |
          $cases = @(
            @{ n = 'negative (real bundles)'; got = '${{ steps.negative.outcome }}';    want = 'success' }
            @{ n = 'positive (known-bad)';    got = '${{ steps.positive.outcome }}';    want = 'failure' }
            @{ n = 'unparseable paths';       got = '${{ steps.unparseable.outcome }}'; want = 'failure' }
            @{ n = 'empty paths';             got = '${{ steps.empty.outcome }}';       want = 'failure' }
          )
          $ok = $true
          foreach ($c in $cases) {
            $verdict = if ($c.got -eq $c.want) { 'OK' } else { 'WRONG'; }
            Write-Host ("{0,-24} got={1,-8} want={2,-8} {3}" -f $c.n, $c.got, $c.want, $verdict)
            if ($c.got -ne $c.want) { $ok = $false }
          }
          if (-not $ok) {
            Write-Host '::error::release gate did not behave correctly in every case'
            exit 1
          }
          Write-Host 'Release gate behaves correctly: passes clean bundles, refuses bad ones, and refuses to pass when it cannot see its input.'
