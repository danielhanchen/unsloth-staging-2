name: menus-bench
on:
  push:
    branches: ["bench/menus-ci"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  menus:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        rep: [1, 2, 3]
        include:
          - rep: 1
            arms: "main-now2=bench/main-now2,main-now3=bench/main-now3"
          - rep: 2
            arms: "main-now3=bench/main-now3,main-now2=bench/main-now2"
          - rep: 3
            arms: "main-now2=bench/main-now2,main-now3=bench/main-now3"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record arm ref
        run: |
          mkdir -p job/out
          git ls-remote https://github.com/danielhanchen/unsloth-staging-2 "refs/heads/bench/main-now2" "refs/heads/bench/main-now3" | tee job/out/arm_ref.txt
      - name: Menu bench (150-turn thread, solid + liquid-3d, main-now2 vs main-now3)
        env:
          BENCH_WORK: ${{ runner.temp }}/lagbench
          # both arms on the same runner, order alternates per rep
          MENU_ARM_REFS: ${{ matrix.arms }}
          MENU_GLASS: "1"
          MENU_TURNS: "150"
          MENU_ENGINES: webkit,chromium
        run: |
          cp bench/pack_menus.tgz job/
          cd job
          python -u ../bench/run_all.py menus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-${{ matrix.os }}-r${{ matrix.rep }}
          path: job/out
