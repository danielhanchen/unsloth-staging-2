name: menus-bench
on:
  push:
    branches: ["bench/menus-ci"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  menus:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        rep: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record arm ref
        run: |
          mkdir -p job/out
          git ls-remote https://github.com/danielhanchen/unsloth-staging-2 "refs/heads/bench/main-now4" | tee job/out/arm_ref.txt
      - name: Menu bench (short vs long, solid + liquid-3d, origin/main)
        env:
          BENCH_WORK: ${{ runner.temp }}/lagbench
          # one arm, short (1 turn) vs long (150 turns)
          MENU_ARM_REFS: main-now4=bench/main-now4
          MENU_GLASS: "1"
          MENU_TURNS: "1 150"
          MENU_ENGINES: webkit,chromium
        run: |
          cp bench/pack_menus.tgz job/
          cd job
          python -u ../bench/run_all.py menus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r6-${{ matrix.os }}-r${{ matrix.rep }}
          path: job/out
