name: menus-bench
on:
  push:
    branches: ["bench/menus-ci"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  menus:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        rep: [1, 2, 3, 4]
        include:
          - rep: 1
            arms: "main=bench/r10-main,pr17035=bench/r10-pr17035,main2=bench/r10-main2"
          - rep: 2
            arms: "main2=bench/r10-main2,pr17035=bench/r10-pr17035,main=bench/r10-main"
          - rep: 3
            arms: "main=bench/r10-main,main2=bench/r10-main2,pr17035=bench/r10-pr17035"
          - rep: 4
            arms: "pr17035=bench/r10-pr17035,main2=bench/r10-main2,main=bench/r10-main"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record arm refs
        run: |
          mkdir -p job/out
          git ls-remote https://github.com/danielhanchen/unsloth-staging-2 "refs/heads/bench/r10-main" "refs/heads/bench/r10-main2" "refs/heads/bench/r10-pr17035" | tee job/out/arm_ref.txt
      - name: Menu bench round 10 (balanced main vs #17035 with an A/A main copy, WebKit + Chromium, 1 vs 150 turns)
        env:
          BENCH_WORK: ${{ runner.temp }}/lagbench
          MENU_ARM_REFS: ${{ matrix.arms }}
          MENU_GLASS: "0"
          MENU_TURNS: "1 150"
          MENU_ENGINES: webkit,chromium
          MENU_SURFACES: run_settings,sidebar_toggle,browser_pane,tools_menu
          MENU_SKIP_TS: "1"
        run: |
          cp bench/pack_menus.tgz job/
          cd job
          python -u ../bench/run_all.py menus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r10-${{ matrix.os }}-r${{ matrix.rep }}
          path: job/out
