name: menus-bench
on:
  push:
    branches: ["bench/menus-ci"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  menus:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        rep: [1, 2, 3]
        include:
          - rep: 1
            arms: "main=bench/r7-main,pr17006=bench/r7-pr17006"
          - rep: 2
            arms: "pr17006=bench/r7-pr17006,main=bench/r7-main"
          - rep: 3
            arms: "main=bench/r7-main,pr17006=bench/r7-pr17006"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record arm refs
        run: |
          mkdir -p job/out
          git ls-remote https://github.com/danielhanchen/unsloth-staging-2 "refs/heads/bench/r7-main" "refs/heads/bench/r7-pr17006" | tee job/out/arm_ref.txt
      - name: Menu bench round 8 (rename close re-check, frame-start window, main vs #17006, rotated order)
        env:
          BENCH_WORK: ${{ runner.temp }}/lagbench
          MENU_ARM_REFS: ${{ matrix.arms }}
          MENU_GLASS: "0"
          MENU_TURNS: "1 150"
          MENU_ENGINES: webkit,chromium
          MENU_SURFACES: rename_chat,tools_menu,command_palette,chat_options,composer_menu
          MENU_SKIP_TS: "1"
        run: |
          cp bench/pack_menus.tgz job/
          cd job
          python -u ../bench/run_all.py menus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r8-${{ matrix.os }}-r${{ matrix.rep }}
          path: job/out
