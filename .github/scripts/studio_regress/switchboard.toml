# ---------------------------------------------------------------- diffusion_bench (unslothai/scripts #330)
# Absolute pass / fail suites run on the side's Studio install and source tree. Head first; the
# base runs only on a head failure (external.py). known_failures = "results_json": the suite's
# KNOWN_STUDIO_FAILS (host RAM kept after unload, VRAM held after unloading mid-render, host RAM
# after a video->image switch) do not count, so only NEW failures force the base run.
# Pins: diffusers-*.txt (diffusers) and overrides.txt (torch) select the tiny suites too.
# The driver is the side's Studio python (it has av for the HTTP video decode); prefetch runs
# fetch_tiny.py so every tiny pipe and the rope-128 Wan copy exist under $WORKSPACE/hf_tiny.
[[target]]
name = "diffusion_bench_tiny_http"
kind = "external"
tier = "gpu"
perf_sensitive = false
gpu_mem_gb = 8
est_s = 300
known_failures = "results_json"
cmd = ["{install}/unsloth_studio/bin/python", "diffusion_bench/edge/run_edge.py", "--tier", "tiny",
       "--surface", "http", "--studio-src", "{src}", "--python", "{install}/unsloth_studio/bin/python",
       "--gpu", "{gpu}", "--out", "{out}"]
triggers = ["studio/backend/core/inference/diffusion*.py", "studio/backend/core/inference/video*.py",
            "studio/backend/core/inference/video_families*.py", "studio/backend/core/inference/gpu_arbiter*.py",
            "studio/backend/core/inference/media_auto_switch*.py", "studio/backend/routes/images.py",
            "studio/backend/routes/video.py", "studio/backend/models/inference.py", "studio/backend/main.py",
            "studio/backend/requirements/diffusers-*.txt", "studio/backend/requirements/overrides.txt"]
models = ["diffusion_bench_tiny"]
owner = "330"

[[target]]
name = "diffusion_bench_tiny_inproc"
kind = "external"
tier = "gpu"
perf_sensitive = false
gpu_mem_gb = 8
est_s = 290
known_failures = "results_json"
cmd = ["{install}/unsloth_studio/bin/python", "diffusion_bench/edge/run_edge.py", "--tier", "tiny",
       "--surface", "inproc", "--studio-src", "{src}", "--python", "{install}/unsloth_studio/bin/python",
       "--gpu", "{gpu}", "--out", "{out}"]
triggers = ["studio/backend/core/inference/diffusion*.py", "studio/backend/core/inference/video*.py",
            "studio/backend/core/inference/video_families*.py", "studio/backend/core/inference/gpu_arbiter*.py",
            "studio/backend/core/inference/media_auto_switch*.py", "studio/backend/models/inference.py",
            "studio/backend/requirements/diffusers-*.txt", "studio/backend/requirements/overrides.txt"]
models = ["diffusion_bench_tiny"]
owner = "330"

[[target]]
name = "diffusion_bench_matrix_tiny"
kind = "external"
tier = "gpu"
perf_sensitive = true    # records timings: exclusive GPU lease
gpu_mem_gb = 6
est_s = 600
# Every cell runs on the side's install and source tree, not an envs.py-built venv.
cmd = ["{install}/unsloth_studio/bin/python", "diffusion_bench/matrix.py", "diffusion_bench/specs/tiny_plumbing.json",
       "--out", "{out}", "--gpus", "{gpu}", "--set", "venv={install}/unsloth_studio/bin/python",
       "--set", "options.studio_src={src}"]
triggers = ["studio/backend/core/inference/diffusion*.py", "studio/backend/core/inference/video*.py",
            "studio/backend/core/inference/gpu_arbiter*.py",
            "studio/backend/requirements/diffusers-*.txt", "studio/backend/requirements/overrides.txt"]
models = ["diffusion_bench_tiny"]
owner = "330"

[[target]]
name = "diffusion_bench_fast"
kind = "external"
tier = "gpu"
perf_sensitive = false
gpu_mem_gb = 40          # SDXL-Turbo, Z-Image-Turbo, Wan2.2-TI2V-5B (real weights, fetched by the suite)
est_s = 660          # measured 657 s (head side, B200, 2026-09-25)
known_failures = "results_json"
cmd = ["{install}/unsloth_studio/bin/python", "diffusion_bench/edge/run_edge.py", "--tier", "fast",
       "--surface", "both", "--studio-src", "{src}", "--python", "{install}/unsloth_studio/bin/python",
       "--gpu", "{gpu}", "--out", "{out}"]
# Label-only: real SDXL-Turbo / Z-Image-Turbo / Wan2.2-5B weights, ~11 min and ~40 GB per side.
# The three tiny targets above cover the same diffusion code paths in 6 to 8 min each (all SAME
# on #11604); run this one on request (label, or --only diffusion_bench_fast).
triggers = ["label:affects diffusion"]
owner = "330"

# CPU-only diffusion coverage that needs no model: both run with the side's Studio python and source tree.
# diffusion_imports: every image / video family's diffusers classes import under the installed pins (a pin bump
# or a family registry edit that names a class this diffusers lacks). Head first, base only on failure.
[[target]]
name = "diffusion_imports"
kind = "external"
tier = "fast"
perf_sensitive = false
gpu_mem_gb = 0
est_s = 300          # one child importing every class; 40 s idle, ~600 s on a loaded host
known_failures = "results_json"
cmd = ["{install}/unsloth_studio/bin/python", "studio_regress/diffusion_imports.py", "--src", "{src}",
       "--out", "{out}", "--python", "{install}/unsloth_studio/bin/python"]
triggers = ["studio/backend/core/inference/**", "studio/backend/requirements/**"]
owner = "switchboard"

# planner_matrix: the image, video and MiniMax-H3 planners over 8..96 GiB x discrete / unified x auto / int8 /
# fp8 / bf16, on BOTH sides (compare = "planner_matrix"); every moved cell is tabled, admitted -> refused and
# strictly slower placements flagged. PLAN_DIFF is for a reader, never a regression (planner_matrix.py).
[[target]]
name = "planner_matrix"
kind = "external"
tier = "fast"
perf_sensitive = false
gpu_mem_gb = 0
est_s = 120
compare = "planner_matrix"
cmd = ["{install}/unsloth_studio/bin/python", "studio_regress/planner_matrix.py", "--src", "{src}",
       "--out", "{out}", "--python", "{install}/unsloth_studio/bin/python"]
triggers = ["studio/backend/core/inference/diffusion_memory.py", "studio/backend/core/inference/diffusion.py",
            "studio/backend/core/inference/video.py", "studio/backend/core/inference/diffusion_families.py",
            "studio/backend/core/inference/video_families.py", "studio/backend/core/inference/video_minimax_h3*.py",
            "studio/backend/core/inference/diffusion_auto_policy.py",
            "studio/backend/core/inference/diffusion_transformer_quant.py",
            "studio/frontend/src/features/model-picker/components/model-selector/model-catalog.ts"]
owner = "switchboard"

# ---------------------------------------------------------------- regression suite (unslothai/scripts #332)
# Tiny-model checks for Unsloth / unsloth-zoo (load, training parity vs a plain HF reference, MoE,
# losses, generate, save / merge, quant formats, remote code, tokenizer). One regression/run.py
# call runs base and head side by side on two leased GPUs (companion repo pinned to one SHA) and
# diffs them: pass -> fail and metric moves beyond tolerance are regressions; registry `known`
# entries keep failures that already exist on main from counting. Needs `regression/run.py
# prefetch --tier smoke` once (models into $WORKSPACE/temp/regression/hub).
[[target]]
name = "regression_smoke"
kind = "regression"
tier = "gpu"
perf_sensitive = false
regression_tier = "smoke"
gpus = 2
gpu_mem_gb = 12
est_s = 1300
triggers = ["unsloth/models/**", "unsloth/kernels/**", "unsloth/save.py", "unsloth/trainer.py",
            "unsloth/tokenizer_utils.py", "unsloth/import_fixes.py", "unsloth/__init__.py", "unsloth/utils/**", "unsloth/dataprep/**", "unsloth/registry/**",
            "unsloth_zoo/**", "pyproject.toml"]

[[target]]
name = "regression_standard"
kind = "regression"
tier = "gpu"
perf_sensitive = false
regression_tier = "standard"
gpus = 2
gpu_mem_gb = 16
est_s = 2000
timeout_s = 7200
triggers = ["label:regression standard"]

