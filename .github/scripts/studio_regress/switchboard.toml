# studio_regress switchboard: ONE registry deciding what runs for a PR.
#
# [[target]] fields
#   name          journey module name (journeys/<name>.py) or jobs script ("jobs/<file>.py ARGS")
#   kind          "journey" (Studio, before/after screenshots)
#                 | "external" (absolute pass / fail suite elsewhere in scripts/, external.py)
#                 | "job" (Core: jobs/ab.py base-vs-head, jobs/compare.py verdict; core.py)
#                 | "regression" (Core: tiny-model suite regression/run.py base-vs-head; core.py)
#                 job / regression need no Studio install: they run in the Core interpreter
#                 (run --core-python; default $STUDIO_REGRESS_CORE_PYTHON, else temp/venv_core,
#                 else the active venv: it needs torch + unsloth deps and a working bitsandbytes)
#   repos         PR repos the target applies to; default journey / external -> unslothai/unsloth,
#                 job / regression -> unslothai/unsloth and unslothai/unsloth-zoo
#   args          job: extra argv for the job script (after any args in the name)
#                 regression: extra argv for `regression/run.py run`
#   regression_tier  regression: smoke | standard | full (regression/registry.py TIERS)
#   gpus          regression: distinct GPUs leased (2: base and head side by side)
#   compare_args  job: extra jobs/compare.py flags, e.g. "--perf-gate"
#   timeout_s     wall-clock cap per target (default max(1800 or 5400, 6 * est_s))
#   cmd           external only: argv list run from scripts/ with {install} {side} {out} {gpu};
#                 head first, exit 0 = SAME; on failure base runs: base ok -> FAIL_HEAD,
#                 base fails -> FAIL_BOTH. {out}/results.json is linked in report.json
#   tier          fast (CPU, no model) | model (CPU GGUF ok) | gpu
#   perf_sensitive  true -> exclusive GPU lease (timings compared); false -> packed with others
#   gpu_mem_gb    peak + 20% (refreshed from reports into temp/studio_regress/mem_cache.json)
#   est_s         warm seconds per side
#   triggers      glob patterns over changed paths; "label:<name>"; "always"
#   deps          targets that must run first on the same side (shared state)
#   models        fixture keys from [models]
#   owner         fork / module that implements it ("pending" = not yet implemented)
#
# Selection (selection.py): a target is picked when any trigger matches. Changed paths that no
# trigger matches are listed as UNMATCHED and add the `fast` smoke set (conservative).

[models]
gguf_270m = { repo = "unsloth/gemma-3-270m-it-GGUF", variant = "UD-Q4_K_XL" }
gguf_qwen35_08b_mtp = { repo = "unsloth/Qwen3.5-0.8B-MTP-GGUF", variant = "UD-Q4_K_XL" }
gguf_qwen35_2b_mtp = { repo = "unsloth/Qwen3.5-2B-MTP-GGUF", variant = "UD-Q4_K_XL" }
train_270m = { repo = "unsloth/gemma-3-270m-it" }
# Keys named after Journey.needs (fork B's models.toml): run.py hands ctx.models[key] to the journey.
gguf_small = { repo = "unsloth/gemma-3-270m-it-GGUF", variant = "UD-Q4_K_XL" }
gguf_compaction = { repo = "unsloth/Qwen3.5-0.8B-MTP-GGUF", variant = "UD-Q4_K_XL" }
gguf_tools = { repo = "unsloth/Qwen3.5-0.8B-MTP-GGUF", variant = "UD-Q4_K_XL" }   # needs a tool-capable template
train_small = { repo = "unsloth/gemma-3-270m-it" }
# local_snapshot: Studio loads non-GGUF, non-unsloth/* pipelines only from a path, so run.py and
# prefetch materialise these under $WORKSPACE/hf_tiny/<name> (journeys/_diffusion.ensure_tiny),
# the same directory diffusion_bench/fetch_tiny.py fills for the external targets below.
tiny_sdxl = { repo = "hf-internal-testing/tiny-stable-diffusion-xl-pipe", local_snapshot = true }
tiny_wan = { repo = "hf-internal-testing/tiny-wan-pipe", local_snapshot = true }
# External diffusion_bench targets: prefetch runs `fetch_tiny.py --set <set>` (14 pipes, ~340 MB,
# plus the rope-128 tiny Wan derivative the HTTP video checks need).
diffusion_bench_tiny = { fetch_script = "diffusion_bench/fetch_tiny.py", args = ["--set", "all"] }
tiny_gpt_oss = { repo = "trl-internal-testing/tiny-GptOssForCausalLM" }
tiny_qwen3_moe = { repo = "trl-internal-testing/tiny-Qwen3MoeForCausalLM" }
tiny_gemma4 = { repo = "trl-internal-testing/tiny-Gemma4ForConditionalGeneration" }
tiny_qwen35 = { repo = "trl-internal-testing/tiny-Qwen3_5ForConditionalGeneration-NoThink" }
gemma4_e2b = { repo = "unsloth/gemma-4-E2B-it" }
qwen35_08b = { repo = "unsloth/Qwen3.5-0.8B" }

