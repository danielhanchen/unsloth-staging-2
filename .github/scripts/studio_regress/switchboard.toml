kind = "job"
tier = "gpu"
perf_sensitive = true
gpu_mem_gb = 30
est_s = 480
triggers = ["unsloth/models/rl*.py", "unsloth/models/vision.py", "unsloth_zoo/rl_*.py"]
models = ["gemma4_e2b"]

[[target]]
name = "jobs/inference_smoke.py"
kind = "job"
tier = "gpu"
perf_sensitive = true
gpu_mem_gb = 6
est_s = 60
triggers = ["unsloth/models/**", "unsloth/kernels/**", "unsloth_zoo/**"]

[[target]]
name = "jobs/mlx_sft.py"
kind = "job"
tier = "fast"
perf_sensitive = false
gpu_mem_gb = 0
est_s = 300
# Apple Silicon only: ab.py on this Linux host exits 3 (NOT_RUN), so `run` skips it and `select`
# prints the staging macOS command, which also runs the PR's tests with the MLX stack installed.
staging_only = true
staging = "python pr_review/staging_ci.py cross-platform {pr} --repo {repo} --oses macos-15 --job mlx_sft"
triggers = ["unsloth/mlx/**", "unsloth_zoo/mlx*/**", "unsloth_zoo/mlx*.py", "unsloth_zoo/**/*mlx*.py",
            "studio/backend/**/mlx*", "studio/backend/**/*_mlx*", "studio/frontend/src/**/*mlx*",
            ".github/workflows/mlx-ci.yml", "scripts/install_*_mlx.sh"]

# ---------------------------------------------------------------- playbook workflows
# [[workflow]]: path triggers that route a PR to claude/workflows/<name>.md (what to try and why);
# `select` reports them as WORKFLOW lines and pr_extra_workflows.py inlines them into the session.
# One entry per (name, repo) so each glob only fires for its own repo; repos may be ones no
# target covers (unslothai/llama.cpp).

[[workflow]]
name = "training_perf_workflow"
why = "compiler / kernels / quantized-weight / MoE / GC / device-map / model patch paths"
repos = ["unslothai/unsloth"]
triggers = [
    "unsloth/kernels/**",
    "unsloth/_compressed_quantize.py",
    "unsloth/models/_utils.py",
    "unsloth/models/loader.py",
    "unsloth/models/loader_utils.py",
    "unsloth/models/vision.py",
    "unsloth/models/llama*.py",
    "unsloth/models/gemma*.py",
    "unsloth/models/qwen*.py",
    "unsloth/models/mistral.py",
    "unsloth/models/cohere.py",
    "unsloth/models/granite.py",
    "unsloth/models/falcon_h1.py",
    "unsloth/models/glm4_moe.py",
    "unsloth/models/longcat_lsa.py",
    "unsloth/models/grouped_linear_lora.py",
    "unsloth/models/modelopt_fp8.py",
    "unsloth/models/_custom_dtype.py",
    "unsloth/models/_attn_mask_compat.py",
    "unsloth/models/_remote_code_buffers.py",
    "unsloth/models/remote_code_shims.py",
]

[[workflow]]
name = "training_perf_workflow"
why = "compiler / kernels / quantized-weight / MoE / GC / device-map / model patch paths"
repos = ["unslothai/unsloth-zoo"]
triggers = [
    "unsloth_zoo/compiler.py",
    "unsloth_zoo/compiler_replacements.py",
    "unsloth_zoo/compile_cache.py",
    "unsloth_zoo/temporary_patches/**",
    "unsloth_zoo/gradient_checkpointing.py",
    "unsloth_zoo/fused_losses/**",
    "unsloth_zoo/loss_utils.py",
    "unsloth_zoo/patching_utils.py",
    "unsloth_zoo/patch_torch_functions.py",
    "unsloth_zoo/peft_utils.py",
    "unsloth_zoo/tiled_mlp.py",
    "unsloth_zoo/device_map_planner.py",
    "unsloth_zoo/empty_model.py",
    "unsloth_zoo/flex_attention/**",
    "unsloth_zoo/gated_delta_vjp.py",
    "unsloth_zoo/fp16_emulation.py",
    "unsloth_zoo/_vendored/**",
]

[[workflow]]
name = "diffusion_perf_workflow"
why = "Studio diffusion + video inference / training paths"
repos = ["unslothai/unsloth"]
triggers = [
    "studio/backend/core/inference/diffusion*.py",
    "studio/backend/core/inference/video_*.py",
    "studio/backend/core/inference/sd_cpp_*.py",
    "studio/backend/core/training/diffusion_*.py",
]

[[workflow]]
name = "kernel_verify_workflow"
why = "hand-written / fused kernel"
repos = ["unslothai/unsloth"]
triggers = [
    "unsloth/kernels/**",
    "unsloth/**/*triton*.py",
    "studio/backend/**/*_fused.py",
    "studio/backend/**/*triton*.py",
    "**/*.cu",
]

[[workflow]]
name = "kernel_verify_workflow"
why = "hand-written / fused kernel"
repos = ["unslothai/unsloth-zoo"]
triggers = [
    "unsloth_zoo/**/*triton*.py",
    "unsloth_zoo/**/*fused*.py",
    "unsloth_zoo/**/kernels/**",
    "**/*.cu",
]

[[workflow]]
name = "gguf_quant_workflow"
why = "GGUF export, llama.cpp quantize / imatrix / quant kernels"
repos = ["unslothai/llama.cpp"]
triggers = [
    "tools/quantize/**",
    "tools/imatrix/**",
    "tools/perplexity/**",
    "src/llama-quant.cpp",
    "ggml/src/ggml-quants.c",
    "ggml/src/ggml-common.h",
    "ggml/src/ggml-cpu/quants.c",
    "ggml/src/ggml-cuda/quantize.cu",
    "ggml/src/ggml-cuda/convert.cu",
    "ggml/src/ggml-cuda/mmq.cu*",
    "ggml/src/ggml-cuda/mmvq.cu*",
    "ggml/src/ggml-cuda/vecdotq.cuh",
    "ggml/src/ggml-cuda/template-instances/mmq-*",
    "gguf-py/gguf/quants.py",
    "gguf-py/gguf/constants.py",
    "convert_hf_to_gguf.py",
]

[[workflow]]
name = "gguf_quant_workflow"
why = "GGUF export, llama.cpp quantize / imatrix / quant kernels"
repos = ["unslothai/unsloth"]
triggers = [
    "unsloth/save.py",
    "studio/backend/core/export/**",
]

[[workflow]]
name = "gguf_quant_workflow"
why = "GGUF export, llama.cpp quantize / imatrix / quant kernels"
repos = ["unslothai/unsloth-zoo"]
triggers = [
    "unsloth_zoo/llama_cpp.py",
    "unsloth_zoo/saving_utils.py",
]
